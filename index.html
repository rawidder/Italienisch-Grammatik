luralregeln entsprechen denen der Substantive:<\/p><table><tr><th>Singular m<\/th><th>Plural m<\/th><th>Plural f<\/th><\/tr><tr><td><em>bianco, stanco, ricco<\/em><\/td><td><em>bianchi, stanchi, ricchi<\/em><\/td><td><em>bianche, stanche, ricche<\/em><\/td><\/tr><tr><td><em>simpatico, pratico, politico<\/em><\/td><td><em>simpatici, pratici, politici<\/em><\/td><td><em>simpatiche, pratiche, politiche<\/em><\/td><\/tr><tr><td><em>lungo, largo<\/em><\/td><td><em>lunghi, larghi<\/em><\/td><td><em>lunghe, larghe<\/em><\/td><\/tr><tr><td><em>grigio, liscio<\/em><\/td><td><em>grigi, lisci<\/em><\/td><td><em>grigie, lisce<\/em><\/td><\/tr><tr><td><em>vecchio, serio<\/em><\/td><td><em>vecchi, seri<\/em><\/td><td><em>vecchie, serie<\/em><\/td><\/tr><\/table><ul><li><em>-co<\/em>: Betonung auf der vorletzten Silbe → <em>-chi<\/em> (<em>bianchi, tedeschi<\/em>; Ausnahme <em>greci<\/em>), auf der drittletzten → <em>-ci<\/em> (<em>simpatici, magnifici<\/em>).<\/li><li>Feminin immer hart: <em>-che, -ghe<\/em>.<\/li><li><em>-cia / -gia<\/em> → <em>-cie / -gie<\/em> nach Vokal (<em>grigie<\/em>, auch <em>grige<\/em>), <em>-ce / -ge<\/em> nach Konsonant (<em>lisce, sagge<\/em>).<\/li><\/ul><div class=\"warn\">Achtung: <em>simpatico → simpatici<\/em> (weich), aber <em>simpatiche<\/em> (hart). <em>simpatichi<\/em> gibt es nicht.<\/div>"},{"h":"Unveränderliche Adjektive","html":"<ul><li>Farben, die von Substantiven kommen: <em>rosa, viola, lilla, blu, beige, bordeaux<\/em>: <em>le gonne rosa, i pantaloni blu<\/em><\/li><li>zusammengesetzte Farbangaben: <em>verde chiaro, rosso scuro, giallo limone<\/em>: <em>le scarpe verde scuro<\/em><\/li><li><em>pari, dispari, impari<\/em>: <em>i numeri pari<\/em><\/li><li>Fremdwörter: <em>chic, snob, trendy, standard<\/em>: <em>delle signore chic<\/em><\/li><li>Zusammensetzungen mit <em>anti-<\/em>: <em>le luci antinebbia, i sistemi antifurto<\/em><\/li><li>einige Wendungen: <em>persone perbene, patate arrosto<\/em><\/li><\/ul><div class=\"tip\"><em>marrone<\/em> und <em>arancione<\/em> sind normale Adjektive auf -e: <em>scarpe marroni, magliette arancioni<\/em>; <em>marrone<\/em> wird aber auch unverändert gebraucht.<\/div>"},{"h":"bello, buono, santo, grande","html":"<p>Vor dem Substantiv verändern sich diese Adjektive. <b>bello<\/b> verhält sich wie der bestimmte Artikel:<\/p><table><tr><th>Artikel<\/th><th>bello<\/th><th>Beispiel<\/th><\/tr><tr><td>il / i<\/td><td><em>bel / bei<\/em><\/td><td><em>un bel ragazzo, dei bei ragazzi<\/em><\/td><\/tr><tr><td>lo / gli<\/td><td><em>bello / begli<\/em><\/td><td><em>un bello zaino, dei begli zaini<\/em><\/td><\/tr><tr><td>l' / gli<\/td><td><em>bell' / begli<\/em><\/td><td><em>un bell'albero, dei begli occhi<\/em><\/td><\/tr><tr><td>la / le<\/td><td><em>bella / belle<\/em><\/td><td><em>una bella casa, delle belle case<\/em><\/td><\/tr><\/table><p><b>buono<\/b> verhält sich im Singular wie der unbestimmte Artikel: <em>un buon amico, un buon vino, un buono studente, una buona idea, una buon'idea<\/em>. Plural regelmäßig: <em>buoni amici, buone idee<\/em>.<\/p><p><b>santo<\/b> vor Namen: <em>San Pietro<\/em> (Konsonant), <em>Santo Stefano<\/em> (s + Konsonant), <em>Sant'Antonio, Sant'Anna<\/em> (Vokal), <em>Santa Lucia<\/em>.<\/p><p><b>grande<\/b> kann vor Konsonant zu <em>gran<\/em> verkürzt werden: <em>un gran caldo, una gran fame<\/em>; vor Vokal <em>grand'<\/em>: <em>un grand'uomo<\/em>.<\/p><div class=\"warn\">Achtung: Nach dem Substantiv oder als Prädikat sind die Formen regelmäßig: <em>un ragazzo bello, gli occhi sono belli<\/em> – nicht <em>bei<\/em> oder <em>begli<\/em>!<\/div>"},{"h":"Der Komparativ","html":"<p><b>Mehr / weniger<\/b>: <em>più / meno<\/em> + Adjektiv + <em>di<\/em> oder <em>che<\/em>.<\/p><table><tr><th>Vergleichswort<\/th><th>wann?<\/th><th>Beispiel<\/th><\/tr><tr><td><em>di<\/em><\/td><td>vor Substantiven, Pronomen, Zahlen (ohne Präposition)<\/td><td><em>Marco è più alto di Luca. È più giovane di me. Costa più di 100 euro.<\/em><\/td><\/tr><tr><td><em>che<\/em><\/td><td>zwei Adjektive, Verben, Adverbien<\/td><td><em>È più bello che utile. Leggere è più rilassante che guardare la TV.<\/em><\/td><\/tr><tr><td><em>che<\/em><\/td><td>Substantiv mit Präposition<\/td><td><em>Fa più caldo a Napoli che a Torino.<\/em><\/td><\/tr><tr><td><em>che<\/em><\/td><td>Mengen zweier Dinge<\/td><td><em>Ho più libri che riviste.<\/em><\/td><\/tr><\/table><p>Vor einem Nebensatz: <em>di quello che / di quanto<\/em>: <em>È più difficile di quello che pensavo.<\/em><\/p><p><b>Gleichheit<\/b>: <em>(così) … come<\/em> oder <em>(tanto) … quanto<\/em>. Das erste Wort fällt meist weg: <em>Anna è alta come sua sorella. È intelligente quanto lui.<\/em> Bei Substantiven werden <em>tanto … quanto<\/em> angeglichen: <em>Mangio tanta frutta quanta verdura.<\/em><\/p><div class=\"warn\">Achtung: „als“ ist nicht immer <em>che<\/em>! Vor Substantiv oder Pronomen steht <em>di<\/em>: <em>più alto di me<\/em>, nicht <em>che me<\/em>.<\/div>"},{"h":"Der Superlativ","html":"<p><b>Relativer Superlativ<\/b> (der/die/das …ste): bestimmter Artikel + <em>più / meno<\/em> + Adjektiv; Bezugsgruppe mit <em>di<\/em> oder <em>tra/fra<\/em>:<\/p><p><em>È la città più bella d'Italia. – È il più giovane tra i fratelli.<\/em><\/p><div class=\"warn\">Achtung: Der Artikel wird nicht wiederholt: <em>la città più bella<\/em>, nicht <em>la città la più bella<\/em>.<\/div><p><b>Absoluter Superlativ<\/b> (sehr …, äußerst …):<\/p><table><tr><th>Bildung<\/th><th>Beispiele<\/th><\/tr><tr><td>-issimo / -a / -i / -e<\/td><td><em>bellissimo, facilissima, lunghissimi, ricchissime<\/em><\/td><\/tr><tr><td>molto / assai / estremamente<\/td><td><em>molto bello, assai difficile<\/em><\/td><\/tr><tr><td>Vorsilben stra-, super-, ultra-, arci-<\/td><td><em>straricco, superveloce, ultramoderno, arcinoto<\/em><\/td><\/tr><tr><td>Verdopplung<\/td><td><em>piano piano, zitto zitto<\/em><\/td><\/tr><tr><td>feste Verbindungen<\/td><td><em>stanco morto, pieno zeppo, ricco sfondato, bagnato fradicio, innamorato cotto<\/em><\/td><\/tr><\/table><p>Bei <em>-co / -go<\/em> richtet sich der Superlativ nach dem maskulinen Plural: <em>bianco → bianchissimo, lungo → lunghissimo<\/em>, aber <em>simpatico → simpaticissimo<\/em>. Einige Adjektive haben gelehrte Formen auf <em>-errimo<\/em>: <em>celebre → celeberrimo, acre → acerrimo<\/em> (<em>un nemico acerrimo<\/em>).<\/p><div class=\"tip\">Adjektive mit absoluter Bedeutung steigert man nicht: <em>eterno, infinito, enorme, perfetto<\/em>.<\/div>"},{"h":"Unregelmäßige Steigerung","html":"<table><tr><th>Grundform<\/th><th>Komparativ<\/th><th>abs. Superlativ<\/th><\/tr><tr><td><em>buono<\/em><\/td><td><em>migliore<\/em> / <em>più buono<\/em><\/td><td><em>ottimo<\/em> / <em>buonissimo<\/em><\/td><\/tr><tr><td><em>cattivo<\/em><\/td><td><em>peggiore<\/em> / <em>più cattivo<\/em><\/td><td><em>pessimo<\/em> / <em>cattivissimo<\/em><\/td><\/tr><tr><td><em>grande<\/em><\/td><td><em>maggiore<\/em> / <em>più grande<\/em><\/td><td><em>massimo<\/em> / <em>grandissimo<\/em><\/td><\/tr><tr><td><em>piccolo<\/em><\/td><td><em>minore<\/em> / <em>più piccolo<\/em><\/td><td><em>minimo<\/em> / <em>piccolissimo<\/em><\/td><\/tr><\/table><p>Relativer Superlativ: <em>il migliore, il peggiore, il maggiore, il minore<\/em>.<\/p><ul><li><em>migliore / peggiore<\/em> eher für Qualität und Wert: <em>un risultato migliore<\/em>; <em>più buono / più cattivo<\/em> für Geschmack und Charakter: <em>Questa torta è più buona.<\/em><\/li><li><em>maggiore / minore<\/em> für Alter (Geschwister), Bedeutung, Musik: <em>mia sorella maggiore, un problema minore, in do maggiore<\/em>; <em>più grande / più piccolo<\/em> für die Größe.<\/li><li><em>massimo / minimo<\/em> für den höchsten Grad: <em>la velocità massima, il minimo indispensabile, Non ho la minima idea.<\/em><\/li><\/ul><div class=\"warn\">Achtung: <em>migliore<\/em> ist Adjektiv, <em>meglio<\/em> Adverb: <em>Il tuo piano è migliore.<\/em> – <em>Tu canti meglio di me.<\/em> Und nie doppelt steigern: <em>più migliore<\/em> und <em>molto ottimo<\/em> sind falsch.<\/div>"}],"exercises":[{"type":"gap","title":"Angleichung","task":"Setze das Adjektiv in der richtigen Form ein.","items":[{"q":"Le tue amiche sono (simpatico) ___.","a":["simpatiche"],"de":"Deine Freundinnen sind sympathisch."},{"q":"I tuoi amici sono (simpatico) ___.","a":["simpatici"],"de":"Deine Freunde sind sympathisch."},{"q":"In questa zona ci sono case (grande) ___.","a":["grandi"],"de":"In dieser Gegend gibt es große Häuser."},{"q":"Dopo il viaggio Marco e Giulia sono (stanco) ___.","a":["stanchi"],"de":"Nach der Reise sind Marco und Giulia müde."},{"q":"La gonna e la camicia sono (nuovo) ___.","a":["nuove"],"de":"Der Rock und die Bluse sind neu."},{"q":"Ho comprato dei pantaloni (blu) ___.","a":["blu"],"de":"Ich habe eine blaue Hose gekauft."},{"q":"Le pareti dello studio sono (grigio) ___.","a":["grigie","grige"],"de":"Die Wände des Arbeitszimmers sind grau."},{"q":"Mia figlia porta delle scarpe (rosa) ___.","a":["rosa"],"de":"Meine Tochter trägt rosa Schuhe."},{"q":"Queste strade sono molto (lungo) ___.","a":["lunghe"],"de":"Diese Straßen sind sehr lang."},{"q":"Nonostante tutto, i miei colleghi sono (ottimista) ___.","a":["ottimisti"],"de":"Trotz allem sind meine Kollegen optimistisch."}]},{"type":"choice","title":"molto & Co.: Adjektiv oder Adverb?","task":"Wähle die richtige Form.","items":[{"q":"A Roma ho ___ amici.","options":["molto","molti"],"a":1,"why":"Vor einem Substantiv: Adjektiv, angeglichen."},{"q":"Le tue figlie sono ___ simpatiche.","options":["molto","molte"],"a":0,"why":"Vor einem Adjektiv: Adverb, unveränderlich."},{"q":"C'è ___ gente in piazza.","options":["molto","molta"],"a":1,"why":"gente ist feminin Singular."},{"q":"Oggi abbiamo lavorato ___.","options":["molto","molti"],"a":0,"why":"Beim Verb: Adverb."},{"q":"Con i bambini ci vuole ___ pazienza.","options":["molto","molta"],"a":1,"why":"pazienza ist feminin Singular."},{"q":"Queste lezioni sono ___ interessanti.","options":["molto","molte"],"a":0,"why":"Vor einem Adjektiv: Adverb."},{"q":"Hai mangiato ___ biscotti!","options":["troppo","troppi"],"a":1,"why":"Vor einem Substantiv: angeglichen."},{"q":"Stasera ho ___ voglia di uscire.","options":["poco","poca"],"a":1,"why":"voglia ist feminin Singular."}]},{"type":"choice","title":"Stellung und Bedeutung","task":"Wähle die passende Wortfolge.","items":[{"q":"Gandhi era ___.","options":["un grande uomo","un uomo grande"],"a":0,"why":"Vorangestellt: bedeutend."},{"q":"Mio fratello è alto due metri: è ___.","options":["un grande uomo","un uomo grande"],"a":1,"why":"Nachgestellt: großgewachsen."},{"q":"Ci conosciamo da trent'anni: è ___.","options":["un vecchio amico","un amico vecchio"],"a":0,"why":"Vorangestellt: langjährig."},{"q":"Non ha nemmeno i soldi per mangiare: è ___.","options":["un pover'uomo","un uomo povero"],"a":1,"why":"Nachgestellt: mittellos."},{"q":"Su questo tema ho letto ___. (mehrere)","options":["diversi libri","libri diversi"],"a":0,"why":"Vorangestellt: mehrere."},{"q":"Uno è un giallo, l'altro un saggio: sono ___.","options":["diversi libri","libri diversi"],"a":1,"why":"Nachgestellt: unterschiedlich."},{"q":"Abbiamo ___: la riunione è confermata.","options":["certe notizie","notizie certe"],"a":1,"why":"Nachgestellt: sicher."},{"q":"Paolo non ha né fratelli né sorelle: è ___.","options":["un unico figlio","un figlio unico"],"a":1,"why":"figlio unico = Einzelkind."},{"q":"Vive senza famiglia e senza amici: è ___.","options":["una sola donna","una donna sola"],"a":1,"why":"Nachgestellt: alleinstehend, einsam."}]},{"type":"gap","title":"bello, buono, santo","task":"Setze die richtige Form ein.","items":[{"q":"Che (bello) ___ panorama!","a":["bel"],"de":"Was für ein schönes Panorama!"},{"q":"Hai dei (bello) ___ occhi.","a":["begli"],"de":"Du hast schöne Augen."},{"q":"Che (bello) ___ zaino!","a":["bello"],"de":"Was für ein schöner Rucksack!"},{"q":"Ieri ho visto dei (bello) ___ film.","a":["bei"],"de":"Gestern habe ich schöne Filme gesehen."},{"q":"Davanti a casa c'è un (bello) ___ albero.","a":["bell'"],"de":"Vor dem Haus steht ein schöner Baum."},{"q":"(buono) ___ appetito!","a":["Buon","buon"],"de":"Guten Appetit!"},{"q":"Luca è un (buono) ___ studente.","a":["buono"],"de":"Luca ist ein guter Student."},{"q":"La festa di (santo) ___ Giovanni è il 24 giugno.","a":["San"],"de":"Das Fest des heiligen Johannes ist am 24. Juni."},{"q":"(santo) ___ Antonio è il patrono di Padova.","a":["Sant'"],"de":"Der heilige Antonius ist der Schutzpatron von Padua."},{"q":"Il 26 dicembre è (santo) ___ Stefano.","a":["Santo"],"de":"Der 26. Dezember ist der Stephanstag."}]},{"type":"choice","title":"di oder che?","task":"Wähle das richtige Vergleichswort.","items":[{"q":"Roma è più grande ___ Firenze.","options":["di","che"],"a":0,"why":"Vor einem Namen/Substantiv: di."},{"q":"Leggere è più rilassante ___ guardare la TV.","options":["di","che"],"a":1,"why":"Vergleich zweier Verben: che."},{"q":"Mia sorella è più giovane ___ me.","options":["di","che"],"a":0,"why":"Vor einem Pronomen: di."},{"q":"Questo lavoro è più faticoso ___ interessante.","options":["di","che"],"a":1,"why":"Vergleich zweier Adjektive: che."},{"q":"In estate fa più caldo a Palermo ___ a Milano.","options":["di","che"],"a":1,"why":"Vor Präposition + Substantiv: che."},{"q":"Nella mia libreria ci sono più libri ___ riviste.","options":["di","che"],"a":1,"why":"Mengenvergleich zweier Dinge: che."},{"q":"Alla conferenza c'erano più ___ cento persone.","options":["di","che"],"a":0,"why":"Vor Zahlen: di."},{"q":"Anna è alta ___ sua madre.","options":["come","di"],"a":0,"why":"Gleichheit ohne più/meno: come."},{"q":"L'esame è stato più difficile ___ pensavo.","options":["di quello che","che"],"a":0,"why":"Vor einem Nebensatz: di quello che."}]},{"type":"gap","title":"Superlativ und unregelmäßige Formen","task":"Setze die passende Form ein.","items":[{"q":"Per me Venezia è la città ___ bella del mondo. (schönste)","a":["più"],"de":"Für mich ist Venedig die schönste Stadt der Welt."},{"q":"Questo esercizio è (facile – absoluter Superlativ) ___.","a":["facilissimo"],"de":"Diese Übung ist sehr leicht."},{"q":"La strada per il lago è (lungo – absoluter Superlativ) ___.","a":["lunghissima"],"de":"Die Straße zum See ist sehr lang."},{"q":"Questo vino è ___ di quello di ieri. (besser)","a":["migliore","più buono"],"de":"Dieser Wein ist besser als der von gestern."},{"q":"Mio fratello ___ ha vent'anni. (älterer)","a":["maggiore","più grande"],"de":"Mein älterer Bruder ist zwanzig."},{"q":"Tu canti ___ di me. (besser – Adverb)","a":["meglio"],"de":"Du singst besser als ich."},{"q":"La cena era ___! (hervorragend, unregelmäßige Form)","a":["ottima"],"de":"Das Abendessen war hervorragend!"},{"q":"Non ne ho la ___ idea. (geringste)","a":["minima"],"de":"Ich habe nicht die geringste Ahnung."},{"q":"È il ___ film che abbia mai visto. (schlechteste)","a":["peggiore","peggior"],"de":"Das ist der schlechteste Film, den ich je gesehen habe."},{"q":"Il treno era pieno ___. (gerammelt voll)","a":["zeppo"],"de":"Der Zug war gerammelt voll."}]}],"cards":[{"f":"Adjektivendungen Gruppe 1","b":"-o, -a, -i, -e (alto, alta, alti, alte)"},{"f":"Adjektivendungen Gruppe 2","b":"-e, -i (grande, grandi)"},{"f":"Die Häuser sind klein.","b":"Le case sono piccole. (auch prädikativ angleichen)"},{"f":"Marco und Anna sind müde.","b":"Marco e Anna sono stanchi. (gemischt → maskulin)"},{"f":"Es ist wichtig, gut zu schlafen.","b":"È importante dormire bene. (m Sg.)"},{"f":"Wenn man jung ist …","b":"Quando si è giovani … (si + essere → Plural)"},{"f":"viele Leute / sehr nett","b":"molta gente / molto gentile"},{"f":"Normale Stellung des Adjektivs","b":"nach dem Substantiv (Farbe, Herkunft, Form …)"},{"f":"un grande uomo / un uomo grande","b":"bedeutender Mann / großgewachsener Mann"},{"f":"un vecchio amico / un amico vecchio","b":"langjähriger Freund / betagter Freund"},{"f":"diversi libri / libri diversi","b":"mehrere Bücher / unterschiedliche Bücher"},{"f":"un pover'uomo / un uomo povero","b":"bedauernswerter Mann / mittelloser Mann"},{"f":"simpatico – Plural m/f","b":"simpatici / simpatiche"},{"f":"bianco – Plural m/f","b":"bianchi / bianche"},{"f":"Unveränderliche Farben","b":"rosa, viola, lilla, blu, beige; verde chiaro …"},{"f":"bello vor Substantiv","b":"bel, bello, bell', bella; bei, begli, belle (wie der Artikel)"},{"f":"schöne Augen","b":"begli occhi"},{"f":"buono vor Substantiv (Sg.)","b":"buon, buono, buona, buon' (wie un, uno, una, un')"},{"f":"santo vor Namen","b":"San Pietro, Santo Stefano, Sant'Anna, Santa Lucia"},{"f":"größer als ich","b":"più grande di me"},{"f":"mehr schön als nützlich","b":"più bello che utile"},{"f":"so groß wie","b":"(così) alto come / (tanto) alto quanto"},{"f":"die schönste Stadt Italiens","b":"la città più bella d'Italia"},{"f":"Absoluter Superlativ von lungo","b":"lunghissimo"},{"f":"todmüde / gerammelt voll","b":"stanco morto / pieno zeppo"},{"f":"buono → Komparativ, Superlativ","b":"migliore, il migliore, ottimo"},{"f":"cattivo → Komparativ, Superlativ","b":"peggiore, il peggiore, pessimo"},{"f":"grande / piccolo (unregelmäßig)","b":"maggiore, massimo / minore, minimo"},{"f":"migliore oder meglio?","b":"migliore = Adjektiv (besser), meglio = Adverb (besser)"}],"id":"k04"},{"nr":5,"title":"Die Possessiva","teil":"Das Substantiv und seine Begleiter","intro":"Possessiva drücken Besitz und Zugehörigkeit aus. Im Italienischen stehen sie meist mit Artikel und richten sich nach dem Besessenen – zwei Punkte, an denen deutsche Lerner oft stolpern.","sections":[{"h":"Die Formen","html":"<p>Das Possessivum richtet sich in Geschlecht und Zahl nach dem <b>Besessenen<\/b>, nicht nach dem Besitzer.<\/p><table><tr><th><\/th><th>m. Sg. / Pl.<\/th><th>f. Sg. / Pl.<\/th><\/tr><tr><td>ich<\/td><td><em>mio / miei<\/em><\/td><td><em>mia / mie<\/em><\/td><\/tr><tr><td>du<\/td><td><em>tuo / tuoi<\/em><\/td><td><em>tua / tue<\/em><\/td><\/tr><tr><td>er, sie, Sie<\/td><td><em>suo / suoi<\/em><\/td><td><em>sua / sue<\/em><\/td><\/tr><tr><td>wir<\/td><td><em>nostro / nostri<\/em><\/td><td><em>nostra / nostre<\/em><\/td><\/tr><tr><td>ihr<\/td><td><em>vostro / vostri<\/em><\/td><td><em>vostra / vostre<\/em><\/td><\/tr><tr><td>sie (Pl.)<\/td><td><em>loro<\/em><\/td><td><em>loro<\/em><\/td><\/tr><\/table><p><em>il mio zaino, la mia borsa, i miei zaini, le mie borse<\/em> <small>mein Rucksack, meine Tasche, meine Rucksäcke, meine Taschen<\/small><\/p><div class=\"tip\"><em>loro<\/em> ist unveränderlich: <em>il loro giardino, la loro casa, i loro figli, le loro idee<\/em>.<\/div><div class=\"warn\">Achtung: <em>suo<\/em> heißt „sein“ <b>und<\/b> „ihr“. Entscheidend ist das Besessene: <em>la sua bici<\/em> = sein/ihr Fahrrad, <em>il suo cane<\/em> = sein/ihr Hund. Bei Missverständnissen hilft <em>di lui / di lei<\/em>: <em>la bici di lei<\/em>.<\/div>"},{"h":"Die Höflichkeitsform Suo","html":"<p>Für die Anrede mit <em>Lei<\/em> verwendet man die Formen von <em>suo<\/em>, in Briefen oft großgeschrieben.<\/p><p><em>Signora, ha dimenticato il Suo ombrello.<\/em> <small>Frau …, Sie haben Ihren Schirm vergessen.<\/small><\/p><p><em>Dottore, posso vedere i Suoi documenti?<\/em> <small>Herr Doktor, kann ich Ihre Unterlagen sehen?<\/small><\/p><p>Spricht man mehrere Personen höflich an, nimmt man im modernen Italienisch meist <em>vostro<\/em>, sehr förmlich <em>Loro<\/em>.<\/p><p><em>Grazie per la vostra pazienza.<\/em> <small>Danke für Ihre Geduld.<\/small><\/p>"},{"h":"Artikel beim Possessiv","html":"<p>Anders als im Deutschen steht vor dem Possessivadjektiv in der Regel der <b>bestimmte Artikel<\/b>. Mit Präpositionen verschmilzt er wie gewohnt.<\/p><ul><li><em>Il mio telefono è scarico.<\/em> <small>Mein Handy ist leer.<\/small><\/li><li><em>Parlo spesso dei miei progetti.<\/em> <small>Ich spreche oft über meine Projekte.<\/small><\/li><li><em>Abitiamo nella vostra via.<\/em> <small>Wir wohnen in eurer Straße.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nicht <em>mio libro<\/em>, sondern <em>il mio libro<\/em>! Der Artikel entfällt nur in bestimmten Fällen (Verwandte, feste Ausdrücke, s. u.).<\/div><p>Nach <em>essere<\/em> steht das Possessiv oft <b>ohne<\/b> Artikel, wenn es um die Zugehörigkeit geht; <b>mit<\/b> Artikel, wenn unterschieden wird:<\/p><ul><li><em>Questa giacca è mia.<\/em> <small>Diese Jacke gehört mir.<\/small><\/li><li><em>Quale giacca è la tua? – È la mia, quella blu.<\/em> <small>Welche ist deine? – Meine ist die blaue.<\/small><\/li><\/ul>"},{"h":"Verwandtschaftsnamen","html":"<p>Bei Verwandtschaftsbezeichnungen im <b>Singular<\/b> ohne weitere Bestimmung fällt der Artikel weg:<\/p><p><em>mio padre, mia madre, tuo fratello, sua sorella, nostro zio, vostra cugina, mio marito, sua moglie<\/em><\/p><p>Der Artikel <b>steht aber<\/b>:<\/p><ul><li>im Plural: <em>i miei genitori, le sue sorelle<\/em> <small>meine Eltern, seine/ihre Schwestern<\/small><\/li><li>bei <em>loro<\/em>: <em>la loro madre, il loro nonno<\/em> <small>ihre Mutter, ihr Großvater<\/small><\/li><li>bei Kose- und Verkleinerungsformen: <em>la mia mamma, il mio papà, la mia sorellina, il tuo fratellino<\/em><\/li><li>mit einem Adjektiv oder Zusatz: <em>la mia cara zia, il mio zio di Napoli<\/em> <small>meine liebe Tante, mein Onkel aus Neapel<\/small><\/li><\/ul><div class=\"tip\">Merke: Singular + nackter Verwandter = ohne Artikel. Plural, <em>loro<\/em>, Koseform oder Zusatz = mit Artikel.<\/div><p>Bei <em>nonno/nonna<\/em> und <em>fidanzato/fidanzata<\/em> schwankt der Gebrauch; mit Artikel ist man immer auf der sicheren Seite: <em>il mio fidanzato, la mia nonna<\/em>. Nicht als Verwandte gelten <em>ragazzo/ragazza<\/em> (Freund/in): <em>il mio ragazzo<\/em>.<\/p>"},{"h":"Das Possessivpronomen","html":"<p>Das Pronomen ersetzt ein Nomen und hat dieselben Formen, aber <b>immer mit Artikel<\/b> – auch bei Verwandten.<\/p><ul><li><em>La mia macchina è in garage, prendiamo la tua.<\/em> <small>Mein Auto ist in der Garage, nehmen wir deins.<\/small><\/li><li><em>Mio padre fa l'ingegnere, e il tuo?<\/em> <small>Mein Vater ist Ingenieur, und deiner?<\/small><\/li><li><em>I nostri figli giocano con i loro.<\/em> <small>Unsere Kinder spielen mit ihren.<\/small><\/li><\/ul><p>Feste Wendungen mit dem Pronomen:<\/p><ul><li><em>i miei, i tuoi<\/em> <small>meine/deine Eltern, Familie<\/small><\/li><li><em>Ognuno ha detto la sua.<\/em> <small>Jeder hat seine Meinung gesagt.<\/small><\/li><li><em>Siamo dalla tua parte.<\/em> <small>Wir stehen auf deiner Seite.<\/small><\/li><li><em>Alla nostra!<\/em> <small>Auf uns! (Trinkspruch)<\/small><\/li><\/ul>"},{"h":"Nachgestellt und ohne Artikel","html":"<p>In vielen festen Ausdrücken steht das Possessiv <b>nach<\/b> dem Nomen und ohne Artikel:<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>a casa mia / tua<\/em><\/td><td>bei mir / dir zu Hause<\/td><\/tr><tr><td><em>in camera sua<\/em><\/td><td>in seinem/ihrem Zimmer<\/td><\/tr><tr><td><em>da parte mia<\/em><\/td><td>meinerseits<\/td><\/tr><tr><td><em>è colpa mia<\/em><\/td><td>es ist meine Schuld<\/td><\/tr><tr><td><em>è merito tuo<\/em><\/td><td>es ist dein Verdienst<\/td><\/tr><tr><td><em>per conto mio<\/em><\/td><td>auf eigene Faust / für mich<\/td><\/tr><tr><td><em>di testa sua<\/em><\/td><td>nach seinem/ihrem Kopf<\/td><\/tr><tr><td><em>Mamma mia! / Dio mio!<\/em><\/td><td>Meine Güte!<\/td><\/tr><tr><td><em>amore mio, tesoro mio<\/em><\/td><td>mein Schatz<\/td><\/tr><\/table><p><em>Stasera ceniamo a casa nostra.<\/em> <small>Heute Abend essen wir bei uns zu Hause.<\/small><\/p>"},{"h":"un mio amico, questo mio …","html":"<p>Statt des bestimmten Artikels können auch der unbestimmte Artikel, Zahlen, Demonstrativa oder Indefinita stehen. Im Deutschen entspricht das oft „ein Freund von mir“:<\/p><ul><li><em>Un mio collega abita a Monza.<\/em> <small>Ein Kollege von mir wohnt in Monza.<\/small><\/li><li><em>Due miei amici studiano medicina.<\/em> <small>Zwei Freunde von mir studieren Medizin.<\/small><\/li><li><em>Questo tuo progetto mi piace.<\/em> <small>Dieses Projekt von dir gefällt mir.<\/small><\/li><li><em>Alcuni nostri vicini sono tedeschi.<\/em> <small>Einige unserer Nachbarn sind Deutsche.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nicht <em>un amico di me<\/em>, sondern <em>un mio amico<\/em> (oder <em>un amico mio<\/em>).<\/div>"},{"h":"Wegfall des Possessivs","html":"<p>Bei Körperteilen, Kleidung und persönlichen Gegenständen steht im Italienischen meist nur der Artikel, wenn klar ist, wem sie gehören. Oft zeigt ein Reflexiv- oder Objektpronomen den Besitzer an.<\/p><ul><li><em>Mi lavo le mani.<\/em> <small>Ich wasche mir die Hände.<\/small><\/li><li><em>Si è rotto il braccio.<\/em> <small>Er hat sich den Arm gebrochen.<\/small><\/li><li><em>Mi fa male la schiena.<\/em> <small>Mir tut der Rücken weh.<\/small><\/li><li><em>Ho perso il portafoglio.<\/em> <small>Ich habe meinen Geldbeutel verloren.<\/small><\/li><li><em>Togliti le scarpe!<\/em> <small>Zieh deine Schuhe aus!<\/small><\/li><li><em>Alzate la mano!<\/em> <small>Hebt die Hand!<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>Lavo le mie mani<\/em> klingt im Italienischen unnatürlich. Richtig: <em>Mi lavo le mani<\/em>.<\/div>"},{"h":"proprio","html":"<p><em>proprio<\/em> (= eigen, sein eigenes) bezieht sich auf das <b>Subjekt<\/b> des Satzes. Es ist <b>obligatorisch<\/b> bei unpersönlichem oder allgemeinem Subjekt:<\/p><ul><li><em>Ognuno è responsabile delle proprie azioni.<\/em> <small>Jeder ist für seine eigenen Taten verantwortlich.<\/small><\/li><li><em>Bisogna rispettare le proprie promesse.<\/em> <small>Man muss seine Versprechen halten.<\/small><\/li><li><em>Si deve conoscere il proprio corpo.<\/em> <small>Man muss seinen Körper kennen.<\/small><\/li><\/ul><p>Es hilft auch, Mehrdeutigkeit zu vermeiden und verstärkt: <em>L'ho visto con i miei propri occhi.<\/em> <small>Ich habe es mit eigenen Augen gesehen.<\/small><\/p><p><em>Luca ha prestato a Paolo la propria bici.<\/em> <small>Luca hat Paolo sein (Lucas) Fahrrad geliehen.<\/small> – mit <em>sua<\/em> bliebe offen, wessen Fahrrad.<\/p><div class=\"tip\">Nicht verwechseln mit dem Adverb <em>proprio<\/em> = genau, wirklich: <em>È proprio vero.<\/em> – Das ist wirklich wahr.<\/div>"}],"exercises":[{"type":"gap","title":"Formen mit Artikel","task":"Setze Artikel + Possessiv ein (Besitzer in Klammern).","items":[{"q":"(io) ___ chiavi sono sul tavolo.","a":["Le mie"],"de":"Meine Schlüssel liegen auf dem Tisch."},{"q":"(tu) Hai trovato ___ occhiali?","a":["i tuoi"],"de":"Hast du deine Brille gefunden?"},{"q":"(noi) ___ appartamento è al terzo piano.","a":["Il nostro"],"de":"Unsere Wohnung ist im dritten Stock."},{"q":"(voi) Quando arriva ___ treno?","a":["il vostro"],"de":"Wann kommt euer Zug?"},{"q":"(loro) ___ case sono vicino al mare.","a":["Le loro"],"de":"Ihre Häuser liegen am Meer."},{"q":"(lei = Anna) Anna ha venduto ___ motorino.","a":["il suo"],"de":"Anna hat ihren Motorroller verkauft."},{"q":"(lui = Marco) Marco porta sempre ___ cartella rossa.","a":["la sua"],"de":"Marco trägt immer seine rote Mappe."},{"q":"(Lei) Signor Bassi, ecco ___ passaporto.","a":["il Suo","il suo"],"de":"Herr Bassi, hier ist Ihr Reisepass."}]},{"type":"choice","title":"Mit oder ohne Artikel? Verwandte","task":"Wähle die richtige Form.","items":[{"q":"___ madre lavora in ospedale.","options":["Mia","La mia"],"a":0,"why":"Verwandter im Singular ohne Zusatz → kein Artikel."},{"q":"___ genitori vivono in campagna.","options":["Miei","I miei"],"a":1,"why":"Plural → Artikel."},{"q":"___ padre è di Bari.","options":["Loro","Il loro"],"a":1,"why":"Bei loro steht immer der Artikel."},{"q":"Domani esco con ___ sorellina.","options":["mia","la mia"],"a":1,"why":"Verkleinerungsform → Artikel."},{"q":"Ti presento ___ marito.","options":["mio","il mio"],"a":0,"why":"Verwandter im Singular → kein Artikel."},{"q":"___ cara nonna compie novant'anni.","options":["Mia","La mia"],"a":1,"why":"Mit Adjektiv → Artikel."},{"q":"Come sta ___ fratello?","options":["Suo","il Suo"],"a":0,"why":"Auch bei der Höflichkeitsform entfällt der Artikel vor Verwandten im Singular."},{"q":"Questo è ___ papà.","options":["mio","il mio"],"a":1,"why":"papà ist eine Koseform → Artikel."}]},{"type":"choice","title":"Possessiv – ja oder nein?","task":"Welcher Satz ist idiomatisch?","items":[{"q":"„Ich putze mir die Zähne.“","options":["Lavo i miei denti.","Mi lavo i denti."],"a":1,"why":"Körperteil: Reflexivpronomen + Artikel statt Possessiv."},{"q":"„Ein Freund von mir ist Koch.“","options":["Un amico di me fa il cuoco.","Un mio amico fa il cuoco."],"a":1,"why":"„ein … von mir“ = un mio …"},{"q":"„Komm doch zu mir nach Hause.“","options":["Vieni a casa mia.","Vieni alla mia casa."],"a":0,"why":"Feste Wendung: a casa mia."},{"q":"„Das ist nicht meine Schuld.“","options":["Non è colpa mia.","Non è la colpa mia."],"a":0,"why":"Feste Wendung ohne Artikel."},{"q":"„Er hat sein Handy vergessen.“","options":["Ha dimenticato il telefono.","Ha dimenticato telefono suo."],"a":0,"why":"Persönlicher Gegenstand: Artikel genügt."},{"q":"„Mir tut der Kopf weh.“","options":["Mi fa male la testa.","Mi fa male la mia testa."],"a":0,"why":"Das Pronomen mi zeigt den Besitzer, Possessiv überflüssig."},{"q":"„Mein Auto ist kaputt, kann ich deins nehmen?“","options":["… posso prendere tua?","… posso prendere la tua?"],"a":1,"why":"Possessivpronomen immer mit Artikel."}]},{"type":"gap","title":"suo, loro oder proprio?","task":"Setze die passende Form ein (mit Artikel, wo nötig).","items":[{"q":"Giulia e Sara vendono ___ macchina. (ihr Auto)","a":["la loro"],"de":"Giulia und Sara verkaufen ihr Auto."},{"q":"Pietro ha chiamato ___ figlie. (seine)","a":["le sue"],"de":"Pietro hat seine Töchter angerufen."},{"q":"Ognuno deve pagare il ___ biglietto. (eigen)","a":["proprio"],"de":"Jeder muss seine eigene Fahrkarte bezahlen."},{"q":"Bisogna accettare i ___ errori. (eigen)","a":["propri"],"de":"Man muss seine eigenen Fehler akzeptieren."},{"q":"I signori Rossi festeggiano ___ anniversario. (ihren)","a":["il loro"],"de":"Die Rossis feiern ihren Hochzeitstag."},{"q":"Elena ha perso ___ orecchini. (ihre)","a":["i suoi"],"de":"Elena hat ihre Ohrringe verloren."},{"q":"Ciascuno ha le ___ abitudini. (eigen)","a":["proprie"],"de":"Jeder hat seine eigenen Gewohnheiten."},{"q":"I ragazzi hanno lasciato qui ___ zaini. (ihre)","a":["i loro"],"de":"Die Jungs haben ihre Rucksäcke hier gelassen."}]},{"type":"gap","title":"Gemischte Übung","task":"Ergänze das Possessiv (mit oder ohne Artikel/Präposition).","items":[{"q":"Ho conosciuto ___ zio di Torino. (dein)","a":["il tuo"],"de":"Ich habe deinen Onkel aus Turin kennengelernt."},{"q":"Non ho la penna, mi presti ___? (deine)","a":["la tua"],"de":"Ich habe keinen Stift, leihst du mir deinen?"},{"q":"Abbiamo festeggiato Natale con ___. (meine Eltern, Pronomen)","a":["i miei"],"de":"Wir haben Weihnachten mit meinen Eltern gefeiert."},{"q":"Questi occhiali non sono ___. (meine, Zugehörigkeit nach essere)","a":["miei","i miei"],"de":"Diese Brille gehört nicht mir."},{"q":"Hai parlato con ___ moglie? (seine)","a":["sua"],"de":"Hast du mit seiner Frau gesprochen?"},{"q":"Siamo andati in vacanza con ___ cugini. (unsere)","a":["i nostri"],"de":"Wir sind mit unseren Cousins in Urlaub gefahren."},{"q":"Penso spesso ai ___ amici d'infanzia. (meine)","a":["miei"],"de":"Ich denke oft an meine Kindheitsfreunde."},{"q":"È stato un ___ errore, scusa. (mein, mit unbest. Artikel)","a":["mio"],"de":"Das war ein Fehler von mir, entschuldige."},{"q":"Ha fatto tutto di testa ___. (sein)","a":["sua"],"de":"Er hat alles nach seinem Kopf gemacht."}]}],"cards":[{"f":"mein / meine (m./f., Sg./Pl.)","b":"il mio, la mia, i miei, le mie"},{"f":"sein / ihr (Sg.)","b":"il suo / la sua – richtet sich nach dem Besessenen"},{"f":"ihr (Pl.-Besitzer)","b":"il loro, la loro, i loro, le loro – unveränderlich"},{"f":"euer / eure","b":"il vostro, la vostra, i vostri, le vostre"},{"f":"Ihr (Höflichkeitsform)","b":"il Suo, la Sua, i Suoi, le Sue"},{"f":"mia madre oder la mia madre?","b":"mia madre – Verwandter im Singular ohne Artikel"},{"f":"meine Eltern","b":"i miei genitori (oder kurz: i miei)"},{"f":"ihre Mutter (Pl.-Besitzer)","b":"la loro madre – bei loro immer Artikel"},{"f":"meine Mama / mein Papa","b":"la mia mamma / il mio papà – Koseform mit Artikel"},{"f":"mein Schwesterchen","b":"la mia sorellina"},{"f":"Possessivpronomen: deins (f.)","b":"la tua – immer mit Artikel"},{"f":"Mein Vater ist Arzt, und deiner?","b":"Mio padre fa il medico, e il tuo?"},{"f":"Diese Tasche gehört mir.","b":"Questa borsa è mia."},{"f":"bei mir zu Hause","b":"a casa mia"},{"f":"Es ist meine Schuld.","b":"È colpa mia."},{"f":"meinerseits / von mir aus","b":"da parte mia"},{"f":"auf eigene Faust","b":"per conto mio"},{"f":"ein Freund von mir","b":"un mio amico / un amico mio"},{"f":"zwei Kolleginnen von mir","b":"due mie colleghe"},{"f":"Ich wasche mir die Hände.","b":"Mi lavo le mani."},{"f":"Ich habe meine Schlüssel verloren.","b":"Ho perso le chiavi."},{"f":"Man muss seine Grenzen kennen.","b":"Bisogna conoscere i propri limiti."},{"f":"mit eigenen Augen","b":"con i miei (tuoi …) occhi / con i propri occhi"},{"f":"Jeder hat seine Meinung gesagt.","b":"Ognuno ha detto la sua."},{"f":"Auf uns! (Trinkspruch)","b":"Alla nostra!"},{"f":"sein/ihr – eindeutig machen","b":"la casa di lui / la casa di lei"}],"id":"k05"},{"nr":6,"title":"Die Demonstrativa","teil":"Das Substantiv und seine Begleiter","intro":"Mit Demonstrativa zeigt man auf Personen und Dinge: questo für Nahes, quello für Entferntes. Besonders quello verlangt Aufmerksamkeit, weil es seine Form wie der bestimmte Artikel ändert.","sections":[{"h":"questo: Formen","html":"<p><em>questo<\/em> (= dieser hier) bezeichnet etwas, das beim Sprecher ist – räumlich oder zeitlich.<\/p><table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>questo<\/em><\/td><td><em>questi<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>questa<\/em><\/td><td><em>queste<\/em><\/td><\/tr><\/table><ul><li><em>questo zaino, questa sedia<\/em> <small>dieser Rucksack, dieser Stuhl<\/small><\/li><li><em>questi giorni, queste foto<\/em> <small>diese Tage, diese Fotos<\/small><\/li><\/ul><p>Vor Vokal kann im Singular apostrophiert werden: <em>quest'anno, quest'estate, quest'uomo<\/em> <small>dieses Jahr, diesen Sommer, dieser Mann<\/small>. Im Plural wird nicht apostrophiert: <em>questi alberi, queste isole<\/em>.<\/p>"},{"h":"Kurzformen: stamattina, stasera …","html":"<p>Mit Tageszeiten verschmilzt <em>questa<\/em> zu <em>sta-<\/em>:<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>stamattina / stamani<\/em><\/td><td>heute Morgen<\/td><\/tr><tr><td><em>stasera<\/em><\/td><td>heute Abend<\/td><\/tr><tr><td><em>stanotte<\/em><\/td><td>heute Nacht / letzte Nacht<\/td><\/tr><tr><td><em>stavolta<\/em><\/td><td>diesmal<\/td><\/tr><\/table><p><em>Stasera usciamo a cena.<\/em> <small>Heute Abend gehen wir essen.<\/small><\/p><div class=\"tip\"><em>oggi pomeriggio<\/em> = heute Nachmittag – hier gibt es keine Kurzform.<\/div><p>Umgangssprachlich hört man auch <em>sto, sta, sti, ste<\/em> (<em>sta casa<\/em>) – in der Schriftsprache vermeiden.<\/p>"},{"h":"quello: Formen wie der Artikel","html":"<p><em>quello<\/em> (= jener, der da) bezeichnet etwas Entferntes. <b>Vor einem Nomen<\/b> verändert es sich genau wie der bestimmte Artikel:<\/p><table><tr><th>Artikel<\/th><th>quello<\/th><th>Beispiel<\/th><\/tr><tr><td><em>il<\/em><\/td><td><em>quel<\/em><\/td><td><em>quel ragazzo<\/em><\/td><\/tr><tr><td><em>lo<\/em><\/td><td><em>quello<\/em><\/td><td><em>quello studente, quello zio<\/em><\/td><\/tr><tr><td><em>l'<\/em><\/td><td><em>quell'<\/em><\/td><td><em>quell'albero, quell'amica<\/em><\/td><\/tr><tr><td><em>la<\/em><\/td><td><em>quella<\/em><\/td><td><em>quella casa<\/em><\/td><\/tr><tr><td><em>i<\/em><\/td><td><em>quei<\/em><\/td><td><em>quei ragazzi<\/em><\/td><\/tr><tr><td><em>gli<\/em><\/td><td><em>quegli<\/em><\/td><td><em>quegli studenti, quegli amici<\/em><\/td><\/tr><tr><td><em>le<\/em><\/td><td><em>quelle<\/em><\/td><td><em>quelle case<\/em><\/td><\/tr><\/table><div class=\"tip\">Eselsbrücke: Sag zuerst den Artikel – <em>gli zaini<\/em> → <em>quegli zaini<\/em>, <em>il libro<\/em> → <em>quel libro<\/em>.<\/div><div class=\"warn\">Achtung: <em>quel libro<\/em>, nicht <em>quello libro<\/em>; <em>quegli occhiali<\/em>, nicht <em>quei occhiali<\/em>.<\/div>"},{"h":"Stellung und Gegenüberstellung","html":"<p>Das Demonstrativum steht vor dem Nomen, <b>ohne<\/b> zusätzlichen Artikel. Possessiva und Adjektive können folgen:<\/p><ul><li><em>questa mia amica<\/em> <small>diese Freundin von mir<\/small><\/li><li><em>quel vecchio ponte<\/em> <small>jene alte Brücke<\/small><\/li><\/ul><p>Zur Verstärkung oder beim Zeigen fügt man <em>qui/qua<\/em> bzw. <em>lì/là<\/em> hinzu:<\/p><ul><li><em>Prendo questa qui, non quella lì.<\/em> <small>Ich nehme die hier, nicht die da.<\/small><\/li><\/ul><p>Bei Gegenüberstellung entspricht <em>questo<\/em> dem deutschen „dieser/letzterer“ (das zuletzt Genannte), <em>quello<\/em> „jener/ersterer“:<\/p><p><em>Ho due cugini, Franco e Dario: questo fa il cuoco, quello l'avvocato.<\/em> <small>… Dario ist Koch, Franco Anwalt.<\/small><\/p>"},{"h":"questo und quello als Pronomen","html":"<p>Als Pronomen (ohne Nomen) hat <em>quello<\/em> nur die vier Vollformen: <em>quello, quella, quelli, quelle<\/em>.<\/p><ul><li><em>Quale borsa vuoi? – Quella.<\/em> <small>Welche Tasche willst du? – Die da.<\/small><\/li><li><em>Questi pomodori sono più maturi di quelli.<\/em> <small>Diese Tomaten sind reifer als jene.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Als Pronomen nie <em>quei<\/em> oder <em>quegli<\/em>: <em>Mi piacciono quelli<\/em>, nicht <em>quei<\/em>.<\/div><p>Wichtige Verbindungen:<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>quello di Marco<\/em><\/td><td>der von Marco<\/td><\/tr><tr><td><em>quella rossa<\/em><\/td><td>die rote<\/td><\/tr><tr><td><em>quelli che vengono<\/em><\/td><td>diejenigen, die kommen<\/td><\/tr><tr><td><em>quello che dici<\/em><\/td><td>das, was du sagst<\/td><\/tr><\/table><p>Neutral (für einen Sachverhalt) steht das maskuline <em>questo / quello<\/em>: <em>Questo non lo sapevo.<\/em> <small>Das wusste ich nicht.<\/small> – <em>Quello che conta è la salute.<\/em> <small>Was zählt, ist die Gesundheit.<\/small><\/p>"},{"h":"ciò","html":"<p><em>ciò<\/em> ist ein unveränderliches, neutrales Pronomen (= dies, das). Es ist etwas gehobener als <em>questo/quello<\/em> und steht nie vor einem Nomen.<\/p><ul><li><em>Ciò mi sembra strano.<\/em> <small>Das kommt mir seltsam vor.<\/small><\/li><li><em>Non sono d'accordo con ciò che hai scritto.<\/em> <small>Ich bin nicht einverstanden mit dem, was du geschrieben hast.<\/small><\/li><li><em>Ciò nonostante è partito.<\/em> <small>Trotzdem ist er abgereist.<\/small><\/li><li><em>Oltre a ciò …<\/em> <small>Außerdem …<\/small><\/li><\/ul><div class=\"tip\"><em>ciò che<\/em> = <em>quello che<\/em> = das, was. Gesprochen ist <em>quello che<\/em> häufiger.<\/div>"},{"h":"stesso und medesimo","html":"<p><em>stesso<\/em> (-a, -i, -e) hat zwei Hauptbedeutungen:<\/p><ul><li><b>vor<\/b> dem Nomen mit Artikel = derselbe: <em>Abitiamo nello stesso palazzo.<\/em> <small>Wir wohnen im selben Gebäude.<\/small><\/li><li><b>nach<\/b> Nomen/Pronomen = selbst: <em>L'ha detto il sindaco stesso.<\/em> <small>Der Bürgermeister selbst hat es gesagt.<\/small> – <em>Lo faccio io stesso.<\/em> <small>Ich mache es selbst.<\/small><\/li><\/ul><p>Reflexiv: <em>Pensa solo a sé stesso.<\/em> <small>Er denkt nur an sich selbst.<\/small> Neben <em>sé stesso<\/em> ist auch die Schreibung <em>se stesso<\/em> verbreitet. <em>da sé<\/em> = von selbst, allein: <em>La porta si è chiusa da sé.<\/em> <small>Die Tür ist von selbst zugegangen.<\/small><\/p><p>Als Neutrum/Adverb: <em>Per me fa lo stesso.<\/em> <small>Mir ist es egal.<\/small> – <em>Piove, ma esco lo stesso.<\/em> <small>Es regnet, aber ich gehe trotzdem raus.<\/small><\/p><p><em>medesimo<\/em> bedeutet dasselbe wie <em>stesso<\/em>, ist aber gehoben bzw. schriftsprachlich: <em>nel medesimo istante<\/em> <small>im selben Augenblick<\/small>.<\/p>"},{"h":"codesto, costui und Co.","html":"<p><em>codesto<\/em> bezeichnet etwas beim <b>Angesprochenen<\/b> (= dieses da bei dir). Es lebt fast nur noch in der Toskana und in der Behördensprache:<\/p><p><em>Si prega codesto Ufficio di inviare la documentazione.<\/em> <small>Das (angeschriebene) Amt wird gebeten, die Unterlagen zu senden.<\/small><\/p><p><em>costui, costei, costoro<\/em> (= dieser da) beziehen sich nur auf Personen und klingen heute meist <b>abwertend<\/b>:<\/p><p><em>E costui chi sarebbe?<\/em> <small>Und wer soll der da sein?<\/small><\/p><p><em>colui, colei, coloro<\/em> stehen fast nur vor einem Relativsatz (= derjenige, der): <em>coloro che hanno pagato<\/em> <small>diejenigen, die bezahlt haben<\/small>.<\/p><div class=\"warn\">Achtung: <em>costui/costoro<\/em> nicht neutral für „dieser Mann/diese Leute“ verwenden – es wirkt herablassend. Neutral: <em>questo signore, queste persone<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"questo","task":"Setze die richtige Form von questo ein (vor Vokal im Singular apostrophiert).","items":[{"q":"___ sedie sono scomode.","a":["Queste"],"de":"Diese Stühle sind unbequem."},{"q":"Non conosco ___ ragazzo.","a":["questo"],"de":"Ich kenne diesen Jungen nicht."},{"q":"___ anno andiamo in Sicilia.","a":["Quest'","Questo"],"de":"Dieses Jahr fahren wir nach Sizilien."},{"q":"Di chi sono ___ guanti?","a":["questi"],"de":"Wem gehören diese Handschuhe?"},{"q":"___ estate fa un caldo terribile.","a":["Quest'","Questa"],"de":"Diesen Sommer ist es schrecklich heiß."},{"q":"Ci vediamo ___. (heute Abend)","a":["stasera"],"de":"Wir sehen uns heute Abend."},{"q":"___ ho bevuto solo un caffè. (heute Morgen)","a":["Stamattina","Stamani"],"de":"Heute Morgen habe ich nur einen Kaffee getrunken."}]},{"type":"gap","title":"quello vor dem Nomen","task":"Setze die richtige Form von quello ein.","items":[{"q":"Ti piace ___ vestito?","a":["quel"],"de":"Gefällt dir das Kleid da?"},{"q":"Chi è ___ signora?","a":["quella"],"de":"Wer ist die Dame da?"},{"q":"Guarda ___ uccelli!","a":["quegli"],"de":"Schau dir die Vögel dort an!"},{"q":"___ specchio è antico.","a":["Quello"],"de":"Der Spiegel da ist antik."},{"q":"Ricordi ___ estate a Rimini?","a":["quell'"],"de":"Erinnerst du dich an jenen Sommer in Rimini?"},{"q":"___ libri sono di Paola.","a":["Quei"],"de":"Die Bücher da gehören Paola."},{"q":"Non mi fido di ___ uomo.","a":["quell'"],"de":"Ich traue dem Mann da nicht."},{"q":"___ scarpe costano troppo.","a":["Quelle"],"de":"Die Schuhe dort kosten zu viel."},{"q":"Abbiamo parlato con ___ psicologo.","a":["quello"],"de":"Wir haben mit dem Psychologen gesprochen."}]},{"type":"choice","title":"Begleiter oder Pronomen?","task":"Wähle die richtige Form.","items":[{"q":"Questi stivali sono belli, ma ___ sono più comodi.","options":["quei","quelli"],"a":1,"why":"Pronomen ohne Nomen → Vollform quelli."},{"q":"Mi passi ___ bicchieri?","options":["quei","quelli"],"a":0,"why":"Vor dem Nomen wie Artikel: i → quei."},{"q":"Non è la mia giacca, è ___ di Luca.","options":["quella","quell'"],"a":0,"why":"Pronomen + di → quella."},{"q":"Hai visto ___ occhiali da sole?","options":["quei","quegli"],"a":1,"why":"gli occhiali → quegli occhiali."},{"q":"Quale gelato prendi? ___ al limone.","options":["Quel","Quello"],"a":1,"why":"Als Pronomen nur die Vollform quello."},{"q":"Tra questi biscotti prendo ___ che costano meno.","options":["quei","quelli"],"a":1,"why":"Pronomen vor Relativsatz → quelli che."},{"q":"___ amici sono simpatici.","options":["Quei","Quegli"],"a":1,"why":"gli amici → quegli amici."}]},{"type":"gap","title":"ciò, stesso, lo stesso","task":"Ergänze ciò oder die passende Form von stesso.","items":[{"q":"Siamo nati nello ___ anno.","a":["stesso"],"de":"Wir sind im selben Jahr geboren."},{"q":"Le ragazze hanno organizzato tutto loro ___.","a":["stesse"],"de":"Die Mädchen haben alles selbst organisiert."},{"q":"Non credo a ___ che dice.","a":["ciò"],"de":"Ich glaube nicht, was er sagt."},{"q":"È stanco, ma viene lo ___.","a":["stesso"],"de":"Er ist müde, kommt aber trotzdem."},{"q":"Abbiamo avuto le ___ idee.","a":["stesse"],"de":"Wir hatten dieselben Ideen."},{"q":"___ nonostante, abbiamo vinto.","a":["Ciò"],"de":"Trotzdem haben wir gewonnen."},{"q":"Parla sempre di sé ___.","a":["stesso"],"de":"Er spricht immer von sich selbst."},{"q":"Me l'ha detto il direttore ___.","a":["stesso"],"de":"Der Direktor selbst hat es mir gesagt."}]},{"type":"choice","title":"Gebrauch und Stil","task":"Wähle die passende Lösung.","items":[{"q":"„Das wusste ich nicht.“","options":["Questa non lo sapevo.","Questo non lo sapevo."],"a":1,"why":"Für einen Sachverhalt steht das neutrale maskuline questo."},{"q":"„Was zählt, ist die Gesundheit.“","options":["Che conta è la salute.","Quello che conta è la salute."],"a":1,"why":"„das, was“ = quello che / ciò che."},{"q":"Im Amtsbrief an eine Behörde: „… bittet ___ Ufficio …“","options":["codesto","costui"],"a":0,"why":"codesto = die angesprochene Stelle, typisch Behördensprache."},{"q":"Abwertend: „Und wer ist der da?“","options":["E costui chi è?","E codesto chi è?"],"a":0,"why":"costui bezieht sich abwertend auf Personen."},{"q":"„Mir ist es egal.“","options":["Per me fa lo stesso.","Per me fa stesso."],"a":0,"why":"Feste Wendung mit Artikel: fa lo stesso."},{"q":"„Ich habe zwei Hunde, Fido und Rex: ___ ist alt, jener jung.“ (= Rex alt)","options":["questo","quello"],"a":0,"why":"questo verweist auf das zuletzt Genannte (Rex)."},{"q":"„diejenigen, die zu spät kommen“ (gehoben)","options":["coloro che arrivano tardi","costoro che arrivano tardi"],"a":0,"why":"colui/coloro + che = derjenige/diejenigen, die."}]}],"cards":[{"f":"dieser/diese (Sg./Pl.)","b":"questo, questa, questi, queste"},{"f":"dieses Jahr","b":"quest'anno"},{"f":"heute Morgen / heute Abend","b":"stamattina (stamani) / stasera"},{"f":"heute Nacht / diesmal","b":"stanotte / stavolta"},{"f":"quello vor il-Wörtern","b":"quel – quel ragazzo"},{"f":"quello vor lo-Wörtern","b":"quello – quello studente"},{"f":"quello vor Vokal (Sg.)","b":"quell' – quell'albero, quell'amica"},{"f":"quello vor i-Wörtern","b":"quei – quei libri"},{"f":"quello vor gli-Wörtern","b":"quegli – quegli zaini, quegli amici"},{"f":"quello als Pronomen","b":"quello, quella, quelli, quelle (nie quel/quei/quegli)"},{"f":"der von Marco","b":"quello di Marco"},{"f":"das, was …","b":"quello che … / ciò che …"},{"f":"die hier, nicht die da","b":"questa qui, non quella lì"},{"f":"Das weiß ich nicht.","b":"Questo non lo so."},{"f":"trotzdem (gehoben)","b":"ciò nonostante"},{"f":"derselbe Tag","b":"lo stesso giorno"},{"f":"ich selbst / sie selbst (Pl. f.)","b":"io stesso (stessa) / loro stesse"},{"f":"an sich selbst denken","b":"pensare a sé stesso (se stesso)"},{"f":"von selbst","b":"da sé"},{"f":"Mir ist es egal.","b":"Per me fa lo stesso."},{"f":"trotzdem (Alltag)","b":"lo stesso – vengo lo stesso"},{"f":"medesimo","b":"= stesso, aber gehoben"},{"f":"codesto","b":"„dieses da bei dir“ – toskanisch / Behördensprache"},{"f":"costui, costei, costoro","b":"dieser da – meist abwertend"},{"f":"colui che / coloro che","b":"derjenige, der / diejenigen, die (gehoben)"},{"f":"questo … quello (Gegenüberstellung)","b":"letzterer … ersterer"}],"id":"k06"},{"nr":7,"title":"Die Indefinita","teil":"Das Substantiv und seine Begleiter","intro":"Indefinita bezeichnen unbestimmte Personen, Dinge oder Mengen: jemand, etwas, jeder, einige, viel, nichts. Wichtig ist, ob ein Wort nur vor einem Nomen, nur allein oder in beiden Funktionen stehen kann.","sections":[{"h":"Überblick","html":"<p>Man unterscheidet drei Gruppen:<\/p><table><tr><th>Gruppe<\/th><th>Beispiele<\/th><\/tr><tr><td>nur adjektivisch (vor Nomen)<\/td><td><em>ogni, qualche, qualsiasi, qualunque<\/em><\/td><\/tr><tr><td>nur pronominal (allein)<\/td><td><em>qualcuno, ognuno, chiunque, qualcosa, niente/nulla, uno<\/em><\/td><\/tr><tr><td>beides<\/td><td><em>alcuno, nessuno, ciascuno, altro, molto, poco, tanto, troppo, parecchio, tutto, certo, vario, diverso<\/em><\/td><\/tr><\/table><div class=\"tip\">Faustregel: <em>ogni<\/em> → <em>ognuno<\/em>, <em>qualche<\/em> → <em>qualcuno<\/em>. Vor dem Nomen die erste, allein die zweite Form.<\/div>"},{"h":"ogni und qualche","html":"<p><em>ogni<\/em> (= jeder, jede) ist unveränderlich und steht mit dem Nomen im <b>Singular<\/b>:<\/p><ul><li><em>Ogni mattina faccio jogging.<\/em> <small>Jeden Morgen jogge ich.<\/small><\/li><li><em>Il bus passa ogni dieci minuti.<\/em> <small>Der Bus fährt alle zehn Minuten.<\/small> – Ausnahme: mit Zahlen Plural.<\/li><\/ul><p><em>qualche<\/em> (= einige, ein paar) ist unveränderlich und steht ebenfalls mit dem <b>Singular<\/b> – obwohl es eine Mehrzahl meint. Auch das Verb steht im Singular:<\/p><ul><li><em>Ho comprato qualche libro.<\/em> <small>Ich habe ein paar Bücher gekauft.<\/small><\/li><li><em>Qualche studente è già arrivato.<\/em> <small>Einige Studenten sind schon da.<\/small><\/li><li><em>qualche volta<\/em> <small>manchmal<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nicht <em>qualche libri<\/em>! Entweder <em>qualche libro<\/em> oder <em>alcuni libri<\/em>.<\/div>"},{"h":"qualsiasi und qualunque","html":"<p><em>qualsiasi<\/em> und <em>qualunque<\/em> (= jeder beliebige, irgendein) sind unveränderlich und bedeutungsgleich.<\/p><ul><li><em>Puoi chiamarmi a qualsiasi ora.<\/em> <small>Du kannst mich zu jeder Uhrzeit anrufen.<\/small><\/li><li><em>Prendi una penna qualunque.<\/em> <small>Nimm irgendeinen Stift.<\/small><\/li><\/ul><p>Nachgestellt nach <em>un/una<\/em> bekommen sie oft den Sinn „x-beliebig, gewöhnlich“: <em>Non è un giorno qualsiasi.<\/em> <small>Das ist kein gewöhnlicher Tag.<\/small><\/p><p>Mit Relativsatz folgt der <em>congiuntivo<\/em>: <em>Qualunque cosa tu decida, ti aiuto.<\/em> <small>Was auch immer du entscheidest, ich helfe dir.<\/small><\/p>"},{"h":"Nur pronominal: qualcuno, ognuno, chiunque, uno","html":"<ul><li><em>qualcuno<\/em> (-a) = jemand; einige: <em>Qualcuno ha bussato.<\/em> <small>Jemand hat geklopft.<\/small> – <em>Qualcuna delle mie amiche verrà.<\/em> <small>Eine meiner Freundinnen wird kommen.<\/small><\/li><li><em>ognuno<\/em> (-a) = jeder (Einzelne): <em>Ognuno porta qualcosa da mangiare.<\/em> <small>Jeder bringt etwas zu essen mit.<\/small><\/li><li><em>chiunque<\/em> = jeder (der), wer auch immer: <em>Chiunque può partecipare.<\/em> <small>Jeder kann teilnehmen.<\/small> – <em>Chiunque arrivi, non aprire.<\/em> <small>Egal wer kommt, mach nicht auf.<\/small> (+ congiuntivo)<\/li><li><em>uno<\/em> (-a) = einer; man: <em>Ho incontrato uno che ti conosce.<\/em> <small>Ich habe einen getroffen, der dich kennt.<\/small> – <em>Uno non sa mai cosa dire.<\/em> <small>Man weiß nie, was man sagen soll.<\/small><\/li><\/ul><div class=\"warn\">Achtung: „jeder“ vor einem Nomen = <em>ogni<\/em>, allein = <em>ognuno<\/em>. Nicht <em>ognuno giorno<\/em>.<\/div>"},{"h":"qualcosa, niente, nulla","html":"<p><em>qualcosa<\/em> (= etwas) und <em>niente / nulla<\/em> (= nichts) sind unveränderlich und gelten grammatisch als <b>maskulin<\/b>:<\/p><ul><li><em>È successo qualcosa?<\/em> <small>Ist etwas passiert?<\/small><\/li><li><em>Non è cambiato niente.<\/em> <small>Nichts hat sich geändert.<\/small><\/li><\/ul><p>Mit Adjektiv: <em>di<\/em> + Adjektiv; mit Verb: <em>da<\/em> + Infinitiv:<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>qualcosa di bello<\/em><\/td><td>etwas Schönes<\/td><\/tr><tr><td><em>niente di nuovo<\/em><\/td><td>nichts Neues<\/td><\/tr><tr><td><em>qualcosa da bere<\/em><\/td><td>etwas zu trinken<\/td><\/tr><tr><td><em>non c'è niente da fare<\/em><\/td><td>da ist nichts zu machen<\/td><\/tr><\/table><div class=\"warn\">Achtung: Nicht <em>qualcosa bello<\/em> oder <em>qualcosa a bere<\/em>. Immer <em>di<\/em> + Adjektiv, <em>da<\/em> + Infinitiv.<\/div><p>Vor Vokal wird oft elidiert: <em>qualcos'altro<\/em> (etwas anderes); <em>niente<\/em> und <em>nulla<\/em> sind austauschbar, <em>nulla<\/em> ist etwas gehobener.<\/p>"},{"h":"alcuno, nessuno, ciascuno","html":"<p><em>alcuni / alcune<\/em> (Plural) = einige: <em>Alcuni colleghi lavorano da casa.<\/em> <small>Einige Kollegen arbeiten von zu Hause.<\/small><\/p><p>Im Singular steht <em>alcuno<\/em> nur in verneinten Sätzen (= kein): <em>senza alcun dubbio<\/em> <small>ohne jeden Zweifel<\/small> – <em>Non c'è alcuna differenza.<\/em> <small>Es gibt keinen Unterschied.<\/small><\/p><p><em>nessuno<\/em> (= kein, niemand) und <em>ciascuno<\/em> (= jeder einzelne) gibt es nur im Singular. Vor einem Nomen verhalten sie sich wie der unbestimmte Artikel:<\/p><table><tr><th>un / uno / una / un'<\/th><th>nessuno<\/th><th>ciascuno<\/th><\/tr><tr><td><em>un libro<\/em><\/td><td><em>nessun libro<\/em><\/td><td><em>ciascun libro<\/em><\/td><\/tr><tr><td><em>uno zaino<\/em><\/td><td><em>nessuno zaino<\/em><\/td><td><em>ciascuno zaino<\/em><\/td><\/tr><tr><td><em>una casa<\/em><\/td><td><em>nessuna casa<\/em><\/td><td><em>ciascuna casa<\/em><\/td><\/tr><tr><td><em>un'idea<\/em><\/td><td><em>nessun'idea<\/em><\/td><td><em>ciascun'idea<\/em><\/td><\/tr><\/table><p>Als Pronomen: <em>Non ho visto nessuno.<\/em> <small>Ich habe niemanden gesehen.<\/small> – <em>Ciascuno di voi riceverà un modulo.<\/em> <small>Jeder von euch bekommt ein Formular.<\/small><\/p>"},{"h":"molto, poco, tanto, troppo, parecchio","html":"<p>Als <b>Adjektiv<\/b> (vor Nomen) und <b>Pronomen<\/b> richten sie sich nach Geschlecht und Zahl:<\/p><ul><li><em>molta gente, molti turisti<\/em> <small>viele Leute, viele Touristen<\/small><\/li><li><em>poca pazienza, pochi soldi<\/em> <small>wenig Geduld, wenig Geld<\/small><\/li><li><em>troppe domande<\/em> <small>zu viele Fragen<\/small><\/li><li><em>parecchie volte<\/em> <small>ziemlich oft<\/small><\/li><li><em>Hai dei biscotti? – Sì, ne ho tanti.<\/em> <small>Hast du Kekse? – Ja, ich habe viele.<\/small><\/li><\/ul><p>Als <b>Adverb<\/b> (bei Verb, Adjektiv, Adverb) sind sie <b>unveränderlich<\/b>:<\/p><ul><li><em>Le ragazze sono molto stanche.<\/em> <small>Die Mädchen sind sehr müde.<\/small><\/li><li><em>Abbiamo mangiato troppo.<\/em> <small>Wir haben zu viel gegessen.<\/small><\/li><li><em>Costa parecchio.<\/em> <small>Das kostet ziemlich viel.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>molto stanche<\/em> (Adverb, unveränderlich), aber <em>molte ragazze<\/em> (Adjektiv, angeglichen).<\/div><div class=\"tip\">Plural von <em>poco<\/em>: <em>pochi, poche<\/em> – mit h!<\/div>"},{"h":"tutto","html":"<ul><li><em>tutto<\/em> + Artikel + Nomen: <em>tutto il giorno, tutta la notte<\/em> <small>den ganzen Tag, die ganze Nacht<\/small><\/li><li><em>tutti i giorni, tutte le sere<\/em> <small>jeden Tag, jeden Abend<\/small> (= <em>ogni giorno<\/em>)<\/li><li><em>tutti e due / tutte e tre<\/em> = alle beide / alle drei: <em>Sono venuti tutti e due.<\/em> <small>Sie sind beide gekommen.<\/small><\/li><li>Pronomen: <em>Tutti lo sanno.<\/em> <small>Alle wissen es.<\/small> – <em>Ho capito tutto.<\/em> <small>Ich habe alles verstanden.<\/small><\/li><li><em>tutti noi, tutti voi<\/em> <small>wir alle, ihr alle<\/small>; <em>tutto quello che / tutto ciò che<\/em> <small>alles, was<\/small><\/li><\/ul><div class=\"warn\">Achtung: Zwischen <em>tutto<\/em> und Nomen steht der Artikel: <em>tutta la classe<\/em>, nicht <em>tutta classe<\/em>. Und: <em>tutti e due<\/em>, nicht <em>tutti due<\/em>.<\/div>"},{"h":"altro, certo, vario, diverso","html":"<ul><li><em>altro<\/em> = anderer, weiterer: <em>un altro caffè, un'altra volta, gli altri<\/em> <small>noch ein Kaffee, ein andermal, die anderen<\/small><\/li><li><em>l'altro ieri<\/em> <small>vorgestern<\/small> – <em>Altro?<\/em> <small>Sonst noch etwas?<\/small> – <em>senz'altro<\/em> <small>auf jeden Fall<\/small> – <em>tra l'altro<\/em> <small>unter anderem<\/small><\/li><li><em>certo<\/em> vor dem Nomen = gewiss, ein gewisser: <em>un certo signor Neri, certe persone<\/em> <small>ein gewisser Herr Neri, gewisse Leute<\/small>; nach dem Nomen = sicher: <em>una notizia certa<\/em> <small>eine sichere Nachricht<\/small><\/li><li><em>vario, diverso<\/em> im Plural vor dem Nomen = mehrere: <em>varie volte, diversi amici<\/em> <small>mehrmals, mehrere Freunde<\/small>; nach dem Nomen = verschieden: <em>opinioni diverse<\/em> <small>unterschiedliche Meinungen<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>un altro<\/em> (m.) ohne Apostroph, <em>un'altra<\/em> (f.) mit Apostroph.<\/div>"},{"h":"Verneinung: non … nessuno / niente","html":"<p>Stehen <em>nessuno, niente, nulla<\/em> <b>nach<\/b> dem Verb, braucht man zusätzlich <em>non<\/em> vor dem Verb – doppelte Verneinung ist im Italienischen Pflicht:<\/p><ul><li><em>Non è venuto nessuno.<\/em> <small>Niemand ist gekommen.<\/small><\/li><li><em>Non ho detto niente.<\/em> <small>Ich habe nichts gesagt.<\/small><\/li><li><em>Non ho nessuna voglia.<\/em> <small>Ich habe keine Lust.<\/small><\/li><\/ul><p>Stehen sie <b>vor<\/b> dem Verb, entfällt <em>non<\/em>:<\/p><ul><li><em>Nessuno è venuto.<\/em> <small>Niemand ist gekommen.<\/small><\/li><li><em>Niente è impossibile.<\/em> <small>Nichts ist unmöglich.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>Ho visto nessuno<\/em> ist falsch – richtig: <em>Non ho visto nessuno<\/em>.<\/div>"}],"exercises":[{"type":"choice","title":"ogni, qualche, qualcuno, ognuno","task":"Wähle die richtige Form.","items":[{"q":"___ sabato vado al mercato.","options":["Ogni","Ognuno"],"a":0,"why":"Vor dem Nomen: ogni."},{"q":"Ho letto ___ articolo interessante.","options":["qualche","alcuni"],"a":0,"why":"qualche + Singular."},{"q":"___ ha lasciato la porta aperta.","options":["Qualche","Qualcuno"],"a":1,"why":"Allein stehend = qualcuno (jemand)."},{"q":"___ deve fare la sua parte.","options":["Ogni","Ognuno"],"a":1,"why":"Allein stehend = ognuno."},{"q":"Ci vediamo ___ volta.","options":["qualche","qualcuna"],"a":0,"why":"qualche volta = manchmal."},{"q":"Ho invitato ___ amici.","options":["qualche","alcuni"],"a":1,"why":"Nomen im Plural → alcuni."},{"q":"___ può sbagliare.","options":["Chiunque","Qualunque"],"a":0,"why":"Pronomen: chiunque = jeder; qualunque nur vor Nomen."},{"q":"Scegli un colore ___.","options":["qualsiasi","chiunque"],"a":0,"why":"Nach dem Nomen: qualsiasi = beliebig."}]},{"type":"gap","title":"molto, poco, troppo … angleichen oder nicht?","task":"Setze die richtige Form ein.","items":[{"q":"Ci sono (molto) ___ persone in piazza.","a":["molte"],"de":"Auf dem Platz sind viele Leute."},{"q":"I bambini sono (molto) ___ bravi.","a":["molto"],"de":"Die Kinder sind sehr brav."},{"q":"Abbiamo (poco) ___ tempo.","a":["poco"],"de":"Wir haben wenig Zeit."},{"q":"Ho fatto (troppo) ___ errori.","a":["troppi"],"de":"Ich habe zu viele Fehler gemacht."},{"q":"Sono rimasti (poco) ___ posti liberi.","a":["pochi"],"de":"Es sind wenige freie Plätze übrig."},{"q":"Mia nonna cucina (tanto) ___ bene!","a":["tanto"],"de":"Meine Oma kocht so gut!"},{"q":"L'ho chiamata (parecchio) ___ volte.","a":["parecchie"],"de":"Ich habe sie ziemlich oft angerufen."},{"q":"Bevi (troppo) ___ caffè.","a":["troppo"],"de":"Du trinkst zu viel Kaffee."}]},{"type":"gap","title":"Verneinung und nessuno","task":"Ergänze non, nessuno (passende Form) oder niente.","items":[{"q":"___ ho capito niente.","a":["Non"],"de":"Ich habe nichts verstanden."},{"q":"Al telefono non risponde ___. (niemand)","a":["nessuno"],"de":"Am Telefon geht niemand ran."},{"q":"Non c'è ___ problema.","a":["nessun"],"de":"Es gibt kein Problem."},{"q":"Non ho ___ intenzione di cambiare casa.","a":["nessuna"],"de":"Ich habe keinerlei Absicht umzuziehen."},{"q":"___ mi ha avvisato. (niemand, am Satzanfang)","a":["Nessuno"],"de":"Niemand hat mich benachrichtigt."},{"q":"Non abbiamo comprato ___. (nichts)","a":["niente","nulla"],"de":"Wir haben nichts gekauft."},{"q":"In questa zona non c'è ___ supermercato.","a":["nessun"],"de":"In dieser Gegend gibt es keinen Supermarkt."},{"q":"Non c'è ___ sconto per gli studenti.","a":["nessuno"],"de":"Es gibt keinen Rabatt für Studenten."}]},{"type":"gap","title":"di oder da?","task":"Setze di oder da ein.","items":[{"q":"Vuoi qualcosa ___ bere?","a":["da"],"de":"Möchtest du etwas zu trinken?"},{"q":"Raccontami qualcosa ___ divertente.","a":["di"],"de":"Erzähl mir etwas Lustiges."},{"q":"Non c'è niente ___ fare.","a":["da"],"de":"Da ist nichts zu machen."},{"q":"Niente ___ nuovo in ufficio?","a":["di"],"de":"Nichts Neues im Büro?"},{"q":"Ho bisogno di qualcosa ___ leggere per il viaggio.","a":["da"],"de":"Ich brauche etwas zu lesen für die Reise."},{"q":"Non ha detto nulla ___ importante.","a":["di"],"de":"Er hat nichts Wichtiges gesagt."}]},{"type":"choice","title":"tutto, altro, certo, diverso","task":"Wähle die richtige Lösung.","items":[{"q":"Ho lavorato ___ giorno.","options":["tutto il","tutto"],"a":0,"why":"tutto + Artikel + Nomen."},{"q":"Sono venute ___ sorelle.","options":["tutte e due le","tutti due"],"a":0,"why":"tutte e due (+ Artikel + Nomen) – mit e und angeglichen."},{"q":"Prendo ___ birra, per favore.","options":["un altra","un'altra"],"a":1,"why":"Feminin vor Vokal: un'altra."},{"q":"Vorrei ___ panino.","options":["un altro","un'altro"],"a":0,"why":"Maskulin: un altro ohne Apostroph."},{"q":"Ci siamo visti ___ ieri.","options":["l'altro","altro"],"a":0,"why":"l'altro ieri = vorgestern."},{"q":"Ho incontrato ___ persone simpatiche.","options":["diverse","diversi"],"a":0,"why":"diverse vor Nomen = mehrere, angeglichen an persone (f. Pl.)."},{"q":"Abbiamo gusti ___.","options":["diversi","diverse"],"a":0,"why":"Nach dem Nomen = verschieden; gusti ist m. Pl."},{"q":"Ti ha cercato un ___ signor Galli.","options":["certo","sicuro"],"a":0,"why":"un certo + Name = ein gewisser."}]},{"type":"gap","title":"Gemischte Übung","task":"Setze das passende Indefinitum ein.","items":[{"q":"Il treno parte ___ ora. (jede)","a":["ogni"],"de":"Der Zug fährt jede Stunde."},{"q":"C'è ___ in casa? (jemand)","a":["qualcuno"],"de":"Ist jemand zu Hause?"},{"q":"___ di voi deve firmare. (jeder einzelne)","a":["Ciascuno","Ognuno"],"de":"Jeder von euch muss unterschreiben."},{"q":"Sono partiti ___ e tre. (alle)","a":["tutti"],"de":"Alle drei sind abgereist."},{"q":"___ cosa succeda, chiamami. (was auch immer)","a":["Qualunque","Qualsiasi"],"de":"Was auch immer passiert, ruf mich an."},{"q":"Senza ___ dubbio è il migliore. (jeden)","a":["alcun","nessun"],"de":"Ohne jeden Zweifel ist er der Beste."},{"q":"Mi serve ___ cosa da mangiare. (etwas, mit qual-)","a":["qualche"],"de":"Ich brauche etwas zu essen."},{"q":"Hai capito ___? (alles)","a":["tutto"],"de":"Hast du alles verstanden?"},{"q":"Gli ___ sono già andati via. (anderen)","a":["altri"],"de":"Die anderen sind schon gegangen."}]}],"cards":[{"f":"jeder (vor Nomen) / jeder (allein)","b":"ogni / ognuno (-a)"},{"f":"einige Bücher (2 Möglichkeiten)","b":"qualche libro / alcuni libri"},{"f":"jemand","b":"qualcuno"},{"f":"etwas","b":"qualcosa"},{"f":"nichts","b":"niente / nulla"},{"f":"niemand / kein","b":"nessuno – nessun libro, nessuno zaino, nessuna idea"},{"f":"jeder beliebige","b":"qualsiasi / qualunque (unveränderlich)"},{"f":"wer auch immer / jeder, der","b":"chiunque (+ congiuntivo)"},{"f":"Man weiß nie …","b":"Uno non sa mai …"},{"f":"etwas Schönes","b":"qualcosa di bello"},{"f":"etwas zu trinken","b":"qualcosa da bere"},{"f":"nichts zu machen","b":"niente da fare"},{"f":"Ich habe niemanden gesehen.","b":"Non ho visto nessuno."},{"f":"Niemand ist gekommen. (2 Stellungen)","b":"Nessuno è venuto. / Non è venuto nessuno."},{"f":"ohne jeden Zweifel","b":"senza alcun dubbio"},{"f":"manchmal","b":"qualche volta"},{"f":"sehr müde (Pl. f.)","b":"molto stanche – Adverb unveränderlich"},{"f":"wenig Geld","b":"pochi soldi"},{"f":"den ganzen Tag","b":"tutto il giorno"},{"f":"jeden Tag","b":"tutti i giorni / ogni giorno"},{"f":"alle beide","b":"tutti e due / tutte e due"},{"f":"alles, was","b":"tutto quello che / tutto ciò che"},{"f":"noch ein Kaffee / ein andermal","b":"un altro caffè / un'altra volta"},{"f":"vorgestern","b":"l'altro ieri"},{"f":"Sonst noch etwas?","b":"Altro?"},{"f":"auf jeden Fall","b":"senz'altro"},{"f":"ein gewisser Herr Neri","b":"un certo signor Neri"},{"f":"mehrere Male / verschiedene Meinungen","b":"diverse volte / opinioni diverse"}],"id":"k07"},{"nr":8,"title":"Die Relativpronomen","teil":"Das Substantiv und seine Begleiter","intro":"Relativpronomen verbinden einen Nebensatz mit einem Nomen: der, die, das, dessen, dem. Das Italienische kommt mit wenigen Formen aus – che, cui, il quale, chi –, verlangt aber klare Regeln bei Präpositionen.","sections":[{"h":"che – Subjekt und Objekt","html":"<p><em>che<\/em> ist das häufigste Relativpronomen. Es ist <b>unveränderlich<\/b> und steht für Subjekt oder direktes Objekt – für Personen und Sachen:<\/p><ul><li><em>La signora che abita qui è medico.<\/em> <small>Die Frau, die hier wohnt, ist Ärztin.<\/small> (Subjekt)<\/li><li><em>Il film che abbiamo visto era lungo.<\/em> <small>Der Film, den wir gesehen haben, war lang.<\/small> (Objekt)<\/li><li><em>Le chiavi che cercavi sono in cucina.<\/em> <small>Die Schlüssel, die du gesucht hast, liegen in der Küche.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nach einer Präposition steht <b>nie<\/b> <em>che<\/em>: nicht <em>la ragazza con che esco<\/em>, sondern <em>con cui<\/em>.<\/div><div class=\"tip\">Das Relativpronomen kann im Italienischen – anders als im Englischen – nie weggelassen werden: <em>il libro che leggo<\/em>.<\/div>"},{"h":"il che – bezogen auf einen ganzen Satz","html":"<p>Bezieht sich der Relativsatz auf den <b>ganzen vorhergehenden Satz<\/b>, steht <em>il che<\/em> (= was):<\/p><ul><li><em>Ha trovato lavoro, il che ci rende felici.<\/em> <small>Er hat Arbeit gefunden, was uns glücklich macht.<\/small><\/li><li><em>Il volo è stato cancellato, il che significa un giorno in più a Lisbona.<\/em> <small>Der Flug wurde gestrichen, was einen Tag mehr in Lissabon bedeutet.<\/small><\/li><\/ul><p>Mit Präposition: <em>… del che mi dispiace<\/em> <small>… was mir leidtut<\/small> (gehoben).<\/p><div class=\"tip\">„…, was …“ nach einem Komma, das sich auf den ganzen Satz bezieht = <em>il che<\/em> (oder <em>e questo<\/em>).<\/div>"},{"h":"cui nach Präpositionen","html":"<p>Nach Präpositionen steht das unveränderliche <em>cui<\/em>:<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>la persona di cui ti ho parlato<\/em><\/td><td>die Person, von der ich dir erzählt habe<\/td><\/tr><tr><td><em>l'amico a cui ho scritto<\/em><\/td><td>der Freund, dem ich geschrieben habe<\/td><\/tr><tr><td><em>la città in cui sono nata<\/em><\/td><td>die Stadt, in der ich geboren bin<\/td><\/tr><tr><td><em>il motivo per cui ti chiamo<\/em><\/td><td>der Grund, weshalb ich dich anrufe<\/td><\/tr><tr><td><em>i colleghi con cui lavoro<\/em><\/td><td>die Kollegen, mit denen ich arbeite<\/td><\/tr><tr><td><em>il paese da cui vengono<\/em><\/td><td>das Land, aus dem sie kommen<\/td><\/tr><tr><td><em>la sedia su cui sei seduto<\/em><\/td><td>der Stuhl, auf dem du sitzt<\/td><\/tr><\/table><p>Bei <em>a<\/em> kann die Präposition entfallen: <em>la persona cui ho scritto<\/em> (gehoben).<\/p><p>Zeitangaben: <em>il giorno in cui ci siamo conosciuti<\/em> <small>der Tag, an dem wir uns kennengelernt haben<\/small> – umgangssprachlich auch <em>il giorno che …<\/em>.<\/p><p><em>per cui<\/em> als Satzverbindung (nach Komma) heißt auch „deshalb“: <em>Ero stanco, per cui sono rimasto a casa.<\/em> <small>Ich war müde, deshalb bin ich zu Hause geblieben.<\/small><\/p><p><em>di cui<\/em> kann auch „davon“ bedeuten: <em>Ho tre fratelli, di cui due vivono all'estero.<\/em> <small>Ich habe drei Geschwister, von denen zwei im Ausland leben.<\/small><\/p>"},{"h":"il cui = dessen, deren","html":"<p>Für „dessen/deren“ steht <em>cui<\/em> zwischen Artikel und Nomen. Der Artikel richtet sich nach dem <b>folgenden Nomen<\/b> (dem Besessenen):<\/p><ul><li><em>lo scrittore il cui romanzo ha vinto il premio<\/em> <small>der Schriftsteller, dessen Roman den Preis gewonnen hat<\/small><\/li><li><em>la ragazza i cui genitori sono svizzeri<\/em> <small>das Mädchen, dessen Eltern Schweizer sind<\/small><\/li><li><em>la città la cui storia è antichissima<\/em> <small>die Stadt, deren Geschichte uralt ist<\/small><\/li><li><em>gli amici le cui figlie studiano a Pavia<\/em> <small>die Freunde, deren Töchter in Pavia studieren<\/small><\/li><\/ul><div class=\"warn\">Achtung: Der Artikel passt zum Besessenen, nicht zum Besitzer: <em>la ragazza <b>i<\/b> cui genitori<\/em>.<\/div><div class=\"tip\">Da direkt <em>cui<\/em> folgt, gibt es nur <em>il, la, i, le<\/em> – nie <em>lo, l', gli<\/em>: <em>i cui amici, la cui amica, il cui zio<\/em>.<\/div><p>Mit Präposition: <em>l'azienda nel cui ufficio lavoro<\/em> <small>die Firma, in deren Büro ich arbeite<\/small><\/p>"},{"h":"il quale – Formen und Gebrauch","html":"<p><em>il quale<\/em> ist veränderlich und wird mit dem Artikel gebildet:<\/p><table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>il quale<\/em><\/td><td><em>i quali<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>la quale<\/em><\/td><td><em>le quali<\/em><\/td><\/tr><\/table><p>Mit Präpositionen verschmilzt der Artikel: <em>del quale, al quale, dalla quale, nei quali, sulle quali, con il quale<\/em> …<\/p><ul><li><em>Il collega al quale ho dato il fascicolo è in ferie.<\/em> <small>Der Kollege, dem ich die Akte gegeben habe, ist im Urlaub.<\/small><\/li><li><em>le ragioni per le quali ho rinunciato<\/em> <small>die Gründe, aus denen ich verzichtet habe<\/small><\/li><\/ul><p><em>il quale<\/em> ist gehobener als <em>che/cui<\/em>. Nützlich ist es vor allem zur <b>Eindeutigkeit<\/b>, weil es Geschlecht und Zahl zeigt:<\/p><p><em>Ho parlato con il fratello di Lucia, il quale lavora in banca.<\/em> <small>Ich habe mit Lucias Bruder gesprochen, der bei einer Bank arbeitet.<\/small> – <em>il quale<\/em> = der Bruder; mit <em>che<\/em> bliebe es offen.<\/p><div class=\"tip\">Als direktes Objekt verwendet man <em>il quale<\/em> nicht – dort steht <em>che<\/em>.<\/div>"},{"h":"Deutsche Relativpronomen wiedergeben","html":"<p>Die deutsche Deklination (der, dessen, dem, den) wird im Italienischen so wiedergegeben:<\/p><table><tr><th>Deutsch<\/th><th>Italienisch<\/th><\/tr><tr><td>der Mann, <b>der<\/b> …<\/td><td><em>l'uomo che …<\/em><\/td><\/tr><tr><td>der Mann, <b>den<\/b> ich kenne<\/td><td><em>l'uomo che conosco<\/em><\/td><\/tr><tr><td>der Mann, <b>dem<\/b> ich schreibe<\/td><td><em>l'uomo a cui / al quale scrivo<\/em><\/td><\/tr><tr><td>der Mann, <b>dessen<\/b> Auto …<\/td><td><em>l'uomo la cui macchina …<\/em><\/td><\/tr><tr><td>der Mann, <b>mit dem<\/b> …<\/td><td><em>l'uomo con cui / con il quale …<\/em><\/td><\/tr><tr><td>der Mann, <b>von dem<\/b> …<\/td><td><em>l'uomo di cui / del quale …<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Ein deutscher Dativ entspricht nur dann <em>a cui<\/em>, wenn das italienische Verb <em>a<\/em> verlangt: <em>la persona a cui telefono<\/em> (telefonare a qn). Aber: <em>la persona che aiuto<\/em> (aiutare qn = direktes Objekt!).<\/div>"},{"h":"quello che / ciò che","html":"<p><em>quello che<\/em> und <em>ciò che<\/em> bedeuten „das, was“ bzw. „was“, wenn es <b>kein Bezugswort<\/b> gibt:<\/p><ul><li><em>Fai quello che vuoi.<\/em> <small>Mach, was du willst.<\/small><\/li><li><em>Ciò che mi preoccupa è il prezzo.<\/em> <small>Was mir Sorgen macht, ist der Preis.<\/small><\/li><li><em>tutto quello che sai<\/em> <small>alles, was du weißt<\/small><\/li><\/ul><p>Unterschied zu <em>il che<\/em>:<\/p><ul><li><em>Non capisco quello che dice.<\/em> <small>Ich verstehe nicht, was er sagt.<\/small> – Objekt des Verbs<\/li><li><em>Non mi ha richiamato, il che è strano.<\/em> <small>Er hat nicht zurückgerufen, was seltsam ist.<\/small> – Bezug auf den ganzen Satz<\/li><\/ul><div class=\"warn\">Achtung: „was“ als Relativpronomen ist nie <em>che cosa<\/em>: nicht <em>Fai che cosa vuoi<\/em>, sondern <em>Fai quello che vuoi<\/em>.<\/div>"},{"h":"chi und colui che","html":"<p><em>chi<\/em> als Relativpronomen bedeutet „wer, derjenige, der“. Es hat <b>kein Bezugswort<\/b>, bezieht sich auf Personen und steht mit dem Verb im <b>Singular<\/b>:<\/p><ul><li><em>Chi cerca trova.<\/em> <small>Wer sucht, der findet.<\/small><\/li><li><em>Chi ha finito può uscire.<\/em> <small>Wer fertig ist, darf hinausgehen.<\/small><\/li><li><em>C'è chi preferisce il mare.<\/em> <small>Es gibt Leute, die das Meer vorziehen.<\/small><\/li><li><em>Non parlo con chi mi insulta.<\/em> <small>Ich rede nicht mit jemandem, der mich beleidigt.<\/small><\/li><\/ul><p>Gehobene Entsprechungen: <em>colui che, colei che, coloro che<\/em> (= derjenige, diejenige, diejenigen, die). Dafür auch: <em>quello che, quella che, quelli che<\/em>.<\/p><p><em>Coloro che desiderano partecipare devono iscriversi.<\/em> <small>Diejenigen, die teilnehmen möchten, müssen sich anmelden.<\/small><\/p><div class=\"warn\">Achtung: Nach <em>chi<\/em> immer Singular: <em>Chi vuole venire alzi la mano<\/em>, nicht <em>alzino<\/em>.<\/div>"}],"exercises":[{"type":"choice","title":"che oder cui?","task":"Wähle das richtige Relativpronomen.","items":[{"q":"Il ristorante ___ ci hai consigliato era ottimo.","options":["che","cui"],"a":0,"why":"Direktes Objekt (consigliare qc) → che."},{"q":"La casa in ___ abitiamo è piccola.","options":["che","cui"],"a":1,"why":"Nach Präposition → cui."},{"q":"Il ragazzo ___ suona la chitarra è mio cugino.","options":["che","cui"],"a":0,"why":"Subjekt → che."},{"q":"È un argomento di ___ non so niente.","options":["che","cui"],"a":1,"why":"Nach di → cui."},{"q":"Le persone con ___ lavoro sono gentili.","options":["che","cui"],"a":1,"why":"Nach con → cui."},{"q":"Ecco la ragione per ___ sono venuto.","options":["che","cui"],"a":1,"why":"Nach per → cui."},{"q":"Il treno ___ prendo ogni mattina è sempre in ritardo.","options":["che","cui"],"a":0,"why":"Direktes Objekt → che."},{"q":"La signora ___ ho aiutato mi ha ringraziato.","options":["a cui","che"],"a":1,"why":"aiutare qn verlangt ein direktes Objekt → che."}]},{"type":"gap","title":"Präposition + cui","task":"Setze die passende Präposition ein (di, a, in, per, con, da, su).","items":[{"q":"Il quartiere ___ cui sono cresciuto è cambiato molto.","a":["in"],"de":"Das Viertel, in dem ich aufgewachsen bin, hat sich sehr verändert."},{"q":"Il film ___ cui tutti parlano non mi è piaciuto.","a":["di"],"de":"Der Film, von dem alle reden, hat mir nicht gefallen."},{"q":"La collega ___ cui ho mandato l'e-mail non ha risposto.","a":["a"],"de":"Die Kollegin, der ich die E-Mail geschickt habe, hat nicht geantwortet."},{"q":"Il ragazzo ___ cui esce Laura è simpatico.","a":["con"],"de":"Der Junge, mit dem Laura ausgeht, ist nett."},{"q":"La finestra ___ cui si vede il lago è in camera.","a":["da"],"de":"Das Fenster, von dem aus man den See sieht, ist im Zimmer."},{"q":"È proprio questo il motivo ___ cui ho cambiato lavoro.","a":["per"],"de":"Genau das ist der Grund, weshalb ich den Job gewechselt habe."},{"q":"Il tavolo ___ cui hai messo il vaso è di mia nonna.","a":["su"],"de":"Der Tisch, auf den du die Vase gestellt hast, gehört meiner Oma."},{"q":"È una cosa ___ cui non posso rinunciare.","a":["a"],"de":"Das ist etwas, worauf ich nicht verzichten kann."}]},{"type":"gap","title":"il cui – den Artikel richtig wählen","task":"Setze den passenden Artikel vor cui ein.","items":[{"q":"È un attore ___ cui film sono famosi in tutto il mondo.","a":["i"],"de":"Er ist ein Schauspieler, dessen Filme weltweit berühmt sind."},{"q":"Ho un'amica ___ cui madre è giapponese.","a":["la"],"de":"Ich habe eine Freundin, deren Mutter Japanerin ist."},{"q":"È un paese ___ cui abitanti sono molto ospitali.","a":["i"],"de":"Es ist ein Land, dessen Einwohner sehr gastfreundlich sind."},{"q":"Conosco una pittrice ___ cui quadri costano una fortuna.","a":["i"],"de":"Ich kenne eine Malerin, deren Bilder ein Vermögen kosten."},{"q":"È un libro ___ cui autrice è sconosciuta.","a":["la"],"de":"Es ist ein Buch, dessen Autorin unbekannt ist."},{"q":"È una ditta ___ cui prodotti esportiamo in Germania.","a":["i"],"de":"Es ist eine Firma, deren Produkte wir nach Deutschland exportieren."},{"q":"Ho visto la casa ___ cui giardino ti piace tanto.","a":["il"],"de":"Ich habe das Haus gesehen, dessen Garten dir so gefällt."}]},{"type":"gap","title":"il quale mit Präposition","task":"Setze die passende Form von il quale ein (mit Präposition verschmolzen).","items":[{"q":"Il medico (a) ___ mi sono rivolto è molto bravo.","a":["al quale"],"de":"Der Arzt, an den ich mich gewandt habe, ist sehr gut."},{"q":"Le amiche (con) ___ sono andata in vacanza sono di Roma.","a":["con le quali"],"de":"Die Freundinnen, mit denen ich im Urlaub war, sind aus Rom."},{"q":"Il progetto (di) ___ ti ho parlato è stato approvato.","a":["del quale"],"de":"Das Projekt, von dem ich dir erzählt habe, wurde genehmigt."},{"q":"La ditta (per) ___ lavoro ha sede a Verona.","a":["per la quale"],"de":"Die Firma, für die ich arbeite, hat ihren Sitz in Verona."},{"q":"I clienti (a) ___ abbiamo scritto non hanno ancora risposto.","a":["ai quali"],"de":"Die Kunden, denen wir geschrieben haben, haben noch nicht geantwortet."},{"q":"La valle (in) ___ si trova il paese è stretta.","a":["nella quale"],"de":"Das Tal, in dem das Dorf liegt, ist eng."},{"q":"Gli esami (da) ___ dipende la laurea sono difficili.","a":["dai quali"],"de":"Die Prüfungen, von denen der Abschluss abhängt, sind schwer."}]},{"type":"choice","title":"il che, quello che, chi …","task":"Wähle die passende Form.","items":[{"q":"Ha cominciato a piovere, ___ ci ha rovinato la gita.","options":["il che","che cosa"],"a":0,"why":"Bezug auf den ganzen Satz → il che."},{"q":"Non ho capito ___ hai detto.","options":["che cosa","quello che"],"a":1,"why":"Relatives „was“ ohne Bezugswort → quello che (che cosa ist Fragewort)."},{"q":"___ arriva tardi non trova posto.","options":["Chi","Che"],"a":0,"why":"„Wer …“ ohne Bezugswort → chi."},{"q":"C'è ___ dice che domani nevica.","options":["chi","che"],"a":0,"why":"c'è chi = es gibt Leute, die …"},{"q":"___ conta è partecipare.","options":["Ciò che","Il che"],"a":0,"why":"„Was zählt …“ ohne Bezug auf einen Vorsatz → ciò che."},{"q":"Chi vuole un caffè ___ la mano.","options":["alzi","alzino"],"a":0,"why":"Nach chi steht das Verb im Singular."},{"q":"Ho visto la sorella di Mario, ___ abita a Genova.","options":["il quale","la quale"],"a":1,"why":"la quale macht klar: die Schwester wohnt in Genua."},{"q":"Ho parlato con ___ sono venuti ieri. (gehoben)","options":["coloro che","chi"],"a":0,"why":"Plural → coloro che; chi verlangt Singular."}]},{"type":"gap","title":"Gemischte Übung","task":"Setze das passende Relativpronomen ein (che, cui, il cui, chi, il che …).","items":[{"q":"La borsa ___ ho comprato è di pelle.","a":["che"],"de":"Die Tasche, die ich gekauft habe, ist aus Leder."},{"q":"Il collega a ___ ho chiesto aiuto è gentile.","a":["cui"],"de":"Der Kollege, den ich um Hilfe gebeten habe, ist freundlich."},{"q":"Abbiamo trovato un albergo ___ camere danno sul mare. (dessen)","a":["le cui"],"de":"Wir haben ein Hotel gefunden, dessen Zimmer zum Meer gehen."},{"q":"___ non lavora non mangia.","a":["Chi"],"de":"Wer nicht arbeitet, soll auch nicht essen."},{"q":"Ha passato l'esame, ___ mi sorprende. (was)","a":["il che"],"de":"Er hat die Prüfung bestanden, was mich überrascht."},{"q":"Ho due cani, di ___ uno è molto vecchio.","a":["cui"],"de":"Ich habe zwei Hunde, von denen einer sehr alt ist."},{"q":"È tutto ___ ricordo. (das, was)","a":["quello che","ciò che"],"de":"Das
