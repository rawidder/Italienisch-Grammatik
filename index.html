<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Grammatica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d4f9e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Italienisch-Grammatik</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: ein Schulheft ("quaderno") – kariertes Papier, roter Heftrand, Pigna-Blau als Tinte; eine Spalte, Navigation unten */
:root{
  --paper:#f7f8fb; --sheet:#ffffff; --grid:#e3e8f2; --ink:#1b2333; --muted:#5e6878;
  --blue:#1d4f9e; --blue-soft:#e6eefb; --red:#c8323a; --red-soft:#fbe9ea;
  --green:#1f7a4d; --green-soft:#e3f4ea; --amber:#9a6200; --amber-soft:#fdf2dc;
  --line:#d9dfea;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11151d; --sheet:#171c26; --grid:#1f2633; --ink:#e7ebf2; --muted:#9aa4b5;
  --blue:#8db4ff; --blue-soft:#1d2a44; --red:#ff7b82; --red-soft:#3a1d22;
  --green:#6fd3a0; --green-soft:#16302a; --amber:#f1b95b; --amber-soft:#36290f; --line:#2a3242; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#171c26; --grid:#1f2633; --ink:#e7ebf2; --muted:#9aa4b5;
  --blue:#8db4ff; --blue-soft:#1d2a44; --red:#ff7b82; --red-soft:#3a1d22;
  --green:#6fd3a0; --green-soft:#16302a; --amber:#f1b95b; --amber-soft:#36290f; --line:#2a3242; color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
em{font-style:normal;color:var(--blue)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;color:var(--blue);font-size:17px;padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:2px}
.top .t{font-family:var(--f-display);font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .num{font-family:var(--f-display);color:var(--red);font-size:18px}

/* home */
.hero{padding:22px 0 10px}
.hero h1{font-size:34px;line-height:1.1}
.hero p{color:var(--muted);margin:.5em 0 0;max-width:34em}
.stats{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:20px;font-family:var(--f-display);font-weight:400}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.qbtn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-weight:700;font-size:15px}
.qbtn small{display:block;font-weight:400;opacity:.85;font-size:13px;margin-top:2px}
.qbtn.alt{background:var(--sheet);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .qbtn:not(.alt){color:#0e1420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qbtn:not(.alt){color:#0e1420} }
.search{width:100%;margin:12px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font:inherit;color:var(--ink)}
.teil{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.list{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.list::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1.5px;background:var(--red);opacity:.45}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .n{width:26px;text-align:right;font-family:var(--f-display);color:var(--red);font-size:18px;flex:none;font-variant-numeric:tabular-nums}
.row .tt{flex:1;min-width:0;padding-left:8px}
.row .tt b{display:block;font-weight:700}
.row .tt small{color:var(--muted);font-size:13px}
.ring{flex:none;width:30px;height:30px}
.hit{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.hit small{color:var(--muted);display:block;font-size:13px}

/* chapter */
.chhead{padding:18px 0 6px}
.chhead .kn{color:var(--red);font-family:var(--f-display);font-size:15px}
.chhead h1{font-size:30px;line-height:1.12;margin-top:2px}
.chhead p{color:var(--muted);margin:.55em 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--blue);background:var(--blue-soft)}

.toc{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.sec{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;scroll-margin-top:70px}
.sec h2{font-size:21px;line-height:1.2;margin-bottom:8px}
.sec p{margin:.5em 0}
.sec ul,.sec ol{padding-left:1.2em;margin:.5em 0}
.sec li{margin:.2em 0}
.sec small{color:var(--muted);font-size:.88em}
.tw{overflow-x:auto;margin:10px -4px}
.sec table{border-collapse:collapse;width:100%;font-size:15px}
.sec th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line);font-weight:700}
.sec td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tip,.warn{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15.5px}
.tip{background:var(--blue-soft)}
.tip::before{content:"Merke";display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--blue);margin-bottom:2px}
.warn{background:var(--red-soft)}
.warn::before{content:"Achtung";display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--red);margin-bottom:2px}
.next{display:flex;gap:10px;margin:18px 0}
.next button{flex:1}

/* exercises */
.ex{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.ex h2{font-size:20px}
.ex .task{color:var(--muted);margin:.3em 0 .8em;font-size:15px}
.ex .score{font-size:13px;color:var(--muted);float:right;margin-top:4px}
.it{padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.q{line-height:1.9}
.q .ix{color:var(--muted);font-size:14px;margin-right:6px}
.gap{font:inherit;font-size:16px;color:var(--blue);border:0;border-bottom:2px solid var(--muted);background:transparent;min-width:5.5em;width:7em;padding:0 2px;border-radius:0;outline:none}
.gap:focus{border-bottom-color:var(--blue)}
.gap.ok{border-bottom-color:var(--green);color:var(--green)}
.gap.bad{border-bottom-color:var(--red);color:var(--red)}
.gap.near{border-bottom-color:var(--amber);color:var(--amber)}
.de{color:var(--muted);font-size:14px;display:block}
.fb{font-size:14px;margin-top:4px}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)} .fb.near{color:var(--amber)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15.5px;color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt[disabled]{cursor:default}
.why{font-size:14px;color:var(--muted);margin-top:6px}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700;font-size:15px;background:var(--blue);color:var(--sheet)}
.btn.sec2{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn:focus-visible,.opt:focus-visible,.row:focus-visible,.tab:focus-visible,.chip:focus-visible,.qbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* cards */
.cardwrap{padding:14px 0}
.cardmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.fc{perspective:1200px;height:min(56vh,380px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);
  background:var(--sheet);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;overflow:auto}
.face .lab{position:absolute;top:12px;left:16px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.face .tx{font-size:22px;line-height:1.35;font-family:var(--f-display)}
.face.back{transform:rotateY(180deg);background:var(--blue-soft)}
.face.back .tx{color:var(--blue);font-family:var(--f-body);font-weight:700}
.face .src{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cardbtns .btn{padding:14px}
.btn.no{background:var(--red-soft);color:var(--red)}
.btn.yes{background:var(--green-soft);color:var(--green)}
.done{text-align:center;padding:40px 10px}
.done h2{font-size:26px}
.empty{color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .fc .inner{transition:none} }
</style>
</head>

<script type="application/json" id="data">[{"nr":1,"title":"Aussprache und Schreibung","teil":"Einführung","intro":"Italienisch wird weitgehend so gesprochen, wie es geschrieben wird – wenn man einige Regeln zu c, g, sc, gn und gli kennt. Dazu kommen Akzent, Apostroph und Zeichensetzung, bei denen deutsche Gewohnheiten oft in die Irre führen.","sections":[{"h":"Alphabet und Buchstabieren","html":"<p>Das italienische Alphabet hat <b>21 Buchstaben<\/b>. <em>j, k, w, x, y<\/em> kommen nur in Fremdwörtern und Namen vor. Beim Buchstabieren benutzt man in Italien gern <b>Städtenamen<\/b>: <em>A come Ancona<\/em> usw.<\/p><table><tr><th>Buchstabe<\/th><th>Name<\/th><th>Buchstabieren<\/th><\/tr><tr><td>a<\/td><td><em>a<\/em><\/td><td><em>Ancona<\/em><\/td><\/tr><tr><td>b<\/td><td><em>bi<\/em><\/td><td><em>Bologna<\/em><\/td><\/tr><tr><td>c<\/td><td><em>ci<\/em><\/td><td><em>Como<\/em><\/td><\/tr><tr><td>d<\/td><td><em>di<\/em><\/td><td><em>Domodossola<\/em><\/td><\/tr><tr><td>e<\/td><td><em>e<\/em><\/td><td><em>Empoli<\/em><\/td><\/tr><tr><td>f<\/td><td><em>effe<\/em><\/td><td><em>Firenze<\/em><\/td><\/tr><tr><td>g<\/td><td><em>gi<\/em><\/td><td><em>Genova<\/em><\/td><\/tr><tr><td>h<\/td><td><em>acca<\/em><\/td><td><em>hotel<\/em><\/td><\/tr><tr><td>i<\/td><td><em>i<\/em><\/td><td><em>Imola<\/em><\/td><\/tr><tr><td>l<\/td><td><em>elle<\/em><\/td><td><em>Livorno<\/em><\/td><\/tr><tr><td>m<\/td><td><em>emme<\/em><\/td><td><em>Milano<\/em><\/td><\/tr><tr><td>n<\/td><td><em>enne<\/em><\/td><td><em>Napoli<\/em><\/td><\/tr><tr><td>o<\/td><td><em>o<\/em><\/td><td><em>Otranto<\/em><\/td><\/tr><tr><td>p<\/td><td><em>pi<\/em><\/td><td><em>Palermo<\/em><\/td><\/tr><tr><td>q<\/td><td><em>cu<\/em><\/td><td><em>quadro<\/em><\/td><\/tr><tr><td>r<\/td><td><em>erre<\/em><\/td><td><em>Roma<\/em><\/td><\/tr><tr><td>s<\/td><td><em>esse<\/em><\/td><td><em>Savona<\/em><\/td><\/tr><tr><td>t<\/td><td><em>ti<\/em><\/td><td><em>Torino<\/em><\/td><\/tr><tr><td>u<\/td><td><em>u<\/em><\/td><td><em>Udine<\/em><\/td><\/tr><tr><td>v<\/td><td><em>vu / vi<\/em><\/td><td><em>Venezia<\/em><\/td><\/tr><tr><td>z<\/td><td><em>zeta<\/em><\/td><td><em>Zara<\/em><\/td><\/tr><\/table><p><b>Fremdbuchstaben:<\/b> <em>j<\/em> = <em>i lunga<\/em>, <em>k<\/em> = <em>cappa<\/em>, <em>w<\/em> = <em>doppia vu<\/em>, <em>x<\/em> = <em>ics<\/em>, <em>y<\/em> = <em>ipsilon<\/em> (<em>i greca<\/em>).<\/p><p>Doppelbuchstaben buchstabiert man mit <em>doppia<\/em>: <em>Ferri: F come Firenze, E come Empoli, doppia erre, I come Imola.<\/em><\/p><div class=\"tip\">Die Namen der Buchstaben sind feminin: <em>la erre, una doppia esse<\/em>. Am Telefon: <em>Come si scrive?<\/em> – Wie schreibt man das?<\/div>"},{"h":"Aussprache von c und g","html":"<p>Ob <em>c<\/em> und <em>g<\/em> hart oder weich klingen, entscheidet der <b>folgende Buchstabe<\/b>.<\/p><table><tr><th>Schreibung<\/th><th>Laut<\/th><th>Beispiele<\/th><\/tr><tr><td><em>ca, co, cu<\/em><\/td><td>k<\/td><td><em>casa, cosa, cuore<\/em><\/td><\/tr><tr><td><em>ce, ci<\/em><\/td><td>tsch<\/td><td><em>cena, città<\/em><\/td><\/tr><tr><td><em>che, chi<\/em><\/td><td>k<\/td><td><em>perché, chiave<\/em><\/td><\/tr><tr><td><em>cia, cio, ciu<\/em><\/td><td>tscha, tscho, tschu<\/td><td><em>ciao, cioccolato, ciuffo<\/em><\/td><\/tr><tr><td><em>ga, go, gu<\/em><\/td><td>g<\/td><td><em>gatto, gola, gusto<\/em><\/td><\/tr><tr><td><em>ge, gi<\/em><\/td><td>dsch<\/td><td><em>gelato, giro<\/em><\/td><\/tr><tr><td><em>ghe, ghi<\/em><\/td><td>g<\/td><td><em>spaghetti, ghiaccio<\/em><\/td><\/tr><tr><td><em>gia, gio, giu<\/em><\/td><td>dscha, dscho, dschu<\/td><td><em>giallo, giorno, giusto<\/em><\/td><\/tr><\/table><p>In <em>cia, cio, ciu, gia, gio, giu<\/em> ist das <em>i<\/em> meist nur ein <b>stummes Lesezeichen<\/b> für den weichen Laut. Ist es betont, hört man es: <em>farmacia<\/em> (far-ma-TSCHI-a), <em>bugia<\/em>.<\/p><p><em>qu<\/em> spricht man immer <b>kw<\/b>: <em>quando, quattro, questo<\/em>.<\/p><div class=\"warn\">Achtung: <em>ch<\/em> ist im Italienischen <b>nie<\/b> wie das deutsche „ch“ – <em>Chianti<\/em> klingt wie „Kianti“, <em>chiesa<\/em> wie „kiesa“.<\/div>"},{"h":"Aussprache von s und z","html":"<p><b>s stimmlos<\/b> (wie in „Haus“):<\/p><ul><li>am Wortanfang vor Vokal: <em>sole, sera<\/em><\/li><li>vor stimmlosen Konsonanten (c, f, p, q, t): <em>scuola, spesso, studio<\/em><\/li><li>als Doppel-s: <em>rosso, passo<\/em><\/li><li>nach Konsonant: <em>penso, falso<\/em><\/li><\/ul><p><b>s stimmhaft<\/b> (wie in „Rose“):<\/p><ul><li>vor stimmhaften Konsonanten (b, d, g, l, m, n, r, v): <em>sbaglio, sgabello, smettere, svegliare<\/em><\/li><li>zwischen Vokalen meist (in Norditalien fast immer): <em>rosa, musica<\/em> – in Mittel- und Süditalien oft stimmlos; beides wird verstanden.<\/li><\/ul><p><b>z<\/b> ist immer eine Verbindung: stimmlos <b>ts<\/b> oder stimmhaft <b>ds<\/b>.<\/p><table><tr><th>Laut<\/th><th>typisch<\/th><th>Beispiele<\/th><\/tr><tr><td>ts<\/td><td><em>-zione, -anza, -enza, -ezza<\/em><\/td><td><em>stazione, distanza, partenza, bellezza<\/em><\/td><\/tr><tr><td>ts<\/td><td>Doppel-z oft<\/td><td><em>pizza, piazza, ragazzo<\/em><\/td><\/tr><tr><td>ds<\/td><td>viele Wörter am Anfang<\/td><td><em>zero, zona, zaino<\/em><\/td><\/tr><tr><td>ds<\/td><td>einige Wörter mit -zz-<\/td><td><em>azzurro, mezzo<\/em><\/td><\/tr><\/table><div class=\"tip\">Zwischen Vokalen wird <em>z<\/em> immer lang gesprochen, auch wenn es einfach geschrieben ist: <em>azione<\/em> klingt wie „attsione“.<\/div><div class=\"warn\">Achtung: <em>z<\/em> am Wortanfang ist nicht automatisch „ts“ wie im Deutschen: <em>zero<\/em> = „dsero“, aber <em>zio, zitto<\/em> = „tsio, tsitto“. Im Zweifel ins Wörterbuch schauen.<\/div>"},{"h":"Weitere Konsonanten: gn, gli, sc, Doppelkonsonanten, h","html":"<table><tr><th>Schreibung<\/th><th>Laut<\/th><th>Beispiele<\/th><\/tr><tr><td><em>gn<\/em><\/td><td>nj (wie in „Champagner“)<\/td><td><em>bagno, signora, lavagna, gnocchi<\/em><\/td><\/tr><tr><td><em>gli<\/em><\/td><td>lj, weiches l<\/td><td><em>figlio, famiglia, moglie, aglio<\/em><\/td><\/tr><tr><td><em>sce, sci<\/em><\/td><td>sch<\/td><td><em>pesce, scena, sci, uscita<\/em><\/td><\/tr><tr><td><em>scia, scio, sciu<\/em><\/td><td>scha, scho, schu<\/td><td><em>sciarpa, lasciare, sciopero<\/em><\/td><\/tr><tr><td><em>sche, schi<\/em><\/td><td>sk<\/td><td><em>scherzo, schiena, maschile<\/em><\/td><\/tr><tr><td><em>sca, sco, scu<\/em><\/td><td>sk<\/td><td><em>scala, tasca, scuola<\/em><\/td><\/tr><\/table><p><em>gli<\/em> klingt in wenigen Wörtern wie „gl“: <em>glicine, glicemia, negligente, anglicano<\/em>.<\/p><p><b>Doppelkonsonanten<\/b> werden hörbar <b>länger<\/b> (gehalten) gesprochen, der Vokal davor ist kurz. Das unterscheidet Wörter:<\/p><table><tr><th>einfach<\/th><th>doppelt<\/th><\/tr><tr><td><em>caro<\/em> lieb, teuer<\/td><td><em>carro<\/em> Wagen<\/td><\/tr><tr><td><em>sete<\/em> Durst<\/td><td><em>sette<\/em> sieben<\/td><\/tr><tr><td><em>nono<\/em> neunter<\/td><td><em>nonno<\/em> Großvater<\/td><\/tr><tr><td><em>capello<\/em> Haar<\/td><td><em>cappello<\/em> Hut<\/td><\/tr><tr><td><em>pala<\/em> Schaufel<\/td><td><em>palla<\/em> Ball<\/td><\/tr><\/table><p><b>h<\/b> wird nie gesprochen. Es dient nur als Schreibzeichen: in <em>ch, gh<\/em> und zur Unterscheidung bei <em>avere<\/em>: <em>ho, hai, ha, hanno<\/em> vs. <em>o<\/em> (oder), <em>ai<\/em> (an den), <em>a<\/em> (nach, an), <em>anno<\/em> (Jahr). Außerdem in Ausrufen: <em>ah, oh, eh<\/em>.<\/p><div class=\"warn\">Achtung: Deutsche Lerner sprechen Doppelkonsonanten oft zu kurz. <em>Ho sete<\/em> (Ich habe Durst) und <em>ho sette<\/em> … (ich habe sieben …) klingen verschieden!<\/div>"},{"h":"Betonung und Akzent","html":"<p>Die meisten Wörter werden auf der <b>vorletzten Silbe<\/b> betont: <em>CA-sa, a-MI-co, sta-ZIO-ne<\/em>. Viele werden auf der <b>drittletzten<\/b> betont: <em>TA-vo-lo, MAC-chi-na, te-LE-fo-no, ME-di-co<\/em>; bei Verbformen auch auf der viertletzten: <em>TE-le-fo-na-no<\/em>.<\/p><p><b>Geschrieben<\/b> wird der Akzent (fast nur) auf dem <b>letzten Vokal<\/b>, wenn dieser betont ist – dann ist er <b>Pflicht<\/b>: <em>città, virtù, caffè, perché, però, così, università, venerdì<\/em>.<\/p><table><tr><th>Akzent<\/th><th>auf<\/th><th>Beispiele<\/th><\/tr><tr><td>Gravis (`)<\/td><td><em>à, ì, ò, ù<\/em> und offenes <em>è<\/em><\/td><td><em>già, lunedì, però, più, è, caffè<\/em><\/td><\/tr><tr><td>Akut (´)<\/td><td>geschlossenes <em>é<\/em><\/td><td><em>perché, poiché, benché, né, sé, ventitré<\/em><\/td><\/tr><\/table><p><b>Einsilbige Wörter<\/b> bekommen nur dann einen Akzent, wenn sie zwei Vokale haben und auf dem letzten betont sind (<em>già, più, può, giù, ciò<\/em>) oder wenn sie von einem gleich geschriebenen Wort unterschieden werden müssen:<\/p><table><tr><th>mit Akzent<\/th><th>ohne Akzent<\/th><\/tr><tr><td><em>è<\/em> ist<\/td><td><em>e<\/em> und<\/td><\/tr><tr><td><em>dà<\/em> gibt<\/td><td><em>da<\/em> von, aus, bei<\/td><\/tr><tr><td><em>sì<\/em> ja<\/td><td><em>si<\/em> sich, man<\/td><\/tr><tr><td><em>là, lì<\/em> dort<\/td><td><em>la, li<\/em> die / sie (Artikel, Pronomen)<\/td><\/tr><tr><td><em>né<\/em> weder, noch<\/td><td><em>ne<\/em> davon<\/td><\/tr><tr><td><em>sé<\/em> sich (betont)<\/td><td><em>se<\/em> wenn, ob<\/td><\/tr><tr><td><em>tè<\/em> Tee<\/td><td><em>te<\/em> dich, dir<\/td><\/tr><\/table><div class=\"warn\">Achtung: <b>ohne<\/b> Akzent schreibt man <em>qui, qua, su, fa, va, tre, sto, sta, me, re<\/em>. <em>ventitré<\/em> braucht ihn aber, <em>tre<\/em> nicht!<\/div><div class=\"tip\">Freiwillig setzt man einen Akzent nur, um Missverständnisse zu vermeiden: <em>prìncipi<\/em> (Fürsten) – <em>princìpi<\/em> (Grundsätze).<\/div>"},{"h":"Apostroph: Elision und Troncamento","html":"<p><b>Elision<\/b>: Ein unbetonter Endvokal fällt vor einem Vokal weg und wird durch den <b>Apostroph<\/b> ersetzt.<\/p><ul><li>Artikel: <em>l'amico, l'isola, un'amica<\/em><\/li><li>Präposition + Artikel: <em>dell'acqua, all'ufficio, nell'armadio<\/em><\/li><li>feste Wendungen: <em>c'è, d'accordo, quest'anno, mezz'ora, dov'è, com'è<\/em><\/li><\/ul><p>Bei den Pluralartikeln <em>gli<\/em> und <em>le<\/em> elidiert man heute normalerweise nicht: <em>gli amici, le amiche<\/em>.<\/p><p><b>Troncamento<\/b>: Ein Wort verliert seinen Endvokal (oder die Endsilbe), auch vor Konsonant – meist <b>ohne<\/b> Apostroph:<\/p><ul><li><em>un amico<\/em> (nicht <em>un'amico<\/em>!), <em>qual è, signor Rossi, dottor Neri, buon viaggio, bel tempo, aver capito<\/em><\/li><\/ul><p>Mit Apostroph nur in einigen Fällen: <em>un po'<\/em> (von <em>poco<\/em>) und einige Imperative: <em>da', fa', sta', va', di'<\/em>.<\/p><div class=\"warn\">Achtung, häufige Fehler: <em>qual è<\/em> ohne Apostroph (Troncamento: <em>qual<\/em> steht auch vor Konsonant, z. B. <em>qual buon vento<\/em>), aber <em>un po'<\/em> mit Apostroph – <b>nicht<\/b> <em>un pò<\/em>!<\/div><div class=\"tip\"><em>un'<\/em> mit Apostroph nur vor <b>femininen<\/b> Wörtern, die mit Vokal beginnen: <em>un'amica<\/em>, aber <em>un amico<\/em>.<\/div>"},{"h":"Silbentrennung","html":"<ul><li>Ein einzelner Konsonant gehört zur folgenden Silbe: <em>ca-sa, a-mi-co<\/em>.<\/li><li>Doppelkonsonanten werden getrennt, ebenso <em>cq<\/em>: <em>gat-to, mam-ma, pez-zo, ac-qua<\/em>.<\/li><li>Konsonantengruppen, mit denen ein italienisches Wort beginnen kann, bleiben zusammen: <em>pa-dre, li-bro, ve-tro<\/em>.<\/li><li><em>s<\/em> + Konsonant kommt immer zur folgenden Silbe: <em>pa-sta, fi-ne-stra, ri-spo-sta<\/em>.<\/li><li><em>l, m, n, r<\/em> + Konsonant werden getrennt: <em>al-to, cam-po, can-to, par-te<\/em>.<\/li><li><em>gn, gl(i), sc(i), ch, gh<\/em> werden nie getrennt: <em>ba-gno, fi-glio, pe-sce, chie-sa<\/em>.<\/li><li>Diphthonge bleiben zusammen: <em>pie-de, fiu-me, uo-mo, au-to<\/em>; zwei „starke“ Vokale (a, e, o) werden getrennt: <em>pa-e-se, po-e-ta<\/em>.<\/li><\/ul><div class=\"warn\">Achtung: Anders als im heutigen Deutschen (Fens-ter) kommt im Italienischen <em>s<\/em> + Konsonant immer zusammen auf die neue Zeile: <em>po-sta<\/em>, nicht <em>pos-ta<\/em>.<\/div>"},{"h":"Groß- und Kleinschreibung","html":"<p>Groß schreibt man nur Satzanfänge und <b>Eigennamen<\/b> (Personen, Städte, Länder, Flüsse, Institutionen, Feste): <em>Luca, Bologna, l'Italia, il Po, Natale, Pasqua<\/em>.<\/p><p><b>Klein<\/b> schreibt man (anders als im Deutschen):<\/p><ul><li>alle gewöhnlichen Substantive: <em>la casa, il libro<\/em><\/li><li>Monate und Wochentage: <em>gennaio, agosto, lunedì, domenica<\/em><\/li><li>Nationalitäten und Sprachen: <em>Sono tedesco. Parlo italiano. Gli spagnoli ballano.<\/em><\/li><li>Titel und Anreden vor Namen: <em>il signor Bianchi, la dottoressa Neri<\/em><\/li><li>Straßen und Plätze: <em>via Roma, piazza del Duomo<\/em><\/li><\/ul><p>Die <b>Höflichkeitsform<\/b> <em>Lei<\/em> (und <em>La, Le<\/em>) schreibt man in Briefen und formellen Texten oft groß: <em>La ringrazio per la Sua risposta.<\/em> Im Alltag ist auch Kleinschreibung üblich.<\/p><p>Bei Buch- und Filmtiteln wird nur das erste Wort groß geschrieben: <em>Il giardino dei ciliegi<\/em>.<\/p><div class=\"tip\">Merke: Jahrhunderte als Epochen werden groß geschrieben: <em>il Novecento<\/em> (das 20. Jahrhundert).<\/div>"},{"h":"Satzzeichen und Komma","html":"<p>Das Italienische setzt Kommas nach <b>Sinn und Sprechpausen<\/b>, nicht nach grammatischen Regeln wie das Deutsche.<\/p><ul><li>Kein Komma vor <em>che<\/em>-Sätzen: <em>Penso che sia giusto.<\/em> – Ich denke, dass es richtig ist.<\/li><li>Kein Komma vor Infinitivgruppen: <em>Ho deciso di restare.<\/em> – Ich habe beschlossen zu bleiben.<\/li><li>Kein Komma vor einschränkenden Relativsätzen: <em>Il libro che mi hai regalato è bellissimo.<\/em><\/li><li>Komma bei erklärenden Einschüben: <em>Mio fratello, che vive a Torino, viene domani.<\/em><\/li><li>Komma nach der Anrede: <em>Ciao, Marta!<\/em> und vor <em>ma<\/em>: <em>È caro, ma è buono.<\/em><\/li><\/ul><p>Zahlen: Dezimalkomma und Tausenderpunkt wie im Deutschen: <em>3,5 – 1.200<\/em>. Uhrzeit: <em>alle 10.30<\/em> oder <em>10:30<\/em>.<\/p><p>Anführungszeichen: <em>« »<\/em> oder <em>\" \"<\/em>; in Romanen auch Gedankenstriche für Dialoge.<\/p><div class=\"warn\">Achtung: <em>Credo, che …<\/em> oder <em>Spero, di …<\/em> mit Komma ist ein typischer Germanismus. Richtig: <em>Credo che …<\/em>, <em>Spero di …<\/em><\/div>"}],"exercises":[{"type":"choice","title":"Wie spricht man es aus?","task":"Wähle die richtige Aussprache des markierten Buchstabens.","items":[{"q":"cena – das c klingt wie ___","options":["k","tsch"],"a":1,"why":"c vor e/i wird weich gesprochen."},{"q":"chiave – das ch klingt wie ___","options":["k","tsch"],"a":0,"why":"ch vor e/i bleibt hart (k)."},{"q":"giallo – gia klingt wie ___","options":["dscha (i stumm)","dschi-a (i hörbar)"],"a":0,"why":"Das unbetonte i zeigt nur den weichen Laut an."},{"q":"spaghetti – das gh klingt wie ___","options":["g","dsch"],"a":0,"why":"gh vor e/i bleibt hart (g)."},{"q":"pesce – sc klingt wie ___","options":["sk","sch"],"a":1,"why":"sc vor e/i = sch."},{"q":"schiena – sch klingt wie ___","options":["sk","sch"],"a":0,"why":"sch vor e/i = sk."},{"q":"famiglia – gli klingt wie ___","options":["gl wie in „Glas“","weiches lj"],"a":1,"why":"gli ist normalerweise ein mouilliertes l."},{"q":"bagno – gn klingt wie ___","options":["g und n getrennt","nj wie in „Champagner“"],"a":1,"why":"gn ist ein einziger Laut (nj)."},{"q":"sbaglio – das s ist ___","options":["stimmhaft","stimmlos"],"a":0,"why":"s vor stimmhaftem Konsonanten (b) ist stimmhaft."},{"q":"stazione – das z klingt wie ___","options":["ts","ds"],"a":0,"why":"Die Endung -zione wird immer mit ts gesprochen."}]},{"type":"choice","title":"Mit oder ohne Akzent?","task":"Wähle die richtige Schreibung.","items":[{"q":"Il treno ___ in ritardo.","options":["è","e"],"a":0,"why":"è = ist (Verb essere)."},{"q":"Signora, mi ___ il sale, per favore?","options":["dà","da"],"a":0,"why":"dà = gibt (Verb dare)."},{"q":"Questo treno viene ___ Milano.","options":["dà","da"],"a":1,"why":"da = aus, von (Präposition)."},{"q":"«Vieni anche tu?» «___, volentieri!»","options":["Sì","Si"],"a":0,"why":"sì = ja."},{"q":"Paolo ___ sveglia sempre alle sei.","options":["sì","si"],"a":1,"why":"si = sich (Reflexivpronomen)."},{"q":"Le chiavi sono ___, sul tavolo.","options":["là","la"],"a":0,"why":"là = dort."},{"q":"Non mangio carne ___ pesce.","options":["né","ne"],"a":0,"why":"né = noch (weder … noch)."},{"q":"Quante mele vuoi? ___ prendo tre.","options":["Né","Ne"],"a":1,"why":"ne = davon (Pronomen)."},{"q":"___ piove, restiamo a casa.","options":["Sé","Se"],"a":1,"why":"se = wenn."},{"q":"Prendi un ___ con il limone?","options":["tè","te"],"a":0,"why":"tè = Tee."}]},{"type":"gap","title":"Pflichtakzent schreiben","task":"Schreibe das italienische Wort für den Begriff in Klammern – achte auf den Akzent.","items":[{"q":"Firenze è una ___ meravigliosa. (Stadt)","a":["città"],"de":"Florenz ist eine wunderbare Stadt."},{"q":"Prendo un ___ al bar. (Kaffee)","a":["caffè"],"de":"Ich trinke einen Kaffee in der Bar."},{"q":"___ non vieni con noi? (Warum)","a":["Perché","perché"],"de":"Warum kommst du nicht mit uns?"},{"q":"Vorrei ___ tempo per me. (mehr)","a":["più"],"de":"Ich hätte gern mehr Zeit für mich."},{"q":"Ho ___ mangiato, grazie. (schon)","a":["già"],"de":"Ich habe schon gegessen, danke."},{"q":"Studio all'___ di Padova. (Universität)","a":["università"],"de":"Ich studiere an der Universität Padua."},{"q":"Ci vediamo ___ sera. (Freitag)","a":["venerdì"],"de":"Wir sehen uns Freitagabend."},{"q":"Mia figlia ha ___ anni. (23)","a":["ventitré"],"de":"Meine Tochter ist 23 Jahre alt."},{"q":"Va bene ___? (so)","a":["così"],"de":"Ist es so in Ordnung?"},{"q":"Il libro è ___, sul divano. (hier)","a":["qui","qua"],"de":"Das Buch ist hier, auf dem Sofa."}]},{"type":"gap","title":"Apostroph oder nicht?","task":"Setze die passende Form ein (mit oder ohne Apostroph).","items":[{"q":"Ieri ho incontrato ___ amica di Laura. (eine)","a":["un'"],"de":"Gestern habe ich eine Freundin von Laura getroffen."},{"q":"Ieri ho incontrato ___ amico di Laura. (einen)","a":["un"],"de":"Gestern habe ich einen Freund von Laura getroffen."},{"q":"___ è il tuo indirizzo? (Welches/Was)","a":["Qual","qual"],"de":"Wie lautet deine Adresse?"},{"q":"Mi dai ___ di latte? (ein bisschen)","a":["un po'"],"de":"Gibst du mir ein bisschen Milch?"},{"q":"Scusi, dov'è ___ ospedale? (das)","a":["l'"],"de":"Entschuldigung, wo ist das Krankenhaus?"},{"q":"Scusi, ___ una farmacia qui vicino? (gibt es)","a":["c'è"],"de":"Entschuldigung, gibt es hier in der Nähe eine Apotheke?"},{"q":"Il treno parte tra ___ ora. (einer halben)","a":["mezz'"],"de":"Der Zug fährt in einer halben Stunde ab."},{"q":"Buongiorno, ___ Bianchi! (Herr)","a":["signor"],"de":"Guten Tag, Herr Bianchi!"},{"q":"Va bene, siamo ___ accordo. (einverstanden: d…)","a":["d'"],"de":"In Ordnung, wir sind einverstanden."},{"q":"Marco, ___ una mano a tua sorella! (hilf – Imperativ von dare, tu)","a":["da'","dai"],"de":"Marco, hilf deiner Schwester!"}]},{"type":"choice","title":"Trennung, Schreibung, Komma","task":"Wähle die richtige Variante.","items":[{"q":"Richtige Trennung von finestra: ___","options":["fi-nes-tra","fi-ne-stra","fin-es-tra"],"a":1,"why":"s + Konsonant kommt immer auf die neue Silbe."},{"q":"Richtige Trennung von gatto: ___","options":["ga-tto","gat-to"],"a":1,"why":"Doppelkonsonanten werden getrennt."},{"q":"Richtige Trennung von famiglia: ___","options":["fa-mi-glia","fa-mig-lia"],"a":0,"why":"gli wird nie getrennt."},{"q":"Richtige Schreibung: ___","options":["Il concerto è a Maggio.","Il concerto è a maggio."],"a":1,"why":"Monate schreibt man klein."},{"q":"Richtige Schreibung: ___","options":["Sono Tedesca, ma vivo a Roma.","Sono tedesca, ma vivo a Roma."],"a":1,"why":"Nationalitäten schreibt man klein."},{"q":"Richtige Schreibung: ___","options":["Ci vediamo Lunedì.","Ci vediamo lunedì."],"a":1,"why":"Wochentage schreibt man klein."},{"q":"Richtige Zeichensetzung: ___","options":["Spero, che tu stia bene.","Spero che tu stia bene."],"a":1,"why":"Vor che-Sätzen steht kein Komma."},{"q":"Richtige Zeichensetzung: ___","options":["Ho deciso, di partire domani.","Ho deciso di partire domani."],"a":1,"why":"Vor Infinitivgruppen steht kein Komma."},{"q":"„ein bisschen“ schreibt man: ___","options":["un pò","un po'","un po"],"a":1,"why":"po' ist ein verkürztes poco – Apostroph, kein Akzent."},{"q":"„Welches ist …?“ schreibt man: ___","options":["qual'è","qual è"],"a":1,"why":"qual ist ein Troncamento – ohne Apostroph."}]}],"cards":[{"f":"Wie viele Buchstaben hat das italienische Alphabet?","b":"21 (dazu j, k, w, x, y für Fremdwörter)"},{"f":"Buchstabieren mit Städten: R, M, N","b":"R come Roma, M come Milano, N come Napoli"},{"f":"Name der Buchstaben h, q, z","b":"acca, cu, zeta"},{"f":"Name der Buchstaben j, k, w, x, y","b":"i lunga, cappa, doppia vu, ics, ipsilon"},{"f":"ce, ci – Aussprache","b":"tsch: cena, cinema"},{"f":"che, chi – Aussprache","b":"k: perché, chiave"},{"f":"ge, gi / ghe, ghi","b":"dsch: gelato / g: spaghetti"},{"f":"gn – Aussprache","b":"nj: bagno, signora"},{"f":"gli – Aussprache","b":"weiches lj: figlio, famiglia"},{"f":"sce, sci / sche, schi","b":"sch: pesce, sci / sk: scherzo, schiena"},{"f":"Endung -zione: wie spricht man das z?","b":"stimmlos ts: stazione"},{"f":"s vor b, d, g, l, m, n, r, v","b":"stimmhaft: sbaglio, smettere, svegliare"},{"f":"sete / sette","b":"Durst / sieben (Doppelkonsonant = länger)"},{"f":"Wird h gesprochen?","b":"Nie: ho, hai, ha, hanno"},{"f":"Wo trägt das Wort den Akzent normalerweise?","b":"auf der vorletzten Silbe (amico)"},{"f":"Wann ist der geschriebene Akzent Pflicht?","b":"bei Betonung auf dem letzten Vokal: città, perché, più"},{"f":"Akut (é) steht auf …","b":"geschlossenem e: perché, né, sé, ventitré"},{"f":"è / e","b":"ist / und"},{"f":"dà / da","b":"gibt / von, aus, bei"},{"f":"sì / si","b":"ja / sich, man"},{"f":"né / ne","b":"weder … noch / davon"},{"f":"Ohne Akzent schreibt man …","b":"qui, qua, su, fa, va, tre, sto, sta"},{"f":"un amico / un'amica","b":"Apostroph nur vor femininem Wort"},{"f":"qual è oder qual'è?","b":"qual è (ohne Apostroph)"},{"f":"un po' oder un pò?","b":"un po' (Apostroph)"},{"f":"Silbentrennung: pasta","b":"pa-sta (s + Konsonant zusammen)"},{"f":"Monate, Wochentage, Nationalitäten","b":"klein: maggio, lunedì, tedesco"},{"f":"„Ich denke, dass …“ – Komma?","b":"Penso che … (kein Komma vor che)"}],"id":"k01"},{"nr":2,"title":"Das Substantiv","teil":"Das Substantiv und seine Begleiter","intro":"Jedes Substantiv hat ein Genus, das Artikel und Adjektive bestimmt, und einen Plural, der meist regelmäßig, aber oft auch überraschend gebildet wird. Wer Genus und Plural sicher beherrscht, macht beim Sprechen die meisten Endungsfehler nicht mehr.","sections":[{"h":"Endungen im Singular und Plural","html":"<p>Italienische Substantive sind <b>maskulin<\/b> oder <b>feminin<\/b>. Die Endung verrät das Genus meistens – und bestimmt den Plural.<\/p><table><tr><th>Singular<\/th><th>Plural<\/th><th>Beispiele<\/th><\/tr><tr><td>-o (m)<\/td><td>-i<\/td><td><em>il libro → i libri<\/em><\/td><\/tr><tr><td>-a (f)<\/td><td>-e<\/td><td><em>la casa → le case<\/em><\/td><\/tr><tr><td>-e (m/f)<\/td><td>-i<\/td><td><em>il fiore → i fiori; la chiave → le chiavi<\/em><\/td><\/tr><\/table><p>Bei <b>-e<\/b> muss man das Genus lernen. Hilfreiche Faustregeln:<\/p><ul><li>meist maskulin: <em>-ore<\/em> (<em>il colore, il dolore, il motore<\/em>), <em>-ale<\/em> (<em>il giornale, l'ospedale<\/em>), <em>-ame<\/em> (<em>il salame, il rame<\/em>)<\/li><li>meist feminin: <em>-zione, -sione, -gione<\/em> (<em>la stazione, la televisione, la stagione<\/em>), <em>-ice<\/em> (<em>la radice, la lavatrice<\/em>)<\/li><\/ul><div class=\"warn\">Achtung, Genus anders als im Deutschen: <em>il latte<\/em> (die Milch), <em>il mare<\/em> (das Meer), <em>il sole<\/em> (die Sonne), <em>il fiore<\/em> (die Blume), <em>il dente<\/em> (der Zahn), <em>la gente<\/em> (die Leute, Singular!), <em>la fine<\/em> (das Ende).<\/div>"},{"h":"Genus-Besonderheiten","html":"<p><b>Maskulin auf -a<\/b> – vor allem Wörter griechischen Ursprungs auf <em>-ma<\/em>; Plural auf <b>-i<\/b>:<\/p><p><em>il problema → i problemi, il sistema, il tema, il programma, il clima, il diploma, il panorama<\/em>; außerdem <em>il poeta, il pianeta, il papa<\/em>.<\/p><p><b>Feminin auf -o<\/b>: <em>la mano → le mani<\/em> und Kurzwörter: <em>la foto<\/em> (<em>fotografia<\/em>), <em>la moto<\/em> (<em>motocicletta<\/em>), <em>l'auto<\/em> (<em>automobile<\/em>), <em>la radio<\/em>.<\/p><p><b>Feminin auf -i<\/b> – meist griechische Wörter auf <em>-si<\/em>, unveränderlich: <em>la crisi, l'analisi, la tesi, l'ipotesi, la sintesi<\/em>.<\/p><p><b>Konsonant am Ende<\/b> – Fremdwörter, meist maskulin: <em>lo sport, il bar, il film, il computer, il tram, lo yogurt<\/em>. Feminin, wenn das italienische Entsprechungswort feminin ist: <em>la mail<\/em> (<em>la posta<\/em>), <em>la chat<\/em>.<\/p><div class=\"tip\">Bäume sind meist maskulin, ihre Früchte feminin: <em>il melo – la mela<\/em> (Apfelbaum – Apfel), <em>il pero – la pera, il ciliegio – la ciliegia, l'arancio – l'arancia<\/em>. Ausnahmen: <em>il limone, il fico<\/em> (Baum und Frucht).<\/div><div class=\"warn\">Achtung: <em>il problema<\/em>, nicht <em>la problema<\/em> – und im Plural <em>i problemi<\/em>, nicht <em>le probleme<\/em>.<\/div>"},{"h":"Das Geschlecht bei Lebewesen","html":"<table><tr><th>Muster<\/th><th>maskulin<\/th><th>feminin<\/th><\/tr><tr><td>-o / -a<\/td><td><em>il ragazzo, lo zio<\/em><\/td><td><em>la ragazza, la zia<\/em><\/td><\/tr><tr><td>-e / -a<\/td><td><em>il signore, il cameriere<\/em><\/td><td><em>la signora, la cameriera<\/em><\/td><\/tr><tr><td>-e / -essa<\/td><td><em>lo studente, il professore, il dottore<\/em><\/td><td><em>la studentessa, la professoressa, la dottoressa<\/em><\/td><\/tr><tr><td>-tore / -trice<\/td><td><em>l'attore, lo scrittore, il direttore<\/em><\/td><td><em>l'attrice, la scrittrice, la direttrice<\/em><\/td><\/tr><\/table><p><b>Verschiedene Wörter<\/b>: <em>l'uomo – la donna, il padre – la madre, il marito – la moglie, il fratello – la sorella, il genero – la nuora<\/em> (Schwiegersohn – Schwiegertochter), <em>il gallo – la gallina<\/em>.<\/p><p><b>Gleiche Form<\/b>, nur der Artikel zeigt das Geschlecht: <em>il/la cantante, il/la nipote, il/la cliente, il/la giovane, il/la collega, il/la giornalista<\/em>.<\/p><p>Bei vielen Tieren gibt es nur ein Genus für beide Geschlechter: <em>la tigre, la giraffa, il serpente<\/em> → <em>la giraffa maschio, il serpente femmina<\/em>.<\/p><div class=\"tip\">Für Berufe setzen sich zunehmend feminine Formen auf <em>-a<\/em> durch: <em>la ministra, la sindaca, l'avvocata, l'architetta<\/em>.<\/div>"},{"h":"Unveränderliche Plurale","html":"<p>Gleiche Form im Singular und Plural – nur der Artikel ändert sich:<\/p><table><tr><th>Gruppe<\/th><th>Beispiele<\/th><\/tr><tr><td>Endbetonung (Akzent)<\/td><td><em>la città → le città, il caffè → i caffè, il lunedì → i lunedì<\/em><\/td><\/tr><tr><td>Einsilbler<\/td><td><em>il re → i re, il tè → i tè<\/em><\/td><\/tr><tr><td>Fremdwörter auf Konsonant<\/td><td><em>il film → i film, lo sport → gli sport, il bar → i bar<\/em><\/td><\/tr><tr><td>Kurzwörter<\/td><td><em>la foto → le foto, l'auto → le auto, la bici → le bici, il cinema → i cinema<\/em><\/td><\/tr><tr><td>-i<\/td><td><em>la crisi → le crisi, l'analisi → le analisi<\/em><\/td><\/tr><tr><td>meist -ie (f)<\/td><td><em>la serie → le serie, la specie → le specie<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Fremdwörter bekommen im Italienischen <b>kein Plural-s<\/b>: <em>due film, tre computer<\/em> – nicht <em>films, computers<\/em>.<\/div><p>Ausnahme bei <em>-ie<\/em>: <em>la moglie → le mogli<\/em>.<\/p>"},{"h":"Plural von -a und -ista","html":"<p><b>Maskulina auf -a<\/b> bilden den Plural auf <b>-i<\/b>: <em>il problema → i problemi, il poeta → i poeti<\/em>.<\/p><p>Wörter auf <b>-ista<\/b> (und <em>-cida, -iatra<\/em>) können beide Geschlechter bezeichnen. Im Plural unterscheiden sie sich:<\/p><table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>m<\/td><td><em>il turista<\/em><\/td><td><em>i turisti<\/em><\/td><\/tr><tr><td>f<\/td><td><em>la turista<\/em><\/td><td><em>le turiste<\/em><\/td><\/tr><tr><td>m<\/td><td><em>il collega<\/em><\/td><td><em>i colleghi<\/em><\/td><\/tr><tr><td>f<\/td><td><em>la collega<\/em><\/td><td><em>le colleghe<\/em><\/td><\/tr><\/table><p>Ebenso: <em>il/la dentista, il/la pianista, il/la giornalista, il/la pediatra<\/em>.<\/p><div class=\"tip\">Gemischte Gruppen stehen im maskulinen Plural: <em>Paolo e Anna sono giornalisti.<\/em><\/div>"},{"h":"Plural auf -co/-go, -cia/-gia, -io","html":"<p><b>-co / -go<\/b> (maskulin):<\/p><ul><li>Betonung auf der vorletzten Silbe → <b>-chi / -ghi<\/b> (Laut bleibt hart): <em>il fuoco → i fuochi, il bosco → i boschi, il lago → i laghi, l'albergo → gli alberghi<\/em>. Ausnahmen: <em>l'amico → gli amici, il nemico → i nemici, il greco → i greci<\/em>.<\/li><li>Betonung auf der drittletzten Silbe → meist <b>-ci / -gi<\/b>: <em>il medico → i medici, il meccanico → i meccanici, lo psicologo → gli psicologi<\/em>. Ausnahmen: <em>il carico → i carichi, il dialogo → i dialoghi, il catalogo → i cataloghi<\/em>.<\/li><\/ul><p><b>-ca / -ga<\/b> (feminin) → immer <b>-che / -ghe<\/b>: <em>l'amica → le amiche, la banca → le banche, la riga → le righe<\/em>.<\/p><p><b>-cia / -gia<\/b> mit <b>unbetontem<\/b> i:<\/p><ul><li>Vokal davor → <b>-cie / -gie<\/b>: <em>la camicia → le camicie, la ciliegia → le ciliegie, la valigia → le valigie<\/em> (auch <em>valige<\/em>)<\/li><li>Konsonant davor → <b>-ce / -ge<\/b>: <em>l'arancia → le arance, la spiaggia → le spiagge, la provincia → le province<\/em><\/li><\/ul><p><b>Betontes<\/b> í bleibt: <em>la farmacia → le farmacie, la bugia → le bugie<\/em>.<\/p><p><b>-io<\/b>: unbetontes i → <b>-i<\/b>: <em>il negozio → i negozi, il figlio → i figli, l'orologio → gli orologi<\/em>; betontes í → <b>-ii<\/b>: <em>lo zio → gli zii, l'addio → gli addii<\/em>.<\/p><div class=\"tip\">Faustregel für -logo: Personen → <em>-logi<\/em> (<em>i biologi, gli archeologi<\/em>), Dinge → <em>-loghi<\/em> (<em>i cataloghi, i dialoghi<\/em>).<\/div>"},{"h":"Unregelmäßige Plurale","html":"<table><tr><th>Singular<\/th><th>Plural<\/th><th><\/th><\/tr><tr><td><em>l'uomo<\/em><\/td><td><em>gli uomini<\/em><\/td><td>Mann, Mensch<\/td><\/tr><tr><td><em>il dio<\/em><\/td><td><em>gli dei<\/em><\/td><td>Gott<\/td><\/tr><tr><td><em>il bue<\/em><\/td><td><em>i buoi<\/em><\/td><td>Ochse<\/td><\/tr><tr><td><em>la moglie<\/em><\/td><td><em>le mogli<\/em><\/td><td>Ehefrau<\/td><\/tr><tr><td><em>l'ala<\/em><\/td><td><em>le ali<\/em><\/td><td>Flügel<\/td><\/tr><tr><td><em>l'arma<\/em><\/td><td><em>le armi<\/em><\/td><td>Waffe<\/td><\/tr><\/table><p>Einige Maskulina auf <b>-o<\/b> werden im Plural <b>feminin auf -a<\/b>:<\/p><table><tr><th>Singular (m)<\/th><th>Plural (f)<\/th><th><\/th><\/tr><tr><td><em>l'uovo<\/em><\/td><td><em>le uova<\/em><\/td><td>Ei<\/td><\/tr><tr><td><em>il paio<\/em><\/td><td><em>le paia<\/em><\/td><td>Paar<\/td><\/tr><tr><td><em>il centinaio<\/em><\/td><td><em>le centinaia<\/em><\/td><td>etwa hundert<\/td><\/tr><tr><td><em>il migliaio<\/em><\/td><td><em>le migliaia<\/em><\/td><td>etwa tausend<\/td><\/tr><tr><td><em>il miglio<\/em><\/td><td><em>le miglia<\/em><\/td><td>Meile<\/td><\/tr><\/table><div class=\"warn\">Achtung: Das Adjektiv richtet sich nach dem femininen Plural: <em>le uova fresche, due paia di scarpe nuove<\/em>.<\/div>"},{"h":"Nur Plural, nur Singular, zwei Plurale","html":"<p><b>Nur Plural<\/b> (oft Gegenstände aus zwei Teilen): <em>gli occhiali<\/em> (Brille), <em>le forbici<\/em> (Schere), <em>i pantaloni<\/em> (Hose), <em>le nozze<\/em> (Hochzeit), <em>le ferie<\/em> (Urlaub), <em>i dintorni<\/em> (Umgebung), <em>i soldi<\/em> (Geld).<\/p><p><b>Singular mit Mengenbedeutung<\/b>: <em>la gente<\/em> (die Leute), <em>la frutta<\/em> (Obst), <em>la verdura<\/em> (Gemüse), <em>l'uva<\/em> (Weintrauben), <em>la roba<\/em> (Zeug).<\/p><div class=\"warn\">Achtung: <em>I miei occhiali sono rotti.<\/em> (Meine Brille ist kaputt.) – aber <em>La gente è gentile.<\/em> (Die Leute sind nett.) Verb im Singular!<\/div><p><b>Zwei Plurale mit unterschiedlicher Bedeutung<\/b> – der feminine Plural auf <em>-a<\/em> bezeichnet oft das Zusammengehörige (Körperteile, Gesamtheit):<\/p><table><tr><th>Singular<\/th><th>Plural -i (m)<\/th><th>Plural -a (f)<\/th><\/tr><tr><td><em>il braccio<\/em><\/td><td><em>i bracci<\/em> Arme (Fluss, Leuchter)<\/td><td><em>le braccia<\/em> Arme (Körper)<\/td><\/tr><tr><td><em>il muro<\/em><\/td><td><em>i muri<\/em> Wände<\/td><td><em>le mura<\/em> Stadtmauer<\/td><\/tr><tr><td><em>il dito<\/em><\/td><td><em>i diti<\/em> (einzelne) Finger<\/td><td><em>le dita<\/em> Finger (alle)<\/td><\/tr><tr><td><em>il labbro<\/em><\/td><td><em>i labbri<\/em> Ränder (Wunde)<\/td><td><em>le labbra<\/em> Lippen<\/td><\/tr><tr><td><em>l'osso<\/em><\/td><td><em>gli ossi<\/em> Knochen (einzeln)<\/td><td><em>le ossa<\/em> Knochen, Skelett<\/td><\/tr><tr><td><em>il ciglio<\/em><\/td><td><em>i cigli<\/em> Ränder (Straße)<\/td><td><em>le ciglia<\/em> Wimpern<\/td><\/tr><tr><td><em>il lenzuolo<\/em><\/td><td><em>i lenzuoli<\/em> einzelne Laken<\/td><td><em>le lenzuola<\/em> Bettwäsche (Paar)<\/td><\/tr><tr><td><em>il membro<\/em><\/td><td><em>i membri<\/em> Mitglieder<\/td><td><em>le membra<\/em> Gliedmaßen<\/td><\/tr><tr><td><em>il fondamento<\/em><\/td><td><em>i fondamenti<\/em> Grundlagen<\/td><td><em>le fondamenta<\/em> Fundament<\/td><\/tr><\/table><p>Meist feminin, ohne Bedeutungsunterschied: <em>il ginocchio → le ginocchia<\/em> (auch <em>i ginocchi<\/em>), <em>il sopracciglio → le sopracciglia<\/em> (auch <em>i sopraccigli<\/em>).<\/p>"},{"h":"Zusammengesetzte Substantive","html":"<table><tr><th>Bildung<\/th><th>Plural<\/th><th>Beispiele<\/th><\/tr><tr><td>Substantiv + Substantiv<\/td><td>2. Teil<\/td><td><em>il cavolfiore → i cavolfiori, l'arcobaleno → gli arcobaleni<\/em><\/td><\/tr><tr><td>Adjektiv + Substantiv<\/td><td>2. Teil<\/td><td><em>il francobollo → i francobolli<\/em><\/td><\/tr><tr><td>Substantiv + Adjektiv<\/td><td>beide Teile<\/td><td><em>la cassaforte → le casseforti<\/em><\/td><\/tr><tr><td>Verb + Subst. (m Sg.)<\/td><td>2. Teil<\/td><td><em>il grattacielo → i grattacieli, il passaporto → i passaporti<\/em><\/td><\/tr><tr><td>Verb + Subst. (f Sg. / Pl.)<\/td><td>unveränderlich<\/td><td><em>il portacenere → i portacenere, l'apribottiglie → gli apribottiglie, il cavatappi → i cavatappi<\/em><\/td><\/tr><tr><td>Verb + Verb<\/td><td>unveränderlich<\/td><td><em>il saliscendi → i saliscendi<\/em><\/td><\/tr><\/table><p><b>capo-<\/b>: Bedeutet <em>capo<\/em> „Chef, Leiter“, ändert sich der erste Teil: <em>il capostazione → i capistazione, il capoufficio → i capiufficio<\/em>. Bedeutet es „Haupt-“, ändert sich der zweite: <em>il capoluogo → i capoluoghi, il capolavoro → i capolavori<\/em>.<\/p><p><b>Getrennt geschriebene Fügungen<\/b>: Nur das erste Wort wird Plural: <em>la parola chiave → le parole chiave, il treno merci → i treni merci<\/em>.<\/p><div class=\"tip\">Die Regeln haben Ausnahmen und Schwankungen. Im Zweifel hilft das Wörterbuch – dort ist der Plural angegeben.<\/div>"}],"exercises":[{"type":"gap","title":"Regelmäßiger Plural","task":"Setze das Substantiv in den Plural.","items":[{"q":"Quest'estate ho letto due (libro) ___.","a":["libri"],"de":"Diesen Sommer habe ich zwei Bücher gelesen."},{"q":"Le (finestra) ___ sono aperte.","a":["finestre"],"de":"Die Fenster sind offen."},{"q":"Ho perso le (chiave) ___ di casa.","a":["chiavi"],"de":"Ich habe die Hausschlüssel verloren."},{"q":"I (fiore) ___ in giardino sono gialli.","a":["fiori"],"de":"Die Blumen im Garten sind gelb."},{"q":"Abbiamo visitato tre (città) ___ toscane.","a":["città"],"de":"Wir haben drei toskanische Städte besucht."},{"q":"Questi (problema) ___ sono difficili.","a":["problemi"],"de":"Diese Probleme sind schwierig."},{"q":"Ieri sera abbiamo visto due (film) ___.","a":["film"],"de":"Gestern Abend haben wir zwei Filme gesehen."},{"q":"Lavati le (mano) ___ prima di mangiare!","a":["mani"],"de":"Wasch dir vor dem Essen die Hände!"},{"q":"In albergo ci sono molte (turista) ___ inglesi. (nur Frauen)","a":["turiste"],"de":"Im Hotel sind viele englische Touristinnen."},{"q":"Nel museo c'erano tanti (turista) ___. (gemischte Gruppe)","a":["turisti"],"de":"Im Museum waren viele Touristen."}]},{"type":"choice","title":"Maskulin oder feminin?","task":"Wähle den richtigen Artikel.","items":[{"q":"___ problema","options":["il","la"],"a":0,"why":"Griechische Wörter auf -ma sind maskulin."},{"q":"___ mano","options":["il","la"],"a":1,"why":"mano ist feminin, obwohl es auf -o endet."},{"q":"___ latte","options":["il","la"],"a":0,"why":"latte ist maskulin (anders als „die Milch“)."},{"q":"___ stazione","options":["il","la"],"a":1,"why":"Wörter auf -zione sind feminin."},{"q":"___ crisi","options":["il","la"],"a":1,"why":"Griechische Wörter auf -si sind feminin."},{"q":"___ foto","options":["il","la"],"a":1,"why":"foto ist die Kurzform von la fotografia."},{"q":"___ fiore","options":["il","la"],"a":0,"why":"fiore ist maskulin (anders als „die Blume“)."},{"q":"___ pianeta","options":["il","la"],"a":0,"why":"pianeta ist ein Maskulinum auf -a."},{"q":"___ melo (Apfelbaum)","options":["il","la"],"a":0,"why":"Bäume sind meist maskulin."},{"q":"___ città","options":["il","la"],"a":1,"why":"Wörter auf -tà sind feminin."}]},{"type":"gap","title":"Die weibliche Form","task":"Setze die feminine Form ein.","items":[{"q":"Lui è un attore, lei è un'___.","a":["attrice"],"de":"Er ist Schauspieler, sie ist Schauspielerin."},{"q":"Lui è professore, lei è ___.","a":["professoressa"],"de":"Er ist Lehrer, sie ist Lehrerin."},{"q":"Mio zio si chiama Piero, mia ___ si chiama Carla.","a":["zia"],"de":"Mein Onkel heißt Piero, meine Tante heißt Carla."},{"q":"Lui fa il cameriere, lei fa la ___.","a":["cameriera"],"de":"Er arbeitet als Kellner, sie als Kellnerin."},{"q":"Lui è il padre, lei è la ___.","a":["madre"],"de":"Er ist der Vater, sie ist die Mutter."},{"q":"Lui è uno scrittore famoso, lei è una ___ famosa.","a":["scrittrice"],"de":"Er ist ein berühmter Schriftsteller, sie eine berühmte Schriftstellerin."},{"q":"Lui è il marito, lei è la ___.","a":["moglie"],"de":"Er ist der Ehemann, sie ist die Ehefrau."},{"q":"Lui è un cantante, lei è una ___.","a":["cantante"],"de":"Er ist Sänger, sie ist Sängerin."},{"q":"Lui è uno studente, lei è una ___.","a":["studentessa"],"de":"Er ist Student, sie ist Studentin."},{"q":"Lui è il mio collega, lei è la mia ___.","a":["collega"],"de":"Er ist mein Kollege, sie ist meine Kollegin."}]},{"type":"gap","title":"Schwierige Plurale","task":"Setze das Substantiv in den Plural.","items":[{"q":"In centro ci sono molte (banca) ___.","a":["banche"],"de":"Im Zentrum gibt es viele Banken."},{"q":"I miei (amico) ___ arrivano stasera.","a":["amici"],"de":"Meine Freunde kommen heute Abend an."},{"q":"Nel nord Italia ci sono molti (lago) ___.","a":["laghi"],"de":"In Norditalien gibt es viele Seen."},{"q":"I (medico) ___ di questo reparto sono bravi.","a":["medici"],"de":"Die Ärzte dieser Abteilung sind gut."},{"q":"Ho comprato tre (camicia) ___ nuove.","a":["camicie"],"de":"Ich habe drei neue Hemden gekauft."},{"q":"D'agosto le (spiaggia) ___ sono piene.","a":["spiagge"],"de":"Im August sind die Strände voll."},{"q":"In questa via ci sono due (farmacia) ___.","a":["farmacie"],"de":"In dieser Straße gibt es zwei Apotheken."},{"q":"I (negozio) ___ chiudono alle otto.","a":["negozi"],"de":"Die Geschäfte schließen um acht."},{"q":"I miei (zio) ___ abitano a Napoli.","a":["zii"],"de":"Meine Onkel wohnen in Neapel."},{"q":"Abbiamo confrontato i prezzi di due (albergo) ___.","a":["alberghi"],"de":"Wir haben die Preise von zwei Hotels verglichen."}]},{"type":"choice","title":"Unregelmäßig, zwei Plurale, nur Plural","task":"Wähle die richtige Form.","items":[{"q":"A colazione ho mangiato due ___.","options":["uovi","uova","uove"],"a":1,"why":"l'uovo → le uova (feminin auf -a)."},{"q":"Ho comprato due ___ di scarpe.","options":["paia","pai","paii"],"a":0,"why":"il paio → le paia."},{"q":"Quegli ___ sono molto gentili.","options":["uomi","uomini","uomoni"],"a":1,"why":"l'uomo → gli uomini."},{"q":"Dopo la palestra mi fanno male le ___. (Arme)","options":["braccia","bracci"],"a":0,"why":"Körperteile: le braccia."},{"q":"Il lampadario ha sei ___. (Arme des Leuchters)","options":["braccia","bracci"],"a":1,"why":"Übertragene Bedeutung: i bracci."},{"q":"Le ___ di Lucca sono famose. (Stadtmauer)","options":["mura","muri"],"a":0,"why":"Stadtmauer = le mura."},{"q":"Abbiamo dipinto i ___ della cucina. (Wände)","options":["mura","muri"],"a":1,"why":"Wände eines Raumes = i muri."},{"q":"Oggi la gente ___ di buon umore.","options":["è","sono"],"a":0,"why":"la gente ist Singular."},{"q":"Dove sono i miei occhiali? Ah, ___ sul tavolo.","options":["è","sono"],"a":1,"why":"occhiali ist ein Plural."},{"q":"Il bambino si è tagliato le ___. (Finger)","options":["dita","diti"],"a":0,"why":"Körperteil, Gesamtheit: le dita."}]},{"type":"gap","title":"Zusammengesetzte und unveränderliche Wörter","task":"Setze das Substantiv in den Plural.","items":[{"q":"Ho perso due (portafoglio) ___ quest'anno.","a":["portafogli"],"de":"Ich habe dieses Jahr zwei Geldbörsen verloren."},{"q":"A New York ci sono tanti (grattacielo) ___.","a":["grattacieli"],"de":"In New York gibt es viele Wolkenkratzer."},{"q":"In cucina abbiamo tre (apribottiglie) ___.","a":["apribottiglie"],"de":"In der Küche haben wir drei Flaschenöffner."},{"q":"Mi servono tre (francobollo) ___.","a":["francobolli"],"de":"Ich brauche drei Briefmarken."},{"q":"Le (cassaforte) ___ della banca sono vuote.","a":["casseforti"],"de":"Die Tresore der Bank sind leer."},{"q":"In questa stazione lavorano due (capostazione) ___.","a":["capistazione"],"de":"In diesem Bahnhof arbeiten zwei Bahnhofsvorsteher."},{"q":"In vacanza ho fatto tante (foto) ___.","a":["foto"],"de":"Im Urlaub habe ich viele Fotos gemacht."},{"q":"Le (crisi) ___ economiche sono frequenti.","a":["crisi"],"de":"Wirtschaftskrisen sind häufig."},{"q":"Firenze e Pisa sono (capoluogo) ___ di provincia.","a":["capoluoghi"],"de":"Florenz und Pisa sind Provinzhauptstädte."},{"q":"Quali sono le (parola chiave) ___ di questo testo?","a":["parole chiave"],"de":"Was sind die Schlüsselwörter dieses Textes?"}]}],"cards":[{"f":"Plural: -o / -a / -e","b":"-i / -e / -i"},{"f":"il problema – Plural","b":"i problemi (m auf -a)"},{"f":"la mano – Plural","b":"le mani"},{"f":"die Milch / das Meer / die Sonne","b":"il latte / il mare / il sole"},{"f":"Genus von -zione, -tà, -tù","b":"feminin: la stazione, la città, la virtù"},{"f":"la crisi – Plural","b":"le crisi (unveränderlich)"},{"f":"Apfelbaum / Apfel","b":"il melo / la mela"},{"f":"l'attore – feminin","b":"l'attrice"},{"f":"il dottore – feminin","b":"la dottoressa"},{"f":"il marito – feminin","b":"la moglie"},{"f":"il/la cantante, il/la nipote","b":"gleiche Form, nur der Artikel zeigt das Geschlecht"},{"f":"Unveränderliche Plurale (Gruppen)","b":"Akzent-Endung, Einsilbler, Fremdwörter, Kurzwörter, -i, -ie"},{"f":"il turista / la turista – Plural","b":"i turisti / le turiste"},{"f":"il collega / la collega – Plural","b":"i colleghi / le colleghe"},{"f":"il lago / il medico – Plural","b":"i laghi / i medici"},{"f":"l'amico – Plural","b":"gli amici (Ausnahme)"},{"f":"la camicia / l'arancia – Plural","b":"le camicie / le arance"},{"f":"il negozio / lo zio – Plural","b":"i negozi / gli zii"},{"f":"l'uomo – Plural","b":"gli uomini"},{"f":"l'uovo / il paio – Plural","b":"le uova / le paia"},{"f":"die Brille / die Schere","b":"gli occhiali / le forbici (nur Plural)"},{"f":"Die Leute sind nett.","b":"La gente è gentile. (Singular)"},{"f":"le braccia / i bracci","b":"Arme (Körper) / Arme (Leuchter, Fluss)"},{"f":"le mura / i muri","b":"Stadtmauer / Wände"},{"f":"le labbra / le ciglia","b":"Lippen / Wimpern"},{"f":"il grattacielo – Plural","b":"i grattacieli"},{"f":"la cassaforte – Plural","b":"le casseforti (beide Teile)"},{"f":"il capostazione – Plural","b":"i capistazione"}],"id":"k02"},{"nr":3,"title":"Der Artikel","teil":"Das Substantiv und seine Begleiter","intro":"Der Artikel hat im Italienischen mehr Formen als im Deutschen und richtet sich nach dem Anlaut des folgenden Wortes. Außerdem steht er oft dort, wo das Deutsche keinen hat – und umgekehrt.","sections":[{"h":"Der bestimmte Artikel: Formen","html":"<p>Welche Form man wählt, hängt vom Genus, von der Zahl und vom <b>Anlaut des folgenden Wortes<\/b> ab.<\/p><table><tr><th>vor …<\/th><th>m Sg.<\/th><th>m Pl.<\/th><\/tr><tr><td>Konsonant<\/td><td><em>il libro<\/em><\/td><td><em>i libri<\/em><\/td><\/tr><tr><td>s + Konsonant, z, gn, ps, pn, x, y<\/td><td><em>lo studente, lo zaino<\/em><\/td><td><em>gli studenti, gli zaini<\/em><\/td><\/tr><tr><td>Vokal<\/td><td><em>l'amico<\/em><\/td><td><em>gli amici<\/em><\/td><\/tr><\/table><table><tr><th>vor …<\/th><th>f Sg.<\/th><th>f Pl.<\/th><\/tr><tr><td>Konsonant<\/td><td><em>la casa<\/em><\/td><td><em>le case<\/em><\/td><\/tr><tr><td>Vokal<\/td><td><em>l'isola<\/em><\/td><td><em>le isole<\/em><\/td><\/tr><\/table><p>Weitere Beispiele für <em>lo / gli<\/em>: <em>lo gnocco, lo psicologo, lo pneumatico, lo xilofono, lo yogurt<\/em>; ebenso vor <em>i<\/em> + Vokal: <em>lo iodio<\/em>.<\/p><div class=\"tip\">Merke: <em>lo<\/em> steht dort, wo das folgende Wort mit einer „schwierigen“ Lautgruppe beginnt – <em>il<\/em> würde sich dort schlecht sprechen lassen.<\/div><div class=\"warn\">Achtung: Der Artikel richtet sich nach dem <b>direkt folgenden<\/b> Wort, nicht nach dem Substantiv: <em>lo zio → il mio zio<\/em>, <em>gli studenti → i bravi studenti<\/em>, <em>l'amica → la nuova amica<\/em>.<\/div>"},{"h":"Besonderheiten des bestimmten Artikels","html":"<ul><li><em>il dio<\/em>, aber im Plural <em>gli dei<\/em> (historische Ausnahme).<\/li><li><em>la<\/em> und <em>lo<\/em> werden vor Vokal elidiert, <em>le<\/em> und <em>gli<\/em> heute normalerweise nicht: <em>le amiche, gli italiani<\/em>.<\/li><li><b>stummes h<\/b> zählt als Vokal: <em>l'hotel, l'hobby, gli hamburger<\/em>.<\/li><li>Bei <b>Fremdwörtern<\/b> entscheidet die Aussprache: <em>w<\/em> wie „u“ → <em>il web, il weekend, il whisky<\/em>; <em>j<\/em> wie „dsch“ → <em>il jazz, il judo<\/em>; <em>y<\/em> wie „i“ + Vokal → <em>lo yogurt, lo yacht<\/em>.<\/li><li>Vor <em>pn<\/em> hört man umgangssprachlich auch <em>il pneumatico<\/em>; korrekt ist <em>lo pneumatico, gli pneumatici<\/em>.<\/li><\/ul><div class=\"tip\">Bei Fremdwörtern schwankt der Gebrauch manchmal. Die Regel „Aussprache entscheidet“ ist der sicherste Weg.<\/div>"},{"h":"Gebrauch des bestimmten Artikels – anders als im Deutschen","html":"<p>Im Italienischen steht der bestimmte Artikel in vielen Fällen, in denen das Deutsche keinen hat:<\/p><table><tr><th>Fall<\/th><th>Beispiel<\/th><th>Deutsch<\/th><\/tr><tr><td>Uhrzeit<\/td><td><em>Sono le tre. È l'una. Alle otto.<\/em><\/td><td>Es ist drei. Um acht.<\/td><\/tr><tr><td>Possessiv<\/td><td><em>la mia casa, i tuoi amici<\/em><\/td><td>mein Haus, deine Freunde<\/td><\/tr><tr><td>Länder, Regionen, Kontinente<\/td><td><em>L'Italia è lunga. La Toscana è bella.<\/em><\/td><td>Italien … Die Toskana …<\/td><\/tr><tr><td>Titel vor Namen<\/td><td><em>Il signor Rossi è qui. La dottoressa Neri arriva.<\/em><\/td><td>Herr Rossi … Frau Dr. Neri …<\/td><\/tr><tr><td>Jahreszahlen, Daten<\/td><td><em>il 2026, nel 1989, il 3 maggio<\/em><\/td><td>2026, 1989, am 3. Mai<\/td><\/tr><tr><td>Prozente<\/td><td><em>il 40% dei pazienti<\/em><\/td><td>40 % der Patienten<\/td><\/tr><tr><td>Körperteile, Kleidung<\/td><td><em>Mi lavo le mani. Si è rotto il braccio.<\/em><\/td><td>Ich wasche mir die Hände.<\/td><\/tr><tr><td>Allgemeine Begriffe<\/td><td><em>Mi piace il calcio. La salute è importante.<\/em><\/td><td>Ich mag Fußball.<\/td><\/tr><\/table><p><b>Ausnahmen:<\/b><\/p><ul><li>Possessiv + <b>Verwandte im Singular<\/b> ohne Artikel: <em>mia madre, tuo fratello<\/em> – aber <em>i miei fratelli, la mia mamma, il mio fratellino, la loro madre<\/em>.<\/li><li><em>in<\/em> + feminines Land ohne Artikel: <em>Vivo in Italia, vado in Toscana<\/em>; aber <em>negli Stati Uniti, nel Lazio<\/em>.<\/li><li>Städte ohne Artikel: <em>Roma, Milano<\/em> (Ausnahmen: <em>La Spezia, L'Aquila, il Cairo<\/em>).<\/li><li>Direkte Anrede ohne Artikel: <em>Buongiorno, signor Rossi!<\/em><\/li><\/ul><div class=\"tip\"><em>il lunedì<\/em> = montags, jeden Montag; <em>lunedì<\/em> = (diesen) Montag.<\/div>"},{"h":"Der unbestimmte Artikel: Formen","html":"<table><tr><th>vor …<\/th><th>m<\/th><th>f<\/th><\/tr><tr><td>Konsonant<\/td><td><em>un libro<\/em><\/td><td><em>una casa<\/em><\/td><\/tr><tr><td>Vokal<\/td><td><em>un amico<\/em><\/td><td><em>un'amica<\/em><\/td><\/tr><tr><td>s + Konsonant, z, gn, ps, pn, x, y<\/td><td><em>uno studente, uno zaino, uno psicologo<\/em><\/td><td><em>una studentessa, una zia<\/em><\/td><\/tr><\/table><p>Auch hier entscheidet das direkt folgende Wort: <em>uno zaino → un grande zaino<\/em>; <em>un'amica → una vecchia amica<\/em>.<\/p><p>Einen Plural hat der unbestimmte Artikel nicht – dafür nimmt man den Teilungsartikel oder <em>alcuni / qualche<\/em> (siehe unten).<\/p><div class=\"warn\">Achtung: <em>un amico<\/em> ohne Apostroph (<em>un<\/em> ist eine Vollform), aber <em>un'amica<\/em> mit Apostroph (aus <em>una<\/em>).<\/div>"},{"h":"Gebrauch des unbestimmten Artikels","html":"<p><b>Beruf, Nationalität, Religion<\/b> nach <em>essere<\/em>: meist <b>ohne<\/b> Artikel. Mit <em>fare<\/em>: <b>bestimmter<\/b> Artikel.<\/p><table><tr><th><\/th><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td>essere<\/td><td><em>Sono insegnante.<\/em><\/td><td>Ich bin Lehrer.<\/td><\/tr><tr><td>fare<\/td><td><em>Faccio l'insegnante.<\/em><\/td><td>Ich arbeite als Lehrer.<\/td><\/tr><tr><td>mit Adjektiv<\/td><td><em>È un insegnante bravissimo.<\/em><\/td><td>Er ist ein sehr guter Lehrer.<\/td><\/tr><\/table><p><b>Kein Artikel<\/b> außerdem:<\/p><ul><li>in Ausrufen mit <em>che<\/em>: <em>Che bella giornata!<\/em> – Was für ein schöner Tag!<\/li><li>bei <em>mezzo<\/em> vor dem Substantiv: <em>mezzo chilo<\/em> – ein halbes Kilo; aber <em>un chilo e mezzo<\/em><\/li><li>in Wendungen mit <em>avere<\/em>: <em>Ho fame, ho sete, ho fretta.<\/em><\/li><\/ul><p>Anders als im Deutschen steht er bei: <em>un altro<\/em> (ein anderer), <em>Ho la febbre / il raffreddore<\/em> (Ich habe Fieber / Schnupfen – bestimmter Artikel!).<\/p><div class=\"warn\">Achtung: „Was für ein …!“ heißt <em>Che …!<\/em> ohne Artikel – nicht <em>Che una sorpresa!<\/em>, sondern <em>Che sorpresa!<\/em><\/div>"},{"h":"Der Teilungsartikel: Formen","html":"<p>Der Teilungsartikel besteht aus <em>di<\/em> + bestimmtem Artikel und bezeichnet eine <b>unbestimmte Menge<\/b> („etwas, einige“). Im Plural dient er als Plural des unbestimmten Artikels.<\/p><table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>m (Konsonant)<\/td><td><em>del pane<\/em><\/td><td><em>dei pomodori<\/em><\/td><\/tr><tr><td>m (s+Kons., z …)<\/td><td><em>dello zucchero<\/em><\/td><td><em>degli spinaci<\/em><\/td><\/tr><tr><td>m (Vokal)<\/td><td><em>dell'olio<\/em><\/td><td><em>degli amici<\/em><\/td><\/tr><tr><td>f (Konsonant)<\/td><td><em>della birra<\/em><\/td><td><em>delle mele<\/em><\/td><\/tr><tr><td>f (Vokal)<\/td><td><em>dell'acqua<\/em><\/td><td><em>delle arance<\/em><\/td><\/tr><\/table><p><em>Compro del pane.<\/em> – Ich kaufe (etwas) Brot. <em>Ho delle domande.<\/em> – Ich habe (einige) Fragen. <em>Ci sono degli studenti in aula.<\/em> – Es sind Studenten im Hörsaal.<\/p><div class=\"tip\">Im Deutschen steht hier meist gar nichts. Der Teilungsartikel ist im Italienischen oft auch weglassbar – besonders in Aufzählungen.<\/div>"},{"h":"Teilungsartikel: Gebrauch, Ersatz, Wegfall","html":"<p><b>Weglassen<\/b> ist häufig, vor allem in Aufzählungen und nach Mengenangaben: <em>Compro pane, latte e uova. Un chilo di mele.<\/em><\/p><p><b>Ersatzformen:<\/b><\/p><table><tr><th>Form<\/th><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>un po' di<\/em><\/td><td>Nichtzählbares, Singular<\/td><td><em>un po' di sale, un po' di pazienza<\/em><\/td><\/tr><tr><td><em>qualche<\/em><\/td><td>Zählbares, Substantiv im <b>Singular<\/b><\/td><td><em>qualche amico, qualche giorno<\/em><\/td><\/tr><tr><td><em>alcuni / alcune<\/em><\/td><td>Zählbares, Plural<\/td><td><em>alcuni amici, alcune volte<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Nach <em>qualche<\/em> steht das Substantiv (und das Verb) im <b>Singular<\/b>, obwohl die Bedeutung Plural ist: <em>C'è qualche problema?<\/em> – Gibt es (irgendwelche) Probleme?<\/div><p><b>Bei Verneinung<\/b> fällt der Teilungsartikel weg: <em>Non ho tempo. Non ci sono problemi. Non abbiamo figli.<\/em><\/p><p>Nach Präpositionen klingt er oft schwerfällig; besser <em>alcuni<\/em>: <em>Sono uscito con alcuni amici<\/em> (statt <em>con degli amici<\/em>, das umgangssprachlich aber vorkommt).<\/p><div class=\"tip\">Nach Mengenangaben steht nur <em>di<\/em>, kein Teilungsartikel: <em>un chilo di mele<\/em>, nicht <em>un chilo delle mele<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Der bestimmte Artikel","task":"Setze den bestimmten Artikel ein.","items":[{"q":"___ zaino di Luca è pesante.","a":["Lo","lo"],"de":"Lucas Rucksack ist schwer."},{"q":"___ studenti sono già in aula.","a":["Gli","gli"],"de":"Die Studenten sind schon im Hörsaal."},{"q":"___ amica di Paolo fa la farmacista.","a":["L'","l'"],"de":"Paolos Freundin ist Apothekerin."},{"q":"___ psicologo riceve il martedì.","a":["Lo","lo"],"de":"Der Psychologe hat dienstags Sprechstunde."},{"q":"___ isole greche sono bellissime.","a":["Le","le"],"de":"Die griechischen Inseln sind wunderschön."},{"q":"___ yogurt è in frigo.","a":["Lo","lo"],"de":"Der Joghurt ist im Kühlschrank."},{"q":"___ hotel è vicino alla spiaggia.","a":["L'","l'"],"de":"Das Hotel ist in der Nähe des Strandes."},{"q":"___ zii di Marta vivono a Bari.","a":["Gli","gli"],"de":"Martas Onkel (Onkel und Tante) wohnen in Bari."},{"q":"___ bravi studenti studiano ogni giorno.","a":["I","i"],"de":"Die guten Studenten lernen jeden Tag."},{"q":"Nella mitologia greca ___ dei vivono sull'Olimpo.","a":["gli"],"de":"In der griechischen Mythologie leben die Götter auf dem Olymp."}]},{"type":"choice","title":"Der unbestimmte Artikel","task":"Wähle die richtige Form.","items":[{"q":"___ amico","options":["un","uno","un'"],"a":0,"why":"Maskulin vor Vokal: un, ohne Apostroph."},{"q":"___ amica","options":["una","un'","un"],"a":1,"why":"Feminin vor Vokal: un'."},{"q":"___ zaino","options":["un","uno"],"a":1,"why":"Vor z steht uno."},{"q":"___ studente","options":["un","uno"],"a":1,"why":"Vor s + Konsonant steht uno."},{"q":"___ isola","options":["un","un'","uno"],"a":1,"why":"Feminin vor Vokal: un'."},{"q":"___ psicologo","options":["un","uno"],"a":1,"why":"Vor ps steht uno."},{"q":"___ grande zaino","options":["un","uno"],"a":0,"why":"Entscheidend ist das folgende Wort: grande."},{"q":"___ vecchia amica","options":["una","un'"],"a":0,"why":"Das folgende Wort vecchia beginnt mit Konsonant."},{"q":"___ albero","options":["un","un'","uno"],"a":0,"why":"Maskulin vor Vokal: un."},{"q":"___ gnomo","options":["un","uno"],"a":1,"why":"Vor gn steht uno."}]},{"type":"choice","title":"Artikel oder nicht?","task":"Wähle die richtige Lösung (– = kein Artikel).","items":[{"q":"___ Italia è famosa per la sua cucina.","options":["L'","–"],"a":0,"why":"Ländernamen stehen mit Artikel."},{"q":"Da tre anni vivo in ___ Germania.","options":["la","–"],"a":1,"why":"in + feminines Land ohne Artikel."},{"q":"Che ore sono? Sono ___ tre.","options":["le","–"],"a":0,"why":"Uhrzeiten stehen mit Artikel."},{"q":"Ti presento ___ mia sorella.","options":["la","–"],"a":1,"why":"Verwandte im Singular + Possessiv: kein Artikel."},{"q":"Ti presento ___ mie sorelle.","options":["le","–"],"a":0,"why":"Im Plural steht der Artikel."},{"q":"Buongiorno, ___ dottor Neri!","options":["il","–"],"a":1,"why":"Direkte Anrede ohne Artikel."},{"q":"Ieri ho parlato con ___ dottor Neri.","options":["il","–"],"a":0,"why":"Titel vor Namen mit Artikel, wenn man über jemanden spricht."},{"q":"Dopo ogni pasto mi lavo ___ denti.","options":["i","miei"],"a":0,"why":"Körperteile: Artikel statt Possessiv."},{"q":"Mio figlio è nato ___ 2015.","options":["in","nel"],"a":1,"why":"Jahreszahlen stehen mit Artikel: nel."},{"q":"Mia madre fa ___ insegnante.","options":["l'","un'","–"],"a":0,"why":"fare + bestimmter Artikel beim Beruf."}]},{"type":"gap","title":"Der Teilungsartikel","task":"Setze den Teilungsartikel ein.","items":[{"q":"Al forno ho comprato ___ pane fresco.","a":["del"],"de":"In der Bäckerei habe ich frisches Brot gekauft."},{"q":"Ci sono ___ studenti in biblioteca.","a":["degli"],"de":"Es sind Studenten in der Bibliothek."},{"q":"Vuoi ___ acqua?","a":["dell'"],"de":"Möchtest du etwas Wasser?"},{"q":"Dottore, ho ___ domande per Lei.","a":["delle"],"de":"Herr Doktor, ich habe einige Fragen an Sie."},{"q":"Metti ___ zucchero nel caffè?","a":["dello"],"de":"Tust du Zucker in den Kaffee?"},{"q":"Per sabato abbiamo invitato ___ amici.","a":["degli"],"de":"Für Samstag haben wir Freunde eingeladen."},{"q":"Compra anche ___ pomodori, per favore!","a":["dei"],"de":"Kauf bitte auch Tomaten!"},{"q":"In frigo c'è ancora ___ birra.","a":["della"],"de":"Im Kühlschrank ist noch Bier."},{"q":"Ho trovato ___ errori nella tua lettera.","a":["degli"],"de":"Ich habe Fehler in deinem Brief gefunden."}]},{"type":"choice","title":"Ersatz und Verneinung","task":"Wähle die richtige Form.","items":[{"q":"Alla festa ho incontrato ___ amico di scuola.","options":["qualche","alcuni","un po' di"],"a":0,"why":"qualche + Singular."},{"q":"Alla festa ho incontrato ___ amici di scuola.","options":["qualche","alcuni"],"a":1,"why":"alcuni + Plural."},{"q":"Aggiungi ___ sale alla pasta.","options":["qualche","un po' di","alcuni"],"a":1,"why":"Nichtzählbares: un po' di."},{"q":"Mi dispiace, oggi non ho ___ tempo.","options":["del","–"],"a":1,"why":"Bei Verneinung fällt der Teilungsartikel weg."},{"q":"Tranquillo, non ci sono ___ problemi.","options":["dei","–"],"a":1,"why":"Bei Verneinung fällt der Teilungsartikel weg."},{"q":"Scusi, c'___ qualche problema?","options":["è","sono"],"a":0,"why":"Nach qualche steht das Verb im Singular."},{"q":"Con i bambini serve ___ pazienza.","options":["un po' di","qualche"],"a":0,"why":"pazienza ist nicht zählbar."},{"q":"Un chilo ___ mele, per favore.","options":["di","delle"],"a":0,"why":"Nach Mengenangaben nur di."}]},{"type":"gap","title":"Gebrauch im Satz","task":"Setze die passende Form ein (Artikel oder Präposition + Artikel).","items":[{"q":"Mio padre fa ___ ingegnere.","a":["l'"],"de":"Mein Vater arbeitet als Ingenieur."},{"q":"Che ore sono? È ___ una e mezza.","a":["l'"],"de":"Wie spät ist es? Es ist halb zwei."},{"q":"Il treno parte ___ otto. (um)","a":["alle"],"de":"Der Zug fährt um acht ab."},{"q":"Quest'estate andiamo ___ Stati Uniti. (in die)","a":["negli"],"de":"Diesen Sommer fahren wir in die USA."},{"q":"___ signora Bianchi è in ufficio?","a":["La"],"de":"Ist Frau Bianchi im Büro?"},{"q":"Secondo lo studio, ___ 30% dei pazienti sta meglio.","a":["il"],"de":"Laut der Studie geht es 30 % der Patienten besser."},{"q":"Sciando si è rotto ___ braccio.","a":["il"],"de":"Beim Skifahren hat er sich den Arm gebrochen."},{"q":"Mia figlia è nata ___ 12 aprile.","a":["il"],"de":"Meine Tochter ist am 12. April geboren."},{"q":"Ho comprato ___ chilo e mezzo di pane.","a":["un"],"de":"Ich habe anderthalb Kilo Brot gekauft."}]}],"cards":[{"f":"Bestimmter Artikel m: il / lo / l'","b":"Plural: i / gli / gli"},{"f":"Bestimmter Artikel f: la / l'","b":"Plural: le / le"},{"f":"Wann lo / gli?","b":"vor s + Konsonant, z, gn, ps, pn, x, y (und i + Vokal)"},{"f":"lo zio → mit Adjektiv","b":"il mio zio (Artikel richtet sich nach dem folgenden Wort)"},{"f":"il dio – Plural","b":"gli dei"},{"f":"das Hotel / der Joghurt / der Jazz","b":"l'hotel / lo yogurt / il jazz"},{"f":"Es ist drei Uhr. / Es ist ein Uhr.","b":"Sono le tre. / È l'una."},{"f":"mein Haus / meine Mutter","b":"la mia casa / mia madre"},{"f":"meine Geschwister","b":"i miei fratelli (Plural mit Artikel)"},{"f":"Italien ist schön. / Ich lebe in Italien.","b":"L'Italia è bella. / Vivo in Italia."},{"f":"Herr Rossi ist da. / Guten Tag, Herr Rossi!","b":"Il signor Rossi è qui. / Buongiorno, signor Rossi!"},{"f":"im Jahr 1990","b":"nel 1990"},{"f":"Ich wasche mir die Hände.","b":"Mi lavo le mani."},{"f":"montags / (diesen) Montag","b":"il lunedì / lunedì"},{"f":"Unbestimmter Artikel m","b":"un (Konsonant, Vokal) / uno (s+Kons., z, gn, ps …)"},{"f":"Unbestimmter Artikel f","b":"una / un' (vor Vokal)"},{"f":"un amico / un'amica","b":"Apostroph nur beim Femininum"},{"f":"Ich bin Ärztin. / Ich arbeite als Ärztin.","b":"Sono medico. / Faccio il medico."},{"f":"Was für eine Überraschung!","b":"Che sorpresa! (ohne Artikel)"},{"f":"ein halbes Kilo / anderthalb Kilo","b":"mezzo chilo / un chilo e mezzo"},{"f":"Teilungsartikel: Formen","b":"del, dello, dell', della, dei, degli, delle"},{"f":"Ich kaufe Brot. (etwas)","b":"Compro del pane."},{"f":"einige Freunde (3 Möglichkeiten)","b":"degli amici / alcuni amici / qualche amico"},{"f":"qualche + …","b":"Substantiv und Verb im Singular: C'è qualche problema?"},{"f":"ein bisschen Geduld","b":"un po' di pazienza"},{"f":"Ich habe keine Zeit.","b":"Non ho tempo. (kein Teilungsartikel bei Verneinung)"},{"f":"ein Kilo Äpfel","b":"un chilo di mele"}],"id":"k03"},{"nr":4,"title":"Das Adjektiv","teil":"Das Substantiv und seine Begleiter","intro":"Italienische Adjektive werden immer an ihr Substantiv angeglichen – auch nach essere. Ihre Stellung kann die Bedeutung verändern, und bei der Steigerung gibt es wichtige unregelmäßige Formen.","sections":[{"h":"Endungen und Angleichung","html":"<p>Adjektive richten sich in <b>Genus und Zahl<\/b> nach ihrem Substantiv. Es gibt zwei Hauptgruppen:<\/p><table><tr><th><\/th><th>m<\/th><th>f<\/th><\/tr><tr><td>Gruppe 1 Sg.<\/td><td><em>alto<\/em><\/td><td><em>alta<\/em><\/td><\/tr><tr><td>Gruppe 1 Pl.<\/td><td><em>alti<\/em><\/td><td><em>alte<\/em><\/td><\/tr><tr><td>Gruppe 2 Sg.<\/td><td><em>grande<\/em><\/td><td><em>grande<\/em><\/td><\/tr><tr><td>Gruppe 2 Pl.<\/td><td><em>grandi<\/em><\/td><td><em>grandi<\/em><\/td><\/tr><\/table><p>Adjektive auf <em>-ista<\/em> haben im Singular eine Form, im Plural zwei: <em>un uomo ottimista, una donna ottimista – uomini ottimisti, donne ottimiste<\/em>.<\/p><p>Die Angleichung gilt für das <b>Attribut<\/b> (<em>una casa piccola<\/em>) <b>und<\/b> für das <b>Prädikat<\/b> nach <em>essere, diventare, sembrare<\/em> usw. (<em>La casa è piccola. Le case sono piccole.<\/em>).<\/p><div class=\"warn\">Achtung: Im Deutschen bleibt das prädikative Adjektiv unverändert („Die Häuser sind klein“). Im Italienischen nie: <em>Le ragazze sono stanche<\/em>, nicht <em>stanco<\/em>.<\/div>"},{"h":"Mehrere Substantive, unbestimmtes Subjekt","html":"<ul><li>Mehrere Adjektive zu einem Substantiv: alle werden angeglichen: <em>una macchina rossa e veloce<\/em>.<\/li><li>Mehrere Substantive <b>gleichen<\/b> Genus: Plural dieses Genus: <em>La gonna e la camicia sono nuove.<\/em><\/li><li>Substantive mit <b>gemischtem<\/b> Genus: <b>maskuliner Plural<\/b>: <em>Il libro e la penna sono nuovi. Marco e Anna sono stanchi.<\/em><\/li><li>Als nachgestelltes Attribut gleicht sich das Adjektiv oft nur an das nächste Substantiv an: <em>lingua e cultura italiana<\/em>.<\/li><\/ul><p><b>Unbestimmtes Subjekt<\/b> (Infinitiv, Satz, <em>questo, ciò<\/em>): maskuliner Singular: <em>È importante dormire bene. È strano che non chiami. Questo è vero.<\/em><\/p><p>Bei unpersönlichem <em>si<\/em> + <em>essere<\/em> steht das Adjektiv im <b>Plural<\/b>: <em>Quando si è giovani, si è spesso impazienti.<\/em><\/p><div class=\"tip\">Bei der Höflichkeitsform <em>Lei<\/em> richtet sich das Adjektiv nach dem tatsächlichen Geschlecht: <em>Signor Conti, Lei è stanco? – Signora Conti, Lei è stanca?<\/em><\/div>"},{"h":"molto, tanto, poco, troppo: Adjektiv oder Adverb?","html":"<table><tr><th><\/th><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td>Adjektiv<\/td><td>vor einem <b>Substantiv<\/b>, wird angeglichen<\/td><td><em>molti libri, molta pazienza, molte persone<\/em><\/td><\/tr><tr><td>Adverb<\/td><td>vor einem <b>Adjektiv<\/b> oder bei einem <b>Verb<\/b>, unveränderlich<\/td><td><em>molto belle, molto stanchi; lavora molto<\/em><\/td><\/tr><\/table><p>Ebenso: <em>tanta gente – tanto gentile; poche idee – poco chiaro; troppi errori – troppo caro<\/em>.<\/p><div class=\"warn\">Achtung: <em>Le ragazze sono molto simpatiche<\/em> – hier ist <em>molto<\/em> Adverb (bezieht sich auf <em>simpatiche<\/em>) und bleibt unverändert. <em>molte simpatiche<\/em> ist falsch.<\/div>"},{"h":"Stellung des Adjektivs","html":"<p><b>Normalerweise nach dem Substantiv<\/b> – vor allem, wenn das Adjektiv unterscheidet oder einordnet:<\/p><ul><li>Farbe, Form, Material: <em>una borsa nera, un tavolo rotondo<\/em><\/li><li>Herkunft, Religion, Fachgebiet: <em>un vino siciliano, la chiesa cattolica, la chirurgia oculare<\/em><\/li><li>Partizipien: <em>una porta chiusa<\/em><\/li><li>Adjektive mit Ergänzung: <em>un esercizio facile da capire<\/em><\/li><\/ul><p><b>Vor dem Substantiv<\/b> stehen oft kurze, häufige Adjektive (<em>bello, brutto, buono, grande, piccolo, nuovo, vecchio, giovane, lungo, breve<\/em>). Vorangestellt klingt das Adjektiv <b>beschreibend, gefühlsbetont<\/b>; nachgestellt <b>unterscheidend<\/b>:<\/p><table><tr><th>vorangestellt<\/th><th>nachgestellt<\/th><\/tr><tr><td><em>Che bella giornata!<\/em> (einfach schön)<\/td><td><em>una giornata bella<\/em> (nicht eine hässliche)<\/td><\/tr><tr><td><em>le alte montagne del Trentino<\/em> (die Berge sind hoch)<\/td><td><em>le montagne alte<\/em> (nur die hohen)<\/td><\/tr><\/table><div class=\"tip\">Im Zweifel nachstellen – das ist fast nie falsch, nur manchmal weniger elegant.<\/div>"},{"h":"Bedeutungsunterschied durch die Stellung","html":"<p>Bei manchen Adjektiven ändert sich mit der Stellung die Bedeutung. Vorangestellt meist <b>übertragen<\/b>, nachgestellt <b>wörtlich<\/b>:<\/p><table><tr><th>vorangestellt<\/th><th>nachgestellt<\/th><\/tr><tr><td><em>un grande uomo<\/em> ein bedeutender Mann<\/td><td><em>un uomo grande<\/em> ein großer (großgewachsener) Mann<\/td><\/tr><tr><td><em>un pover'uomo<\/em> ein bedauernswerter Mann<\/td><td><em>un uomo povero<\/em> ein armer (mittelloser) Mann<\/td><\/tr><tr><td><em>un vecchio amico<\/em> ein langjähriger Freund<\/td><td><em>un amico vecchio<\/em> ein alter (betagter) Freund<\/td><\/tr><tr><td><em>certe notizie<\/em> gewisse Nachrichten<\/td><td><em>notizie certe<\/em> sichere Nachrichten<\/td><\/tr><tr><td><em>diversi libri<\/em> mehrere Bücher<\/td><td><em>libri diversi<\/em> unterschiedliche Bücher<\/td><\/tr><tr><td><em>un caro amico<\/em> ein lieber Freund<\/td><td><em>un ristorante caro<\/em> ein teures Restaurant<\/td><\/tr><tr><td><em>l'unico figlio<\/em> der einzige Sohn<\/td><td><em>un figlio unico<\/em> ein Einzelkind<\/td><\/tr><tr><td><em>una sola donna<\/em> eine einzige Frau<\/td><td><em>una donna sola<\/em> eine alleinstehende Frau<\/td><\/tr><tr><td><em>un semplice impiegato<\/em> bloß ein Angestellter<\/td><td><em>un impiegato semplice<\/em> ein schlichter Angestellter<\/td><\/tr><tr><td><em>numerose famiglie<\/em> viele Familien<\/td><td><em>famiglie numerose<\/em> kinderreiche Familien<\/td><\/tr><\/table><div class=\"tip\">Merke: <em>un nuovo libro<\/em> = ein weiteres bzw. neu erschienenes Buch; <em>un libro nuovo<\/em> = ein neues (nicht gebrauchtes) Buch.<\/div>"},{"h":"Laut- und Schreibbesonderheiten","html":"<p>Die P
