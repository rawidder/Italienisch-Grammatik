ca!<\/em><\/td><td><em>finiscano!<\/em><\/td><\/tr><tr><td>andare / fare<\/td><td><em>vada! / faccia!<\/em><\/td><td><em>vadano! / facciano!<\/em><\/td><\/tr><tr><td>venire / dire<\/td><td><em>venga! / dica!<\/em><\/td><td><em>vengano! / dicano!<\/em><\/td><\/tr><tr><td>essere / avere<\/td><td><em>sia! / abbia!<\/em><\/td><td><em>siano! / abbiano!<\/em><\/td><\/tr><tr><td>stare / dare / uscire<\/td><td><em>stia! / dia! / esca!<\/em><\/td><td><em>stiano! / diano! / escano!<\/em><\/td><\/tr><\/table><p>Verneinung: einfach <em>non<\/em> davor: <em>Non si preoccupi!<\/em> <small>Machen Sie sich keine Sorgen!<\/small><\/p><div class=\"tip\">Die <em>Loro<\/em>-Form ist sehr förmlich (Hotel, Zeremonie: <em>Si accomodino!<\/em>). Im Alltag spricht man auch mehrere fremde Personen mit <em>voi<\/em> an: <em>Accomodatevi!<\/em><\/div><div class=\"warn\">Achtung: Die Endungen wirken „vertauscht“: <em>Lei<\/em> sagt <em>Scusi!<\/em>, <em>tu<\/em> sagt <em>Scusa!<\/em><\/div>"},{"h":"Stellung der Pronomen","html":"<p>Bei <em>tu, noi, voi<\/em> werden unbetonte Pronomen, Reflexivpronomen sowie <em>ci<\/em> und <em>ne<\/em> <b>angehängt<\/b>. Bei <em>Lei<\/em> und <em>Loro<\/em> stehen sie <b>davor<\/b>.<\/p><table><tr><th>tu / noi / voi<\/th><th>Lei<\/th><\/tr><tr><td><em>Chiamami!<\/em><\/td><td><em>Mi chiami!<\/em><\/td><\/tr><tr><td><em>Prendilo!<\/em><\/td><td><em>Lo prenda!<\/em><\/td><\/tr><tr><td><em>Siediti!<\/em><\/td><td><em>Si sieda!<\/em><\/td><\/tr><tr><td><em>Mandamelo!<\/em><\/td><td><em>Me lo mandi!<\/em><\/td><\/tr><tr><td><em>Parliamone!<\/em><\/td><td><em>Ne parli!<\/em><\/td><\/tr><tr><td><em>Alzatevi!<\/em><\/td><td><em>Si alzi!<\/em><\/td><\/tr><\/table><p><em>loro<\/em> (= ihnen) steht immer <b>nach<\/b> dem Verb und wird nicht angehängt: <em>Scrivi loro una cartolina!<\/em> <small>Schreib ihnen eine Postkarte!<\/small> – <em>Scriva loro!<\/em> <small>Schreiben Sie ihnen!<\/small> (Umgangssprachlich: <em>Scrivigli!<\/em>)<\/p>"},{"h":"Verdopplung bei einsilbigen Formen","html":"<p>Bei den Kurzformen <em>va', fa', da', sta', di'<\/em> verdoppelt sich der Anfangskonsonant des angehängten Pronomens.<\/p><table><tr><th>Form<\/th><th>Beispiel<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>di' + mi<\/em><\/td><td><em>dimmi!<\/em><\/td><td>sag mir!<\/td><\/tr><tr><td><em>fa' + mi<\/em><\/td><td><em>fammi vedere!<\/em><\/td><td>lass mich sehen!<\/td><\/tr><tr><td><em>da' + lo<\/em><\/td><td><em>dallo a me!<\/em><\/td><td>gib es mir!<\/td><\/tr><tr><td><em>va' + ci<\/em><\/td><td><em>vacci!<\/em><\/td><td>geh hin!<\/td><\/tr><tr><td><em>di' + le<\/em><\/td><td><em>dille!<\/em><\/td><td>sag ihr!<\/td><\/tr><tr><td><em>sta' + mi<\/em><\/td><td><em>stammi bene!<\/em><\/td><td>mach's gut!<\/td><\/tr><tr><td><em>di' + me + lo<\/em><\/td><td><em>dimmelo!<\/em><\/td><td>sag es mir!<\/td><\/tr><\/table><div class=\"warn\">Achtung: <b>Ausnahme <em>gli<\/em><\/b> – hier keine Verdopplung: <em>digli!<\/em> (sag ihm), <em>fagli!<\/em>, <em>dagli!<\/em>, <em>daglielo!<\/em><\/div><div class=\"tip\">Mit den Langformen <em>vai, fai, dai, stai<\/em> hängt man nichts an. Also <em>Fammi un favore!<\/em>, nicht <em>*Faimi<\/em>.<\/div>"},{"h":"Verneinter Imperativ mit Pronomen","html":"<p>Bei <em>tu<\/em> (non + Infinitiv) und <em>voi<\/em> gibt es zwei gleichwertige Stellungen: angehängt oder vor dem Verb.<\/p><table><tr><th><\/th><th>angehängt<\/th><th>vorangestellt<\/th><\/tr><tr><td>tu<\/td><td><em>Non farlo!<\/em><\/td><td><em>Non lo fare!<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>Non dirmelo!<\/em><\/td><td><em>Non me lo dire!<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>Non preoccuparti!<\/em><\/td><td><em>Non ti preoccupare!<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>Non ditelo!<\/em><\/td><td><em>Non lo dite!<\/em><\/td><\/tr><\/table><p>Bei <em>Lei<\/em> stehen die Pronomen immer davor: <em>Non lo faccia!<\/em> <small>Tun Sie es nicht!<\/small> – <em>Non se ne vada!<\/em> <small>Gehen Sie nicht weg!<\/small><\/p><div class=\"warn\">Achtung: Beim verneinten <em>tu<\/em>-Imperativ verliert der Infinitiv sein End-<em>e<\/em>: <em>non alzarti<\/em>, nicht <em>*non alzareti<\/em>. Und keine Mischform wie <em>*Non ti preoccuparti!<\/em><\/div>"},{"h":"Betonung bleibt gleich","html":"<p>Angehängte Pronomen verändern die Betonung des Verbs nicht – auch wenn das Wort dadurch sehr lang wird.<\/p><table><tr><th>Imperativ<\/th><th>mit Pronomen<\/th><th>betont<\/th><\/tr><tr><td><em>manda<\/em><\/td><td><em>mandamelo<\/em><\/td><td>MAN-da-me-lo<\/td><\/tr><tr><td><em>telefona<\/em><\/td><td><em>telefonagli<\/em><\/td><td>te-LE-fo-na-gli<\/td><\/tr><tr><td><em>prendete<\/em><\/td><td><em>prendetelo<\/em><\/td><td>pren-DE-te-lo<\/td><\/tr><tr><td><em>spiega<\/em><\/td><td><em>spiegamelo<\/em><\/td><td>SPIE-ga-me-lo<\/td><\/tr><\/table><div class=\"tip\">Auch <em>ne<\/em> wird angehängt: <em>Dammene un po'!<\/em> – Gib mir ein bisschen davon! <em>Parlane con lei!<\/em> – Sprich mit ihr darüber!<\/div>"},{"h":"Andere Formen der Aufforderung","html":"<ul><li><b>Frage im Indikativ<\/b> (freundlich): <em>Mi passi il pane?<\/em> <small>Reichst du mir das Brot?<\/small><\/li><li><b>Konditional<\/b> (sehr höflich): <em>Potresti abbassare la musica?<\/em> <small>Könntest du die Musik leiser machen?<\/small><\/li><li><b>Indikativ Präsens<\/b> in Wegbeschreibungen und Rezepten: <em>Prende la seconda a sinistra e arriva in piazza.<\/em> <small>Sie nehmen die zweite links und kommen auf den Platz.<\/small><br><em>Tagliamo le zucchine a rondelle e le friggiamo.<\/em> <small>Wir schneiden die Zucchini in Scheiben und braten sie.<\/small><\/li><li><b>Futur<\/b> (nachdrücklich): <em>Domani ti alzerai alle sei!<\/em> <small>Morgen stehst du um sechs auf!<\/small><\/li><li><b>Infinitiv<\/b> in Anleitungen, Schildern, Formularen: <em>Non fumare.<\/em> <small>Nicht rauchen.<\/small> – <em>Agitare prima dell'uso.<\/em> <small>Vor Gebrauch schütteln.<\/small> – <em>Spingere.<\/em> <small>Drücken.<\/small><\/li><\/ul><div class=\"tip\">In Rezepten findet man alle Varianten: <em>Tagliate / Taglia / Tagliare / Si taglia la cipolla.<\/em><\/div>"}],"exercises":[{"type":"gap","title":"Imperativ tu, noi, voi","task":"Bilde den Imperativ für die angegebene Person.","items":[{"q":"(aspettare, tu) ___ un momento!","a":["aspetta","Aspetta"],"de":"Warte einen Moment!"},{"q":"Ragazzi, (scrivere, voi) ___ i vostri nomi qui.","a":["scrivete"],"de":"Leute, schreibt eure Namen hierhin."},{"q":"Per favore, (aprire, tu) ___ la finestra.","a":["apri"],"de":"Bitte mach das Fenster auf."},{"q":"Prima di uscire, (pulire, tu) ___ la tua camera!","a":["pulisci"],"de":"Bevor du ausgehst, räum dein Zimmer auf!"},{"q":"Stasera (mangiare, noi) ___ fuori!","a":["mangiamo"],"de":"Heute Abend essen wir auswärts!"},{"q":"Signori e signore, (spegnere, voi) ___ i cellulari, per favore.","a":["spegnete"],"de":"Meine Damen und Herren, schalten Sie bitte die Handys aus."},{"q":"Ragazzi, (finire, voi) ___ il compito entro domani.","a":["finite"],"de":"Leute, macht die Aufgabe bis morgen fertig."},{"q":"Marta, (leggere, tu) ___ questa frase ad alta voce.","a":["leggi"],"de":"Marta, lies diesen Satz laut vor."},{"q":"È tardi, (partire, noi) ___ subito!","a":["partiamo"],"de":"Es ist spät, fahren wir sofort los!"}]},{"type":"gap","title":"Unregelmäßige tu-Formen","task":"Setze den Imperativ (tu) ein.","items":[{"q":"(essere) ___ gentile con tua sorella!","a":["sii","Sii"],"de":"Sei nett zu deiner Schwester!"},{"q":"Ti prego, (avere) ___ pazienza!","a":["abbi"],"de":"Ich bitte dich, hab Geduld!"},{"q":"È tardi, (andare) ___ a dormire!","a":["va'","vai"],"de":"Es ist spät, geh schlafen!"},{"q":"Quando attraversi, (fare) ___ attenzione!","a":["fa'","fai"],"de":"Wenn du über die Straße gehst, pass auf!"},{"q":"Non stare zitto, (dire) ___ qualcosa!","a":["di'"],"de":"Sei nicht still, sag etwas!"},{"q":"(stare) ___ tranquillo, andrà tutto bene.","a":["sta'","stai","Sta'","Stai"],"de":"Sei ganz ruhig, alles wird gut."},{"q":"Per favore, (dare) ___ un'occhiata a questo documento.","a":["da'","dai"],"de":"Bitte wirf einen Blick auf dieses Dokument."},{"q":"(sapere) ___ che puoi sempre contare su di me.","a":["sappi","Sappi"],"de":"Du sollst wissen, dass du immer auf mich zählen kannst."},{"q":"Luca, (venire) ___ qui subito!","a":["vieni"],"de":"Luca, komm sofort her!"},{"q":"Fa caldo qui dentro, (uscire) ___ un po' in giardino!","a":["esci"],"de":"Es ist heiß hier drin, geh ein bisschen in den Garten!"}]},{"type":"gap","title":"Höflichkeitsform Lei","task":"Setze den Imperativ in der Lei-Form ein.","items":[{"q":"Signora, (entrare) ___ pure!","a":["entri"],"de":"Kommen Sie ruhig herein!"},{"q":"(prendere) ___ la seconda strada a destra.","a":["prenda","Prenda"],"de":"Nehmen Sie die zweite Straße rechts."},{"q":"Dottore, (scusare) ___ il ritardo.","a":["scusi"],"de":"Herr Doktor, entschuldigen Sie die Verspätung."},{"q":"Non c'è fretta: (finire) ___ pure il Suo caffè con calma.","a":["finisca"],"de":"Keine Eile: Trinken Sie Ihren Kaffee in Ruhe aus."},{"q":"Per arrivare al museo, (andare) ___ sempre dritto.","a":["vada"],"de":"Um zum Museum zu kommen, gehen Sie immer geradeaus."},{"q":"(fare) ___ attenzione al gradino!","a":["faccia","Faccia"],"de":"Achten Sie auf die Stufe!"},{"q":"Signor Neri, (venire) ___ domani alle dieci.","a":["venga"],"de":"Herr Neri, kommen Sie morgen um zehn."},{"q":"(dire) ___ pure, La ascolto.","a":["dica","Dica"],"de":"Sprechen Sie ruhig, ich höre Ihnen zu."},{"q":"Non (preoccuparsi) ___, ci pensiamo noi.","a":["si preoccupi"],"de":"Machen Sie sich keine Sorgen, wir kümmern uns darum."},{"q":"La prego, (essere) ___ paziente: il medico arriva subito.","a":["sia"],"de":"Bitte haben Sie Geduld: Der Arzt kommt gleich."}]},{"type":"choice","title":"Verneinter Imperativ","task":"Wähle die korrekte verneinte Form.","items":[{"q":"Non ___ così forte, il bambino dorme! (tu)","options":["parla","parlare"],"a":1,"why":"Verneinter Imperativ tu = non + Infinitiv."},{"q":"Ragazzi, non ___ la porta aperta! (voi)","options":["lasciate","lasciare"],"a":0,"why":"Bei voi: non + Imperativform."},{"q":"Non ___ paura, è solo un temporale. (tu)","options":["avere","abbi"],"a":0,"why":"tu verneint: non + Infinitiv, auch bei avere."},{"q":"Signore, non ___ qui, per favore. (Lei)","options":["fumi","fumare"],"a":0,"why":"Lei-Form verneint: non + congiuntivo."},{"q":"Non ___ tardi stasera, domani hai scuola! (tu)","options":["torna","tornare"],"a":1,"why":"tu verneint: non + Infinitiv."},{"q":"Non ___ ancora, aspettiamo gli altri! (noi)","options":["cominciamo","cominciare"],"a":0,"why":"noi verneint: non + Imperativform."},{"q":"Non ___ nervoso, andrà bene! (tu)","options":["essere","sii"],"a":0,"why":"tu verneint: non + Infinitiv, nicht sii."}]},{"type":"gap","title":"Imperativ mit Pronomen","task":"Bilde den Imperativ mit Pronomen nach der deutschen Vorgabe.","items":[{"q":"Il libro? ___ subito! (Gib es mir – tu, dare)","a":["dammelo","Dammelo"],"de":"Das Buch? Gib es mir sofort!"},{"q":"Per favore, ___ la verità! (sag mir – tu, dire)","a":["dimmi"],"de":"Bitte sag mir die Wahrheit!"},{"q":"Scusa, ___ un favore! (tu mir – tu, fare)","a":["fammi"],"de":"Entschuldige, tu mir einen Gefallen!"},{"q":"Se vedi Marco, ___ di chiamarmi. (sag ihm – tu, dire)","a":["digli"],"de":"Wenn du Marco siehst, sag ihm, er soll mich anrufen."},{"q":"Se vedi Anna, ___ che arrivo tardi. (sag ihr – tu, dire)","a":["dille"],"de":"Wenn du Anna siehst, sag ihr, dass ich spät komme."},{"q":"In farmacia? Allora ___ adesso, prima che chiuda! (geh hin – tu, andare)","a":["vacci"],"de":"In die Apotheke? Dann geh jetzt hin, bevor sie schließt!"},{"q":"Signora, ___ pure! (setzen Sie sich – Lei, accomodarsi)","a":["si accomodi"],"de":"Bitte setzen Sie sich!"},{"q":"Questi documenti sono per il direttore: ___ subito! (bringt sie ihm – voi, portare)","a":["portateglieli"],"de":"Diese Unterlagen sind für den Direktor: Bringt sie ihm sofort!"},{"q":"La lettera? ___ entro domani, per favore. (schicken Sie sie mir – Lei, mandare)","a":["me la mandi","Me la mandi"],"de":"Den Brief? Schicken Sie ihn mir bitte bis morgen."},{"q":"Sono già le sette, ___! (steh auf – tu, alzarsi)","a":["alzati"],"de":"Es ist schon sieben, steh auf!"}]},{"type":"choice","title":"Pronomen, Verneinung und andere Befehlsformen","task":"Wähle die korrekte Variante.","items":[{"q":"tu: Erzähl es ihm nicht!","options":["Non dirglielo!","Non diglielo!","Non glielo dici!"],"a":0,"why":"Verneint tu: non + Infinitiv (dire → dir-) + glielo."},{"q":"tu: Mach dir keine Sorgen!","options":["Non preoccuparti!","Non preoccupati!","Non ti preoccupi!"],"a":0,"why":"non + Infinitiv mit angehängtem ti; Non ti preoccupi ist die Lei-Form."},{"q":"Lei: Tun Sie es nicht!","options":["Non lo faccia!","Non farlo!","Non faccialo!"],"a":0,"why":"Bei Lei steht das Pronomen vor dem Verb."},{"q":"voi: Sagt es niemandem!","options":["Non ditelo a nessuno!","Non dirlo a nessuno!","Non dite lo a nessuno!"],"a":0,"why":"voi verneint: non + Imperativ, Pronomen angehängt."},{"q":"tu: Gib ihm das Buch!","options":["Dagli il libro!","Daggli il libro!","Gli da' il libro!"],"a":0,"why":"Bei gli keine Konsonantenverdopplung."},{"q":"tu: Sag es mir!","options":["Dimmelo!","Dimelo!","Dillomi!"],"a":0,"why":"di' + me + lo mit Verdopplung des m."},{"q":"Hinweis auf einem Medikament: Vor Gebrauch schütteln.","options":["Agitare prima dell'uso.","Agita prima dell'uso.","Agiti prima dell'uso."],"a":0,"why":"In Anleitungen steht der unpersönliche Infinitiv."},{"q":"Freundliche Bitte am Tisch unter Freunden:","options":["Mi passi l'acqua?","Mi passa l'acqua?","Passare l'acqua!"],"a":0,"why":"Frage im Indikativ (tu) als freundliche Aufforderung; passa wäre Lei."},{"q":"tu: Lass es mich sehen!","options":["Fammelo vedere!","Famelo vedere!","Faimelo vedere!"],"a":0,"why":"fa' + me + lo mit Verdopplung: fammelo."}]}],"cards":[{"f":"Imperativ tu: -are / -ere / -ire","b":"parla! / prendi! / senti! (finire: finisci!)"},{"f":"Imperativ noi / voi","b":"= Indikativ Präsens: parliamo! / parlate!"},{"f":"essere – Imperativ tu / voi","b":"sii! / siate!"},{"f":"avere – Imperativ tu / voi","b":"abbi! / abbiate!"},{"f":"sapere – Imperativ tu","b":"sappi!"},{"f":"andare / fare – Imperativ tu","b":"va' (vai) / fa' (fai)"},{"f":"dare / stare – Imperativ tu","b":"da' (dai) / sta' (stai)"},{"f":"dire – Imperativ tu","b":"di'! (nur diese Form)"},{"f":"Verneinung tu","b":"non + Infinitiv: Non correre!"},{"f":"Verneinung noi / voi","b":"non + Imperativ: Non usciamo! Non uscite!"},{"f":"Lei-Imperativ","b":"= congiuntivo presente: parli, prenda, finisca"},{"f":"Lei: andare / fare / venire / dire","b":"vada / faccia / venga / dica"},{"f":"Entschuldige! / Entschuldigen Sie!","b":"Scusa! / Scusi!"},{"f":"Loro-Form","b":"sehr förmlich (Si accomodino!); im Alltag meist voi"},{"f":"Pronomen bei tu/noi/voi","b":"angehängt: Chiamami! Alziamoci! Ditelo!"},{"f":"Pronomen bei Lei","b":"vorangestellt: Mi chiami! Si sieda! Lo prenda!"},{"f":"sag mir / tu mir / gib mir","b":"dimmi / fammi / dammi"},{"f":"geh hin! / gib es!","b":"vacci! / dallo!"},{"f":"sag ihm / sag ihr","b":"digli! (keine Verdopplung) / dille!"},{"f":"loro (ihnen) beim Imperativ","b":"immer nachgestellt, nicht angehängt: Scrivi loro!"},{"f":"Tu es nicht! (tu – zwei Varianten)","b":"Non farlo! / Non lo fare!"},{"f":"Tun Sie es nicht! (Lei)","b":"Non lo faccia!"},{"f":"Mach dir keine Sorgen! / Machen Sie sich keine Sorgen!","b":"Non preoccuparti! (Non ti preoccupare!) / Non si preoccupi!"},{"f":"Betonung mit Pronomen","b":"bleibt: MAN-da-me-lo, pren-DE-te-lo"},{"f":"Nicht rauchen! (Schild)","b":"Non fumare. / Vietato fumare."},{"f":"Aufforderung in Wegbeschreibungen","b":"oft Indikativ: Prende la prima a destra e poi gira a sinistra."}],"id":"k14"},{"nr":15,"title":"Infinite Verbformen","teil":"Das Verb und seine Ergänzungen","intro":"Infinitiv, Partizip und gerundio machen Sätze kürzer und eleganter. Entscheidend sind die richtige Präposition vor dem Infinitiv und die Regel, dass verkürzte Nebensätze dasselbe Subjekt haben müssen.","sections":[{"h":"Der Infinitiv: Präsens und Perfekt","html":"<p>Der Infinitiv Präsens endet auf <em>-are, -ere, -ire<\/em> (auch <em>-rre<\/em>: <em>porre, tradurre<\/em>). Der Infinitiv Perfekt besteht aus <em>avere/essere<\/em> + Partizip; das End-<em>e<\/em> von <em>avere/essere<\/em> fällt oft weg.<\/p><table><tr><th>Präsens<\/th><th>Perfekt<\/th><\/tr><tr><td><em>mangiare<\/em><\/td><td><em>aver(e) mangiato<\/em><\/td><\/tr><tr><td><em>partire<\/em><\/td><td><em>esser(e) partito/-a/-i/-e<\/em><\/td><\/tr><tr><td><em>alzarsi<\/em><\/td><td><em>essersi alzato/-a/-i/-e<\/em><\/td><\/tr><\/table><ul><li>Als Subjekt: <em>Imparare una lingua richiede tempo.<\/em> <small>Eine Sprache zu lernen braucht Zeit.<\/small><\/li><li>Perfekt = Vorzeitigkeit: <em>Credo di aver dimenticato l'ombrello.<\/em> <small>Ich glaube, ich habe den Schirm vergessen.<\/small><\/li><li>Pronomen werden angehängt (End-<em>e<\/em> fällt weg): <em>Voglio vederla.<\/em> <small>Ich will sie sehen.<\/small> – <em>Mi dispiace di averti svegliato.<\/em> <small>Tut mir leid, dass ich dich geweckt habe.<\/small><\/li><\/ul><div class=\"tip\">Beim Infinitiv Perfekt mit <em>essere<\/em> wird angeglichen: <em>Le ragazze sono felici di essere arrivate.<\/em><\/div>"},{"h":"Infinitiv ohne Präposition","html":"<ul><li>Modalverben: <em>dovere, potere, volere, sapere<\/em>: <em>Sai nuotare?<\/em> <small>Kannst du schwimmen?<\/small><\/li><li><em>preferire, desiderare, amare, osare<\/em>; <em>piacere<\/em>: <em>Mi piace cucinare per gli amici.<\/em> <small>Ich koche gern für Freunde.<\/small><\/li><li>Unpersönliche Ausdrücke: <em>bisogna, occorre, è necessario/facile/bello<\/em>: <em>Bisogna prenotare.<\/em> <small>Man muss reservieren.<\/small><\/li><li>Wahrnehmungsverben <em>sentire, vedere, guardare, ascoltare<\/em>: <em>Ho sentito arrivare la macchina.<\/em> <small>Ich habe das Auto kommen hören.<\/small><\/li><li><em>lasciare<\/em> (zulassen): <em>Lascia parlare il nonno!<\/em> <small>Lass den Opa reden!<\/small><\/li><li><em>fare<\/em> (veranlassen): <em>Faccio riparare la macchina.<\/em> <small>Ich lasse das Auto reparieren.<\/small> – <em>Questa storia mi fa ridere.<\/em> <small>Diese Geschichte bringt mich zum Lachen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Deutsches „lassen“ hat zwei Entsprechungen: <em>fare<\/em> = veranlassen (<em>Mi faccio tagliare i capelli<\/em> – Ich lasse mir die Haare schneiden), <em>lasciare<\/em> = erlauben/nicht hindern (<em>Lasciami dormire!<\/em> – Lass mich schlafen!).<\/div>"},{"h":"Infinitiv mit di","html":"<p>Die größte Gruppe – Verben des Sagens, Denkens, Beschließens, Versuchens und viele Ausdrücke mit <em>avere<\/em> und <em>essere<\/em>:<\/p><table><tr><th>Verben<\/th><th>Beispiel<\/th><\/tr><tr><td><em>decidere, finire, smettere<\/em><\/td><td><em>Ho smesso di fumare.<\/em><\/td><\/tr><tr><td><em>sperare, credere, pensare<\/em><\/td><td><em>Spero di vincere.<\/em><\/td><\/tr><tr><td><em>cercare<\/em> (versuchen)<\/td><td><em>Cerco di capire.<\/em><\/td><\/tr><tr><td><em>dimenticare, ricordarsi<\/em><\/td><td><em>Ricordati di chiamare!<\/em><\/td><\/tr><tr><td><em>dire, chiedere, promettere, permettere<\/em><\/td><td><em>Mi ha chiesto di aspettare.<\/em><\/td><\/tr><tr><td><em>avere paura / voglia / bisogno / tempo di<\/em><\/td><td><em>Ho voglia di ballare.<\/em><\/td><\/tr><tr><td><em>essere contento / sicuro / stanco di<\/em><\/td><td><em>Sono stanca di aspettare.<\/em><\/td><\/tr><\/table><div class=\"tip\">Nach Verben der Meinung (<em>credere, pensare, sperare<\/em>) mit gleichem Subjekt steht <em>di<\/em> + Infinitiv statt <em>che<\/em> + <em>congiuntivo<\/em> (siehe Kapitel 12).<\/div>"},{"h":"Infinitiv mit a","html":"<p><em>a<\/em> steht nach Verben des Beginnens, Fortsetzens, Lernens, Gelingens und nach Bewegungsverben (Zweck).<\/p><table><tr><th>Verben<\/th><th>Beispiel<\/th><\/tr><tr><td><em>cominciare, iniziare, continuare<\/em><\/td><td><em>Ha cominciato a nevicare.<\/em><\/td><\/tr><tr><td><em>imparare, insegnare<\/em><\/td><td><em>Mi insegni a sciare?<\/em><\/td><\/tr><tr><td><em>riuscire<\/em><\/td><td><em>Non riesco a dormire.<\/em><\/td><\/tr><tr><td><em>aiutare, invitare, convincere<\/em><\/td><td><em>Mi aiuti a portare la valigia?<\/em><\/td><\/tr><tr><td><em>abituarsi, prepararsi, provare<\/em><\/td><td><em>Prova a spegnere e riaccendere.<\/em><\/td><\/tr><tr><td><em>andare, venire, passare, tornare<\/em><\/td><td><em>Vado a prendere il pane.<\/em><\/td><\/tr><tr><td><em>essere pronto a, il primo / l'ultimo a<\/em><\/td><td><em>È sempre l'ultimo ad arrivare.<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: „versuchen“ heißt <em>cercare di<\/em> oder <em>provare a<\/em> – nicht verwechseln! Vor Vokal wird <em>a<\/em> oft zu <em>ad<\/em>: <em>ad aprire<\/em>.<\/div>"},{"h":"Infinitiv mit da","html":"<p><em>da<\/em> + Infinitiv drückt aus, dass etwas getan werden <b>muss<\/b> oder <b>kann<\/b> (Zweck, Eignung).<\/p><ul><li><em>Hai qualcosa da bere?<\/em> <small>Hast du etwas zu trinken?<\/small><\/li><li><em>Oggi ho molto da fare.<\/em> <small>Heute habe ich viel zu tun.<\/small><\/li><li><em>Non c'è niente da vedere.<\/em> <small>Es gibt nichts zu sehen.<\/small><\/li><li><em>È una casa da ristrutturare.<\/em> <small>Es ist ein renovierungsbedürftiges Haus.<\/small><\/li><li><em>Questo testo è facile da tradurre.<\/em> <small>Dieser Text ist leicht zu übersetzen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>Il testo è facile da tradurre<\/em> (der Text ist Subjekt), aber <em>È facile tradurre il testo<\/em> (der Infinitiv ist Subjekt) – hier ohne Präposition!<\/div>"},{"h":"per, senza, prima di, dopo + Infinitiv; substantivierter Infinitiv","html":"<p>Präpositionen + Infinitiv verkürzen einen Nebensatz – nur bei <b>gleichem Subjekt<\/b>.<\/p><table><tr><th>Präposition<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>per<\/em><\/td><td>um … zu<\/td><td><em>Lavoro per vivere.<\/em><\/td><\/tr><tr><td><em>senza<\/em><\/td><td>ohne … zu<\/td><td><em>È uscito senza pagare.<\/em><\/td><\/tr><tr><td><em>prima di<\/em><\/td><td>bevor<\/td><td><em>Lavati le mani prima di mangiare.<\/em><\/td><\/tr><tr><td><em>dopo<\/em> + Inf. Perfekt<\/td><td>nachdem<\/td><td><em>Dopo aver cenato, …<\/em><\/td><\/tr><tr><td><em>invece di<\/em><\/td><td>statt … zu<\/td><td><em>Invece di lamentarti, aiutami!<\/em><\/td><\/tr><\/table><p><em>Dopo essere tornata dal lavoro, Lisa si è riposata.<\/em> <small>Nachdem Lisa von der Arbeit zurückgekommen war, ruhte sie sich aus.<\/small><\/p><div class=\"warn\">Achtung: Nach <em>dopo<\/em> steht immer der Infinitiv <b>Perfekt<\/b>: <em>dopo aver mangiato<\/em>, nicht <em>*dopo mangiare<\/em>.<\/div><p><b>Substantivierter Infinitiv<\/b> (mit Artikel, männlich): <em>Il camminare fa bene alla schiena.<\/em> <small>Das Gehen tut dem Rücken gut.<\/small><br><em>Mi disturba il continuo bussare alla porta.<\/em> <small>Mich stört das ständige Klopfen an der Tür.<\/small><br>Feste Wendungen: <em>il dovere<\/em> (die Pflicht), <em>il piacere<\/em>, <em>il sapere<\/em>, <em>al calar del sole<\/em> (bei Sonnenuntergang).<\/p>"},{"h":"Partizip Präsens","html":"<p>Endung <em>-ante<\/em> (<em>-are<\/em>-Verben) bzw. <em>-ente<\/em> (<em>-ere/-ire<\/em>), Plural <em>-anti/-enti<\/em>. Es wird heute fast nur noch als <b>Adjektiv<\/b> oder <b>Substantiv<\/b> verwendet.<\/p><table><tr><th>Verb<\/th><th>Adjektiv<\/th><th>Substantiv<\/th><\/tr><tr><td>interessare<\/td><td><em>interessante<\/em><\/td><td>–<\/td><\/tr><tr><td>divertire<\/td><td><em>divertente<\/em><\/td><td>–<\/td><\/tr><tr><td>cantare<\/td><td>–<\/td><td><em>il/la cantante<\/em><\/td><\/tr><tr><td>insegnare<\/td><td>–<\/td><td><em>l'insegnante<\/em><\/td><\/tr><tr><td>abitare<\/td><td>–<\/td><td><em>gli abitanti<\/em><\/td><\/tr><tr><td>correre<\/td><td><em>l'acqua corrente<\/em><\/td><td><em>la corrente<\/em> (Strömung, Strom)<\/td><\/tr><\/table><p>Weitere: <em>lo studente, il presidente, l'assistente, il cliente, sorprendente, emozionante, pesante, seguente<\/em>.<\/p><div class=\"warn\">Achtung: Das deutsche Partizip Präsens („das schlafende Kind“) übersetzt man meist mit Relativsatz: <em>il bambino che dorme<\/em>. Ein <em>gerundio<\/em> ist hier falsch!<\/div>"},{"h":"Partizip Perfekt","html":"<p>Regelmäßig: <em>-ato, -uto, -ito<\/em> (<em>parlato, venduto, finito<\/em>). Häufige unregelmäßige Formen:<\/p><table><tr><th><\/th><th><\/th><th><\/th><\/tr><tr><td><em>fatto<\/em> (fare)<\/td><td><em>detto<\/em> (dire)<\/td><td><em>scritto<\/em> (scrivere)<\/td><\/tr><tr><td><em>letto<\/em> (leggere)<\/td><td><em>preso<\/em> (prendere)<\/td><td><em>messo<\/em> (mettere)<\/td><\/tr><tr><td><em>visto<\/em> (vedere)<\/td><td><em>aperto<\/em> (aprire)<\/td><td><em>chiuso<\/em> (chiudere)<\/td><\/tr><tr><td><em>rimasto<\/em> (rimanere)<\/td><td><em>venuto<\/em> (venire)<\/td><td><em>scelto<\/em> (scegliere)<\/td><\/tr><tr><td><em>bevuto<\/em> (bere)<\/td><td><em>rotto<\/em> (rompere)<\/td><td><em>chiesto<\/em> (chiedere)<\/td><\/tr><tr><td><em>risposto<\/em> (rispondere)<\/td><td><em>tradotto<\/em> (tradurre)<\/td><td><em>offerto<\/em> (offrire)<\/td><\/tr><\/table><p><b>Adjektivisch<\/b> (angeglichen): <em>la porta chiusa, i vetri rotti<\/em> <small>die geschlossene Tür, die zerbrochenen Scheiben<\/small><\/p><p><b>Satzverkürzend<\/b> (vorzeitig, meist am Satzanfang): <em>Finito il lavoro, siamo usciti.<\/em> <small>Nachdem die Arbeit fertig war, sind wir ausgegangen.<\/small><br><em>Arrivata a casa, Gina ha acceso il forno.<\/em> <small>Zu Hause angekommen, schaltete Gina den Ofen ein.<\/small><\/p><ul><li>Transitive Verben: Angleichung an das <b>Objekt<\/b>: <em>Lette le istruzioni, ho montato lo scaffale.<\/em><\/li><li>Verben mit <em>essere<\/em>: Angleichung an das <b>Subjekt<\/b>: <em>Partiti gli ospiti, abbiamo riordinato.<\/em><\/li><\/ul><div class=\"tip\">Pronomen werden angehängt (gehoben): <em>Salutatolo, se ne andò.<\/em> – Nachdem sie ihn gegrüßt hatte, ging sie.<\/div>"},{"h":"gerundio presente: Formen und Verlaufsform","html":"<p>Endung <em>-ando<\/em> (<em>-are<\/em>) bzw. <em>-endo<\/em> (<em>-ere, -ire<\/em>). Das <em>gerundio<\/em> ist unveränderlich.<\/p><table><tr><th>Infinitiv<\/th><th>gerundio<\/th><th>Infinitiv<\/th><th>gerundio<\/th><\/tr><tr><td>parlare<\/td><td><em>parlando<\/em><\/td><td>fare<\/td><td><em>facendo<\/em><\/td><\/tr><tr><td>leggere<\/td><td><em>leggendo<\/em><\/td><td>dire<\/td><td><em>dicendo<\/em><\/td><\/tr><tr><td>partire<\/td><td><em>partendo<\/em><\/td><td>bere<\/td><td><em>bevendo<\/em><\/td><\/tr><tr><td>finire<\/td><td><em>finendo<\/em><\/td><td>porre<\/td><td><em>ponendo<\/em><\/td><\/tr><tr><td><\/td><td><\/td><td>tradurre<\/td><td><em>traducendo<\/em><\/td><\/tr><\/table><ul><li><em>stare<\/em> + <em>gerundio<\/em> = Handlung ist gerade im Gang: <em>Sto preparando la cena.<\/em> <small>Ich mache gerade das Abendessen.<\/small> – <em>Stavamo uscendo quando hai chiamato.<\/em> <small>Wir wollten gerade gehen, als du angerufen hast.<\/small><\/li><li><em>andare<\/em> + <em>gerundio<\/em> = allmähliche Entwicklung: <em>Il traffico va aumentando.<\/em> <small>Der Verkehr nimmt nach und nach zu.<\/small><\/li><li><em>venire<\/em> + <em>gerundio<\/em> = Wiederholung/Fortschreiten (gehoben): <em>Mi viene ripetendo sempre la stessa cosa.<\/em> <small>Er wiederholt mir immer wieder dasselbe.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>stare<\/em> + <em>gerundio<\/em> nur für Handlungen, die <b>in diesem Moment<\/b> ablaufen, nicht für Zustände: <em>So la risposta<\/em>, nicht <em>*Sto sapendo la risposta<\/em>.<\/div>"},{"h":"gerundio als Satzverkürzung; gerundio passato","html":"<p>Das <em>gerundio<\/em> ersetzt einen Nebensatz – <b>nur bei gleichem Subjekt<\/b> wie im Hauptsatz.<\/p><table><tr><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td>modal (wie?)<\/td><td><em>È entrata sorridendo.<\/em> <small>Sie kam lächelnd herein.<\/small><\/td><\/tr><tr><td>temporal (als, während)<\/td><td><em>Tornando a casa, ho incontrato Rino.<\/em><\/td><\/tr><tr><td>kausal (da, weil)<\/td><td><em>Avendo fame, ho preso un panino.<\/em><\/td><\/tr><tr><td>konditional (wenn)<\/td><td><em>Volendo, potremmo partire stasera.<\/em><\/td><\/tr><tr><td>konzessiv (obwohl)<\/td><td><em>Pur conoscendo la strada, si è perso.<\/em><\/td><\/tr><\/table><p><b>gerundio passato<\/b>: <em>avendo / essendo<\/em> + Partizip = Vorzeitigkeit; bei <em>essendo<\/em> angeglichen: <em>Avendo finito presto, siamo andati al cinema.<\/em> <small>Da wir früh fertig waren, gingen wir ins Kino.<\/small><br><em>Essendo arrivate tardi, le ragazze non hanno trovato posto.<\/em> <small>Da die Mädchen spät angekommen waren, fanden sie keinen Platz.<\/small><\/p><p><b>Pronomen<\/b> werden angehängt: <em>Vedendolo, ho capito tutto.<\/em> <small>Als ich ihn sah, verstand ich alles.<\/small> – <em>avendoglielo detto<\/em> <small>da ich es ihm gesagt hatte<\/small>; bei <em>stare<\/em>: <em>Lo sto facendo<\/em> oder <em>Sto facendolo<\/em>.<\/p><div class=\"warn\">Achtung: <em>Ho visto Marco uscendo dal bar.<\/em> bedeutet „… als <b>ich<\/b> aus der Bar kam“. Für Marco: <em>Ho visto Marco che usciva dal bar<\/em> oder <em>… mentre usciva dal bar.<\/em><\/div>"}],"exercises":[{"type":"choice","title":"Welche Präposition vor dem Infinitiv?","task":"Wähle: ohne Präposition (–), di, a oder da.","items":[{"q":"Ho deciso ___ cambiare lavoro.","options":["–","di","a","da"],"a":1,"why":"decidere di + Infinitiv."},{"q":"Domani comincio ___ lavorare in un nuovo ufficio.","options":["–","di","a","da"],"a":2,"why":"cominciare a + Infinitiv."},{"q":"Con questo caldo non riesco ___ dormire.","options":["–","di","a","da"],"a":2,"why":"riuscire a + Infinitiv."},{"q":"Vuoi ___ venire con noi?","options":["–","di","a","da"],"a":0,"why":"Modalverb volere + Infinitiv ohne Präposition."},{"q":"Hai qualcosa ___ leggere per il viaggio?","options":["–","di","a","da"],"a":3,"why":"qualcosa da + Infinitiv (Zweck)."},{"q":"Ho dimenticato ___ chiudere la porta.","options":["–","di","a","da"],"a":1,"why":"dimenticare di + Infinitiv."},{"q":"Vado ___ prendere i bambini a scuola.","options":["–","di","a","da"],"a":2,"why":"Bewegungsverb + a + Infinitiv (Zweck)."},{"q":"Bisogna ___ prenotare con anticipo.","options":["–","di","a","da"],"a":0,"why":"bisogna + Infinitiv ohne Präposition."},{"q":"Spero ___ rivederti presto.","options":["–","di","a","da"],"a":1,"why":"sperare di + Infinitiv."},{"q":"Questo esercizio è difficile ___ risolvere.","options":["–","di","a","da"],"a":3,"why":"Subjekt + è difficile da + Infinitiv."}]},{"type":"gap","title":"Infinitiv Präsens oder Perfekt","task":"Setze den Infinitiv Präsens oder Perfekt ein.","items":[{"q":"Dopo (mangiare) ___, abbiamo fatto una passeggiata.","a":["aver mangiato","avere mangiato"],"de":"Nach dem Essen haben wir einen Spaziergang gemacht."},{"q":"Dopo (arrivare) ___ a Milano, Giulia ha preso un taxi.","a":["essere arrivata","esser arrivata"],"de":"Nachdem Giulia in Mailand angekommen war, nahm sie ein Taxi."},{"q":"Credo di (sbagliare) ___ strada: torniamo indietro.","a":["aver sbagliato","avere sbagliato"],"de":"Ich glaube, ich habe mich verfahren: Fahren wir zurück."},{"q":"Sono contento di (conoscere) ___ i tuoi genitori ieri sera.","a":["aver conosciuto","avere conosciuto"],"de":"Ich freue mich, deine Eltern gestern Abend kennengelernt zu haben."},{"q":"Dopo (alzarsi) ___, Marco si è fatto la doccia.","a":["essersi alzato"],"de":"Nachdem Marco aufgestanden war, hat er geduscht."},{"q":"Siamo stanchi per (camminare) ___ tutto il giorno.","a":["aver camminato","avere camminato"],"de":"Wir sind müde, weil wir den ganzen Tag gelaufen sind."},{"q":"Domani ricordati di (comprare) ___ il latte!","a":["comprare"],"de":"Denk morgen daran, Milch zu kaufen!"},{"q":"Lucia è uscita senza (salutare) ___ nessuno.","a":["salutare"],"de":"Lucia ist gegangen, ohne jemanden zu grüßen."},{"q":"Prima di (partire) ___, controlla di avere il passaporto.","a":["partire"],"de":"Bevor du losfährst, prüfe, ob du den Pass hast."}]},{"type":"choice","title":"fare, lasciare und Wahrnehmungsverben","task":"Wähle die passende Form.","items":[{"q":"Devo ___ riparare la lavatrice. (reparieren lassen)","options":["fare","lasciare"],"a":0,"why":"Veranlassen = fare + Infinitiv."},{"q":"I genitori non ___ uscire la figlia la sera. (erlauben nicht)","options":["fanno","lasciano"],"a":1,"why":"Erlauben = lasciare + Infinitiv."},{"q":"Questo film mi ___ sempre piangere.","options":["fa","lascia"],"a":0,"why":"Bewirken/verursachen = fare + Infinitiv."},{"q":"___ stare, faccio io! (Lass nur!)","options":["Fa'","Lascia"],"a":1,"why":"Lascia stare = lass gut sein."},{"q":"Mi sono fatta ___ i capelli dal parrucchiere.","options":["tagliare","tagliato","tagliata"],"a":0,"why":"farsi + Infinitiv: sich etwas machen lassen."},{"q":"Ho sentito ___ il telefono.","options":["squillare","squillato","a squillare"],"a":0,"why":"Wahrnehmungsverb + Infinitiv ohne Präposition."},{"q":"Ti ho visto ___ dal supermercato.","options":["uscire","a uscire","di uscire"],"a":0,"why":"vedere + Infinitiv ohne Präposition."},{"q":"Mia madre mi ha fatto ___ la stanza.","options":["pulire","pulita","a pulire"],"a":0,"why":"fare + Infinitiv = jemanden etwas tun lassen."}]},{"type":"gap","title":"gerundio presente","task":"Setze das gerundio presente ein.","items":[{"q":"Sto (leggere) ___ un giallo molto avvincente.","a":["leggendo"],"de":"Ich lese gerade einen sehr spannenden Krimi."},{"q":"Che cosa stai (fare) ___?","a":["facendo"],"de":"Was machst du gerade?"},{"q":"Ho imparato l'italiano (ascoltare) ___ la radio.","a":["ascoltando"],"de":"Ich habe Italienisch gelernt, indem ich Radio gehört habe."},{"q":"È uscito dalla stanza (dire) ___ che non sarebbe tornato.","a":["dicendo"],"de":"Er verließ den Raum mit den Worten, er werde nicht zurückkommen."},{"q":"Mi sono addormentata (guardare) ___ la TV.","a":["guardando"],"de":"Ich bin beim Fernsehen eingeschlafen."},{"q":"La situazione economica va (migliorare) ___ .","a":["migliorando"],"de":"Die wirtschaftliche Lage verbessert sich allmählich."},{"q":"Pur (bere) ___ molto caffè, dorme benissimo.","a":["bevendo"],"de":"Obwohl er viel Kaffee trinkt, schläft er sehr gut."},{"q":"Ho trovato molti errori (tradurre) ___ il testo.","a":["traducendo"],"de":"Beim Übersetzen des Textes habe ich viele Fehler gefunden."},{"q":"Non sono uscito, (essere) ___ molto stanco.","a":["essendo"],"de":"Ich bin nicht ausgegangen, da ich sehr müde war."}]},{"type":"gap","title":"gerundio passato und Partizip Perfekt","task":"Setze die angegebene Form ein (Angleichung beachten!).","items":[{"q":"(finire – gerundio passato) ___ i compiti, i ragazzi sono andati a giocare.","a":["avendo finito","Avendo finito"],"de":"Nachdem sie die Hausaufgaben beendet hatten, gingen die Jungs spielen."},{"q":"(arrivare – gerundio passato) ___ in ritardo, Paola ha perso l'inizio del film.","a":["essendo arrivata","Essendo arrivata"],"de":"Da Paola zu spät gekommen war, verpasste sie den Anfang des Films."},{"q":"(leggere – participio passato) ___ la lettera, la nonna si è commossa.","a":["letta","Letta"],"de":"Nachdem die Oma den Brief gelesen hatte, war sie gerührt."},{"q":"(finire – participio passato) ___ la cena, siamo usciti in giardino.","a":["finita","Finita"],"de":"Nach dem Abendessen gingen wir in den Garten."},{"q":"(arrivare – participio passato) ___ alla stazione, i ragazzi hanno cercato un bar.","a":["arrivati","Arrivati"],"de":"Am Bahnhof angekommen, suchten die Jungs eine Bar."},{"q":"(vedere – gerundio passato) ___ il prezzo, ho deciso di non comprare la giacca.","a":["avendo visto","Avendo visto"],"de":"Nachdem ich den Preis gesehen hatte, beschloss ich, die Jacke nicht zu kaufen."},{"q":"(partire – gerundio passato) ___ presto, le mie amiche hanno evitato il traffico.","a":["essendo partite","Essendo partite"],"de":"Da meine Freundinnen früh losgefahren waren, vermieden sie den Verkehr."},{"q":"Non (capire – gerundio passato) ___ la domanda, ho chiesto di ripeterla.","a":["avendo capito"],"de":"Da ich die Frage nicht verstanden hatte, bat ich darum, sie zu wiederholen."},{"q":"(fare – participio passato) ___ la spesa, siamo tornati a casa.","a":["fatta","Fatta"],"de":"Nach dem Einkaufen sind wir nach Hause zurückgekehrt."}]},{"type":"choice","title":"Partizip, gerundio und Subjektbezug","task":"Wähle die richtige Variante.","items":[{"q":"Questo documentario è molto ___.","options":["interessante","interessando","interessato"],"a":0,"why":"Adjektiv aus dem Partizip Präsens: interessante."},{"q":"Mia sorella fa l'___ in una scuola elementare.","options":["insegnante","insegnando","insegnata"],"a":0,"why":"Substantiviertes Partizip Präsens: l'insegnante."},{"q":"Das schlafende Kind","options":["il bambino che dorme","il bambino dormendo"],"a":0,"why":"Deutsches Partizip Präsens als Attribut → Relativsatz, kein gerundio."},{"q":"Ich habe ihn gesehen, als er hinausging.","options":["L'ho visto mentre usciva.","L'ho visto uscendo."],"a":0,"why":"Das gerundio bezöge sich auf das Subjekt (ich); für ihn braucht man mentre."},{"q":"Ich habe ihn gesehen, als ich hinausging.","options":["L'ho visto uscendo.","L'ho visto mentre usciva."],"a":0,"why":"Gleiches Subjekt (io) → gerundio möglich."},{"q":"___, ho capito che era triste. (Als ich ihn sah)","options":["Vedendolo","Lo vedendo","Vedendo lo"],"a":0,"why":"Pronomen werden an das gerundio angehängt."},{"q":"Il ___ fa male alla salute.","options":["fumare","fumando","fumante"],"a":0,"why":"Substantivierter Infinitiv mit Artikel."},{"q":"Le ragazze, ___ a casa, hanno acceso la TV.","options":["arrivate","arrivati","arrivato"],"a":0,"why":"Partizip von essere-Verb: Angleichung an das Subjekt (le ragazze)."}]}],"cards":[{"f":"Infinitiv Perfekt (mangiare / partire)","b":"aver mangiato / essere partito"},{"f":"Ich glaube, ich habe mich geirrt.","b":"Credo di essermi sbagliato."},{"f":"Infinitiv ohne Präposition nach …","b":"Modalverben, piacere, bisogna, sentire/vedere, fare, lasciare"},{"f":"Ich lasse das Auto reparieren.","b":"Faccio riparare la macchina."},{"f":"lassen = veranlassen / erlauben","b":"fare / lasciare"},{"f":"Ich höre jemanden singen.","b":"Sento cantare qualcuno."},{"f":"decidere, finire, smettere, sperare + …","b":"di + Infinitiv"},{"f":"cercare (versuchen) / provare (versuchen)","b":"cercare di / provare a"},{"f":"cominciare, imparare, riuscire, aiutare + …","b":"a + Infinitiv"},{"f":"Ich gehe Brot holen.","b":"Vado a prendere il pane. (Bewegung + a)"},{"f":"etwas zu trinken / nichts zu tun","b":"qualcosa da bere / niente da fare"},{"f":"leicht zu verstehen","b":"facile da capire (aber: È facile capire …)"},{"f":"nachdem ich gegessen hatte","b":"dopo aver mangiato (immer Infinitiv Perfekt)"},{"f":"um zu / ohne zu / bevor / statt zu","b":"per / senza / prima di / invece di + Infinitiv"},{"f":"Das Rauchen schadet.","b":"Il fumare fa male. (substantivierter Infinitiv; üblicher: Il fumo fa male.)"},{"f":"Partizip Präsens – Endungen","b":"-ante / -ente (Pl. -anti / -enti): cantante, divertente"},{"f":"das schlafende Kind","b":"il bambino che dorme (Relativsatz!)"},{"f":"Nach getaner Arbeit gingen wir aus.","b":"Finito il lavoro, siamo usciti."},{"f":"Angleichung beim satzverkürzenden Partizip","b":"transitiv → an das Objekt; essere-Verben → an das Subjekt"},{"f":"gerundio – Endungen","b":"-ando (-are) / -endo (-ere, -ire)"},{"f":"fare / dire / bere / porre / tradurre – gerundio","b":"facendo / dicendo / bevendo / ponendo / traducendo"},{"f":"Ich esse gerade.","b":"Sto mangiando."},{"f":"Die Preise steigen allmählich.","b":"I prezzi vanno aumentando."},{"f":"obwohl er es weiß (gerundio)","b":"pur sapendolo"},{"f":"gerundio passato","b":"avendo finito / essendo arrivato/-a/-i/-e"},{"f":"gerundio – Subjektregel","b":"nur bei gleichem Subjekt wie im Hauptsatz!"},{"f":"Als ich ihn sah, … (gerundio + Pronomen)","b":"Vedendolo, …"}],"id":"k15"},{"nr":16,"title":"Gebrauch der Zeiten und Modi","teil":"Das Verb und seine Ergänzungen","intro":"Dieses Kapitel zeigt, wie man im Nebensatz Modus (Indikativ oder congiuntivo) und Zeit richtig wählt – von der Zeitenfolge über die indirekte Rede bis zu den Bedingungssätzen. Wer diese Regeln beherrscht, formuliert auch komplexe Sätze sicher.","sections":[{"h":"Modus im Nebensatz: Indikativ oder congiuntivo?","html":"<p>Im Nebensatz entscheidet vor allem das <b>Verb oder der Ausdruck im Hauptsatz<\/b> (manchmal auch die Konjunktion) über den Modus. Grundidee: Der <b>Indikativ<\/b> stellt etwas als Tatsache dar, der <b>congiuntivo<\/b> als Meinung, Wunsch, Gefühl, Möglichkeit oder Unsicherheit.<\/p><table><tr><th>Indikativ nach …<\/th><th>congiuntivo nach …<\/th><\/tr><tr><td>Wissen, Gewissheit: <em>sapere, essere sicuro, è chiaro, è evidente<\/em><\/td><td>Meinung: <em>pensare, credere, ritenere, avere l'impressione<\/em><\/td><\/tr><tr><td>Wahrnehmung: <em>vedere, sentire, accorgersi<\/em><\/td><td>Wille, Wunsch: <em>volere, desiderare, preferire, sperare<\/em><\/td><\/tr><tr><td>Mitteilung: <em>dire, raccontare, affermare<\/em><\/td><td>Gefühl: <em>essere contento, temere, mi dispiace, avere paura<\/em><\/td><\/tr><tr><td>Konjunktionen: <em>perché<\/em> (weil), <em>quando, mentre, dato che, poiché<\/em><\/td><td>Konjunktionen: <em>benché, sebbene, affinché, prima che, senza che, a condizione che, purché<\/em><\/td><\/tr><tr><td><\/td><td>unpersönliche Ausdrücke: <em>è necessario, è possibile, bisogna, è strano<\/em><\/td><\/tr><\/table><ul><li><em>So che Marta lavora in banca.<\/em> <small>Ich weiß, dass Marta in einer Bank arbeitet.<\/small><\/li><li><em>Penso che Marta lavori in banca.<\/em> <small>Ich glaube, dass Marta in einer Bank arbeitet.<\/small><\/li><li><em>Benché piova, andiamo a fare una passeggiata.<\/em> <small>Obwohl es regnet, gehen wir spazieren.<\/small><\/li><\/ul><p>Auch in <b>Relativsätzen<\/b> steht der congiuntivo, wenn etwas Gesuchtes, Unbestimmtes gemeint ist oder ein Superlativ vorausgeht:<\/p><ul><li><em>Cerco un appartamento che abbia un balcone.<\/em> <small>Ich suche eine Wohnung, die einen Balkon hat (falls es eine gibt).<\/small><\/li><li><em>Ho trovato un appartamento che ha un balcone.<\/em> <small>Ich habe eine Wohnung gefunden, die einen Balkon hat (Tatsache).<\/small><\/li><li><em>È la torta più buona che io abbia mai mangiato.<\/em> <small>Das ist der beste Kuchen, den ich je gegessen habe.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>dire<\/em> mit Indikativ = mitteilen (<em>Dice che è stanco<\/em>), <em>dire<\/em> mit congiuntivo = auffordern (<em>Dice che tu venga subito<\/em> – er sagt, du sollst sofort kommen). Verneinte Aussageverben ziehen oft den congiuntivo nach sich: <em>Non dico che tu abbia torto.<\/em><\/div>"},{"h":"Zeitverhältnis: vorher, gleichzeitig, nachher","html":"<p>Neben dem Modus muss man die <b>Zeit<\/b> im Nebensatz wählen. Sie hängt von zwei Fragen ab:<\/p><ol><li>Steht der Hauptsatz in der <b>Gegenwart<\/b> (auch Futur, Imperativ) oder in der <b>Vergangenheit<\/b> (auch Konditional)?<\/li><li>Findet die Handlung im Nebensatz <b>vorher<\/b> (Vorzeitigkeit), <b>gleichzeitig<\/b> (Gleichzeitigkeit) oder <b>danach<\/b> (Nachzeitigkeit) statt?<\/li><\/ol><table><tr><th>Zeitverhältnis<\/th><th>Beispiel (HS Gegenwart)<\/th><\/tr><tr><td>vorzeitig<\/td><td><em>Credo che Pietro sia uscito.<\/em> <small>… dass Pietro hinausgegangen ist.<\/small><\/td><\/tr><tr><td>gleichzeitig<\/td><td><em>Credo che Pietro sia in giardino.<\/em> <small>… dass Pietro im Garten ist.<\/small><\/td><\/tr><tr><td>nachzeitig<\/td><td><em>Credo che Pietro uscirà più tardi.<\/em> <small>… dass Pietro später hinausgeht.<\/small><\/td><\/tr><\/table><div class=\"tip\">Merke: Erst den Bezugspunkt bestimmen (Hauptsatz: jetzt oder damals?), dann das Zeitverhältnis – daraus ergibt sich die Zeitform fast automatisch.<\/div>"},{"h":"Zusammenfassungstabelle","html":"<p>Die wichtigsten Kombinationen auf einen Blick:<\/p><table><tr><th>HS<\/th><th>Verhältnis<\/th><th>Indikativ<\/th><th>congiuntivo<\/th><\/tr><tr><td>Gegenwart<\/td><td>vorher<\/td><td>pass. prossimo / imperfetto<\/td><td>cong. passato / imperfetto<\/td><\/tr><tr><td>Gegenwart<\/td><td>gleich<\/td><td>presente<\/td><td>cong. presente<\/td><\/tr><tr><td>Gegenwart<\/td><td>nachher<\/td><td>futuro (presente)<\/td><td>cong. presente / futuro<\/td><\/tr><tr><td>Verg./Kond.<\/td><td>vorher<\/td><td>trapassato prossimo<\/td><td>cong. trapassato<\/td><\/tr><tr><td>Verg./Kond.<\/td><td>gleich<\/td><td>imperfetto<\/td><td>cong. imperfetto<\/td><\/tr><tr><td>Verg./Kond.<\/td><td>nachher<\/td><td>condizionale passato<\/td><td>cond. passato / cong. imperfetto<\/td><\/tr><\/table><div class=\"tip\">Für die Nachzeitigkeit in der Vergangenheit steht nach Verben des Sagens, Wissens und Meinens das <b>condizionale passato<\/b> (<em>Credevo che sarebbe venuto<\/em>). Nach Verben des Wollens, nach Konditional-Hauptsätzen und nach Konjunktionen wie <em>prima che<\/em> steht dagegen der <em>congiuntivo imperfetto<\/em>: <em>Volevo che venisse il giorno dopo.<\/em><\/div>"},{"h":"Zeitenfolge beim Indikativ","html":"<p>Steht der Hauptsatz in der Gegenwart, verwendet man im Nebensatz einfach die Zeit, die man auch im selbstständigen Satz verwenden würde:<\/p><ul><li><em>Dico che Paolo ha telefonato.<\/em> <small>Ich sage, dass Paolo angerufen hat.<\/small><\/li><li><em>Dico che Paolo è a casa.<\/em> <small>Ich sage, dass Paolo zu Hause ist.<\/small><\/li><li><em>Dico che Paolo verrà.<\/em> <small>Ich sage, dass Paolo kommen wird.<\/small><\/li><\/ul><p>Steht der Hauptsatz in einer Zeit der Vergangenheit, „rutschen“ die Zeiten eine Stufe zurück:<\/p><ul><li><em>Ho detto che Paolo aveva telefonato.<\/em> <small>… dass Paolo angerufen hatte. (vorher)<\/small><\/li><li><em>Ho detto che Paolo era a casa.<\/em> <small>… dass Paolo zu Hause war. (gleichzeitig)<\/small><\/li><li><em>Ho detto che Paolo sarebbe venuto.<\/em> <small>… dass Paolo kommen würde. (nachher)<\/small><\/li><\/ul><div class=\"warn\">Achtung: Das deutsche „würde kommen“ heißt in diesem Fall <b>nicht<\/b> <em>verrebbe<\/em>, sondern <em>sarebbe venuto<\/em> (condizionale passato = Zukunft in der Vergangenheit).<\/div>"},{"h":"Zeitangaben verschieben","html":"<p>Wird etwas aus der Rückschau erzählt (z. B. in der indirekten Rede mit Einleitung in der Vergangenheit), müssen Orts- und Zeitangaben angepasst werden, weil sich der Bezugspunkt geändert hat:<\/p><table><tr><th>direkt<\/th><th>aus der Rückschau<\/th><\/tr><tr><td><em>oggi<\/em><\/td><td><em>quel giorno<\/em><\/td><\/tr><tr><td><em>ieri<\/em><\/td><td><em>il giorno prima / precedente<\/em><\/td><\/tr><tr><td><em>l'altro ieri<\/em><\/td><td><em>due giorni prima<\/em><\/td><\/tr><tr><td><em>domani<\/em><\/td><td><em>il giorno dopo / seguente, l'indomani<\/em><\/td><\/tr><tr><td><em>dopodomani<\/em><\/td><td><em>due giorni dopo<\/em><\/td><\/tr><tr><td><em>stamattina / stasera<\/em><\/td><td><em>quella mattina / quella sera<\/em><\/td><\/tr><tr><td><em>adesso, ora<\/em><\/td><td><em>allora, in quel momento<\/em><\/td><\/tr><tr><td><em>la settimana scorsa<\/em><\/td><td><em>la settimana prima<\/em><\/td><\/tr><tr><td><em>la settimana prossima<\/em><\/td><td><em>la settimana dopo<\/em><\/td><\/tr><tr><td><em>tre giorni fa<\/em><\/td><td><em>tre giorni prima<\/em><\/td><\/tr><tr><td><em>tra un mese<\/em><\/td><td><em>un mese dopo<\/em><\/td><\/tr><tr><td><em>qui / qua<\/em><\/td><td><em>lì / là<\/em><\/td><\/tr><tr><td><em>questo<\/em><\/td><td><em>quello<\/em><\/td><\/tr><\/table><em>„Torno domani.“ → Disse che sarebbe tornato il giorno dopo.<\/em> <small>„Ich komme morgen zurück.“ → Er sagte, er würde am nächsten Tag zurückkommen.<\/small><div class=\"tip\">Ist der Bezugspunkt noch derselbe (z. B. jemand erzählt heute, was er heute früh gehört hat), bleiben die Zeitangaben unverändert.<\/div>"},{"h":"Indirekte Rede: Zeiten und Pronomen","html":"<p>Steht das einleitende Verb (<em>dire, raccontare, chiedere<\/em> …) in der <b>Gegenwart<\/b>, bleiben die Zeiten gleich; nur Personen und Pronomen werden angepasst. Steht es in der <b>Vergangenheit<\/b>, verschieben sich die Zeiten:<\/p><table><tr><th>direkte Rede<\/th><th>indirekte Rede<\/th><\/tr><tr><td>presente<\/td><td>imperfetto<\/td><\/tr><tr><td>passato prossimo / remoto<\/td><td>trapassato prossimo<\/td><\/tr><tr><td>imperfetto, trapassato<\/td><td>bleiben<\/td><\/tr><tr><td>futuro<\/td><td>condizionale passato<\/td><\/tr><tr><td>condizionale presente<\/td><td>condizionale passato<\/td><\/tr><tr><td>congiuntivo presente<\/td><td>congiuntivo imperfetto<\/td><\/tr><tr><td>congiuntivo passato<\/td><td>congiuntivo trapassato<\/td><\/tr><\/table><p>Pronomen, Possessiva und Verbformen wechseln meist von der 1./2. zur 3. Person:<\/p><ul><li><em>Chiara: „Sono stanca e voglio tornare a casa mia.“<\/em> <small>Chiara: „Ich bin müde und will nach Hause.“<\/small><\/li><li><em>Chiara ha detto che era stanca e che voleva tornare a casa sua.<\/em> <small>Chiara sagte, sie sei müde und wolle nach Hause.<\/small><\/li><li><em>Chiara dice che è stanca.<\/em> <small>Chiara sagt, sie sei müde. (Gegenwart: keine Verschiebung)<\/small><\/li><\/ul><div class=\"warn\">Achtung: Das Deutsche benutzt in der indirekten Rede den Konjunktiv I („sie sei“). Im Italienischen gibt es dafür keine eigene Form – man nimmt einfach den Indikativ mit Zeitverschiebung.<\/div>"},{"h":"Indirekte Rede: Fragen, Aufforderungen, Zukunft","html":"<p><b>Fragen<\/b> werden mit <em>se<\/em> (ob) oder dem Fragewort eingeleitet. Im gehobenen Stil ist auch der congiuntivo möglich.<\/p><ul><li><em>„Hai fame?“ → Mi ha chiesto se avevo fame.<\/em> <small>„Hast du Hunger?“ → Sie fragte mich, ob ich Hunger hätte.<\/small><\/li><li><em>„Dove abiti?“ → Mi ha chiesto dove abitavo (abitassi).<\/em> <small>Er fragte mich, wo ich wohne.<\/small><\/li><\/ul><p>Der <b>Imperativ<\/b> wird zu <em>di<\/em> + Infinitiv oder zu <em>che<\/em> + congiuntivo:<\/p><ul><li><em>„Chiudi la finestra!“ → Mi ha detto di chiudere la finestra.<\/em> <small>Sie sagte mir, ich solle das Fenster schließen.<\/small><\/li><li><em>→ Mi ha detto che chiudessi la finestra.<\/em> <small>(gleiche Bedeutung, gehobener)<\/small><\/li><\/ul><p>Die <b>Zukunft in der Vergangenheit<\/b> wird mit dem condizionale passato ausgedrückt:<\/p><em>Marco: „Ti scriverò.“ → Marco mi ha detto che mi avrebbe scritto.<\/em> <small>Marco sagte, er würde mir schreiben.<\/small><div class=\"tip\">Faustregel: In der indirekten Rede der Vergangenheit wird das Futur zum condizionale passato. Liegt das Ereignis aus heutiger Sicht noch in der Zukunft, hört man umgangssprachlich auch das Futur: <em>Ha detto che verrà domani.<\/em><\/div>"},{"h":"Zeitenfolge beim congiuntivo: Hauptsatz in der Gegenwart","html":"<p>Steht der Hauptsatz im Präsens, Futur oder Imperativ:<\/p><table><tr><th>Verhältnis<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>vorher<\/td><td>cong. passato<\/td><td><em>Spero che tu abbia dormito bene.<\/em> <small>… dass du gut geschlafen hast.<\/small><\/td><\/tr><tr><td>vorher (Dauer)<\/td><td>cong. imperfetto<\/td><td><em>Pare che da giovane fosse timido.<\/em> <small>… dass er als junger Mann schüchtern war.<\/small><\/td><\/tr><tr><td>gleich<\/td><td>cong. presente<\/td><td><em>Spero che tu stia bene.<\/em> <small>… dass es dir gut geht.<\/small><\/td><\/tr><tr><td>nachher<\/td><td>cong. presente / futuro<\/td><td><em>Spero che tu venga / verrai domani.<\/em> <small>… dass du morgen kommst.<\/small><\/td><\/tr><\/table><div class=\"tip\">Der congiuntivo imperfetto nach einem Hauptsatz in der Gegenwart beschreibt einen andauernden Zustand oder eine Gewohnheit in der Vergangenheit – wie das imperfetto im Indikativ.<\/div>"},{"h":"Zeitenfolge beim congiuntivo: Hauptsatz in Vergangenheit oder Konditional","html":"<p>Steht der Hauptsatz in einer Vergangenheitszeit oder im Konditional:<\/p><table><tr><th>Verhältnis<\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>vorher<\/td><td>cong. trapassato<\/td><td><em>Pensavo che fosse già partito.<\/em> <small>… dass er schon abgefahren war.<\/small><\/td><\/tr><tr><td>gleich<\/td><td>cong. imperfetto<\/td><td><em>Pensavo che fosse a casa.<\/em> <small>… dass er zu Hause war.<\/small><\/td><\/tr><tr><td>nachher<\/td><td>condizionale passato (nach Wunschverben: cong. imperfetto)<\/td><td><em>Pensavo che sarebbe partito il giorno dopo.<\/em> <small>… dass er am Tag darauf abfahren würde.<\/small><\/td><\/tr><\/table><p>Besonders häufig: <b>Wunsch im Konditional<\/b>.<\/p><ul><li><em>Vorrei che tu restassi ancora un po'.<\/em> <small>Ich möchte, dass du noch ein bisschen bleibst.<\/small><\/li><li><em>Preferirei che non fumaste in casa.<\/em> <small>Mir wäre lieber, ihr würdet nicht in der Wohnung rauchen.<\/small><\/li><li><em>Avrei voluto che tu me lo avessi detto prima.<\/em> <small>Ich hätte gewollt, dass du es mir früher gesagt hättest.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nach <em>vorrei che<\/em> steht nie der congiuntivo presente. Falsch: <em>Vorrei che tu venga.<\/em> Richtig: <em>Vorrei che tu venissi.<\/em><\/div>"},{"h":"Bedingungssätze: real","html":"<p>Der <b>reale<\/b> Bedingungssatz beschreibt eine Bedingung, die erfüllbar ist oder regelmäßig zutrifft. Beide Satzteile stehen im Indikativ:<\/p><ul><li><em>Se piove, restiamo a casa.<\/em> <small>Wenn es regnet, bleiben wir zu Hause.<\/small><\/li><li><em>Se finirai presto, andremo al cinema.<\/em> <small>Wenn du früh fertig bist, gehen wir ins Kino.<\/small><\/li><li><em>Se hai tempo, chiamami!<\/em> <small>Wenn du Zeit hast, ruf mich an!<\/small><\/li><li><em>Se hai già finito, possiamo andare.<\/em> <small>Wenn du schon fertig bist, können wir gehen.<\/small><\/li><\/ul><div class=\"tip\">Geht es um die Zukunft, steht im gepflegten Italienisch in beiden Satzteilen das Futur (<em>se verrai, sarò contento<\/em>); in der Umgangssprache ist das Präsens ebenso üblich.<\/div>"},{"h":"Bedingungssätze: möglich und irreal","html":"<p><b>Möglich / hypothetisch<\/b> (Gegenwart oder Zukunft, unwahrscheinlich oder nur gedacht): <em>se<\/em> + cong. imperfetto, Hauptsatz condizionale presente.<\/p><ul><li><em>Se avessi più tempo, imparerei il giapponese.<\/em> <small>Wenn ich mehr Zeit hätte, würde ich Japanisch lernen.<\/small><\/li><li><em>Se fossi in te, non accetterei.<\/em> <small>Wenn ich du wäre, würde ich nicht annehmen.<\/small><\/li><\/ul><p><b>Irreal in der Vergangenheit<\/b> (nicht mehr erfüllbar): <em>se<\/em> + cong. trapassato, Hauptsatz condizionale passato.<\/p><ul><li><em>Se fossi partito prima, non avrei perso il treno.<\/em> <small>Wenn ich früher losgefahren wäre, hätte ich den Zug nicht verpasst.<\/small><\/li><li><em>Se ce l'avessero detto, saremmo venuti.<\/em> <small>Wenn sie es uns gesagt hätten, wären wir gekommen.<\/small><\/li><\/ul><table><tr><th>Typ<\/th><th>se-Satz<\/th><th>Hauptsatz<\/th><\/tr><tr><td>real<\/td><td>Indikativ<\/td><td>Indikativ / Imperativ<\/td><\/tr><tr><td>möglich<\/td><td>cong. imperfetto<\/td><td>condizionale I<\/td><\/tr><tr><td>irreal (Verg.)<\/td><td>cong. trapassato<\/td><td>condizionale II<\/td><\/tr><\/table>"},{"h":"Mischformen und typische Fehler","html":"<p>Bedingung und Folge können auf verschiedenen Zeitebenen liegen:<\/p><ul><li><em>Se avessi studiato medicina, ora sarei medico.<\/em> <small>Wenn ich Medizin studiert hätte, wäre ich jetzt Arzt. (Bedingung damals, Folge jetzt)<\/small><\/li><li><em>Se fossi più paziente, non avrei litigato con lui.<\/em> <small>Wenn ich geduldiger wäre, hätte ich mich nicht mit ihm gestritten. (Eigenschaft allgemein, Folge damals)<\/small><\/li><\/ul><p>In der gesprochenen Sprache hört man für die irreale Vergangenheit oft zweimal das imperfetto: <em>Se lo sapevo, venivo.<\/em> <small>Wenn ich es gewusst hätte, wäre ich gekommen.<\/small> – Im Schriftlichen vermeiden.<\/p><div class=\"warn\">Achtung: Nach <em>se<\/em> (= wenn, falls) steht <b>nie<\/b> das condizionale! Falsch: <em>Se avrei tempo …<\/em> – richtig: <em>Se avessi tempo …<\/em><\/div><div class=\"tip\">Ausnahme: <em>se<\/em> = „ob“ (indirekte Frage) darf vom Konditional gefolgt werden: <em>Non so se verrebbe volentieri.<\/em> <small>Ich weiß nicht, ob er gern kommen würde.<\/small><\/div>"}],"exercises":[{"type":"choice","title":"Indikativ oder congiuntivo?","task":"Wähle den passenden Modus.","items":[{"q":"Credo che Giulia ___ ragione.","options":["ha","abbia"],"a":1,"why":"credere drückt eine Meinung aus → congiuntivo."},{"q":"So che Giulia ___ ragione.","options":["ha","abbia"],"a":0,"why":"sapere drückt Gewissheit aus → Indikativ."},{"q":"Benché ___ stanco, Marco continua a lavorare.","options":["è","sia"],"a":1,"why":"benché verlangt immer den congiuntivo."},{"q":"Siamo usciti perché ___ bel tempo.","options":["faceva","facesse"],"a":0,"why":"perché im Sinne von „weil“ steht mit Indikativ."},{"q":"Ti presto il libro affinché tu lo ___.","options":["leggi","legga"],"a":1,"why":"affinché (damit) verlangt den congiuntivo."},{"q":"Cerco qualcuno che ___ parlare cinese.","options":["sa","sappia"],"a":1,"why":"Gesuchte, unbestimmte Person im Relativsatz → congiuntivo."},{"q":"È evidente che il progetto ___ troppo costoso.","options":["è","sia"],"a":0,"why":"è evidente drückt Gewissheit aus → Indikativ."},{"q":"Mi dispiace che tu non ___ venire.","options":["puoi","possa"],"a":1,"why":"Gefühlsäußerung (mi dispiace) → congiuntivo."},{"q":"Quando ___ a Roma, vado sempre al Pantheon.","options":["sono","sia"],"a":0,"why":"quando (zeitlich) steht mit Indikativ."},{"q":"È il ristorante più caro che io ___ mai provato.","options":["ho","abbia"],"a":1,"why":"Nach einem Superlativ steht im gepflegten Italienisch der congiuntivo."}]},{"type":"gap","title":"Zeitenfolge beim Indikativ","task":"Setze die richtige Zeit ein. Das Zeitverhältnis steht in Klammern.","items":[{"q":"Luca mi ha detto che sua sorella (trasferirsi – vorher) ___ a Milano l'anno prima.","a":["si era trasferita"],"de":"Luca hat mir erzählt, dass seine Schwester im Jahr davor nach Mailand gezogen war."},{"q":"Sapevo che Carla (lavorare – gleichzeitig) ___ in un ospedale.","a":["lavorava"],"de":"Ich wusste, dass Carla in einem Krankenhaus arbeitete."},{"q":"Mi avevano promesso che (loro, venire – nachher) ___ alla festa.","a":["sarebbero venuti"],"de":"Sie hatten mir versprochen, dass sie zum Fest kommen würden."},{"q":"Ho scoperto che il negozio (chiudere – vorher) ___ due mesi prima.","a":["aveva chiuso"],"de":"Ich habe herausgefunden, dass der Laden zwei Monate zuvor geschlossen hatte."},{"q":"Dice che domani (piovere – nachher) ___.","a":["pioverà"],"de":"Er sagt, dass es morgen regnen wird."},{"q":"Dice che ieri (lui, perdere – vorher) ___ le chiavi.","a":["ha perso","ha perduto"],"de":"Er sagt, dass er gestern die Schlüssel verloren hat."},{"q":"Eravamo convinti che il treno (partire – nachher) ___ in orario.","a":["sarebbe partito"],"de":"Wir waren überzeugt, dass der Zug pünktlich abfahren würde."},{"q":"Mi scrisse che (essere – gleichzeitig) ___ molto felice.","a":["era"],"de":"Er schrieb mir, dass er sehr glücklich sei."}]},{"type":"choice","title":"Zeitangaben aus der Rückschau","task":"Wähle die passende Zeit- oder Ortsangabe für die indirekte Rede.","items":[{"q":"„Parto domani.“ → Ha detto che sarebbe partito ___.","options":["domani","il giorno dopo","il giorno prima"],"a":1,"why":"domani wird aus der Rückschau zu il giorno dopo."},{"q":"„Sono arrivato ieri.“ → Disse che era arrivato ___.","options":["il giorno prima","ieri","il giorno dopo"],"a":0,"why":"ieri wird zu il giorno prima."},{"q":"„Ci vediamo stasera.“ → Mi disse che ci saremmo visti ___.","options":["stasera","quella sera","la sera prima"],"a":1,"why":"stasera wird zu quella sera."},{"q":"„Abito qui da dieci anni.“ → Disse che abitava ___ da dieci anni.","options":["qui","lì"],"a":1,"why":"qui wird zu lì, weil der Sprecher nicht mehr am selben Ort ist."},{"q":"„Ho cambiato lavoro due mesi fa.“ → Mi raccontò che aveva cambiato lavoro due mesi ___.","options":["fa","prima","dopo"],"a":1,"why":"fa wird zu prima."},{"q":"„Ti chiamo tra una settimana.“ → Mi disse che mi avrebbe chiamato una settimana ___.","options":["tra","dopo","fa"],"a":1,"why":"tra wird zu dopo (nachgestellt)."},{"q":"„Questa borsa è mia.“ → Disse che ___ borsa era sua.","options":["questa","quella"],"a":1,"why":"questo/questa wird zu quello/quella."},{"q":"„Oggi sono libera.“ → Disse che ___ era libera.","options":["oggi","quel giorno","il giorno dopo"],"a":1,"why":"oggi wird zu quel giorno."}]},{"type":"gap","title":"Indirekte Rede","task":"Forme in die indirekte Rede um (Einleitung in der Vergangenheit).","items":[{"q":"Marco: „Sono stanco.“ → Marco ha detto che ___ stanco.","a":["era"],"de":"Marco sagte, er sei müde."},{"q":"Anna: „Ho perso il treno.“ → Anna ha detto che ___ il treno.","a":["aveva perso","aveva perduto"],"de":"Anna sagte, sie habe den Zug verpasst."},{"q":"Il medico: „Prenda queste pastiglie!“ → Il medico mi ha detto ___ queste pastiglie.","a":["di prendere"],"de":"Der Arzt sagte mir, ich solle diese Tabletten nehmen."},{"q":"Giulia: „Ti telefonerò.“ → Giulia mi ha detto che mi ___.","a":["avrebbe telefonato"],"de":"Giulia sagte mir, sie würde mich anrufen."},{"q":"Il turista: „Dov'è la stazione?“ → Il turista ha chiesto dove ___ la stazione.","a":["era","fosse"],"de":"Der Tourist fragte, wo der Bahnhof sei."},{"q":"Mia madre: „Hai mangiato?“ → Mia madre mi ha chiesto ___ avevo mangiato.","a":["se"],"de":"Meine Mutter fragte mich, ob ich gegessen hätte."},{"q":"Paolo: „Vorrei un caffè.“ → Paolo ha detto che ___ un caffè.","a":["avrebbe voluto","voleva"],"de":"Paolo sagte, er hätte gern einen Kaffee."},{"q":"I ragazzi: „Siamo qui da un'ora.“ → I ragazzi hanno detto che ___ lì da un'ora.","a":["erano"],"de":"Die Jungs sagten, sie seien seit einer Stunde dort."},{"q":"Luisa a Marco: „Aspettami!“ → Luisa ha detto a Marco ___ aspettarla.","a":["di"],"de":"Luisa sagte zu Marco, er solle auf sie warten."}]},{"type":"gap","title":"Zeitenfolge beim congiuntivo","task":"Setze die richtige Form des congiuntivo (oder des condizionale) ein.","items":[{"q":"Spero che tu (stare – gleichzeitig) ___ bene.","a":["stia"],"de":"Ich hoffe, dass es dir gut geht."},{"q":"Penso che Laura (partire – vorher) ___ ieri.","a":["sia partita"],"de":"Ich glaube, dass Laura gestern abgereist ist."},{"q":"Pensavo che Laura (partire – vorher) ___ già.","a":["fosse partita"],"de":"Ich dachte, Laura sei schon abgereist."},{"q":"Volevo che voi (venire – gleichzeitig) ___ con noi.","a":["veniste"],"de":"Ich wollte, dass ihr mit uns kommt."},{"q":"Vorrei che tu mi (dire) ___ la verità.","a":["dicessi"],"de":"Ich möchte, dass du mir die Wahrheit sagst."},{"q":"Avrei preferito che loro mi (avvisare – vorher) ___ prima.","a":["avessero avvisato"],"de":"Mir wäre lieber gewesen, sie hätten mich vorher benachrichtigt."},{"q":"Credevo che Marco (arrivare – nachher) ___ il giorno dopo.","a":["sarebbe arrivato"],"de":"Ich glaubte, Marco würde am nächsten Tag ankommen."},{"q":"È possibile che da giovane il nonno (essere – Dauer in der Vergangenheit) ___ molto sportivo.","a":["fosse","sia stato"],"de":"Es ist möglich, dass der Großvater als junger Mann sehr sportlich war."},{"q":"Non credo che domani (nevicare – nachher) ___.","a":["nevichi","nevicherà"],"de":"Ich glaube nicht, dass es morgen schneit."}]},{"type":"choice","title":"Welcher Bedingungssatz?","task":"Wähle die passende Form.","items":[{"q":"Se ___ tempo domani, ti aiuto.","options":["ho","avrei","avessi"],"a":0,"why":"Reale Bedingung → se + Indikativ."},{"q":"Se ___ più soldi, viaggerei di più.","options":["avrei","avessi","ho avuto"],"a":1,"why":"Mögliche Bedingung → se + congiuntivo imperfetto."},{"q":"Se avessi saputo dello sciopero, ___ in macchina.","options":["andrei","sarei andato","andavo"],"a":1,"why":"Irreal in der Vergangenheit → condizionale passato im Hauptsatz."},{"q":"Se fossi in te, non ___ quel lavoro.","options":["accetterei","accettassi","accetto"],"a":0,"why":"Ratschlag für die Gegenwart → condizionale presente."},{"q":"Se ieri non avessi bevuto tanto caffè, ora ___ dormire.","options":["potrei","avrei potuto","potessi"],"a":0,"why":"Mischform: Bedingung gestern, Folge jetzt → condizionale presente."},{"q":"Se Marta ___ più attenta, non avrebbe avuto l'incidente.","options":["fosse","sarebbe","è"],"a":0,"why":"Allgemeine Eigenschaft im se-Satz → congiuntivo imperfetto, nie condizionale."},{"q":"Se finirete presto, ___ al mare.","options":["andremo","andassimo","andremmo"],"a":0,"why":"Reale Bedingung in der Zukunft → Futur."},{"q":"Welcher Satz ist korrekt?","options":["Se avrei tempo, verrei.","Se avessi tempo, verrei.","Se avessi tempo, venissi."],"a":1,"why":"Nach se steht der congiuntivo imperfetto, im Hauptsatz das condizionale."}]},{"type":"gap","title":"Bedingungssätze und Mischformen","task":"Setze die richtige Form ein.","items":[{"q":"Se (io, vincere) ___ alla lotteria, comprerei una casa al mare.","a":["vincessi"],"de":"Wenn ich im Lotto gewinnen würde, würde ich ein Haus am Meer kaufen."},{"q":"Se tu (studiare) ___ di più, avresti superato l'esame.","a":["avessi studiato"],"de":"Wenn du mehr gelernt hättest, hättest du die Prüfung bestanden."},{"q":"Se piove, (noi, restare) ___ a casa.","a":["restiamo","resteremo"],"de":"Wenn es regnet, bleiben wir zu Hause."},{"q":"Se avessimo preso il treno delle otto, ora (noi, essere) ___ già a Firenze.","a":["saremmo"],"de":"Wenn wir den Zug um acht genommen hätten, wären wir jetzt schon in Florenz."},{"q":"Se Marco me l'avesse chiesto, lo (io, aiutare) ___ volentieri.","a":["avrei aiutato"],"de":"Wenn Marco mich gefragt hätte, hätte ich ihm gern geholfen."},{"q":"Se (voi, avere) ___ bisogno di qualcosa, chiamateci!","a":["avete","avrete"],"de":"Wenn ihr etwas braucht, ruft uns an!"},{"q":"Se (io, essere) ___ più giovane, farei il giro del mondo in barca.","a":["fossi"],"de":"Wenn ich jünger wäre, würde ich mit dem Boot um die Welt segeln."},{"q":"Se Anna non (perdere) ___ il passaporto, sarebbe partita con noi.","a":["avesse perso","avesse perduto"],"de":"Wenn Anna ihren Pass nicht verloren hätte, wäre sie mit uns gefahren."},{"q":"Se sapessi suonare il pianoforte, (io, suonare) ___ alla festa di stasera.","a":["suonerei"],"de":"Wenn ich Klavier spielen könnte, würde ich heute Abend auf dem Fest spielen."}]}],"cards":[{"f":"Modus nach pensare, credere, sperare + che","b":"congiuntivo: Penso che sia vero."},{"f":"Modus nach sapere, essere sicuro, è evidente + che","b":"Indikativ: So che è vero."},{"f":"benché, sebbene, affinché, prima che, senza che","b":"immer + congiuntivo"},{"f":"perché (= weil), quando, mentre, dato che","b":"+ Indikativ"},{"f":"Relativsatz mit Gesuchtem / nach Superlativ","b":"congiuntivo: Cerco una casa che abbia un giardino."},{"f":"HS Gegenwart – NS gleichzeitig (Indikativ)","b":"presente: Dico che è a casa."},{"f":"HS Vergangenheit – NS vorzeitig (Indikativ)","b":"trapassato prossimo: Ha detto che aveva finito."},{"f":"HS Vergangenheit – NS gleichzeitig (Indikativ)","b":"imperfetto: Ha detto che era stanco."},{"f":"Zukunft in der Vergangenheit","b":"condizionale passato: Disse che sarebbe venuto."},{"f":"HS Gegenwart – NS vorzeitig (congiuntivo)","b":"cong. passato: Credo che sia partito."},{"f":"HS Vergangenheit – NS gleichzeitig (congiuntivo)","b":"cong. imperfetto: Credevo che fosse a casa."},{"f":"HS Vergangenheit – NS vorzeitig (congiuntivo)","b":"cong. trapassato: Credevo che fosse partito."},{"f":"vorrei che … / preferirei che …","b":"+ cong. imperfetto: Vorrei che tu restassi."},{"f":"oggi / ieri / domani (aus der Rückschau)","b":"quel giorno / il giorno prima / il giorno dopo"},{"f":"tre giorni fa / tra tre giorni (Rückschau)","b":"tre giorni prima / tre giorni dopo"},{"f":"qui / questo (Rückschau)","b":"lì / quello"},{"f":"stasera / adesso (Rückschau)","b":"quella sera / allora, in quel momento"},{"f":"Indirekte Rede: Imperativ","b":"di + Infinitiv: Mi ha detto di aspettare."},{"f":"Indirekte Rede: Ja/Nein-Frage","b":"se: Mi ha chiesto se avevo fame."},{"f":"Indirekte Rede (Verg.): futuro wird zu …","b":"condizionale passato"},{"f":"Realer Bedingungssatz","b":"se + Präsens/Futur → Präsens/Futur/Imperativ"},{"f":"Möglicher Bedingungssatz","b":"se + cong. imperfetto → condizionale presente"},{"f":"Irrealer Bedingungssatz (Vergangenheit)","b":"se + cong. trapassato → condizionale passato"},{"f":"Mischform: damals → heute","b":"Se avessi studiato, ora sarei medico."},{"f":"Wenn ich du wäre …","b":"Se fossi in te …"},{"f":"Nach se (= wenn) nie …","b":"condizionale! Se avessi, nicht se avrei"},{"f":"Se lo sapevo, venivo.","b":"umgangssprachlich für: Se l'avessi saputo, sarei venuto."},{"f":"„Er sagte, er würde kommen.“","b":"Disse che sarebbe venuto. (nicht: verrebbe)"}],"id":"k16"},{"nr":17,"title":"Die reflexiven Verben","teil":"Das Verb und seine Ergänzungen","intro":"Reflexive Verben sind im Italienischen sehr häufig – oft auch dort, wo das Deutsche keine reflexive Form hat (und umgekehrt). Entscheidend sind die richtige Pronomenstellung und die zusammengesetzten Zeiten mit essere.","sections":[{"h":"Formen im Präsens","html":"<p>Reflexive Verben erkennt man am Infinitiv auf <em>-arsi, -ersi, -irsi<\/em>. Das Reflexivpronomen richtet sich nach dem Subjekt und steht vor dem konjugierten Verb.<\/p><table><tr><th><\/th><th>lavarsi<\/th><th>sedersi<\/th><\/tr><tr><td>io<\/td><td><em>mi lavo<\/em><\/td><td><em>mi siedo<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>ti lavi<\/em><\/td><td><em>ti siedi<\/em><\/td><\/tr><tr><td>lui/lei/Lei<\/td><td><em>si lava<\/em><\/td><td><em>si siede<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>ci laviamo<\/em><\/td><td><em>ci sediamo<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>vi lavate<\/em><\/td><td><em>vi sedete<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>si lavano<\/em><\/td><td><em>si siedono<\/em><\/td><\/tr><\/table><ul><li><em>Mi chiamo Elena.<\/em> <small>Ich heiße Elena.<\/small><\/li><li><em>A che ora ti svegli?<\/em> <small>Um wie viel Uhr wachst du auf?<\/small><\/li><li><em>I bambini si divertono in piscina.<\/em> <small>Die Kinder haben Spaß im Schwimmbad.<\/small><\/li><\/ul><div class=\"tip\">Vor Vokal oder h kann <em>mi, ti, si, vi<\/em> apostrophiert werden (<em>m'alzo<\/em>), heute ist die volle Form aber üblicher.<\/div>"},{"h":"Zusammengesetzte Zeiten: immer mit essere","html":"<p>Alle reflexiven Verben bilden die zusammengesetzten Zeiten mit <b>essere<\/b>. Das Partizip wird an das <b>Subjekt<\/b> angeglichen.<\/p><table><tr><th><\/th><th>passato prossimo<\/th><\/tr><tr><td>io<\/td><td><em>mi sono lavato / lavata<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>ti sei lavato / lavata<\/em><\/td><\/tr><tr><td>lui / lei<\/td><td><em>si è lavato / lavata<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>ci siamo lavati / lavate<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>vi siete lavati / lavate<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>si sono lavati / lavate<\/em><\/td><\/tr><\/table><ul><li><em>Stamattina Sara si è alzata alle sei.<\/em> <small>Heute Morgen ist Sara um sechs aufgestanden.<\/small><\/li><li><em>Ci eravamo già salutati.<\/em> <small>Wir hatten uns schon verabschiedet.<\/small><\/li><li><em>Se ti fossi sbrigato, saresti arrivato in tempo.<\/em> <small>Wenn du dich beeilt hättest, wärst du rechtzeitig angekommen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Im Deutschen heißt es „ich <b>habe<\/b> mich gewaschen“, im Italienischen aber <em>mi <b>sono<\/b> lavato<\/em>. Falsch: <em>mi ho lavato<\/em>.<\/div>"},{"h":"Besonderheiten: Objekt und Modalverben","html":"<p>Hat das reflexive Verb zusätzlich ein <b>direktes Objekt<\/b>, wird das Partizip normalerweise trotzdem an das Subjekt angeglichen:<\/p><ul><li><em>Laura si è lavata le mani.<\/em> <small>Laura hat sich die Hände gewaschen.<\/small><\/li><li><em>I ragazzi si sono messi la giacca.<\/em> <small>Die Jungen haben sich die Jacke angezogen.<\/small><\/li><\/ul><p>Wird das Objekt durch ein Pronomen ersetzt, richtet sich das Partizip nach dem Pronomen; aus <em>si<\/em> wird <em>se<\/em>:<\/p><em>Le mani? Laura se le è lavate.<\/em> <small>Die Hände? Laura hat sie sich gewaschen.<\/small><p>Mit <b>Modalverben<\/b> (<em>dovere, potere, volere<\/em>) gibt es zwei Möglichkeiten:<\/p><table><tr><th>Pronomen …<\/th><th>Hilfsverb<\/th><th>Beispiel<\/th><\/tr><tr><td>vor dem Modalverb<\/td><td>essere<\/td><td><em>Mi sono dovuto alzare presto.<\/em><\/td><\/tr><tr><td>an den Infinitiv gehängt<\/td><td>avere<\/td><td><em>Ho dovuto alzarmi presto.<\/em><\/td><\/tr><\/table><p><small>Beide: Ich musste früh aufstehen.<\/small><\/p><div class=\"tip\">Merke: Das Pronomen „zieht“ essere nach vorn. Steht es hinten am Infinitiv, bleibt avere.<\/div>"},{"h":"Stellung der Reflexivpronomen","html":"<table><tr><th>Form<\/th><th>Stellung<\/th><th>Beispiel<\/th><\/tr><tr><td>konjugiert<\/td><td>davor<\/td><td><em>Mi alzo.<\/em><\/td><\/tr><tr><td>Infinitiv<\/td><td>angehängt<\/td><td><em>Devo alzarmi.<\/em><\/td><\/tr><tr><td>Gerundium<\/td><td>angehängt<\/td><td><em>Alzandosi, è caduto.<\/em><\/td><\/tr><tr><td>Imperativ (tu, noi, voi)<\/td><td>angehängt<\/td><td><em>Alzati! Alziamoci! Alzatevi!<\/em><\/td><\/tr><tr><td>Imperativ (Lei)<\/td><td>davor<\/td><td><em>Si alzi, prego.<\/em><\/td><\/tr><\/table><p>Beim angehängten Pronomen ändert es sich mit der Person: <em>devo alzarmi, devi alzarti, dobbiamo alzarci<\/em>.<\/p><p><b>Verneinter Imperativ<\/b>: bei <em>tu<\/em> <em>non<\/em> + Infinitiv, bei <em>voi<\/em> <em>non<\/em> + Imperativ; das Pronomen wird angehängt oder steht davor:<\/p><ul><li><em>Non alzarti! / Non ti alzare!<\/em> <small>Steh nicht auf!<\/small><\/li><li><em>Non preoccupatevi! / Non vi preoccupate!<\/em> <small>Macht euch keine Sorgen!<\/small><\/li><\/ul><p>Mit einem weiteren Pronomen wird <em>mi, ti, si, ci, vi<\/em> zu <em>me, te, se, ce, ve<\/em>: <em>Mi metto il cappotto → Me lo metto.<\/em><\/p><div class=\"warn\">Achtung: Beim Infinitiv das Pronomen nicht vergessen anzupassen. Falsch: <em>Domani devo alzarsi presto.<\/em> Richtig: <em>Domani devo alzarmi presto.<\/em><\/div>"},{"h":"Arten von reflexiven Verben","html":"<table><tr><th>Art<\/th><th>Beispiel<\/th><\/tr><tr><td>Pronomen = direktes Objekt<\/td><td><em>Mi lavo. / Si veste.<\/em> <small>Ich wasche mich. / Er zieht sich an.<\/small><\/td><\/tr><tr><td>Pronomen = indirektes Objekt<\/td><td><em>Mi lavo i denti.<\/em> <small>Ich putze mir die Zähne.<\/small><\/td><\/tr><tr><td>reziprok (gegenseitig)<\/td><td><em>Ci vediamo domani.<\/em> <small>Wir sehen uns morgen.<\/small><\/td><\/tr><tr><td>affektiv (umgangssprachlich)<\/td><td><em>Mi bevo un caffè.<\/em> <small>Ich gönne mir einen Kaffee.<\/small><\/td><\/tr><\/table><p>Reziproke Verben gibt es nur im Plural: <em>Marco e Giulia si sono conosciuti a Bari.<\/em> <small>Marco und Giulia haben sich in Bari kennengelernt.<\/small> Zur Verdeutlichung: <em>a vicenda, l'un l'altro<\/em>.<\/p><div class=\"warn\">Achtung: Bei Körperteilen und Kleidung steht im Italienischen kein Possessivbegleiter, sondern der bestimmte Artikel: <em>Mi lavo le mani<\/em>, nicht <em>Lavo le mie mani<\/em>.<\/div>"},{"h":"Verben, die nur reflexiv vorkommen","html":"<p>Einige Verben gibt es (fast) nur in der reflexiven Form:<\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>pentirsi (di)<\/em><\/td><td>bereuen<\/td><\/tr><tr><td><em>accorgersi (di)<\/em><\/td><td>bemerken<\/td><\/tr><tr><td><em>vergognarsi (di)<\/em><\/td><td>sich schämen<\/td><\/tr><tr><td><em>lamentarsi (di)<\/em><\/td><td>sich beklagen<\/td><\/tr><tr><td><em>fidarsi (di)<\/em><\/td><td>vertrauen<\/td><\/tr><tr><td><em>arrendersi<\/em><\/td><td>sich ergeben, aufgeben<\/td><\/tr><tr><td><em>ribellarsi<\/em><\/td><td>sich auflehnen<\/td><\/tr><\/table><ul><li><em>Non mi sono accorto di niente.<\/em> <small>Ich habe nichts bemerkt.<\/small><\/li><li><em>Si è pentita di non essere venuta.<\/em> <small>Sie hat bereut, nicht gekommen zu sein.<\/small><\/li><\/ul><div class=\"tip\">Viele dieser Verben verlangen <em>di<\/em>: <em>fidarsi di qualcuno, vergognarsi di qualcosa<\/em>.<\/div>"},{"h":"Reflexiv oder nicht: Bedeutungsunterschiede","html":"<p>Viele Verben gibt es mit und ohne Reflexivpronomen – die Bedeutung ändert sich:<\/p><table><tr><th>nicht reflexiv<\/th><th>reflexiv<\/th><\/tr><tr><td><em>fermare<\/em> anhalten (jdn./etw.)<\/td><td><em>fermarsi<\/em> stehen bleiben, anhalten<\/td><\/tr><tr><td><em>svegliare<\/em> wecken<\/td><td><em>svegliarsi<\/em> aufwachen<\/td><\/tr><tr><td><em>chiamare<\/em> rufen, anrufen<\/td><td><em>chiamarsi<\/em> heißen<\/td><\/tr><tr><td><em>trovare<\/em> finden<\/td><td><em>trovarsi<\/em> sich befinden; sich wohlfühlen<\/td><\/tr><tr><td><em>sentire<\/em> hören, fühlen<\/td><td><em>sentirsi<\/em> sich fühlen<\/td><\/tr><tr><td><em>preoccupare<\/em> beunruhigen<\/td><td><em>preoccuparsi<\/em> sich Sorgen machen<\/td><\/tr><tr><td><em>sposare<\/em> heiraten (jdn.)<\/td><td><em>sposarsi<\/em> heiraten (allgemein)<\/td><\/tr><\/table><ul><li><em>Il vigile ha fermato la macchina.<\/em> <small>Der Polizist hat das Auto angehalten.<\/small><\/li><li><em>La macchina si è fermata.<\/em> <small>Das Auto ist stehen geblieben.<\/small><\/li><li><em>Mi trovo bene a Bologna.<\/em> <small>Ich fühle mich in Bologna wohl.<\/small><\/li><\/ul>"},{"h":"Unterschiede Deutsch – Italienisch","html":"<p>Was im Deutschen reflexiv ist, muss es im Italienischen nicht sein – und umgekehrt.<\/p><table><tr><th>Deutsch<\/th><th>Italienisch<\/th><\/tr><tr><td>sich freuen<\/td><td><em>essere contento<\/em> (gehoben: <em>rallegrarsi<\/em>)<\/td><\/tr><tr><td>sich etwas ansehen<\/td><td><em>guardare qualcosa<\/em><\/td><\/tr><tr><td>sich (ver)ändern<\/td><td><em>cambiare<\/em> (mit essere)<\/td><\/tr><tr><td>sich verbessern<\/td><td><em>migliorare<\/em><\/td><\/tr><tr><td>sich bedanken bei<\/td><td><em>ringraziare qualcuno<\/em><\/td><\/tr><tr><td>sich etwas vorstellen<\/td><td><em>immaginare<\/em><\/td><\/tr><tr><td>sich erholen<\/td><td><em>riposarsi<\/em>; gesundheitlich: <em>riprendersi<\/em><\/td><\/tr><tr><td>sich verspäten<\/td><td><em>essere in ritardo<\/em><\/td><\/tr><\/table><p>Umgekehrt reflexiv im Italienischen, nicht im Deutschen:<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>addormentarsi<\/em><\/td><td>einschlafen<\/td><\/tr><tr><td><em>ammalarsi<\/em><\/td><td>krank werden<\/td><\/tr><tr><td><em>divertirsi<\/em><\/td><td>Spaß haben<\/td><\/tr><tr><td><em>laurearsi<\/em><\/td><td>das Studium abschließen<\/td><\/tr><tr><td><em>accorgersi<\/em><\/td><td>merken<\/td><\/tr><\/table><ul><li><em>Il tempo è cambiato.<\/em> <small>Das Wetter hat sich geändert.<\/small><\/li><li><em>Mi sono addormentato sul divano.<\/em> <small>Ich bin auf dem Sofa eingeschlafen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>cambiarsi<\/em> heißt „sich umziehen“! Für „sich ändern“ nimmt man <em>cambiare<\/em> mit essere: <em>Marco è cambiato molto.<\/em> <small>Marco hat sich sehr verändert.<\/small><\/div>"},{"h":"Pronominale Verben: andarsene & Co.","html":"<p>Pronominale Verben enthalten ein oder zwei feste Pronomen mit idiomatischer Bedeutung: Reflexivpronomen + <em>ne<\/em> bzw. <em>la<\/em> (<em>andarsene, cavarsela<\/em>) oder <em>ci<\/em> + <em>la<\/em> (<em>farcela<\/em>).<\/p><table><tr><th><\/th><th>andarsene (weggehen)<\/th><\/tr><tr><td>io<\/td><td><em>me ne vado<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>te ne vai<\/em><\/td><\/tr><tr><td>lui / lei<\/td><td><em>se ne va<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>ce ne andiamo<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>ve ne andate<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>se ne vanno<\/em><\/td><\/tr><\/table><p>Passato prossimo: <em>me ne sono andato/-a, se n'è andato/-a<\/em>. Imperativ: <em>Vattene! Andatevene! Non andartene! / Non te ne andare!<\/em><\/p><table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>farcela
