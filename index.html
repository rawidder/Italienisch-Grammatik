gen, also am Donnerstag.<\/small><\/li><li><em>Era stanca: infatti è andata a letto presto.<\/em> <small>Sie war müde: Sie ist ja auch früh ins Bett gegangen.<\/small><\/li><li><em>Piove, quindi prendo l'ombrello.<\/em> <small>Es regnet, also nehme ich den Schirm.<\/small><\/li><\/ul><div class=\"tip\"><em>però<\/em> ist beweglicher als <em>ma<\/em>: Es kann auch hinter dem Verb stehen. <em>ma<\/em> steht immer am Anfang des Satzteils.<\/div><div class=\"warn\">Achtung: <em>infatti<\/em> bestätigt das vorher Gesagte („und tatsächlich, wie erwartet“). Für „in Wirklichkeit (anders als gedacht)“ sagt man <em>in realtà<\/em>.<\/div>"},{"h":"Mehrteilige Konjunktionen","html":"<table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>sia … sia / sia … che<\/em><\/td><td>sowohl … als auch<\/td><\/tr><tr><td><em>né … né<\/em><\/td><td>weder … noch<\/td><\/tr><tr><td><em>non solo … ma anche<\/em><\/td><td>nicht nur … sondern auch<\/td><\/tr><tr><td><em>o … o<\/em><\/td><td>entweder … oder<\/td><\/tr><\/table><ul><li><em>Parla sia l'inglese sia il francese.<\/em> <small>Sie spricht sowohl Englisch als auch Französisch.<\/small><\/li><li><em>Non mangio né carne né pesce.<\/em> <small>Ich esse weder Fleisch noch Fisch.<\/small><\/li><li><em>Né Gianni né Carla sono venuti.<\/em> <small>Weder Gianni noch Carla sind gekommen.<\/small><\/li><li><em>È non solo bella, ma anche intelligente.<\/em> <small>Sie ist nicht nur schön, sondern auch klug.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Steht <em>né … né<\/em> nach dem Verb, braucht das Verb <em>non<\/em> (<em>Non bevo né tè né caffè<\/em>). Am Satzanfang kein <em>non<\/em>; das Verb steht meist im Plural.<\/div>"},{"h":"Unterordnend mit Indikativ","html":"<p>Diese Konjunktionen leiten Nebensätze ein, die eine <b>Tatsache<\/b> ausdrücken – es folgt der Indikativ:<\/p><table><tr><th>Konjunktion<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>perché, poiché, siccome, dato che<\/em><\/td><td>weil, da<\/td><\/tr><tr><td><em>quando<\/em><\/td><td>wenn, als<\/td><\/tr><tr><td><em>mentre<\/em><\/td><td>während<\/td><\/tr><tr><td><em>appena / non appena<\/em><\/td><td>sobald<\/td><\/tr><tr><td><em>dopo che<\/em><\/td><td>nachdem<\/td><\/tr><tr><td><em>finché<\/em><\/td><td>solange<\/td><\/tr><tr><td><em>se<\/em> (Bedingung)<\/td><td>wenn, falls<\/td><\/tr><\/table><ul><li><em>Siccome era tardi, abbiamo preso un taxi.<\/em> <small>Da es spät war, haben wir ein Taxi genommen.<\/small><\/li><li><em>Mentre cucinavo, è squillato il telefono.<\/em> <small>Während ich kochte, klingelte das Telefon.<\/small><\/li><li><em>Appena arrivo, ti scrivo.<\/em> <small>Sobald ich ankomme, schreibe ich dir.<\/small><\/li><li><em>Se hai tempo, passa da me.<\/em> <small>Wenn du Zeit hast, komm bei mir vorbei.<\/small><\/li><\/ul><div class=\"tip\"><em>siccome<\/em> steht fast immer am <b>Satzanfang<\/b>, <em>perché<\/em> meist nach dem Hauptsatz.<\/div><div class=\"warn\">Achtung: Bezieht sich die Handlung auf die Zukunft, steht nach <em>quando, appena, se<\/em> meist das <b>Futur<\/b>: <em>Quando avrò finito, ti chiamerò<\/em>. Umgangssprachlich auch Präsens.<\/div>"},{"h":"Unterordnend mit congiuntivo","html":"<p>Bei Einräumung, Zweck, Bedingung, Vorzeitigkeit und Ausschluss steht der <b>congiuntivo<\/b>:<\/p><table><tr><th>Konjunktion<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>benché, sebbene, nonostante, malgrado<\/em><\/td><td>obwohl<\/td><\/tr><tr><td><em>affinché<\/em><\/td><td>damit<\/td><\/tr><tr><td><em>prima che<\/em><\/td><td>bevor<\/td><\/tr><tr><td><em>senza che<\/em><\/td><td>ohne dass<\/td><\/tr><tr><td><em>purché, a patto che, a condizione che<\/em><\/td><td>vorausgesetzt, dass<\/td><\/tr><tr><td><em>a meno che (non)<\/em><\/td><td>es sei denn, dass<\/td><\/tr><tr><td><em>nel caso che / qualora<\/em><\/td><td>falls<\/td><\/tr><\/table><ul><li><em>Benché sia stanca, continua a lavorare.<\/em> <small>Obwohl sie müde ist, arbeitet sie weiter.<\/small><\/li><li><em>Te lo spiego affinché tu capisca.<\/em> <small>Ich erkläre es dir, damit du es verstehst.<\/small><\/li><li><em>Partiamo prima che faccia buio.<\/em> <small>Fahren wir los, bevor es dunkel wird.<\/small><\/li><li><em>È uscito senza che nessuno se ne accorgesse.<\/em> <small>Er ging hinaus, ohne dass es jemand bemerkte.<\/small><\/li><li><em>Ti presto la bici, purché me la riporti stasera.<\/em> <small>Ich leihe dir das Rad, vorausgesetzt, du bringst es heute Abend zurück.<\/small><\/li><\/ul><div class=\"tip\">Bei gleichem Subjekt steht statt <em>prima che / senza che / affinché<\/em> der Infinitiv: <em>prima di partire, senza dire niente, per capire<\/em>.<\/div><div class=\"warn\">Achtung: Das häufige Wort für „obwohl“ in der Alltagssprache ist <em>anche se<\/em> – und das steht mit <b>Indikativ<\/b>: <em>Anche se è tardi, resto ancora un po'<\/em>.<\/div>"},{"h":"Indikativ oder congiuntivo – je nach Bedeutung","html":"<table><tr><th>Konjunktion<\/th><th>+ Indikativ<\/th><th>+ congiuntivo<\/th><\/tr><tr><td><em>perché<\/em><\/td><td>weil<\/td><td>damit<\/td><\/tr><tr><td><em>come<\/em><\/td><td>wie (Vergleich, Tatsache)<\/td><td>wie (indirekte Frage, gehoben)<\/td><\/tr><tr><td><em>finché (non)<\/em><\/td><td>solange / bis (Vergangenheit, Tatsache)<\/td><td>bis (Zukunft, gehoben)<\/td><\/tr><tr><td><em>così … che / in modo che<\/em><\/td><td>so … dass (Folge)<\/td><td>so, dass / damit (Absicht)<\/td><\/tr><tr><td><em>se<\/em> (indirekte Frage)<\/td><td>ob (Alltagssprache)<\/td><td>ob (gehoben)<\/td><\/tr><\/table><ul><li><em>Studio perché ho un esame.<\/em> <small>Ich lerne, weil ich eine Prüfung habe.<\/small><\/li><li><em>Ti do la chiave perché tu possa entrare.<\/em> <small>Ich gebe dir den Schlüssel, damit du hineinkannst.<\/small><\/li><li><em>Ha parlato in modo che tutti hanno capito.<\/em> <small>Er hat so gesprochen, dass alle verstanden haben. (Folge)<\/small><\/li><li><em>Parla in modo che tutti capiscano!<\/em> <small>Sprich so, dass alle verstehen! (Absicht)<\/small><\/li><li><em>Non so se viene / se venga.<\/em> <small>Ich weiß nicht, ob er kommt.<\/small><\/li><li><em>Ho aspettato finché non è arrivato.<\/em> <small>Ich habe gewartet, bis er gekommen ist.<\/small><\/li><\/ul><p>Verallgemeinernde Konjunktionen stehen immer mit congiuntivo: <em>chiunque<\/em> (wer auch immer), <em>comunque<\/em> (wie auch immer), <em>dovunque<\/em> (wo auch immer), <em>qualunque cosa<\/em> (was auch immer).<\/p><ul><li><em>Chiunque chiami, non ci sono.<\/em> <small>Wer auch immer anruft, ich bin nicht da.<\/small><\/li><li><em>Dovunque tu vada, ti seguirò.<\/em> <small>Wohin du auch gehst, ich werde dir folgen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>comunque<\/em> allein am Satzanfang mit Komma heißt „jedenfalls, trotzdem“ – dann Indikativ: <em>Comunque, domani ci vediamo<\/em>.<\/div>"}],"exercises":[{"type":"choice","title":"Beiordnende Konjunktionen","task":"Wähle die passende Konjunktion.","items":[{"q":"Mi piace il mare, ___ preferisco la montagna.","options":["ma","quindi","cioè"],"a":0,"why":"Gegensatz → ma."},{"q":"Ho perso il treno, ___ sono arrivato tardi.","options":["però","quindi","oppure"],"a":1,"why":"Folge → quindi."},{"q":"Ci vediamo dopodomani, ___ sabato.","options":["cioè","eppure","o"],"a":0,"why":"Erläuterung → cioè."},{"q":"Vuoi la pasta ___ il riso?","options":["né","o","ma"],"a":1,"why":"Alternative → o."},{"q":"Io lavoro molto, mio fratello ___ non fa niente.","options":["invece","infatti","quindi"],"a":0,"why":"Gegenüberstellung → invece."},{"q":"Aveva la febbre: ___ non è venuto a scuola.","options":["infatti","eppure","oppure"],"a":0,"why":"Bestätigung/Begründung → infatti."},{"q":"Non ho studiato, ___ ho preso un bel voto.","options":["perciò","eppure","cioè"],"a":1,"why":"Unerwarteter Gegensatz → eppure."},{"q":"Non bevo ___ vino ___ birra.","options":["né … né","sia … sia","o … o"],"a":0,"why":"Verneinung mit non → né … né."}]},{"type":"gap","title":"Mehrteilige und anreihende Konjunktionen","task":"Ergänze das fehlende Wort.","items":[{"q":"Parlo sia il tedesco ___ l'italiano.","a":["sia","che"],"de":"Ich spreche sowohl Deutsch als auch Italienisch."},{"q":"Non solo è simpatico, ma ___ generoso.","a":["anche"],"de":"Er ist nicht nur sympathisch, sondern auch großzügig."},{"q":"Né io ___ mia moglie conosciamo quel signore.","a":["né"],"de":"Weder ich noch meine Frau kennen diesen Herrn."},{"q":"O vieni adesso, ___ vado senza di te.","a":["o"],"de":"Entweder kommst du jetzt, oder ich gehe ohne dich."},{"q":"Non ho capito niente. – Non ho capito niente ___ io. (auch nicht)","a":["neanche","nemmeno","neppure"],"de":"Ich habe nichts verstanden. – Ich auch nicht."},{"q":"Laura ___ Enrico arrivano domani. (und, vor Vokal)","a":["ed","e"],"de":"Laura und Enrico kommen morgen an."},{"q":"Possiamo cenare a casa, ___ andare in pizzeria. (oder)","a":["oppure","o"],"de":"Wir können zu Hause essen oder in die Pizzeria gehen."},{"q":"Fa freddo, ___ mettiti il cappotto. (deshalb)","a":["perciò","quindi","dunque","allora"],"de":"Es ist kalt, deshalb zieh den Mantel an."}]},{"type":"choice","title":"Indikativ oder congiuntivo?","task":"Wähle die richtige Verbform.","items":[{"q":"Siccome ___ stanca, sono rimasta a casa.","options":["ero","fossi"],"a":0,"why":"siccome (Grund) → Indikativ."},{"q":"Benché ___ freddo, facciamo una passeggiata.","options":["fa","faccia"],"a":1,"why":"benché → congiuntivo."},{"q":"Anche se ___ freddo, facciamo una passeggiata.","options":["fa","faccia"],"a":0,"why":"anche se → Indikativ."},{"q":"Te lo ripeto affinché non lo ___.","options":["dimentica","dimentichi"],"a":1,"why":"affinché → congiuntivo (tu dimentichi)."},{"q":"Mentre ___ il giornale, mi sono addormentato.","options":["leggevo","leggessi"],"a":0,"why":"mentre → Indikativ."},{"q":"Usciamo prima che ___ a piovere.","options":["comincia","cominci"],"a":1,"why":"prima che → congiuntivo."},{"q":"Ti aiuto, purché tu mi ___ un caffè.","options":["offri","offra"],"a":1,"why":"purché → congiuntivo."},{"q":"Appena ___ a casa, ti chiamo.","options":["arrivo","arrivi"],"a":0,"why":"appena → Indikativ (Präsens für nahe Zukunft)."},{"q":"Non partiremo, a meno che non ___ bel tempo.","options":["fa","faccia"],"a":1,"why":"a meno che → congiuntivo."},{"q":"È entrato senza che io lo ___.","options":["sentivo","sentissi"],"a":1,"why":"senza che → congiuntivo; Vergangenheit → imperfetto."}]},{"type":"gap","title":"Die passende Konjunktion","task":"Setze eine passende unterordnende Konjunktion ein. Die deutsche Bedeutung steht in Klammern.","items":[{"q":"Ti presto il libro ___ tu me lo restituisca presto. (vorausgesetzt, dass)","a":["purché","a patto che","a condizione che","sempre che"],"de":"Ich leihe dir das Buch, vorausgesetzt, du gibst es mir bald zurück."},{"q":"___ sia ricco, vive in modo molto semplice. (obwohl)","a":["Benché","Sebbene","Nonostante","Malgrado","benché","sebbene","nonostante","malgrado"],"de":"Obwohl er reich ist, lebt er sehr einfach."},{"q":"___ c'era sciopero, siamo andati a piedi. (da, am Satzanfang)","a":["Siccome","Poiché","Dato che","siccome","poiché","dato che","Visto che","visto che"],"de":"Da gestreikt wurde, sind wir zu Fuß gegangen."},{"q":"Parlo lentamente ___ tu mi capisca. (damit)","a":["affinché","perché","in modo che","così che"],"de":"Ich spreche langsam, damit du mich verstehst."},{"q":"Resto qui ___ non torni tu. (bis)","a":["finché","fino a quando","fin quando"],"de":"Ich bleibe hier, bis du zurückkommst."},{"q":"___ chiami, digli che non sono in casa. (wer auch immer)","a":["Chiunque","chiunque"],"de":"Wer auch immer anruft, sag ihm, dass ich nicht zu Hause bin."},{"q":"___ tu vada, porta il cellulare. (wohin auch immer)","a":["Dovunque","Ovunque","dovunque","ovunque"],"de":"Wohin du auch gehst, nimm das Handy mit."},{"q":"Prendi l'ombrello, ___ piova. (falls)","a":["nel caso che","nel caso","qualora","caso mai","casomai"],"de":"Nimm den Schirm mit, falls es regnet."}]},{"type":"choice","title":"perché, come, in modo che – Bedeutung erkennen","task":"Wähle die korrekte Form.","items":[{"q":"Sono andato dal medico perché ___ mal di testa.","options":["avevo","avessi"],"a":0,"why":"perché = weil → Indikativ."},{"q":"Ti mando le foto perché tu le ___.","options":["vedi","veda"],"a":1,"why":"perché = damit → congiuntivo."},{"q":"Ha gridato così forte che tutti si ___.","options":["sono girati","siano girati"],"a":0,"why":"così … che mit tatsächlicher Folge → Indikativ."},{"q":"Mettiti in modo che tutti ti ___.","options":["vedono","vedano"],"a":1,"why":"Absicht → congiuntivo."},{"q":"Comunque ___, per me va bene.","options":["vanno le cose","vadano le cose"],"a":1,"why":"comunque = wie auch immer → congiuntivo."},{"q":"Ho lavorato finché non ___ buio.","options":["è diventato","diventasse"],"a":0,"why":"Tatsache in der Vergangenheit → Indikativ."},{"q":"___ non avevo fame, non ho mangiato niente.","options":["Siccome","Benché","Affinché"],"a":0,"why":"Grund + Indikativ → siccome."},{"q":"___ non avessi fame, ho mangiato tutto.","options":["Siccome","Sebbene","Poiché"],"a":1,"why":"Einräumung + congiuntivo → sebbene."}]}],"cards":[{"f":"und (vor Vokal, v. a. e-)","b":"ed: Anna ed Elena"},{"f":"auch nicht / nicht einmal","b":"neanche, neppure, nemmeno (nach dem Verb mit non)"},{"f":"entweder … oder","b":"o … o"},{"f":"sowohl … als auch","b":"sia … sia / sia … che"},{"f":"weder … noch","b":"né … né (nach dem Verb: non … né … né)"},{"f":"nicht nur … sondern auch","b":"non solo … ma anche"},{"f":"dagegen, hingegen","b":"invece"},{"f":"und trotzdem","b":"eppure"},{"f":"das heißt","b":"cioè"},{"f":"infatti","b":"tatsächlich, ja auch (bestätigt das Gesagte)"},{"f":"also, deshalb","b":"quindi, perciò, dunque"},{"f":"da (am Satzanfang) + ?","b":"siccome + Indikativ"},{"f":"weil + ?","b":"perché / poiché / dato che + Indikativ"},{"f":"sobald","b":"appena / non appena + Indikativ"},{"f":"während","b":"mentre + Indikativ"},{"f":"obwohl (gehoben) + ?","b":"benché, sebbene, nonostante + congiuntivo"},{"f":"obwohl (Alltag) + ?","b":"anche se + Indikativ"},{"f":"damit","b":"affinché / perché + congiuntivo"},{"f":"bevor (versch. Subjekte / gleiches Subjekt)","b":"prima che + congiuntivo / prima di + Infinitiv"},{"f":"ohne dass","b":"senza che + congiuntivo"},{"f":"vorausgesetzt, dass","b":"purché, a patto che, a condizione che + congiuntivo"},{"f":"es sei denn","b":"a meno che (non) + congiuntivo"},{"f":"falls","b":"nel caso che / qualora + congiuntivo; se + Indikativ"},{"f":"perché – zwei Bedeutungen","b":"weil (+ Indikativ) / damit (+ congiuntivo)"},{"f":"wer / wo / wie auch immer","b":"chiunque / dovunque / comunque + congiuntivo"},{"f":"bis (Tatsache, Vergangenheit)","b":"finché non + Indikativ: Ho aspettato finché non è arrivato."}],"id":"k22"},{"nr":23,"title":"Satzbau und Satzgefüge","teil":"Der Satz","intro":"Die italienische Wortstellung ist freier und zugleich einfacher als die deutsche: kein Verb am Satzende, keine Verbzweitstellung. Dafür spielen Betonung, doppelte Verneinung und verkürzte Nebensätze eine große Rolle.","sections":[{"h":"Der Aussagesatz: Grundstellung SVO","html":"<p>Die neutrale Wortstellung ist <b>Subjekt – Verb – Objekt<\/b>. Ort- und Zeitangaben stehen meist am Ende oder am Anfang.<\/p><ul><li><em>Mia sorella compra il pane.<\/em> <small>Meine Schwester kauft das Brot.<\/small><\/li><li><em>Domani Franco porta i bambini al mare.<\/em> <small>Morgen bringt Franco die Kinder ans Meer.<\/small><\/li><\/ul><p>Weil die Verbendung die Person zeigt, wird das <b>Subjektpronomen<\/b> normalerweise <b>weggelassen<\/b>. Man setzt es nur zur Betonung oder Gegenüberstellung.<\/p><ul><li><em>Abitiamo a Verona.<\/em> <small>Wir wohnen in Verona.<\/small><\/li><li><em>Io lavoro, e tu dormi!<\/em> <small>Ich arbeite, und du schläfst!<\/small><\/li><\/ul><div class=\"warn\">Achtung: Die deutsche Verbzweitstellung („Morgen <b>bringt<\/b> Franco …“) wird nicht nachgeahmt. Nach einer Zeitangabe am Satzanfang bleibt die normale Reihenfolge Subjekt – Verb: <em>Domani Franco porta…<\/em><\/div>"},{"h":"Inversion: das Subjekt nach dem Verb","html":"<p>Das Subjekt steht <b>nach dem Verb<\/b>, wenn es die <b>neue Information<\/b> ist – besonders bei Verben des Erscheinens, Kommens und Geschehens (<em>arrivare, venire, succedere, mancare, nascere, morire<\/em>) und bei <em>piacere<\/em>-Verben.<\/p><ul><li><em>È arrivato Marco.<\/em> <small>Marco ist angekommen. (Wer ist gekommen? – Marco.)<\/small><\/li><li><em>Marco è arrivato.<\/em> <small>Marco ist angekommen. (Was ist mit Marco? – Er ist da.)<\/small><\/li><li><em>Mi piacciono le fragole.<\/em> <small>Ich mag Erdbeeren.<\/small><\/li><li><em>Manca il sale.<\/em> <small>Es fehlt Salz.<\/small><\/li><li><em>È successo un incidente.<\/em> <small>Es ist ein Unfall passiert.<\/small><\/li><\/ul><div class=\"tip\">Faustregel: Was neu und wichtig ist, steht im Italienischen am Satzende.<\/div>"},{"h":"Hervorhebung: Dislokation und Spaltsatz","html":"<p><b>Linksversetzung:<\/b> Ein bekanntes Objekt wird an den Anfang gestellt und durch ein <b>Objektpronomen<\/b> wieder aufgenommen. Das ist in der gesprochenen Sprache sehr häufig.<\/p><ul><li><em>Il caffè lo bevo senza zucchero.<\/em> <small>Den Kaffee trinke ich ohne Zucker.<\/small><\/li><li><em>Le chiavi le ho lasciate in macchina.<\/em> <small>Die Schlüssel habe ich im Auto gelassen.<\/small><\/li><li><em>A Giulia le ho già scritto.<\/em> <small>Giulia habe ich schon geschrieben. (umgangssprachlich)<\/small><\/li><li><em>Di questo ne parliamo dopo.<\/em> <small>Darüber reden wir später.<\/small><\/li><\/ul><p><b>Rechtsversetzung:<\/b> Pronomen zuerst, Objekt nachgeschoben: <em>L'hai letto, il giornale?<\/em> <small>Hast du sie gelesen, die Zeitung?<\/small><\/p><p><b>Spaltsatz<\/b> (frase scissa): <em>essere + betonter Teil + che<\/em> bzw. <em>a + Infinitiv<\/em>:<\/p><ul><li><em>È Maria che ha organizzato la festa.<\/em> <small>Maria war es, die das Fest organisiert hat.<\/small><\/li><li><em>È stata Maria a organizzare la festa.<\/em> <small>Maria war es, die das Fest organisiert hat.<\/small><\/li><li><em>È a Roma che vogliono vivere.<\/em> <small>In Rom wollen sie leben.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Bei Linksversetzung des direkten Objekts ist das Pronomen <b>Pflicht<\/b>: <em>La pizza la ordino io<\/em>, nicht *La pizza ordino io. Im passato prossimo gleicht sich das Partizip an: <em>Le foto le ho stampate<\/em>.<\/div>"},{"h":"Die Verneinung","html":"<p><em>non<\/em> steht <b>direkt vor dem konjugierten Verb<\/b> – nur unbetonte Pronomen stehen dazwischen.<\/p><ul><li><em>Non lavoro il sabato.<\/em> <small>Ich arbeite samstags nicht.<\/small><\/li><li><em>Non lo so.<\/em> <small>Ich weiß es nicht.<\/small><\/li><li><em>Non mi è piaciuto.<\/em> <small>Es hat mir nicht gefallen.<\/small><\/li><\/ul><p><b>Doppelte Verneinung<\/b> ist im Italienischen korrekt und notwendig: <em>non<\/em> + Verb + zweites Negationswort.<\/p><table><tr><th>Ausdruck<\/th><th>Deutsch<\/th><\/tr><tr><td><em>non … mai<\/em><\/td><td>nie<\/td><\/tr><tr><td><em>non … niente / nulla<\/em><\/td><td>nichts<\/td><\/tr><tr><td><em>non … nessuno<\/em><\/td><td>niemand, kein<\/td><\/tr><tr><td><em>non … più<\/em><\/td><td>nicht mehr<\/td><\/tr><tr><td><em>non … ancora<\/em><\/td><td>noch nicht<\/td><\/tr><tr><td><em>non … neanche / nemmeno<\/em><\/td><td>nicht einmal, auch nicht<\/td><\/tr><tr><td><em>non … affatto / per niente<\/em><\/td><td>überhaupt nicht<\/td><\/tr><tr><td><em>non … né … né<\/em><\/td><td>weder … noch<\/td><\/tr><\/table><ul><li><em>Non ho visto nessuno.<\/em> <small>Ich habe niemanden gesehen.<\/small><\/li><li><em>Non fumo più.<\/em> <small>Ich rauche nicht mehr.<\/small><\/li><li><em>Non sono affatto d'accordo.<\/em> <small>Ich bin überhaupt nicht einverstanden.<\/small><\/li><\/ul><p>Steht das Negationswort <b>vor dem Verb<\/b> (am Satzanfang), entfällt <em>non<\/em>:<\/p><ul><li><em>Nessuno è venuto.<\/em> <small>Niemand ist gekommen.<\/small><\/li><li><em>Niente è cambiato.<\/em> <small>Nichts hat sich verändert.<\/small><\/li><li><em>Mai visto una cosa simile!<\/em> <small>So etwas noch nie gesehen!<\/small><\/li><\/ul><div class=\"warn\">Achtung: *Ho visto nessuno ist falsch – es heißt <em>Non ho visto nessuno<\/em>. Umgekehrt: *Non nessuno è venuto ist ebenso falsch.<\/div><div class=\"tip\">Bei zusammengesetzten Zeiten: <em>mai, più, ancora<\/em> zwischen Hilfsverb und Partizip, <em>niente, nessuno<\/em> danach: <em>Non ho mai detto niente a nessuno<\/em>.<\/div>"},{"h":"Der Fragesatz","html":"<p><b>Ja/Nein-Fragen<\/b> unterscheiden sich vom Aussagesatz oft nur durch die <b>Intonation<\/b> (Stimme hebt sich am Ende) – die Wortstellung bleibt gleich.<\/p><ul><li><em>Hai fame?<\/em> <small>Hast du Hunger?<\/small><\/li><li><em>Paolo viene stasera?<\/em> <small>Kommt Paolo heute Abend?<\/small><\/li><\/ul><p>Häufig rückt das Subjekt ans <b>Satzende<\/b>: <em>Viene stasera, Paolo?<\/em><\/p><p><b>W-Fragen:<\/b> Fragewort am Anfang, direkt danach das Verb; ein Subjekt steht <b>hinter dem Verb<\/b>:<\/p><ul><li><em>Dove abita tua cugina?<\/em> <small>Wo wohnt deine Cousine?<\/small><\/li><li><em>Quando parte il treno?<\/em> <small>Wann fährt der Zug ab?<\/small><\/li><li><em>Che cosa ha detto il professore?<\/em> <small>Was hat der Professor gesagt?<\/small><\/li><li><em>Con chi esci stasera?<\/em> <small>Mit wem gehst du heute Abend aus?<\/small><\/li><\/ul><div class=\"warn\">Achtung: Die Präposition steht immer <b>vor<\/b> dem Fragewort: <em>Di dove sei?<\/em> <small>Woher kommst du?<\/small>, <em>A chi scrivi?<\/em> <small>Wem schreibst du?<\/small> – nie am Satzende wie im Englischen.<\/div><div class=\"tip\"><em>Come mai?<\/em> = „Wie kommt es, dass…?“ – steht ohne Inversion: <em>Come mai Luisa non è venuta?<\/em><\/div>"},{"h":"Hauptsätze verbinden","html":"<p>Zwei Hauptsätze werden durch beiordnende Konjunktionen (<em>e, ma, o, però, quindi, infatti<\/em> …) oder einfach durch Komma/Semikolon verbunden. Die Wortstellung bleibt in beiden Teilen SVO.<\/p><ul><li><em>Ho fame, ma non ho tempo di mangiare.<\/em> <small>Ich habe Hunger, aber keine Zeit zu essen.<\/small><\/li><li><em>Il negozio era chiuso, quindi siamo tornati a casa.<\/em> <small>Der Laden war geschlossen, also sind wir nach Hause gegangen.<\/small><\/li><li><em>Entra, siediti, mettiti comodo.<\/em> <small>Komm rein, setz dich, mach es dir bequem.<\/small><\/li><\/ul><div class=\"tip\">Bei gleichem Subjekt wird es im zweiten Satz nicht wiederholt: <em>Luisa si alza e (Ø) va in bagno<\/em>.<\/div>"},{"h":"Haupt- und Nebensatz","html":"<p>Nebensätze werden durch unterordnende Konjunktionen, Relativpronomen oder Fragewörter eingeleitet. <b>Entscheidend:<\/b> Auch im Nebensatz steht das Verb <b>nicht am Ende<\/b>.<\/p><table><tr><th>Deutsch<\/th><th>Italienisch<\/th><\/tr><tr><td>…, weil ich keine Zeit <b>habe<\/b>.<\/td><td><em>…, perché non <b>ho<\/b> tempo.<\/em><\/td><\/tr><tr><td>…, dass er morgen <b>kommt<\/b>.<\/td><td><em>…, che <b>viene<\/b> domani.<\/em><\/td><\/tr><tr><td>…, ob sie es <b>gewusst hat<\/b>.<\/td><td><em>…, se lo <b>ha saputo<\/b>.<\/em><\/td><\/tr><\/table><ul><li><em>Credo che Luca abbia ragione.<\/em> <small>Ich glaube, dass Luca recht hat.<\/small><\/li><li><em>Il ragazzo che hai conosciuto ieri è mio nipote.<\/em> <small>Der Junge, den du gestern kennengelernt hast, ist mein Neffe.<\/small><\/li><li><em>Quando sono arrivato, lo spettacolo era già cominciato.<\/em> <small>Als ich ankam, hatte die Vorstellung schon begonnen.<\/small><\/li><\/ul><p>Der Nebensatz kann vor oder nach dem Hauptsatz stehen; der Hauptsatz behält dabei seine Wortstellung (keine Inversion wie im Deutschen „…, <b>kam<\/b> er“).<\/p><div class=\"warn\">Achtung: Die Konjunktion <em>che<\/em> wird in der Regel nicht weggelassen. Nur vor einem congiuntivo nach Verben des Meinens ist die Auslassung möglich (<em>Penso sia vero<\/em>), v. a. in Presse und Alltag. Vor <em>che<\/em> (dass) steht im Italienischen <b>kein Komma<\/b>.<\/div>"},{"h":"Satzverkürzung: Infinitiv, Gerundium, Partizip","html":"<p>Bei <b>gleichem Subjekt<\/b> ersetzt man Nebensätze gern durch kürzere Konstruktionen:<\/p><table><tr><th>Konstruktion<\/th><th>Beispiel<\/th><th>statt<\/th><\/tr><tr><td>Infinitiv<\/td><td><em>Spero di vincere.<\/em><\/td><td><em>*Spero che io vinca.<\/em><\/td><\/tr><tr><td>Infinitiv<\/td><td><em>Prima di uscire chiudo le finestre.<\/em><\/td><td><em>*Prima che io esca…<\/em><\/td><\/tr><tr><td>Gerundium<\/td><td><em>Tornando a casa, ho incontrato Gino.<\/em><\/td><td><em>Mentre tornavo…<\/em><\/td><\/tr><tr><td>Gerundium<\/td><td><em>Studiando di più, passeresti l'esame.<\/em><\/td><td><em>Se studiassi…<\/em><\/td><\/tr><tr><td>Partizip<\/td><td><em>Finita la cena, siamo usciti.<\/em><\/td><td><em>Dopo che avevamo finito…<\/em><\/td><\/tr><tr><td>Infinitiv Perf.<\/td><td><em>Dopo aver mangiato, faccio un pisolino.<\/em><\/td><td><em>Dopo che ho mangiato…<\/em><\/td><\/tr><\/table><ul><li><em>Penso di partire domani.<\/em> <small>Ich habe vor, morgen abzureisen.<\/small><\/li><li><em>Essendo malato, Franco è rimasto a letto.<\/em> <small>Da er krank war, blieb Franco im Bett.<\/small><\/li><li><em>Arrivati alla stazione, abbiamo preso un caffè.<\/em> <small>Am Bahnhof angekommen, haben wir einen Kaffee getrunken.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Bei gleichem Subjekt ist der Infinitiv nach Verben des Meinens/Wünschens <b>Pflicht<\/b>: <em>Credo di avere ragione<\/em>, nicht *Credo che io abbia ragione.<\/div><div class=\"tip\">Das Partizip in der Verkürzung richtet sich nach dem Objekt bzw. Subjekt: <em>Finite le lezioni, …<\/em>, <em>Partita Anna, …<\/em>.<\/div>"}],"exercises":[{"type":"choice","title":"Wortstellung im Aussagesatz","task":"Wähle den korrekten bzw. passenden Satz.","items":[{"q":"„Morgen fährt meine Mutter nach Rom.“","options":["Domani mia madre va a Roma.","Domani mia madre a Roma va."],"a":0,"why":"Nach der Zeitangabe bleibt SVO; keine Verbzweitstellung."},{"q":"Antwort auf: „Chi ha telefonato?“","options":["Il dottore ha telefonato.","Ha telefonato il dottore."],"a":1,"why":"Neue Information (wer?) steht nach dem Verb."},{"q":"„Es fehlen zwei Stühle.“","options":["Mancano due sedie.","Due sedie manca."],"a":0,"why":"Subjekt nach dem Verb, Verb im Plural."},{"q":"„Den Wein habe ich mitgebracht.“","options":["Il vino ho portato io.","Il vino l'ho portato io."],"a":1,"why":"Linksversetzung verlangt das Pronomen lo."},{"q":"„Die Zeitungen habe ich weggeworfen.“","options":["I giornali li ho buttati.","I giornali li ho buttato."],"a":0,"why":"Partizip gleicht sich an li an → buttati."},{"q":"„Paolo war es, der angerufen hat.“","options":["È Paolo chi ha telefonato.","È stato Paolo a telefonare."],"a":1,"why":"Spaltsatz: essere + … + a + Infinitiv (oder che)."},{"q":"„Wir wohnen in Pisa.“ (neutral)","options":["Noi abitiamo a Pisa.","Abitiamo a Pisa."],"a":1,"why":"Subjektpronomen nur bei Betonung."},{"q":"„Marco ist angekommen.“ (Antwort auf: Was ist mit Marco?)","options":["Marco è arrivato.","È arrivato Marco."],"a":0,"why":"Marco ist bekannt (Thema) → steht vorne."}]},{"type":"gap","title":"Doppelte Verneinung","task":"Ergänze das fehlende Wort (non oder Negationswort).","items":[{"q":"___ ho mai visto il mare d'inverno.","a":["Non","non"],"de":"Ich habe das Meer im Winter nie gesehen."},{"q":"Non ho detto ___ a nessuno. (nichts)","a":["niente","nulla"],"de":"Ich habe niemandem etwas gesagt."},{"q":"___ mi ha aiutato. (niemand)","a":["Nessuno","nessuno"],"de":"Niemand hat mir geholfen."},{"q":"Mio nonno non guida ___. (nicht mehr)","a":["più"],"de":"Mein Großvater fährt nicht mehr Auto."},{"q":"Il pacco non è ___ arrivato. (noch nicht)","a":["ancora"],"de":"Das Paket ist noch nicht angekommen."},{"q":"Questo film non mi è piaciuto ___. (überhaupt nicht)","a":["affatto","per niente","per nulla"],"de":"Dieser Film hat mir überhaupt nicht gefallen."},{"q":"Non ha telefonato ___ sua madre. (nicht einmal)","a":["neanche","nemmeno","neppure"],"de":"Nicht einmal seine Mutter hat angerufen."},{"q":"___ è cambiato in questo paese. (nichts)","a":["Niente","Nulla","niente","nulla"],"de":"Nichts hat sich in diesem Dorf verändert."},{"q":"Non conosco ___ in questa città. (niemand)","a":["nessuno"],"de":"Ich kenne niemanden in dieser Stadt."}]},{"type":"choice","title":"Fragen richtig bilden","task":"Wähle die korrekte Frage.","items":[{"q":"„Woher kommt Ihr Mann?“","options":["Di dove è Suo marito?","Dove è Suo marito di?"],"a":0,"why":"Präposition vor dem Fragewort."},{"q":"„Wann beginnt der Film?“","options":["Quando il film comincia?","Quando comincia il film?"],"a":1,"why":"Nach dem Fragewort folgt das Verb, Subjekt dahinter."},{"q":"„Mit wem sprichst du?“","options":["Con chi parli?","Chi parli con?"],"a":0,"why":"Präposition steht vor chi."},{"q":"„Hast du die Fahrkarten?“","options":["Hai i biglietti?","Hai tu i biglietti?"],"a":0,"why":"Ja/Nein-Frage: gleiche Wortstellung, nur Intonation."},{"q":"„Wie viel kostet die Tasche?“","options":["Quanto la borsa costa?","Quanto costa la borsa?"],"a":1,"why":"Fragewort – Verb – Subjekt."},{"q":"„Was hat dein Bruder gekauft?“","options":["Che cosa tuo fratello ha comprato?","Che cosa ha comprato tuo fratello?"],"a":1,"why":"Fragewort – Verb – Subjekt."},{"q":"„Wem hast du das Geschenk gegeben?“","options":["A chi hai dato il regalo?","Chi hai dato il regalo a?"],"a":0,"why":"a vor chi."}]},{"type":"gap","title":"Satzverkürzung","task":"Ergänze die verkürzte Form (Infinitiv, Gerundium oder Partizip) des Verbs in Klammern.","items":[{"q":"Spero di (trovare) ___ presto un lavoro.","a":["trovare"],"de":"Ich hoffe, bald eine Arbeit zu finden."},{"q":"(Passeggiare) ___ nel parco, ho perso il portafoglio. (Gerundium)","a":["Passeggiando","passeggiando"],"de":"Beim Spazierengehen im Park habe ich den Geldbeutel verloren."},{"q":"(Finire) ___ i compiti, i ragazzi sono usciti a giocare. (Partizip)","a":["Finiti","finiti"],"de":"Als die Hausaufgaben fertig waren, gingen die Jungen zum Spielen hinaus."},{"q":"Dopo aver (leggere) ___ la lettera, l'ha strappata.","a":["letto"],"de":"Nachdem er den Brief gelesen hatte, zerriss er ihn."},{"q":"(Essere) ___ stanchi, siamo rimasti a casa. (Gerundium)","a":["Essendo","essendo"],"de":"Da wir müde waren, sind wir zu Hause geblieben."},{"q":"(Partire) ___ gli ospiti, abbiamo riordinato la casa. (Partizip)","a":["Partiti","partiti"],"de":"Nachdem die Gäste abgereist waren, haben wir das Haus aufgeräumt."},{"q":"Credo di (avere) ___ sbagliato. (Hilfsverb im Infinitiv)","a":["avere","aver"],"de":"Ich glaube, dass ich mich geirrt habe."},{"q":"Prima di (andare) ___ a letto, spegni la luce in cucina.","a":["andare"],"de":"Bevor du ins Bett gehst, mach das Licht in der Küche aus."}]},{"type":"choice","title":"Typische Fehler deutscher Lerner","task":"Welcher Satz ist korrekt?","items":[{"q":"„Ich weiß, dass er morgen kommt.“","options":["So che domani lui viene.","So che lui domani viene.","Beide sind korrekt."],"a":2,"why":"Im Nebensatz keine Verbendstellung; beide Stellungen der Zeitangabe sind möglich."},{"q":"„…, weil sie keine Zeit hat.“","options":["…, perché lei tempo non ha.","…, perché non ha tempo."],"a":1,"why":"Keine Verbendstellung im Nebensatz."},{"q":"„Ich habe niemanden getroffen.“","options":["Ho incontrato nessuno.","Non ho incontrato nessuno."],"a":1,"why":"nessuno nach dem Verb verlangt non."},{"q":"„Niemand weiß es.“","options":["Nessuno lo sa.","Nessuno non lo sa."],"a":0,"why":"Negationswort vor dem Verb → kein non."},{"q":"„Ich glaube, ich habe recht.“","options":["Credo che io abbia ragione.","Credo di avere ragione."],"a":1,"why":"Gleiches Subjekt → di + Infinitiv."},{"q":"„Morgen gehe ich ins Kino, weil ich frei habe.“","options":["Domani vado al cinema, perché libero sono.","Domani vado al cinema, perché sono libero."],"a":1,"why":"Keine Verbendstellung im Nebensatz."},{"q":"„Sie sagt, dass es regnet.“","options":["Dice, che piove.","Dice che piove."],"a":1,"why":"Vor che (dass) kein Komma."},{"q":"„Das Buch? Ich habe es noch nicht gelesen.“","options":["Il libro? Non l'ho ancora letto.","Il libro? Non ho ancora letto."],"a":0,"why":"Objekt muss durch lo wieder aufgenommen werden."}]}],"cards":[{"f":"Grundwortstellung im Italienischen","b":"Subjekt – Verb – Objekt (SVO), auch im Nebensatz"},{"f":"Subjektpronomen – wann?","b":"nur zur Betonung/Gegenüberstellung: Io lavoro, tu dormi."},{"f":"Verbzweitstellung nach Zeitangabe?","b":"Nein, SVO bleibt: Domani Franco parte."},{"f":"Marco ist angekommen. (Wer? – Marco)","b":"È arrivato Marco. – Neues steht hinten."},{"f":"Es ist ein Unfall passiert.","b":"È successo un incidente."},{"f":"Den Kaffee trinke ich bitter.","b":"Il caffè lo bevo amaro. (Linksversetzung + Pronomen)"},{"f":"Linksversetzung im passato prossimo","b":"Partizip angleichen: Le foto le ho stampate."},{"f":"Maria war es, die …","b":"È Maria che … / È stata Maria a + Infinitiv"},{"f":"Stellung von non","b":"direkt vor dem Verb, nur unbetonte Pronomen dazwischen: Non lo so."},{"f":"nie / nichts / niemand","b":"non … mai / non … niente (nulla) / non … nessuno"},{"f":"nicht mehr / noch nicht","b":"non … più / non … ancora"},{"f":"überhaupt nicht","b":"non … affatto / non … per niente"},{"f":"Negationswort am Satzanfang","b":"kein non: Nessuno è venuto. Niente è cambiato."},{"f":"Ich habe niemandem etwas gesagt.","b":"Non ho detto niente a nessuno."},{"f":"Ja/Nein-Frage bilden","b":"nur Intonation: Hai fame? (oft Subjekt am Ende: Viene, Paolo?)"},{"f":"W-Frage: Stellung des Subjekts","b":"nach dem Verb: Dove abita tua cugina?"},{"f":"Woher kommst du? / Wem schreibst du?","b":"Di dove sei? / A chi scrivi? (Präposition vorne)"},{"f":"Wie kommt es, dass …?","b":"Come mai …?"},{"f":"…, weil ich keine Zeit habe.","b":"…, perché non ho tempo. (keine Verbendstellung)"},{"f":"Komma vor che (dass)?","b":"Nein: Dice che piove."},{"f":"Ich hoffe, zu gewinnen (gleiches Subjekt).","b":"Spero di vincere. (nicht *che io vinca)"},{"f":"Gerundium zur Satzverkürzung","b":"Tornando a casa, … = Mentre tornavo a casa, …"},{"f":"Partizip zur Satzverkürzung","b":"Finita la cena, … = Dopo che la cena era finita, …"},{"f":"Nachdem ich gegessen habe …","b":"Dopo aver mangiato … (Infinitiv Perfekt)"},{"f":"Da er krank war, …","b":"Essendo malato, …"}],"id":"k23"},{"nr":24,"title":"Die Präpositionen","teil":"Der Satz","intro":"Präpositionen gehören zu den schwierigsten Kapiteln für Deutschsprachige, weil ihr Gebrauch oft nicht dem Deutschen entspricht. Hier lernst du die Verschmelzung mit dem Artikel und die wichtigsten Gebrauchsregeln für Ort, Zeit, Herkunft, Zweck und Mittel.","sections":[{"h":"Die einfachen Präpositionen","html":"<p>Das Italienische hat acht einfache Präpositionen. Sie sind sehr vielseitig – eine 1:1-Übersetzung ins Deutsche gibt es selten.<\/p><table><tr><th>Präp.<\/th><th>Grundbedeutungen<\/th><\/tr><tr><td><em>di<\/em><\/td><td>von, aus (Herkunft), Besitz, Material, Thema<\/td><\/tr><tr><td><em>a<\/em><\/td><td>in, nach, zu (Ort, Ziel), um (Uhrzeit), Dativ<\/td><\/tr><tr><td><em>da<\/em><\/td><td>von, aus (Ausgangspunkt), seit, bei/zu (Person), Zweck<\/td><\/tr><tr><td><em>in<\/em><\/td><td>in, nach (Länder, Regionen), mit (Verkehrsmittel)<\/td><\/tr><tr><td><em>con<\/em><\/td><td>mit<\/td><\/tr><tr><td><em>su<\/em><\/td><td>auf, über (Thema)<\/td><\/tr><tr><td><em>per<\/em><\/td><td>für, durch, wegen, nach (Richtung), Dauer<\/td><\/tr><tr><td><em>tra / fra<\/em><\/td><td>zwischen, unter, in (Zeit ab jetzt)<\/td><\/tr><\/table><div class=\"tip\"><em>tra<\/em> und <em>fra<\/em> sind gleichbedeutend. Man wählt nach Wohlklang: <em>fra tre giorni<\/em>, aber <em>tra fratelli<\/em> (statt „fra fratelli“).<\/div>"},{"h":"Verschmelzung mit dem Artikel","html":"<p><em>di, a, da, in, su<\/em> verschmelzen mit dem bestimmten Artikel:<\/p><table><tr><th><\/th><th>il / lo / l'<\/th><th>la / i<\/th><th>gli / le<\/th><\/tr><tr><td><em>di<\/em><\/td><td><em>del / dello / dell'<\/em><\/td><td><em>della / dei<\/em><\/td><td><em>degli / delle<\/em><\/td><\/tr><tr><td><em>a<\/em><\/td><td><em>al / allo / all'<\/em><\/td><td><em>alla / ai<\/em><\/td><td><em>agli / alle<\/em><\/td><\/tr><tr><td><em>da<\/em><\/td><td><em>dal / dallo / dall'<\/em><\/td><td><em>dalla / dai<\/em><\/td><td><em>dagli / dalle<\/em><\/td><\/tr><tr><td><em>in<\/em><\/td><td><em>nel / nello / nell'<\/em><\/td><td><em>nella / nei<\/em><\/td><td><em>negli / nelle<\/em><\/td><\/tr><tr><td><em>su<\/em><\/td><td><em>sul / sullo / sull'<\/em><\/td><td><em>sulla / sui<\/em><\/td><td><em>sugli / sulle<\/em><\/td><\/tr><\/table><p><em>con<\/em> und <em>per<\/em> verschmelzen heute normalerweise <b>nicht<\/b>: <em>con il treno, per la strada<\/em>. (<em>col, coi<\/em> hört man noch, v. a. mündlich.) <em>tra/fra<\/em> verschmelzen nie.<\/p><ul><li><em>Il libro è sul tavolo.<\/em> <small>Das Buch liegt auf dem Tisch.<\/small><\/li><li><em>Torno dall'ufficio alle sei.<\/em> <small>Ich komme um sechs aus dem Büro zurück.<\/small><\/li><li><em>Il gatto dorme nello scatolone.<\/em> <small>Die Katze schläft im großen Karton.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Vor Städtenamen und den meisten Personennamen gibt es keinen Artikel – also auch keine Verschmelzung: <em>a Milano, di Paolo<\/em>.<\/div>"},{"h":"Ortsangaben: a oder in?","html":"<table><tr><th>Ziel/Ort<\/th><th>Präposition<\/th><th>Beispiel<\/th><\/tr><tr><td>Städte, Dörfer, kleine Inseln<\/td><td><em>a<\/em><\/td><td><em>a Roma, a Capri<\/em><\/td><\/tr><tr><td>Länder, Regionen, große Inseln, Kontinente<\/td><td><em>in<\/em><\/td><td><em>in Italia, in Toscana, in Sicilia, in Asia<\/em><\/td><\/tr><tr><td>mit Attribut / Plural-Länder<\/td><td><em>in<\/em> + Artikel<\/td><td><em>negli Stati Uniti, nell'Italia del Sud<\/em><\/td><\/tr><\/table><p>Bei vielen <b>Gebäuden und Orten<\/b> sind <em>in<\/em> oder <em>a<\/em> ohne Artikel feste Gewohnheit:<\/p><table><tr><th>mit <em>in<\/em><\/th><th>mit <em>a<\/em> / <em>al<\/em><\/th><\/tr><tr><td><em>in banca, in farmacia, in ufficio, in biblioteca, in chiesa, in montagna, in centro, in città, in giardino, in cucina<\/em><\/td><td><em>a scuola, a casa, a letto, a teatro; al cinema, al mare, al bar, al supermercato, all'università, al ristorante<\/em><\/td><\/tr><\/table><p>Mit näherer Bestimmung kommt der Artikel dazu: <em>in banca<\/em> → <em>nella banca di mio padre<\/em>; <em>a casa<\/em> → <em>nella casa dei nonni<\/em>.<\/p><p><b>da + Person<\/b> = zu/bei jemandem: <em>vado dal medico, sono da Laura, ceniamo dai nonni<\/em>.<\/p><ul><li><em>Stasera dormo da mia sorella.<\/em> <small>Heute Nacht schlafe ich bei meiner Schwester.<\/small><\/li><li><em>Mio figlio studia a Bologna, in Emilia-Romagna.<\/em> <small>Mein Sohn studiert in Bologna, in der Emilia-Romagna.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Im Italienischen unterscheidet man nicht zwischen „wo?“ und „wohin?“: <em>Sono a Napoli<\/em> / <em>Vado a Napoli<\/em>; <em>Abito in Spagna<\/em> / <em>Vado in Spagna<\/em>.<\/div>"},{"h":"Zeitangaben","html":"<table><tr><th>Bedeutung<\/th><th>Präposition<\/th><th>Beispiel<\/th><\/tr><tr><td>Uhrzeit<\/td><td><em>a<\/em> + Artikel<\/td><td><em>alle otto, a mezzogiorno, all'una<\/em><\/td><\/tr><tr><td>Monat<\/td><td><em>a / in<\/em><\/td><td><em>a maggio / in maggio<\/em><\/td><\/tr><tr><td>Jahr, Jahreszeit<\/td><td><em>nel / in<\/em><\/td><td><em>nel 2019, in estate / d'estate<\/em><\/td><\/tr><tr><td>Tageszeit<\/td><td><em>di / la<\/em><\/td><td><em>di sera, di notte, la mattina<\/em><\/td><\/tr><tr><td>seit<\/td><td><em>da<\/em><\/td><td><em>abito qui da tre anni / dal 2020<\/em><\/td><\/tr><tr><td>in (ab jetzt)<\/td><td><em>fra / tra<\/em><\/td><td><em>parto fra due giorni<\/em><\/td><\/tr><tr><td>Dauer<\/td><td><em>per<\/em> (oft weglassbar)<\/td><td><em>ho lavorato (per) due ore<\/em><\/td><\/tr><tr><td>innerhalb von<\/td><td><em>in<\/em><\/td><td><em>l'ho fatto in un'ora<\/em><\/td><\/tr><tr><td>bis<\/td><td><em>fino a<\/em><\/td><td><em>fino a domenica<\/em><\/td><\/tr><\/table><ul><li><em>Studio italiano da sei mesi.<\/em> <small>Ich lerne seit sechs Monaten Italienisch.<\/small><\/li><li><em>Il film comincia fra dieci minuti.<\/em> <small>Der Film beginnt in zehn Minuten.<\/small><\/li><li><em>Abbiamo dipinto la stanza in un giorno.<\/em> <small>Wir haben das Zimmer an einem Tag gestrichen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: „seit“ + <b>Präsens<\/b>: <em>Lavoro qui da due anni<\/em> (Ich arbeite seit zwei Jahren hier), nicht passato prossimo! Und „in zwei Tagen“ (Zukunft) = <em>fra due giorni<\/em>, nicht *in due giorni.<\/div><div class=\"tip\">Wochentage ohne Präposition: <em>lunedì<\/em> = am Montag, <em>il lunedì<\/em> = montags.<\/div>"},{"h":"Herkunft: essere di – venire da","html":"<ul><li><em>Sono di Milano.<\/em> <small>Ich bin aus Mailand. (Herkunft, Heimatort)<\/small><\/li><li><em>Vengo da Milano.<\/em> <small>Ich komme aus Mailand. (Herkunft oder gerade von dort)<\/small><\/li><li><em>Vengo dalla Germania.<\/em> <small>Ich komme aus Deutschland.<\/small><\/li><li><em>Di dove sei? – Sono di Bari.<\/em> <small>Woher kommst du? – Ich bin aus Bari.<\/small><\/li><\/ul><div class=\"tip\">Merke: <em>essere di<\/em> + Stadt (ohne Artikel). Bei Ländern sagt man meist <em>sono tedesco/tedesca<\/em> oder <em>vengo dalla Germania<\/em>.<\/div><p><em>da<\/em> drückt allgemein den <b>Ausgangspunkt<\/b> aus: <em>Il treno parte da Firenze<\/em>, <em>esco dall'ufficio<\/em>, <em>lontano da casa<\/em>.<\/p><div class=\"warn\">Achtung: *Sono da Milano ist falsch.<\/div>"},{"h":"Zweck, Eigenschaft und Inhalt: da oder di?","html":"<p><b>da<\/b> + Substantiv/Infinitiv gibt den <b>Zweck<\/b> oder die <b>Bestimmung<\/b> an:<\/p><ul><li><em>una macchina da scrivere<\/em> <small>eine Schreibmaschine<\/small><\/li><li><em>gli occhiali da sole<\/em> <small>die Sonnenbrille<\/small><\/li><li><em>le scarpe da ginnastica<\/em> <small>die Turnschuhe<\/small><\/li><li><em>una camera da letto<\/em> <small>ein Schlafzimmer<\/small><\/li><li><em>qualcosa da bere<\/em> <small>etwas zu trinken<\/small><\/li><\/ul><p><b>di<\/b> gibt den <b>Inhalt<\/b> an:<\/p><table><tr><th>Zweck (da)<\/th><th>Inhalt (di)<\/th><\/tr><tr><td><em>una tazza da tè<\/em> <small>eine Teetasse<\/small><\/td><td><em>una tazza di tè<\/em> <small>eine Tasse Tee<\/small><\/td><\/tr><tr><td><em>un bicchiere da vino<\/em> <small>ein Weinglas<\/small><\/td><td><em>un bicchiere di vino<\/em> <small>ein Glas Wein<\/small><\/td><\/tr><\/table><p><b>da<\/b> beschreibt auch Eigenschaften und Art und Weise: <em>la ragazza dai capelli rossi<\/em> <small>das Mädchen mit den roten Haaren<\/small>, <em>comportarsi da amico<\/em> <small>sich wie ein Freund verhalten<\/small>, <em>da bambino<\/em> <small>als Kind<\/small>.<\/p><div class=\"tip\">Eselsbrücke: <b>da<\/b> = wozu ist es da? <b>di<\/b> = was ist drin?<\/div>"},{"h":"Material, Besitz und Thema","html":"<p><b>Material:<\/b> <em>di<\/em> oder (etwas gehobener/werblich) <em>in<\/em>:<\/p><ul><li><em>un tavolo di legno / in legno<\/em> <small>ein Holztisch<\/small><\/li><li><em>una collana d'oro<\/em> <small>eine Goldkette<\/small><\/li><li><em>una borsa in pelle<\/em> <small>eine Ledertasche<\/small><\/li><\/ul><p><b>Besitz und Zugehörigkeit:<\/b> <em>di<\/em>: <em>la macchina di Franco, il centro della città<\/em>.<\/p><p><b>Thema:<\/b> <em>di<\/em> oder <em>su<\/em>: <em>un libro di storia<\/em> (Geschichtsbuch), <em>un libro sulla storia di Venezia<\/em> (ein Buch über …), <em>parlare di politica<\/em>.<\/p><div class=\"warn\">Achtung: Das deutsche Kompositum wird oft mit <em>di<\/em> oder <em>da<\/em> aufgelöst – genau überlegen: <em>succo d'arancia<\/em> (Orangensaft, Inhalt) vs. <em>spazzolino da denti<\/em> (Zahnbürste, Zweck).<\/div>"},{"h":"Mittel und Begleitung","html":"<p><b>Verkehrsmittel:<\/b> <em>in<\/em> ohne Artikel; mit näherer Bestimmung <em>con<\/em> + Artikel. Zu Fuß = <em>a piedi<\/em>.<\/p><table><tr><th>Ausdruck<\/th><th>Deutsch<\/th><\/tr><tr><td><em>in treno, in macchina, in aereo, in bici<\/em><\/td><td>mit dem Zug, Auto, Flugzeug, Rad<\/td><\/tr><tr><td><em>con la macchina di Luca<\/em><\/td><td>mit Lucas Auto<\/td><\/tr><tr><td><em>con il treno delle otto<\/em><\/td><td>mit dem Acht-Uhr-Zug<\/td><\/tr><tr><td><em>a piedi, a cavallo<\/em><\/td><td>zu Fuß, zu Pferd<\/td><\/tr><\/table><p><b>con<\/b> = Begleitung, Werkzeug, Art und Weise: <em>esco con gli amici, taglio il pane con il coltello, lavora con attenzione<\/em>.<\/p><p><b>per<\/b> bei Kommunikationswegen: <em>per telefono, per posta, per email<\/em>.<\/p><div class=\"warn\">Achtung: Nach <em>in<\/em> steht beim Verkehrsmittel kein Artikel: <em>in macchina<\/em>. <em>nella macchina<\/em> hieße „im (Inneren des) Auto(s)“. „mit der Hand“ = <em>a mano<\/em>: <em>fatto a mano<\/em>.<\/div>"},{"h":"su, per und tra im Einzelnen","html":"<p><b>su<\/b>: auf (mit Kontakt), über (Thema), ungefähr (Alter, Menge), von (Verhältnis):<\/p><ul><li><em>Le chiavi sono sul tavolo.<\/em> <small>Die Schlüssel liegen auf dem Tisch.<\/small><\/li><li><em>Un uomo sui cinquant'anni.<\/em> <small>Ein Mann um die fünfzig.<\/small><\/li><li><em>Tre studenti su dieci.<\/em> <small>Drei von zehn Studenten.<\/small><\/li><\/ul><p><b>per<\/b>: für, wegen, durch, Richtung, Dauer, Zweck mit Infinitiv:<\/p><ul><li><em>Questo regalo è per te.<\/em> <small>Dieses Geschenk ist für dich.<\/small><\/li><li><em>Abbiamo passeggiato per il centro.<\/em> <small>Wir sind durch die Innenstadt spaziert.<\/small><\/li><li><em>Il treno per Torino è in ritardo.<\/em> <small>Der Zug nach Turin hat Verspätung.<\/small><\/li><li><em>Sono venuto per aiutarti.<\/em> <small>Ich bin gekommen, um dir zu helfen.<\/small><\/li><\/ul><p><b>tra/fra<\/b>: zwischen, unter (einer Gruppe), in (Zeit, Entfernung):<\/p><ul><li><em>La farmacia è tra la banca e il bar.<\/em> <small>Die Apotheke ist zwischen der Bank und der Bar.<\/small><\/li><li><em>Tra noi c'è un buon rapporto.<\/em> <small>Unter uns herrscht ein gutes Verhältnis.<\/small><\/li><li><em>Fra cento metri giri a destra.<\/em> <small>In hundert Metern biegst du rechts ab.<\/small><\/li><\/ul><div class=\"tip\">Zweck mit Infinitiv: <em>per<\/em> + Infinitiv = um … zu.<\/div>"},{"h":"Weitere Präpositionen mit eigener Bedeutung","html":"<table><tr><th>Präposition<\/th><th>Deutsch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>sopra / sotto<\/em><\/td><td>über / unter<\/td><td><em>sotto il letto<\/em><\/td><\/tr><tr><td><em>dentro / fuori (di)<\/em><\/td><td>in, innerhalb / außerhalb<\/td><td><em>fuori città<\/em><\/td><\/tr><tr><td><em>davanti a / dietro (a)<\/em><\/td><td>vor / hinter<\/td><td><em>davanti alla chiesa<\/em><\/td><\/tr><tr><td><em>vicino a / lontano da<\/em><\/td><td>nahe bei / weit weg von<\/td><td><em>vicino al porto<\/em><\/td><\/tr><tr><td><em>accanto a / di fronte a<\/em><\/td><td>neben / gegenüber<\/td><td><em>di fronte alla stazione<\/em><\/td><\/tr><tr><td><em>prima di / dopo<\/em><\/td><td>vor (zeitl.) / nach<\/td><td><em>prima di cena, dopo pranzo<\/em><\/td><\/tr><tr><td><em>durante<\/em><\/td><td>während<\/td><td><em>durante il viaggio<\/em><\/td><\/tr><tr><td><em>senza<\/em><\/td><td>ohne<\/td><td><em>senza zucchero<\/em><\/td><\/tr><tr><td><em>verso<\/em><\/td><td>gegen, in Richtung<\/td><td><em>verso le nove, verso il mare<\/em><\/td><\/tr><tr><td><em>contro<\/em><\/td><td>gegen (Gegnerschaft)<\/td><td><em>contro il vento<\/em><\/td><\/tr><tr><td><em>insieme a / con<\/em><\/td><td>zusammen mit<\/td><td><em>insieme ai colleghi<\/em><\/td><\/tr><tr><td><em>invece di<\/em><\/td><td>statt<\/td><td><em>invece del vino<\/em><\/td><\/tr><tr><td><em>a causa di / grazie a<\/em><\/td><td>wegen / dank<\/td><td><em>a causa della neve<\/em><\/td><\/tr><\/table><p>Vor <b>Personalpronomen<\/b> brauchen viele dieser Präpositionen <em>di<\/em>: <em>senza di te, dopo di lui, dietro di me, contro di noi, sopra di noi<\/em>.<\/p><div class=\"warn\">Achtung: „vor“ ist im Italienischen zweierlei: räumlich <em>davanti a<\/em> (<em>davanti al cinema<\/em>), zeitlich <em>prima di<\/em> (<em>prima del film<\/em>). Und „vor drei Tagen“ = <em>tre giorni fa<\/em>!<\/div><div class=\"tip\"><em>verso<\/em> + Uhrzeit = gegen: <em>verso le otto<\/em>. <em>contro<\/em> = gegen jemanden/etwas: <em>votare contro la proposta<\/em>.<\/div>"},{"h":"Feste Wendungen","html":"<table><tr><th>Wendung<\/th><th>Deutsch<\/th><\/tr><tr><td><em>a mano, a memoria, a voce<\/em><\/td><td>von Hand, auswendig, mündlich<\/td><\/tr><tr><td><em>a piedi, a letto, a tavola<\/em><\/td><td>zu Fuß, im/ins Bett, bei/zu Tisch<\/td><\/tr><tr><td><em>di corsa, di fretta, di nascosto<\/em><\/td><td>eilig, in Eile, heimlich<\/td><\/tr><tr><td><em>da solo, da vicino, da lontano<\/em><\/td><td>allein, aus der Nähe, von Weitem<\/td><\/tr><tr><td><em>in vacanza, in ferie, in pensione<\/em><\/td><td>im/in den Urlaub, im Ruhestand<\/td><\/tr><tr><td><em>in anticipo, in orario, in ritardo<\/em><\/td><td>zu früh, pünktlich, zu spät<\/td><\/tr><tr><td><em>per fortuna, per caso, per sbaglio<\/em><\/td><td>zum Glück, zufällig, aus Versehen<\/td><\/tr><tr><td><em>con calma, con piacere<\/em><\/td><td>in Ruhe, gern<\/td><\/tr><tr><td><em>su misura, su richiesta<\/em><\/td><td>maßgeschneidert, auf Anfrage<\/td><\/tr><\/table><div class=\"tip\">Diese Wendungen am besten als Ganzes lernen – Logik hilft hier wenig.<\/div>"}],"exercises":[{"type":"gap","title":"Verschmelzung","task":"Verbinde Präposition und Artikel.","items":[{"q":"Ho lasciato il cellulare (in + la) ___ borsa.","a":["nella"],"de":"Ich habe das Handy in der Tasche gelassen."},{"q":"Il gatto è salito (su + il) ___ tetto.","a":["sul"],"de":"Die Katze ist aufs Dach geklettert."},{"q":"Questo è il quaderno (di + lo) ___ studente nuovo.","a":["dello"],"de":"Das ist das Heft des neuen Schülers."},{"q":"Telefono (a + gli) ___ amici di Parma.","a":["agli"],"de":"Ich rufe die Freunde aus Parma an."},{"q":"Arrivano (da + l') ___ aeroporto alle dieci.","a":["dall'"],"de":"Sie kommen um zehn vom Flughafen."},{"q":"Ci sono molti turisti (in + gli) ___ Stati Uniti.","a":["negli"],"de":"Es gibt viele Touristen in den USA."},{"q":"Ho parlato (di + i) ___ problemi con il capo.","a":["dei"],"de":"Ich habe mit dem Chef über die Probleme gesprochen."},{"q":"I bambini giocano (su + la) ___ spiaggia.","a":["sulla"],"de":"Die Kinder spielen am Strand."},{"q":"Ho comprato un regalo (per + la) ___ nonna.","a":["per la"],"de":"Ich habe ein Geschenk für die Oma gekauft."}]},{"type":"choice","title":"Orte: a, in, da","task":"Wähle die richtige Präposition.","items":[{"q":"Quest'estate andiamo ___ Grecia.","options":["a","in","da"],"a":1,"why":"Land → in."},{"q":"Mia cugina abita ___ Firenze.","options":["a","in","da"],"a":0,"why":"Stadt → a."},{"q":"Domani devo andare ___ dentista.","options":["al","in","dal"],"a":2,"why":"Zu einer Person → da + Artikel."},{"q":"Stamattina sono andato ___ banca.","options":["a","in","da"],"a":1,"why":"Feste Wendung: in banca."},{"q":"I ragazzi sono ___ scuola fino all'una.","options":["a","in","da"],"a":0,"why":"Feste Wendung: a scuola."},{"q":"Stasera andiamo ___ cinema.","options":["a","al","nel"],"a":1,"why":"Feste Wendung: al cinema."},{"q":"Passiamo le vacanze ___ Sardegna.","options":["a","in","da"],"a":1,"why":"Große Insel → in."},{"q":"Ci vediamo ___ Marco alle nove.","options":["da","a","in"],"a":0,"why":"Bei einer Person → da."},{"q":"Lavoro ___ ufficio dalle 9 alle 17.","options":["a","in","da"],"a":1,"why":"Feste Wendung: in ufficio."},{"q":"Sono nato ___ Capri.","options":["a","in"],"a":0,"why":"Kleine Insel → a."}]},{"type":"gap","title":"Zeitangaben","task":"Setze die passende Präposition ein (mit Artikel, wenn nötig).","items":[{"q":"Il negozio apre ___ nove. (um)","a":["alle"],"de":"Das Geschäft öffnet um neun."},{"q":"Abito a Lecce ___ cinque anni. (seit)","a":["da"],"de":"Ich wohne seit fünf Jahren in Lecce."},{"q":"Ti richiamo ___ dieci minuti. (in)","a":["fra","tra"],"de":"Ich rufe dich in zehn Minuten zurück."},{"q":"Mio nonno è nato ___ 1948.","a":["nel"],"de":"Mein Großvater ist 1948 geboren."},{"q":"Ho finito il puzzle ___ due ore. (innerhalb von)","a":["in"],"de":"Ich habe das Puzzle in zwei Stunden fertig gemacht."},{"q":"Resto a Roma ___ venerdì. (bis)","a":["fino a"],"de":"Ich bleibe bis Freitag in Rom."},{"q":"Di solito lavoro ___ notte. (nachts)","a":["di"],"de":"Gewöhnlich arbeite ich nachts."},{"q":"Ci siamo conosciuti tre anni ___. (vor)","a":["fa"],"de":"Wir haben uns vor drei Jahren kennengelernt."}]},{"type":"choice","title":"da oder di?","task":"Wähle die richtige Präposition.","items":[{"q":"Vorrei una tazza ___ caffè, per favore.","options":["da","di"],"a":1,"why":"Inhalt → di."},{"q":"Mi sono dimenticato gli occhiali ___ sole.","options":["da","di"],"a":0,"why":"Zweck → da."},{"q":"Mia zia è ___ Palermo.","options":["da","di"],"a":1,"why":"essere di + Stadt."},{"q":"Questo treno viene ___ Venezia.","options":["da","di"],"a":0,"why":"venire da."},{"q":"Ho comprato un nuovo spazzolino ___ denti.","options":["da","di"],"a":0,"why":"Zweck → da."},{"q":"È un tavolo ___ legno massiccio.","options":["da","di"],"a":1,"why":"Material → di."},{"q":"Non c'è niente ___ mangiare in frigo.","options":["da","di"],"a":0,"why":"niente da + Infinitiv."},{"q":"___ bambino abitavo in campagna.","options":["Da","Di"],"a":0,"why":"da bambino = als Kind."},{"q":"Chi è la signora ___ cappello verde?","options":["dal","del"],"a":0,"why":"Eigenschaft/Merkmal → da (la signora dal cappello verde)."}]},{"type":"gap","title":"Mittel und andere Präpositionen","task":"Ergänze die passende Präposition.","items":[{"q":"Vado al lavoro ___ bicicletta.","a":["in"],"de":"Ich fahre mit dem Rad zur Arbeit."},{"q":"Siamo venuti ___ piedi.","a":["a"],"de":"Wir sind zu Fuß gekommen."},{"q":"Ti mando i documenti ___ email.","a":["per"],"de":"Ich schicke dir die Unterlagen per E-Mail."},{"q":"Non riesco a vivere senza ___ te.","a":["di"],"de":"Ich kann nicht ohne dich leben."},{"q":"La macchina è parcheggiata davanti ___ casa.","a":["a","alla"],"de":"Das Auto steht vor dem Haus."},{"q":"Abito vicino ___ stazione.","a":["alla"],"de":"Ich wohne in der Nähe des Bahnhofs."},{"q":"Il volo è stato cancellato a causa ___ nebbia.","a":["della"],"de":"Der Flug wurde wegen des Nebels gestrichen."},{"q":"Prendo un tè invece ___ caffè.","a":["del"],"de":"Ich nehme einen Tee statt des Kaffees."}]},{"type":"choice","title":"Gemischte Präpositionen (schwer)","task":"Wähle die richtige Lösung.","items":[{"q":"„Er wohnt in den Niederlanden.“ Abita ___ Paesi Bassi.","options":["in","nei","ai"],"a":1,"why":"Land im Plural → in + Artikel."},{"q":"„Wir treffen uns gegen acht.“ Ci vediamo ___ le otto.","options":["verso","contro","fra"],"a":0,"why":"Ungefähre Uhrzeit → verso."},{"q":"„Drei von vier Ärzten empfehlen es.“ Tre medici ___ quattro lo consigliano.","options":["di","su","per"],"a":1,"why":"Verhältnis → su."},{"q":"„Ich lerne seit Januar Italienisch.“","options":["Studio italiano da gennaio.","Ho studiato italiano da gennaio."],"a":0,"why":"da + Präsens für andauernde Handlung."},{"q":"„Vor dem Konzert essen wir etwas.“ ___ concerto mangiamo qualcosa.","options":["Davanti al","Prima del"],"a":1,"why":"Zeitlich → prima di."},{"q":"„Ich bin aus Versehen abgebogen.“ Ho girato ___ sbaglio.","options":["per","con","di"],"a":0,"why":"Feste Wendung: per sbaglio."},{"q":"„Sie hat das Gedicht auswendig gelernt.“ Ha imparato la poesia ___ memoria.","options":["a","di","in"],"a":0,"why":"Feste Wendung: a memoria."},{"q":"„Wir sind pünktlich angekommen.“ Siamo arrivati ___ orario.","options":["a","in","per"],"a":1,"why":"Feste Wendung: in orario."},{"q":"„Der Zug nach Neapel fährt um 9.“ Il treno ___ Napoli parte alle 9.","options":["a","per","da"],"a":1,"why":"Richtung/Ziel eines Verkehrsmittels → per."}]}],"cards":[{"f":"di + il / lo / la / i / gli / le","b":"del, dello, della, dei, degli, delle"},{"f":"a + il / lo / l' / i / gli","b":"al, allo, all', ai, agli"},{"f":"in + il / la / i / gli / le","b":"nel, nella, nei, negli, nelle"},{"f":"su + il / la / gli","b":"sul, sulla, sugli"},{"f":"Verschmelzen con / per / tra?","b":"Normalerweise nicht: con il, per la, tra i"},{"f":"Städte / Länder","b":"a Roma / in Italia (auch für „wohin?“)"},{"f":"zur Bank / in die Apotheke / ins Büro","b":"in banca / in farmacia / in ufficio"},{"f":"in die Schule / nach Hause / ins Kino","b":"a scuola / a casa / al cinema"},{"f":"zum Arzt / bei Laura","b":"dal medico / da Laura (da + Person)"},{"f":"seit drei Jahren","b":"da tre anni (+ Präsens!)"},{"f":"in zwei Tagen (Zukunft)","b":"fra/tra due giorni"},{"f":"innerhalb einer Stunde","b":"in un'ora"},{"f":"vor drei Tagen","b":"tre giorni fa"},{"f":"im Mai / im Jahr 2020","b":"a/in maggio / nel 2020"},{"f":"Ich bin aus Mailand / komme aus Mailand","b":"Sono di Milano / Vengo da Milano"},{"f":"Teetasse vs. Tasse Tee","b":"tazza da tè (Zweck) vs. tazza di tè (Inhalt)"},{"f":"Sonnenbrille / Schreibmaschine","b":"occhiali da sole / macchina da scrivere"},{"f":"etwas zu trinken","b":"qualcosa da bere"},{"f":"als Kind","b":"da bambino/bambina"},{"f":"Holztisch","b":"tavolo di legno / in legno"},{"f":"mit dem Zug / zu Fuß","b":"in treno / a piedi"},{"f":"per Telefon / per Post","b":"per telefono / per posta"},{"f":"ohne dich / hinter mir","b":"senza di te / dietro di me"},{"f":"vor (räumlich) / vor (zeitlich)","b":"davanti a / prima di"},{"f":"gegen acht Uhr / gegen die Mannschaft","b":"verso le otto / contro la squadra"},{"f":"wegen / dank","b":"a causa di / grazie a"},{"f":"statt","b":"invece di"},{"f":"drei von zehn","b":"tre su dieci"},{"f":"zu früh / pünktlich / zu spät","b":"in anticipo / in orario / in ritardo"},{"f":"zum Glück / aus Versehen","b":"per fortuna / per sbaglio"}],"id":"k24"},{"nr":25,"title":"Zahlen, Zeit- und Mengenangaben","teil":"Anhang","intro":"Zahlen, Uhrzeit, Datum und Mengen braucht man täglich – beim Einkaufen, bei Terminen, am Telefon. Dieses Kapitel fasst Schreibung und Gebrauch kompakt zusammen.","sections":[{"h":"Grundzahlen 0–100","html":"<table><tr><th><\/th><th><\/th><th><\/th><\/tr><tr><td>0 <em>zero<\/em><\/td><td>10 <em>dieci<\/em><\/td><td>20 <em>venti<\/em><\/td><\/tr><tr><td>1 <em>uno<\/em><\/td><td>11 <em>undici<\/em><\/td><td>21 <em>ventuno<\/em><\/td><\/tr><tr><td>2 <em>due<\/em><\/td><td>12 <em>dodici<\/em><\/td><td>23 <em>ventitré<\/em><\/td><\/tr><tr><td>3 <em>tre<\/em><\/td><td>13 <em>tredici<\/em><\/td><td>28 <em>ventotto<\/em><\/td><\/tr><tr><td>4 <em>quattro<\/em><\/td><td>14 <em>quattordici<\/em><\/td><td>30 <em>trenta<\/em><\/td><\/tr><tr><td>5 <em>cinque<\/em><\/td><td>15 <em>quindici<\/em><\/td><td>40 <em>quaranta<\/em><\/td><\/tr><tr><td>6 <em>sei<\/em><\/td><td>16 <em>sedici<\/em><\/td><td>50 <em>cinquanta<\/em><\/td><\/tr><tr><td>7 <em>sette<\/em><\/td><td>17 <em>diciassette<\/em><\/td><td>60 <em>sessanta<\/em><\/td><\/tr><tr><td>8 <em>otto<\/em><\/td><td>18 <em>diciotto<\/em><\/td><td>70 <em>settanta<\/em><\/td><\/tr><tr><td>9 <em>nove<\/em><\/td><td>19 <em>diciannove<\/em><\/td><td>80 <em>ottanta<\/em>, 90 <em>novanta<\/em><\/td><\/tr><\/table><p>Zehner + Einer werden <b>zusammengeschrieben<\/b>, Einer stehen hinten (anders als im Deutschen!): <em>trentacinque<\/em> = 35.<\/p><ul><li>Vor <em>uno<\/em> und <em>otto<\/em> fällt der Endvokal des Zehners weg: <em>ventuno, trentotto, quarantuno<\/em>.<\/li><li>Mit <em>tre<\/em> am Ende: Akzent! <em>ventitré, sessantatré<\/em> (aber <em>tre<\/em> allein ohne Akzent).<\/li><\/ul><div class=\"tip\">Vor einem Substantiv verhält sich <em>uno<\/em> wie der Artikel: <em>un libro, una casa<\/em>. Bei <em>ventuno<\/em> u. Ä. fällt das -o meist weg: <em>ventun anni<\/em>.<\/div>"},{"h":"Hunderter, Tausender, Millionen","html":"<table><tr><th>Zahl<\/th><th>Italienisch<\/th><\/tr><tr><td>100 / 101 / 108<\/td><td><em>cento / centouno / centootto<\/em> (auch <em>centotto<\/em>)<\/td><\/tr><tr><td>180<\/td><td><em>centottanta<\/em><\/td><\/tr><tr><td>200 / 350<\/td><td><em>duecento / trecentocinquanta<\/em><\/td><\/tr><tr><td>1000 / 2000<\/td><td><em>mille / duemila<\/em><\/td><\/tr><tr><td>1999<\/td><td><em>millenovecentonovantanove<\/em><\/td><\/tr><tr><td>2025<\/td><td><em>duemilaventicinque<\/em><\/td><\/tr><tr><td>1 000 000<\/td><td><em>un milione<\/em><\/td><\/tr><tr><td>3 000 000 000<\/td><td><em>tre miliardi<\/em><\/td><\/tr><\/table><p><em>cento<\/em> ist unveränderlich und steht ohne <em>uno<\/em>: <em>cento euro<\/em>. <em>mille<\/em> hat den Plural <em>-mila<\/em>: <em>tremila<\/em>.<\/p><p><em>milione<\/em> und <em>miliardo<\/em> sind <b>Substantive<\/b>: Sie haben einen Plural und verlangen <em>di<\/em> vor einem Substantiv:<\/p><ul><li><em>un milione di abitanti<\/em> <small>eine Million Einwohner<\/small><\/li><li><em>due milioni e mezzo di euro<\/em> <small>zweieinhalb Millionen Euro<\/small><\/li><li><em>un milione duecentomila persone<\/em> <small>1,2 Millionen Menschen (ohne di, da eine Zahl folgt)<\/small><\/li><\/ul><div class=\"warn\">Achtung: Komma und Punkt sind wie im Deutschen: <em>1.500<\/em> = 1500, <em>3,5<\/em> = <em>tre virgola cinque<\/em>. Bei vierstelligen Zahlen ist der Tausenderpunkt freiwillig (1500 oder 1.500), bei größeren üblich: 25.000.<\/div>"},{"h":"Ordnungszahlen","html":"<table><tr><th><\/th><th><\/th><th><\/th><\/tr><tr><td>1. <em>primo<\/em><\/td><td>5. <em>quinto<\/em><\/td><td>9. <em>nono<\/em><\/td><\/tr><tr><td>2. <em>secondo<\/em><\/td><td>6. <em>sesto<\/em><\/td><td>10. <em>decimo<\/em><\/td><\/tr><tr><td>3. <em>terzo<\/em><\/td><td>7. <em>settimo<\/em><\/td><td>11. <em>undicesimo<\/em><\/td><\/tr><tr><td>4. <em>quarto<\/em><\/td><td>8. <em>ottavo<\/em><\/td><td>23. <em>ventitreesimo<\/em><\/td><\/tr><\/table><p>Ab 11: Grundzahl ohne Endvokal + <em>-esimo<\/em>: <em>dodicesimo, ventesimo, centesimo, millesimo<\/em>. Bei Zahlen auf <em>-tré<\/em> und <em>-sei<\/em> bleibt der Vokal: <em>trentatreesimo, ventiseiesimo<\/em>.<\/p><p>Ordnungszahlen sind <b>Adjektive<\/b> und werden angeglichen: <em>la terza volta, i primi giorni<\/em>. Abkürzung: <em>1º, 1ª<\/em> (oder 1°).<\/p><p><b>Herrscher, Päpste:<\/b> römische Zahl, gelesen als Ordnungszahl, <b>ohne Artikel<\/b>: <em>Vittorio Emanuele II<\/em> (<em>secondo<\/em>), <em>Papa Giovanni XXIII<\/em> (<em>ventitreesimo<\/em>).<\/p><p><b>Jahrhunderte:<\/b> <em>il XV secolo / il quindicesimo secolo<\/em>. Ab dem 13. Jh. auch: <em>il Duecento<\/em> (13. Jh.), <em>il Trecento<\/em> (14. Jh.), <em>il Quattrocento<\/em> (15. Jh.) … <em>il Novecento<\/em> (20. Jh.).<\/p><div class=\"warn\">Achtung: <em>il Quattrocento<\/em> ist das <b>15.<\/b> Jahrhundert (die 1400er-Jahre), nicht das 4.! Großgeschrieben.<\/div>"},{"h":"Brüche, Prozente, Rechnen","html":"<table><tr><th>Ausdruck<\/th><th>Italienisch<\/th><\/tr><tr><td>1/2<\/td><td><em>un mezzo<\/em> / <em>la metà<\/em><\/td><\/tr><tr><td>1/3, 2/3<\/td><td><em>un terzo, due terzi<\/em><\/td><\/tr><tr><td>1/4, 3/4<\/td><td><em>un quarto, tre quarti<\/em><\/td><\/tr><tr><td>1/10<\/td><td><em>un decimo<\/em><\/td><\/tr><tr><td>1 ½<\/td><td><em>uno e mezzo<\/em><\/td><\/tr><tr><td>20 %<\/td><td><em>il venti per cento<\/em><\/td><\/tr><\/table><p>Zähler = Grundzahl, Nenner = Ordnungszahl (im Plural, wenn Zähler > 1).<\/p><ul><li><em>La metà degli studenti è assente.<\/em> <small>Die Hälfte der Studenten fehlt.<\/small><\/li><li><em>Ho letto due terzi del libro.<\/em> <small>Ich habe zwei Drittel des Buches gelesen.<\/small><\/li><li><em>I prezzi sono aumentati del cinque per cento.<\/em> <small>Die Preise sind um fünf Prozent gestiegen.<\/small><\/li><li><em>Il trenta per cento degli intervistati è d'accordo.<\/em> <small>30 Prozent der Befragten sind einverstanden.<\/small><\/li><\/ul><p>Rechnen: <em>due più tre fa cinque<\/em> (2+3=5), <em>dieci meno quattro fa sei<\/em>, <em>tre per quattro fa dodici<\/em>, <em>otto diviso due fa quattro<\/em>.<\/p><div class=\"warn\">Achtung: Prozentangaben haben den <b>Artikel<\/b>: <em>il 20%<\/em>. „um 5 % steigen“ = <em>aumentare del 5%<\/em>. „halb“ als Adjektiv: <em>mezzo litro, mezz'ora<\/em>; nach dem Substantiv <em>un'ora e mezza / mezzo<\/em>.<\/div>"},{"h":"Sammelzahlen","html":"<p>Ungefähre Mengen bildet man mit <em>-ina<\/em> (Substantive, weiblich) und <em>di<\/em>:<\/p><table><tr><th>Sammelzahl<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>una decina di<\/em><\/td><td>etwa zehn<\/td><\/tr><tr><td><em>una dozzina di<\/em><\/td><td>ein Dutzend<\/td><\/tr><tr><td><em>una ventina, trentina, quarantina …<\/em><\/td><td>etwa 20, 30, 40 …<\/td><\/tr><tr><td><em>un centinaio di<\/em> (Pl. <em>le centinaia<\/em>)<\/td><td>etwa hundert<\/td><\/tr><tr><td><em>un migliaio di<\/em> (Pl. <em>le migliaia<\/em>)<\/td><td>etwa tausend<\/td><\/tr><tr><td><em>un paio di<\/em> (Pl. <em>le paia<\/em>)<\/td><td>ein paar, ein Paar<\/td><\/tr><\/table><ul><li><em>C'erano una ventina di persone.<\/em> <small>Es waren etwa zwanzig Leute da.<\/small><\/li><li><em>Ho ricevuto centinaia di email.<\/em> <small>Ich habe Hunderte von E-Mails bekommen.<\/small><\/li><li><em>Avrà una quarantina d'anni.<\/em> <small>Er wird um die vierzig sein.<\/small><\/li><li><em>Torno fra un paio di giorni.<\/em> <small>Ich komme in ein paar Tagen zurück.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Der Plural von <em>centinaio, migliaio, paio<\/em> ist <b>weiblich<\/b> und endet auf -a: <em>le centinaia, le migliaia, due paia di scarpe<\/em>.<\/div>"},{"h":"Die Uhrzeit","html":"<p>Frage: <em>Che ore sono?<\/em> oder <em>Che ora è?<\/em> – Antwort mit <em>sono le<\/em> + Zahl (Plural, weil „Stunden“ gemeint sind):<\/p><table><tr><th>Uhrzeit<\/th><th>Italienisch<\/th><\/tr><tr><td>3:00<\/td><td><em>Sono le tre.<\/em><\/td><\/tr><tr><td>3:15<\/td><td><em>Sono le tre e un quarto / e quindici.<\/em><\/td><\/tr><tr><td>3:30<\/td><td><em>Sono le tre e mezza / e mezzo.<\/em><\/td><\/tr><tr><td>3:45<\/td><td><em>Sono le quattro meno un quarto / le tre e tre quarti.<\/em><\/td><\/tr><tr><td>3:50<\/td><td><em>Sono le quattro meno dieci.<\/em><\/td><\/tr><tr><td>1:00<\/td><td><em>È l'una.<\/em><\/td><\/tr><tr><td>12:00<\/td><td><em>È mezzogiorno.<\/em><\/td><\/tr><tr><td>0:00<\/td><td><em>È mezzanotte.<\/em><\/td><\/tr><\/table><p>„Um wie viel Uhr?“ = <em>A che ora?<\/em> – <em>alle otto, all'una, a mezzogiorno<\/em>.<\/p><p>Offiziell (Bahn, Radio) zählt man 0–24: <em>Il treno parte alle diciassette e quaranta.<\/em><\/p><div class=\"warn\">Achtung: „halb vier“ = <em>le tre e mezza<\/em> (also 3:30), nicht *le quattro e mezza! Und bei <em>una, mezzogiorno, mezzanotte<\/em> steht <em>è<\/em> statt <em>sono<\/em>.<\/div><div class=\"tip\">Tageszeit verdeutlichen: <em>le otto di mattina / di sera<\/em>, <em>le tre del pomeriggio<\/em>, <em>le due di notte<\/em>.<\/div>"},{"h":"Datum, Wochentage, Monate, Jahreszeiten","html":"<p>Datum: <b>Artikel + Grundzahl + Monat<\/b>. Nur der Erste ist eine Ordnungszahl: <em>il primo maggio<\/em>, aber <em>il due giugno, il 3 marzo 2025<\/em>. Vor 8 und 11: <em>l'8 aprile, l'11 settembre<\/em>.<\/p><ul><li><em>Che giorno è oggi? – È il 14 febbraio.<\/em> <small>Welcher Tag ist heute? – Der 14. Februar.<\/small><\/li><li><em>Sono nata il 21 luglio 1990.<\/em> <small>Ich bin am 21. Juli 1990 geboren.<\/small><\/li><li><em>Ci sposiamo nel 2027.<\/em> <small>Wir heiraten 2027.<\/small><\/li><\/ul><table><tr><th>Wochentage<\/th><th>Monate<\/th><th>Jahreszeiten<\/th><\/tr><tr><td><em>lunedì, martedì, mercoledì, giovedì, venerdì<\/em> (m.)<\/td><td><em>gennaio, febbraio, marzo, aprile, maggio, giugno<\/em><\/td><td><em>la primavera<\/em>, <em>l'estate<\/em> (f.)<\/td><\/tr><tr><td><em>sabato<\/em> (m.), <em>domenica<\/em> (f.)<\/td><td><em>luglio, agosto, settembre, ottobre, novembre, dicembre<\/em><\/td><td><em>l'autunno, l'inverno<\/em> (m.)<\/td><\/tr><\/table><p>Alles wird <b>kleingeschrieben<\/b>. <em>lunedì<\/em> = am (nächsten/letzten) Montag; <em>il lunedì<\/em> = montags (regelmäßig).<\/p><div class=\"tip\">Jahreszahl mit Artikel: <em>il 2024 è stato un anno difficile<\/em>; „im Jahr“ = <em>nel<\/em>: <em>nel 1989<\/em>. Jahrzehnte: <em>gli anni Ottanta<\/em> (die Achtziger).<\/div><div class=\"warn\">Achtung: „am 5. Mai“ = <em>il cinque maggio<\/em> – keine Präposition, keine Ordnungszahl!<\/div>"},{"h":"Mengenangaben","html":"<p>Mengen- und Behälterangaben verbinden sich mit <em>di<\/em> (ohne Artikel):<\/p><table><tr><th>Angabe<\/th><th>Beispiel<\/th><th>Deutsch<\/th><\/tr><tr><td><em>un chilo (kg)<\/em><\/td><td><em>un chilo di mele<\/em><\/td><td>ein Kilo Äpfel<\/td><\/tr><tr><td><em>mezzo chilo<\/em><\/td><td><em>mezzo chilo di pane<\/em><\/td><td>ein Pfund Brot<\/td><\/tr><tr><td><em>un etto (= 100 g)<\/em><\/td><td><em>due etti di prosciutto<\/em><\/td><td>200 g Schinken<\/td><\/tr><tr><td><em>un litro<\/em><\/td><td><em>un litro di latte<\/em><\/td><td>ein Liter Milch<\/td><\/tr><tr><td><em>un pacco / pacchetto<\/em><\/td><td><em>un pacco di pasta<\/em><\/td><td>eine Packung Nudeln<\/td><\/tr><tr><td><em>una scatola<\/em><\/td><td><em>una scatola di biscotti<\/em><\/td><td>eine Schachtel Kekse<\/td><\/tr><tr><td><em>una bottiglia<\/em><\/td><td><em>una bottiglia d'acqua<\/em><\/td><td>eine Flasche Wasser<\/td><\/tr><tr><td><em>un vasetto<\/em><\/td><td><em>un vasetto di miele<\/em><\/td><td>ein Glas Honig<\/td><\/tr><tr><td><em>una fetta<\/em><\/td><td><em>una fetta di torta<\/em><\/td><td>ein Stück Kuchen<\/td><\/tr><tr><td><em>un paio di<\/em><\/td><td><em>un paio di guanti<\/em><\/td><td>ein Paar Handschuhe<\/td><\/tr><\/table><ul><li><em>Mi dà tre etti di formaggio, per favore?<\/em> <small>Geben Sie mir bitte 300 g Käse?<\/small><\/li><li><em>Ho comprato due paia di calzini.<\/em> <small>Ich habe zwei Paar Socken gekauft.<\/small><\/li><\/ul><div class=\"tip\">Das <em>etto<\/em> ist die typische Einheit an der italienischen Frischetheke: <em>un etto e mezzo<\/em> = 150 g.<\/div><div class=\"warn\">Achtung: Im Deutschen steht kein Wort zwischen Menge und Ware („ein Liter Milch“) – im Italienischen immer <em>di<\/em>: <em>un litro di latte<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Zahlen schreiben","task":"Schreibe die Zahl in Buchstaben.","items":[{"q":"Mia madre ha (61) ___ anni.","a":["sessantun","sessantuno"],"de":"Meine Mutter ist 61 Jahre alt."},{"q":"Il biglietto costa (28) ___ euro.","a":["ventotto"],"de":"Die Fahrkarte kostet 28 Euro."},{"q":"Nella sala ci sono (33) ___ sedie.","a":["trentatré"],"de":"Im Saal stehen 33 Stühle."},{"q":"Abbiamo percorso (108) ___ chilometri.","a":["centootto","centotto"],"de":"Wir sind 108 Kilometer gefahren."},{"q":"La bici costa (1500) ___ euro.","a":["millecinquecento"],"de":"Das Fahrrad kostet 1500 Euro."},{"q":"Hanno venduto (3000) ___ copie.","a":["tremila"],"de":"Sie haben 3000 Exemplare verkauft."},{"q":"La città ha due ___ di abitanti. (Millionen)","a":["milioni"],"de":"Die Stadt hat zwei Millionen Einwohner."},{"q":"Sono nato nel (1987) ___.","a":["millenovecentottantasette"],"de":"Ich bin 1987 geboren."}]},{"type":"choice","title":"Ordnungszahlen und Jahrhunderte","task":"Wähle die richtige Form.","items":[{"q":"Abito al ___ piano. (3.)","options":["tre","terzo","treesimo"],"a":1,"why":"Ordnungszahl 3 = terzo."},{"q":"È la ___ volta che te lo dico! (10.)","options":["decima","decimo","dieci"],"a":0,"why":"Angleichung an volta (f.)."},{"q":"Oggi festeggiamo il nostro ___ anniversario. (25.)","options":["venticinquesimo","venticinquo","venticinquesimi"],"a":0,"why":"Ab 11: -esimo."},{"q":"Michelangelo è un artista del ___. (16. Jh.)","options":["Cinquecento","Seicento","Sedicento"],"a":0,"why":"1500er-Jahre = 16. Jh. = Cinquecento."},{"q":"Papa Giovanni XXIII si legge: Papa Giovanni ___.","options":["ventitré","ventitreesimo","il ventitreesimo"],"a":1,"why":"Ordnungszahl, ohne Artikel."},{"q":"Le ___ settimane sono state difficili. (erste)","options":["prime","primi","primo"],"a":0,"why":"Angleichung: settimane f. Pl."},{"q":"Il Novecento è il ___.","options":["9. Jahrhundert","19. Jahrhundert","20. Jahrhundert"],"a":2,"why":"Novecento = 1900er-Jahre."},{"q":"Arrivo il ___ giugno. (1.)","options":["uno","primo","un"],"a":1,"why":"Der Erste des Monats: Ordnungszahl primo."}]},{"type":"gap","title":"Uhrzeit und Datum","task":"Ergänze das fehlende Wort.","items":[{"q":"Che ore sono? – ___ le cinque e venti.","a":["Sono","sono"],"de":"Wie spät ist es? – Es ist zwanzig nach fünf."},{"q":"Che ore sono? – ___ l'una e mezza.","a":["È","è"],"de":"Wie spät ist es? – Es ist halb zwei."},{"q":"Sono le otto meno un ___. (7:45)","a":["quarto"],"de":"Es ist Viertel vor acht."},{"q":"La lezione comincia ___ nove. (um)","a":["alle"],"de":"Der Unterricht beginnt um neun."},{"q":"Pranziamo sempre a ___. (12 Uhr mittags)","a":["mezzogiorno"],"de":"Wir essen immer um zwölf zu Mittag."},{"q":"Il mio compleanno è il ___ ottobre. (1.)","a":["primo"],"de":"Mein Geburtstag ist am 1. Oktober."},{"q":"La festa è ___ 15 agosto.","a":["il"],"de":"Das Fest ist am 15. August."},{"q":"Mio figlio è nato ___ 2018.","a":["nel"],"de":"Mein Sohn ist 2018 geboren."},{"q":"Il museo è chiuso ___ lunedì. (montags, regelmäßig)","a":["il"],"de":"Das Museum ist montags geschlossen."}]},{"type":"choice","title":"Mengen, Brüche, Sammelzahlen","task":"Wähle die richtige Lösung.","items":[{"q":"Vorrei due ___ di prosciutto crudo. (200 g)","options":["etti","chili","litri"],"a":0,"why":"1 etto = 100 g."},{"q":"Ho comprato un litro ___ latte.","options":["di","del","–"],"a":0,"why":"Menge + di ohne Artikel."},{"q":"Ci saranno una ___ di invitati. (etwa 30)","options":["trentina","trentesima","trenta"],"a":0,"why":"Sammelzahl -ina."},{"q":"Sono arrivate ___ di lettere.","options":["centinaia","centinai","cento"],"a":0,"why":"Plural le centinaia (weiblich, auf -a)."},{"q":"Mi servono due ___ di scarpe nuove.","options":["paia","pai","paio"],"a":0,"why":"paio → Plural le paia."},{"q":"Il negozio fa uno sconto ___ 30%.","options":["del","di","al"],"a":0,"why":"Prozent mit Artikel: del 30%."},{"q":"Ho mangiato ___ della pizza.","options":["la metà","il mezzo","mezza"],"a":0,"why":"Hälfte als Substantiv: la metà."},{"q":"Ci vediamo fra mezz'___.","options":["ora","oro"],"a":0,"why":"mezz'ora = halbe Stunde."},{"q":"Due terzi ___ studenti hanno superato l'esame.","options":["di","degli","dei"],"a":1,"why":"Bruch + di + Artikel: degli studenti (die Studierenden, bestimmte Gruppe)."}]}],"cards":[{"f":"21 / 28 / 31","b":"ventuno / ventotto / trentuno (Vokal fällt vor uno/otto)"},{"f":"23 / 33","b":"ventitré / trentatré (Akzent!)"},{"f":"17 / 18 / 19","b":"diciassette / diciotto / diciannove"},{"f":"100 / 101 / 180","b":"cento / centouno / centottanta"},{"f":"1000 / 2000","b":"mille / duemila"},{"f":"eine Million Einwohner","b":"un milione di abitanti (Substantiv + di)"},{"f":"1. bis 10. (Ordnungszahl)","b":"primo, secondo, terzo, quarto, quinto, sesto, settimo, ottavo, nono, decimo"},{"f":"Ordnungszahl ab 11","b":"Grundzahl ohne Endvokal + -esimo: undicesimo, ventesimo"},{"f":"der 23. (Ordnungszahl)","b":"ventitreesimo"},{"f":"Papst Johannes XXIII.","b":"Papa Giovanni ventitreesimo (ohne Artikel)"},{"f":"il Quattrocento","b":"das 15. Jahrhundert (1400er-Jahre)"},{"f":"il Novecento","b":"das 20. Jahrhundert"},{"f":"zwei Drittel / drei Viertel","b":"due terzi / tre quarti"},{"f":"die Hälfte / ein halber Liter","b":"la metà / mezzo litro"},{"f":"20 Prozent","b":"il venti per cento (mit Artikel)"},{"f":"etwa zehn / etwa zwanzig","b":"una decina / una ventina di"},{"f":"etwa hundert / Hunderte","b":"un centinaio / centinaia (f. Pl.)"},{"f":"etwa tausend / Tausende","b":"un migliaio / migliaia (f. Pl.)"},{"f":"zwei Paar Schuhe","b":"due paia di scarpe"},{"f":"Wie spät ist es?","b":"Che ore sono? / Che ora è?"},{"f":"Es ist ein Uhr / Mittag","b":"È l'una / È mezzogiorno"},{"f":"halb vier (3:30)","b":"le tre e mezza"},{"f":"Viertel vor acht","b":"le otto meno un quarto"},{"f":"Um wie viel Uhr? – Um acht.","b":"A che ora? – Alle otto."},{"f":"am 1. Mai / am 3. März","b":"il primo maggio / il tre marzo"},{"f":"montags (regelmäßig)","b":"il lunedì"},{"f":"Genus Wochentage","b":"alle männlich, außer la domenica"},{"f":"die Achtzigerjahre","b":"gli anni Ottanta"},{"f":"1 etto","b":"100 Gramm"},{"f":"ein Liter Milch / eine Packung Nudeln","b":"un litro di latte / un pacco di pasta"}],"id":"k25"},{"nr":26,"title":"Präpositionen und Verbanschlüsse – Übersicht","teil":"Anhang","intro":"Kompakte Nachschlagetabellen: Verschmelzung von Präposition und Artikel sowie die häufigsten Verben und Adjektive mit a, di, da oder ohne Präposition vor dem Infinitiv.","sections":[{"h":"Präposition + Artikel auf einen Blick","html":"<table><tr><th><\/th><th>il<\/th><th>lo<\/th><th>l'<\/th><\/tr><tr><td><em>di<\/em><\/td><td><em>del<\/em><\/td><td><em>dello<\/em><\/td><td><em>dell'<\/em><\/td><\/tr><tr><td><em>a<\/em><\/td><td><em>al<\/em><\/td><td><em>allo<\/em><\/td><td><em>all'<\/em><\/td><\/tr><tr><td><em>da<\/em><\/td><td><em>dal<\/em><\/td><td><em>dallo<\/em><\/td><td><em>dall'<\/em><\/td><\/tr><tr><td><em>in<\/em><\/td><td><em>nel<\/em><\/td><td><em>nello<\/em><\/td><td><em>nell'<\/em><\/td><\/tr><tr><td><em>su<\/em><\/td><td><em>sul<\/em><\/td><td><em>sullo<\/em><\/td><td><em>sull'<\/em><\/td><\/tr><\/table><table><tr><th><\/th><th>la<\/th><th>i<\/th><th>gli / le<\/th><\/tr><tr><td><em>di<\/em><\/td><td><em>della<\/em><\/td><td><em>dei<\/em><\/td><td><em>degli / delle<\/em><\/td><\/tr><tr><td><em>a<\/em><\/td><td><em>alla<\/em><\/td><td><em>ai<\/em><\/td><td><em>agli / alle<\/em><\/td><\/tr><tr><td><em>da<\/em><\/td><td><em>dalla<\/em><\/td><td><em>dai<\/em><\/td><td><em>dagli / dalle<\/em><\/td><\/tr><tr><td><em>in<\/em><\/td><td><em>nella<\/em><\/td><td><em>nei<\/em><\/td><td><em>negli / nelle<\/em><\/td><\/tr><tr><td><em>su<\/em><\/td><td><em>sulla<\/em><\/td><td><em>sui<\/em><\/td><td><em>sugli / sulle<\/em><\/td><\/tr><\/table><div class=\"tip\"><em>con, per, tra/fra<\/em> + Artikel bleiben getrennt: <em>con il, per gli, tra le<\/em>.<\/div>"},{"h":"Verben mit a + Infinitiv","html":"<p>Vor allem Verben des <b>Beginnens, Fortsetzens, Lernens, Gelingens<\/b> sowie Bewegungsverben (Zweck):<\/p><table><tr><th>Verb<\/th><th>Deutsch<\/th><\/tr><tr><td><em>cominciare / iniziare a<\/em><\/td><td>anfangen zu<\/td><\/tr><tr><td><em>continuare a<\/em><\/td><td>weiter…, fortfahren zu<\/td><\/tr><tr><td><em>mettersi a<\/em><\/td><td>sich daranmachen, anfangen<\/td><\/tr><tr><td><em>imparare a / insegnare a<\/em><\/td><td>lernen / lehren zu<\/td><\/tr><tr><td><em>riuscire a<\/em><\/td><td>schaffen, gelingen<\/td><\/tr><tr><td><em>provare a<\/em><\/td><td>(aus)probieren, versuchen<\/td><\/tr><tr><td><em>abituarsi a<\/em><\/td><td>sich gewöhnen an<\/td><\/tr><tr><td><em>aiutare qn a<\/em><\/td><td>jdm. helfen zu<\/td><\/tr><tr><td><em>invitare / convincere / costringere qn a<\/em><\/td><td>einladen / überzeugen / zwingen zu<\/td><\/tr><tr><td><em>pensare a<\/em><\/td><td>daran denken, sich kümmern um<\/td><\/tr><tr><td><em>andare / venire / tornare a<\/em><\/td><td>gehen / kommen / zurückkehren, um zu<\/td><\/tr><\/table><ul><li><em>Ho cominciato a correre ogni mattina.<\/em> <small>Ich habe angefangen, jeden Morgen zu laufen.<\/small><\/li><li><em>Non riesco a dormire.<\/em> <small>Ich kann nicht schlafen / schaffe es nicht zu schlafen.<\/small><\/li><li><em>Vieni a prendere un caffè?<\/em> <small>Kommst du einen Kaffee trinken?<\/small><\/li><\/ul>"},{"h":"Verben mit di + Infinitiv und ohne Präposition","html":"<p><b>di + Infinitiv:<\/b> Verben des Aufhörens, Sagens, Meinens, Hoffens, Entscheidens sowie viele Ausdrücke mit <em>avere<\/em>:<\/p><table><tr><th>Verb<\/th><th>Deutsch<\/th><\/tr><tr><td><em>finire / smettere di<\/em><\/td><td>aufhören zu<\/td><\/tr><tr><td><em>cercare di<\/em><\/td><td>versuchen zu<\/td><\/tr><tr><td><em>decidere di<\/em><\/td><td>beschließen zu<\/td><\/tr><tr><td><em>sperare / credere / pensare di<\/em><\/td><td>hoffen / glauben / vorhaben zu<\/td><\/tr><tr><td><em>dire / chiedere / promettere di<\/em><\/td><
