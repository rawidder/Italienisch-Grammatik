ist alles, woran ich mich erinnere."},{"q":"Lo studente ___ ha vinto la borsa di studio è di Lecce.","a":["che","il quale"],"de":"Der Student, der das Stipendium gewonnen hat, ist aus Lecce."}]}],"cards":[{"f":"der/die/das (Subjekt oder Akkusativ)","b":"che – unveränderlich"},{"f":"Relativpronomen nach Präposition","b":"cui (nie che!)"},{"f":"von dem / von der","b":"di cui / del quale, della quale"},{"f":"dem / der (Dativ bei Verb mit a)","b":"a cui / al quale, alla quale"},{"f":"in dem / in der","b":"in cui / nel quale, nella quale"},{"f":"weshalb, aus diesem Grund","b":"per cui"},{"f":"mit dem / mit denen","b":"con cui / con il quale, con i quali"},{"f":"dessen / deren","b":"il cui, la cui, i cui, le cui – Artikel nach dem Besessenen"},{"f":"die Stadt, deren Geschichte …","b":"la città la cui storia …"},{"f":"das Mädchen, dessen Eltern …","b":"la ragazza i cui genitori …"},{"f":"il quale – Formen","b":"il quale, la quale, i quali, le quali"},{"f":"Wozu dient il quale?","b":"Eindeutigkeit (zeigt Genus/Numerus) und gehobener Stil"},{"f":"…, was (Bezug auf ganzen Satz)","b":"il che"},{"f":"das, was / was (ohne Bezugswort)","b":"quello che / ciò che"},{"f":"Mach, was du willst.","b":"Fai quello che vuoi."},{"f":"alles, was …","b":"tutto quello che / tutto ciò che"},{"f":"wer …, derjenige, der …","b":"chi + Verb im Singular"},{"f":"Wer sucht, der findet.","b":"Chi cerca trova."},{"f":"Es gibt Leute, die …","b":"C'è chi …"},{"f":"diejenigen, die (gehoben)","b":"coloro che"},{"f":"der Mann, dem ich helfe","b":"l'uomo che aiuto (aiutare + direktes Objekt)"},{"f":"der Tag, an dem …","b":"il giorno in cui … (ugs. il giorno che …)"},{"f":"drei Brüder, von denen zwei …","b":"tre fratelli, di cui due …"},{"f":"Kann man che weglassen?","b":"Nein, nie: il libro che leggo"}],"id":"k08"},{"nr":9,"title":"Die Interrogativa","teil":"Das Substantiv und seine Begleiter","intro":"Fragewörter wie chi, che cosa, quale und quanto braucht man ständig. Typische Stolpersteine für Deutsche sind die Präposition am Satzanfang (di chi = wessen), qual è ohne Apostroph und die Wortstellung.","sections":[{"h":"chi – wer, wen, wem, wessen","html":"<p><em>chi<\/em> fragt nach Personen und ist unveränderlich. Die deutschen Fälle werden durch Präpositionen ausgedrückt, die immer <b>vor<\/b> <em>chi<\/em> stehen:<\/p><table><tr><th>Deutsch<\/th><th>Italienisch<\/th><th>Beispiel<\/th><\/tr><tr><td>wer?<\/td><td><em>chi?<\/em><\/td><td><em>Chi ha chiamato?<\/em><\/td><\/tr><tr><td>wen?<\/td><td><em>chi?<\/em><\/td><td><em>Chi aspetti?<\/em><\/td><\/tr><tr><td>wem?<\/td><td><em>a chi?<\/em><\/td><td><em>A chi scrivi?<\/em><\/td><\/tr><tr><td>wessen?<\/td><td><em>di chi?<\/em><\/td><td><em>Di chi è questa giacca?<\/em><\/td><\/tr><tr><td>mit wem?<\/td><td><em>con chi?<\/em><\/td><td><em>Con chi vai al cinema?<\/em><\/td><\/tr><tr><td>für wen?<\/td><td><em>per chi?<\/em><\/td><td><em>Per chi è il regalo?<\/em><\/td><\/tr><tr><td>von wem? / bei wem?<\/td><td><em>da chi?<\/em><\/td><td><em>Da chi dormi stasera?<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Die Präposition steht immer am Anfang – nie am Satzende wie im Englischen. Und „Wessen Tasche ist das?“ heißt <em>Di chi è questa borsa?<\/em>, nicht <em>Chi borsa …<\/em>.<\/div><p>Mit Plural- oder Femininbezug bleibt das Verb meist im Singular: <em>Chi viene stasera?<\/em> <small>Wer kommt heute Abend?<\/small>; bei <em>essere<\/em> + Plural aber: <em>Chi sono quei ragazzi?<\/em> <small>Wer sind die Jungen da?<\/small><\/p>"},{"h":"che cosa, cosa, che","html":"<p>Für „was?“ gibt es drei gleichwertige Formen: <em>che cosa<\/em> (neutral, auch schriftlich), <em>cosa<\/em> (sehr häufig gesprochen) und <em>che<\/em> (umgangssprachlich, eher im Süden und in festen Wendungen).<\/p><ul><li><em>Che cosa fai domani?<\/em> <small>Was machst du morgen?<\/small><\/li><li><em>Cosa c'è?<\/em> <small>Was ist los?<\/small><\/li><li><em>Che succede?<\/em> <small>Was passiert da?<\/small><\/li><li><em>Di che cosa avete parlato?<\/em> <small>Worüber habt ihr gesprochen?<\/small><\/li><li><em>A cosa pensi?<\/em> <small>Woran denkst du?<\/small><\/li><\/ul><div class=\"tip\">Deutsche „wo(r)-“-Wörter = Präposition + <em>(che) cosa<\/em>: womit = <em>con che cosa<\/em>, wofür = <em>per che cosa<\/em>, worauf = <em>su che cosa<\/em>.<\/div><p><em>che<\/em> vor einem Nomen = welcher, was für ein:<\/p><ul><li><em>Che lavoro fai?<\/em> <small>Was arbeitest du?<\/small><\/li><li><em>Che ore sono?<\/em> <small>Wie spät ist es?<\/small><\/li><li><em>Che tempo fa?<\/em> <small>Wie ist das Wetter?<\/small><\/li><li><em>Che tipo di musica ascolti?<\/em> <small>Was für Musik hörst du?<\/small><\/li><\/ul><p>Im Ausruf: <em>Che bello! Che peccato! Che freddo!<\/em> <small>Wie schön! Wie schade! Ist das kalt!<\/small><\/p>"},{"h":"quale / quali – welcher","html":"<p><em>quale<\/em> (Pl. <em>quali<\/em>) fragt nach einer Auswahl aus einer bestimmten Menge. Es unterscheidet nur Singular und Plural, nicht das Geschlecht.<\/p><ul><li><em>Quale treno prendi?<\/em> <small>Welchen Zug nimmst du?<\/small><\/li><li><em>Quali lingue parli?<\/em> <small>Welche Sprachen sprichst du?<\/small><\/li><li><em>Ci sono due torte: quale preferisci?<\/em> <small>Es gibt zwei Kuchen: Welchen magst du lieber?<\/small><\/li><\/ul><p>Vor <em>è<\/em> und <em>era<\/em> wird <em>quale<\/em> (fast immer) zu <em>qual<\/em> verkürzt – <b>ohne Apostroph<\/b>:<\/p><ul><li><em>Qual è il tuo numero?<\/em> <small>Wie ist deine Nummer?<\/small><\/li><li><em>Qual era il problema?<\/em> <small>Was war das Problem?<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>Qual è<\/em>, nie <em>Qual'è<\/em>! Es handelt sich um eine Verkürzung (wie <em>qual buon vento<\/em>), nicht um eine Elision.<\/div><div class=\"tip\">Für „Wie ist dein Name / deine Adresse / deine Meinung?“ sagt man <em>Qual è …?<\/em> – nicht <em>Come è …<\/em>.<\/div>"},{"h":"quanto – wie viel, wie viele","html":"<p><em>quanto<\/em> als Begleiter oder Pronomen wird angeglichen:<\/p><table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>quanto<\/em><\/td><td><em>quanti<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>quanta<\/em><\/td><td><em>quante<\/em><\/td><\/tr><\/table><ul><li><em>Quanto zucchero metti?<\/em> <small>Wie viel Zucker nimmst du?<\/small><\/li><li><em>Quanta pasta compro?<\/em> <small>Wie viel Nudeln kaufe ich?<\/small><\/li><li><em>Quanti anni hai?<\/em> <small>Wie alt bist du?<\/small><\/li><li><em>Quante volte sei stato a Roma?<\/em> <small>Wie oft warst du schon in Rom?<\/small><\/li><\/ul><p>Als Adverb (bei Verben) bleibt es unveränderlich:<\/p><ul><li><em>Quanto costa questo vino? – Quanto costano le arance?<\/em> <small>Was kostet …? – Was kosten …?<\/small><\/li><li><em>Quanto dura il viaggio?<\/em> <small>Wie lange dauert die Reise?<\/small><\/li><li><em>Quant'è?<\/em> <small>Was macht das? (beim Bezahlen)<\/small><\/li><\/ul><div class=\"warn\">Achtung: „Wie alt bist du?“ = <em>Quanti anni hai?<\/em> (mit avere!), nicht <em>Quanto vecchio sei?<\/em>.<\/div>"},{"h":"Weitere Fragewörter","html":"<table><tr><th>Italienisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>come?<\/em><\/td><td>wie?<\/td><\/tr><tr><td><em>dove? / da dove?<\/em><\/td><td>wo? wohin? / woher?<\/td><\/tr><tr><td><em>quando?<\/em><\/td><td>wann?<\/td><\/tr><tr><td><em>da quando?<\/em><\/td><td>seit wann?<\/td><\/tr><tr><td><em>fino a quando?<\/em><\/td><td>bis wann?<\/td><\/tr><tr><td><em>perché?<\/em><\/td><td>warum?<\/td><\/tr><tr><td><em>come mai?<\/em><\/td><td>wieso denn?<\/td><\/tr><tr><td><em>da quanto tempo?<\/em><\/td><td>wie lange schon?<\/td><\/tr><tr><td><em>ogni quanto?<\/em><\/td><td>wie oft? in welchen Abständen?<\/td><\/tr><\/table><ul><li><em>Dov'è la stazione?<\/em> <small>Wo ist der Bahnhof?<\/small> – <em>dove<\/em> + <em>è<\/em> → <em>dov'è<\/em><\/li><li><em>Come ti chiami?<\/em> <small>Wie heißt du?<\/small><\/li><li><em>Come mai sei ancora qui?<\/em> <small>Wieso bist du denn noch hier?<\/small><\/li><\/ul><p><em>perché<\/em> heißt in der Frage „warum“, in der Antwort „weil“: <em>Perché ridi? – Perché sei buffo.<\/em> <small>Warum lachst du? – Weil du lustig bist.<\/small><\/p><div class=\"warn\">Achtung: Nach <em>da quanto tempo<\/em> / <em>da quando<\/em> steht das <b>Präsens<\/b>, wenn die Handlung noch andauert: <em>Da quanto tempo vivi a Milano?<\/em> – Wie lange lebst du schon in Mailand?<\/div>"},{"h":"Wortstellung in der Frage","html":"<p>Das Subjekt steht in Fragen mit Fragewort meist <b>nach dem Verb<\/b>, oft am Satzende:<\/p><ul><li><em>Dove lavora tuo fratello?<\/em> <small>Wo arbeitet dein Bruder?<\/small><\/li><li><em>Quando parte il treno?<\/em> <small>Wann fährt der Zug ab?<\/small><\/li><li><em>Che cosa ha detto il medico?<\/em> <small>Was hat der Arzt gesagt?<\/small><\/li><\/ul><p>Zwischen Fragewort und Verb steht normalerweise kein Subjekt: <em>Dove tuo fratello lavora?<\/em> ist falsch. Unbetonte Pronomen stehen direkt vor dem Verb: <em>Quando lo vedi?<\/em> <small>Wann siehst du ihn?<\/small><\/p><p>Ja/Nein-Fragen unterscheiden sich vom Aussagesatz oft nur durch die <b>Intonation<\/b>: <em>Vieni anche tu?<\/em> <small>Kommst du auch?<\/small><\/p>"},{"h":"Die indirekte Frage","html":"<p>Indirekte Fragen werden mit demselben Fragewort eingeleitet; Ja/Nein-Fragen mit <em>se<\/em> (= ob):<\/p><ul><li><em>Non so dove abita.<\/em> <small>Ich weiß nicht, wo er wohnt.<\/small><\/li><li><em>Dimmi quanto costa.<\/em> <small>Sag mir, wie viel es kostet.<\/small><\/li><li><em>Mi chiedo chi sia quel signore.<\/em> <small>Ich frage mich, wer dieser Herr ist.<\/small><\/li><li><em>Non so se viene.<\/em> <small>Ich weiß nicht, ob er kommt.<\/small><\/li><\/ul><p>Im Alltag steht meist der Indikativ, in gepflegter Sprache – vor allem nach <em>chiedersi, domandare, non sapere<\/em> – oft der <em>congiuntivo<\/em>: <em>Non so dove abiti.<\/em><\/p><p>Mit Infinitiv, wenn das Subjekt gleich ist: <em>Non so cosa fare.<\/em> <small>Ich weiß nicht, was ich tun soll.<\/small> – <em>Non sapevo a chi chiedere.<\/em> <small>Ich wusste nicht, wen ich fragen sollte.<\/small><\/p><div class=\"warn\">Achtung: „ob“ = <em>se<\/em>, nicht <em>che<\/em>. Konditionales „wenn“ und „ob“ heißen beide <em>se<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Das passende Fragewort","task":"Setze das passende Fragewort ein.","items":[{"q":"___ ti chiami? – Mi chiamo Irene.","a":["Come"],"de":"Wie heißt du? – Ich heiße Irene."},{"q":"___ abiti? – A Trieste.","a":["Dove"],"de":"Wo wohnst du? – In Triest."},{"q":"___ torni a casa? – Domani sera.","a":["Quando"],"de":"Wann kommst du nach Hause? – Morgen Abend."},{"q":"___ non mangi? – Perché non ho fame.","a":["Perché","Come mai"],"de":"Warum isst du nicht? – Weil ich keinen Hunger habe."},{"q":"___ vieni? – Da Lugano.","a":["Da dove"],"de":"Woher kommst du? – Aus Lugano."},{"q":"___ ha rotto il vaso? – Il gatto!","a":["Chi"],"de":"Wer hat die Vase zerbrochen? – Die Katze!"},{"q":"___ fai stasera? – Niente di speciale.","a":["Cosa","Che cosa","Che"],"de":"Was machst du heute Abend? – Nichts Besonderes."},{"q":"___ costa il biglietto? – Due euro.","a":["Quanto"],"de":"Wie viel kostet die Fahrkarte? – Zwei Euro."}]},{"type":"gap","title":"chi mit Präposition","task":"Setze die passende Präposition + chi ein.","items":[{"q":"___ è questo ombrello? (wessen)","a":["Di chi"],"de":"Wem gehört dieser Schirm?"},{"q":"___ hai dato le chiavi? (wem)","a":["A chi"],"de":"Wem hast du die Schlüssel gegeben?"},{"q":"___ esci stasera? (mit wem)","a":["Con chi"],"de":"Mit wem gehst du heute Abend aus?"},{"q":"___ è questa torta? (für wen)","a":["Per chi"],"de":"Für wen ist dieser Kuchen?"},{"q":"___ hai saputo la notizia? (von wem)","a":["Da chi"],"de":"Von wem hast du die Nachricht erfahren?"},{"q":"___ stai parlando? (über wen)","a":["Di chi"],"de":"Über wen sprichst du?"},{"q":"___ assomiglia tuo figlio? (wem)","a":["A chi"],"de":"Wem sieht dein Sohn ähnlich?"}]},{"type":"choice","title":"che, quale oder qual?","task":"Wähle die richtige Form.","items":[{"q":"___ è la tua opinione?","options":["Qual","Qual'"],"a":0,"why":"qual è ohne Apostroph (Verkürzung, keine Elision)."},{"q":"___ ore sono?","options":["Che","Quali"],"a":0,"why":"Feste Wendung: Che ore sono?"},{"q":"Ho tre maglioni: ___ metto?","options":["che","quale"],"a":1,"why":"Auswahl aus begrenzter Menge → quale."},{"q":"___ scarpe ti piacciono di più, queste o quelle?","options":["Quale","Quali"],"a":1,"why":"Plural → quali."},{"q":"___ tempo fa a Napoli?","options":["Che","Come"],"a":0,"why":"Che tempo fa? = Wie ist das Wetter?"},{"q":"___ è il tuo indirizzo?","options":["Come","Qual"],"a":1,"why":"Nach Name/Adresse fragt man mit qual è."},{"q":"___ bella giornata!","options":["Che","Quale"],"a":0,"why":"Ausruf: Che …!"},{"q":"___ era il titolo del film?","options":["Qual'","Qual"],"a":1,"why":"Vor era wird quale zu qual verkürzt – ohne Apostroph (Troncamento)."}]},{"type":"gap","title":"quanto angleichen","task":"Setze die richtige Form von quanto ein.","items":[{"q":"___ anni ha tua nonna?","a":["Quanti"],"de":"Wie alt ist deine Oma?"},{"q":"___ acqua bevi al giorno?","a":["Quanta"],"de":"Wie viel Wasser trinkst du am Tag?"},{"q":"___ costano questi stivali?","a":["Quanto"],"de":"Wie viel kosten diese Stiefel?"},{"q":"___ persone vengono alla festa?","a":["Quante"],"de":"Wie viele Leute kommen zum Fest?"},{"q":"___ tempo ci vuole per arrivare a Siena?","a":["Quanto"],"de":"Wie lange braucht man bis Siena?"},{"q":"___ fratelli hai?","a":["Quanti"],"de":"Wie viele Geschwister hast du?"},{"q":"___ volte ti devo dire di chiudere la porta?","a":["Quante"],"de":"Wie oft muss ich dir sagen, dass du die Tür schließen sollst?"},{"q":"___ dura la lezione?","a":["Quanto"],"de":"Wie lange dauert der Unterricht?"}]},{"type":"choice","title":"Wortstellung und Zeitform","task":"Welche Frage ist korrekt?","items":[{"q":"„Wo arbeitet deine Schwester?“","options":["Dove tua sorella lavora?","Dove lavora tua sorella?"],"a":1,"why":"Subjekt nach dem Verb."},{"q":"„Seit wann lernst du Italienisch?“","options":["Da quando studi l'italiano?","Da quando hai studiato l'italiano?"],"a":0,"why":"Andauernde Handlung → Präsens."},{"q":"„Mit wem hast du gesprochen?“","options":["Chi hai parlato con?","Con chi hai parlato?"],"a":1,"why":"Präposition immer vor chi."},{"q":"„Wie alt ist dein Vater?“","options":["Quanto vecchio è tuo padre?","Quanti anni ha tuo padre?"],"a":1,"why":"Alter mit avere + anni."},{"q":"„Wieso bist du denn so früh da?“","options":["Come mai sei qui così presto?","Come sei qui così presto?"],"a":0,"why":"come mai = wieso denn."},{"q":"„Worüber lacht ihr?“","options":["Di che cosa ridete?","Che cosa ridete di?"],"a":0,"why":"Präposition + che cosa am Satzanfang."},{"q":"„Wann siehst du ihn?“","options":["Quando vedi lo?","Quando lo vedi?"],"a":1,"why":"Unbetontes Pronomen vor dem Verb."}]},{"type":"gap","title":"Indirekte Fragen","task":"Ergänze das passende Einleitewort (se oder Fragewort).","items":[{"q":"Non so ___ Marta viene alla festa. (ob)","a":["se"],"de":"Ich weiß nicht, ob Marta zum Fest kommt."},{"q":"Mi chiedo ___ abbia lasciato questo biglietto. (wer)","a":["chi"],"de":"Ich frage mich, wer diesen Zettel hinterlassen hat."},{"q":"Puoi dirmi ___ parte l'autobus? (wann)","a":["quando"],"de":"Kannst du mir sagen, wann der Bus abfährt?"},{"q":"Non ricordo ___ ho messo gli occhiali. (wo)","a":["dove"],"de":"Ich weiß nicht mehr, wo ich die Brille hingelegt habe."},{"q":"Non so ___ regalargli. (was)","a":["cosa","che cosa","che"],"de":"Ich weiß nicht, was ich ihm schenken soll."},{"q":"Chiedi al cameriere ___ costa il menù. (wie viel)","a":["quanto"],"de":"Frag den Kellner, wie viel das Menü kostet."},{"q":"Vorrei sapere ___ non mi hai chiamato. (warum)","a":["perché"],"de":"Ich möchte wissen, warum du mich nicht angerufen hast."},{"q":"Non sapevo ___ chiedere aiuto. (wen – an wen)","a":["a chi"],"de":"Ich wusste nicht, wen ich um Hilfe bitten sollte."}]}],"cards":[{"f":"wer? / wen?","b":"chi?"},{"f":"wem?","b":"a chi?"},{"f":"wessen?","b":"di chi? – Di chi è questo libro?"},{"f":"mit wem? / für wen?","b":"con chi? / per chi?"},{"f":"was?","b":"che cosa? / cosa? / che?"},{"f":"woran denkst du?","b":"A che cosa pensi?"},{"f":"worüber sprecht ihr?","b":"Di che cosa parlate?"},{"f":"Wie spät ist es?","b":"Che ore sono? / Che ora è?"},{"f":"Wie ist das Wetter?","b":"Che tempo fa?"},{"f":"Was arbeitest du?","b":"Che lavoro fai?"},{"f":"welcher? / welche? (Pl.)","b":"quale? / quali?"},{"f":"Wie ist deine Adresse?","b":"Qual è il tuo indirizzo? (ohne Apostroph!)"},{"f":"Qual è oder Qual'è?","b":"Qual è – Verkürzung, kein Apostroph"},{"f":"wie viel / wie viele","b":"quanto, quanta, quanti, quante"},{"f":"Wie alt bist du?","b":"Quanti anni hai?"},{"f":"Was kostet das? / Was kosten sie?","b":"Quanto costa? / Quanto costano?"},{"f":"Was macht das? (Bezahlen)","b":"Quant'è?"},{"f":"Wie lange dauert es?","b":"Quanto dura? / Quanto ci vuole?"},{"f":"woher?","b":"da dove? (Herkunft: di dove sei?)"},{"f":"wieso denn?","b":"come mai?"},{"f":"Seit wann wohnst du hier?","b":"Da quanto tempo / Da quando abiti qui? (Präsens!)"},{"f":"Wo ist …?","b":"Dov'è …?"},{"f":"perché","b":"warum? (Frage) / weil (Antwort)"},{"f":"ob (indirekte Frage)","b":"se – Non so se viene."},{"f":"Ich weiß nicht, was ich tun soll.","b":"Non so cosa fare."},{"f":"Wo arbeitet Paolo? (Wortstellung)","b":"Dove lavora Paolo?"}],"id":"k09"},{"nr":10,"title":"Die Personalpronomen","teil":"Das Substantiv und seine Begleiter","intro":"Personalpronomen gehören zu den häufigsten Wörtern überhaupt – und mit ci, ne und den kombinierten Formen zu den größten Hürden für Deutschsprachige. Wer sie sicher beherrscht, spricht deutlich flüssiger und natürlicher.","sections":[{"h":"Subjektpronomen","html":"<p>Die Subjektpronomen zeigen, wer handelt. Weil die Verbendung die Person schon verrät, lässt man sie im Italienischen meistens weg.<\/p>\n<table><tr><th>Singular<\/th><th>Plural<\/th><\/tr>\n<tr><td><em>io<\/em> ich<\/td><td><em>noi<\/em> wir<\/td><\/tr>\n<tr><td><em>tu<\/em> du<\/td><td><em>voi<\/em> ihr<\/td><\/tr>\n<tr><td><em>lui / lei<\/em> er / sie<\/td><td><em>loro<\/em> sie<\/td><\/tr>\n<tr><td><em>Lei<\/em> Sie (höflich)<\/td><td><em>voi<\/em> Sie (höflich, mehrere)<\/td><\/tr><\/table>\n<p><em>Lavoro in un ospedale.<\/em> – Ich arbeite in einem Krankenhaus.<br><em>Stasera restiamo a casa.<\/em> – Heute Abend bleiben wir zu Hause.<\/p>\n<p><b>Man setzt das Pronomen<\/b>, wenn es betont ist oder einen Gegensatz ausdrückt:<\/p>\n<ul><li><em>Io cucino, tu apparecchi la tavola.<\/em> – Ich koche, du deckst den Tisch.<\/li>\n<li><em>Pago io!<\/em> – Ich zahle! (nachgestellt = besonders betont)<\/li>\n<li><em>Anche lei è di Lecce.<\/em> – Sie ist auch aus Lecce. (nach <em>anche, neanche, nemmeno<\/em>)<\/li><\/ul>\n<p><b>Höflichkeitsform:<\/b> <em>Lei<\/em> (3. Person Singular, oft großgeschrieben) für eine Person, <em>voi<\/em> für mehrere: <em>Dottore, Lei viene domani?<\/em> – Herr Doktor, kommen Sie morgen? <em>Signori, voi cosa prendete?<\/em> – Meine Herrschaften, was nehmen Sie?<\/p>\n<p><small>Die Formen <em>egli, ella, esso, essa, essi, esse<\/em> findet man nur noch in gehobener Schriftsprache; <em>Loro<\/em> als Anrede ist sehr förmlich und selten.<\/small><\/p>\n<div class=\"warn\">Achtung: Das deutsche „es“ als Scheinsubjekt hat keine Entsprechung: <em>Piove.<\/em> – Es regnet. <em>È tardi.<\/em> – Es ist spät.<\/div>"},{"h":"Reflexivpronomen","html":"<p>Reflexive Verben haben im Infinitiv die Endung <em>-si<\/em> (<em>lavarsi<\/em>, <em>svegliarsi<\/em>). Das Pronomen richtet sich nach dem Subjekt.<\/p>\n<table><tr><th>Person<\/th><th>Pronomen<\/th><th>Beispiel<\/th><\/tr>\n<tr><td>io<\/td><td><em>mi<\/em><\/td><td><em>mi sveglio<\/em><\/td><\/tr>\n<tr><td>tu<\/td><td><em>ti<\/em><\/td><td><em>ti svegli<\/em><\/td><\/tr>\n<tr><td>lui / lei / Lei<\/td><td><em>si<\/em><\/td><td><em>si sveglia<\/em><\/td><\/tr>\n<tr><td>noi<\/td><td><em>ci<\/em><\/td><td><em>ci svegliamo<\/em><\/td><\/tr>\n<tr><td>voi<\/td><td><em>vi<\/em><\/td><td><em>vi svegliate<\/em><\/td><\/tr>\n<tr><td>loro<\/td><td><em>si<\/em><\/td><td><em>si svegliano<\/em><\/td><\/tr><\/table>\n<ul><li>Gegenseitig (reziprok): <em>Ci sentiamo stasera.<\/em> – Wir hören uns heute Abend. <em>Si conoscono dall'asilo.<\/em> – Sie kennen sich seit dem Kindergarten.<\/li>\n<li>Bei Körperteilen und Kleidung steht das Reflexivpronomen statt des Possessivs: <em>Mi lavo i denti.<\/em> – Ich putze mir die Zähne.<\/li>\n<li>In zusammengesetzten Zeiten immer <em>essere<\/em>: <em>Stamattina mi sono svegliata tardi.<\/em><\/li><\/ul>\n<div class=\"tip\">Nicht jedes deutsche reflexive Verb ist im Italienischen reflexiv und umgekehrt: <em>La situazione migliora.<\/em> – Die Lage verbessert sich. Aber: <em>sbagliarsi<\/em> – sich irren, <em>ricordarsi<\/em> – sich erinnern, <em>addormentarsi<\/em> – einschlafen.<\/div>"},{"h":"Unbetonte direkte Objektpronomen","html":"<p>Sie ersetzen das direkte Objekt (deutscher Akkusativ) und stehen vor dem konjugierten Verb.<\/p>\n<table><tr><th>Singular<\/th><th>Plural<\/th><\/tr>\n<tr><td><em>mi<\/em> mich<\/td><td><em>ci<\/em> uns<\/td><\/tr>\n<tr><td><em>ti<\/em> dich<\/td><td><em>vi<\/em> euch<\/td><\/tr>\n<tr><td><em>lo<\/em> ihn / es<\/td><td><em>li<\/em> sie (m. / gemischt)<\/td><\/tr>\n<tr><td><em>la<\/em> sie / <em>La<\/em> Sie<\/td><td><em>le<\/em> sie (nur f.)<\/td><\/tr><\/table>\n<p><em>Il vino rosso? Lo bevo raramente.<\/em> – Den Rotwein? Ich trinke ihn selten.<br><em>Le tue amiche non le conosco.<\/em> – Deine Freundinnen kenne ich nicht.<br><em>Signora, La accompagno alla macchina.<\/em> – Ich begleite Sie zum Auto.<\/p>\n<ul><li>Vor Vokal oder h werden <em>lo<\/em> und <em>la<\/em> meist apostrophiert: <em>L'aspetto qui.<\/em> <em>Li<\/em> und <em>le<\/em> nie.<\/li>\n<li><em>lo<\/em> kann einen ganzen Sachverhalt ersetzen: <em>Non lo so.<\/em> – Ich weiß es nicht. <em>Lo dico sempre.<\/em><\/li><\/ul>\n<p><b>Angleichung des Partizips:<\/b> Steht <em>lo, la, li, le<\/em> vor einer zusammengesetzten Zeit mit <em>avere<\/em>, richtet sich das Partizip nach dem Pronomen.<\/p>\n<p><em>Hai visto Chiara? – Sì, l'ho vista al bar.<\/em><br><em>I biglietti? Li ho già stampati.<\/em><br><em>Le foto? Le ho mandate ieri.<\/em><\/p>\n<p><small>Bei <em>mi, ti, ci, vi<\/em> ist die Angleichung freiwillig: <em>Ci hanno salutati / salutato.<\/em><\/small><\/p>\n<div class=\"warn\">Achtung: Einige Verben haben im Deutschen ein Dativobjekt, im Italienischen aber ein direktes Objekt: <em>aiutare<\/em> (helfen), <em>ringraziare<\/em> (danken), <em>ascoltare<\/em> (zuhören), <em>seguire<\/em> (folgen). Also: <em>La ringrazio.<\/em> – Ich danke Ihnen.<\/div>"},{"h":"Unbetonte indirekte Objektpronomen","html":"<p>Sie ersetzen ein Objekt mit <em>a<\/em> (meist deutscher Dativ).<\/p>\n<table><tr><th>Singular<\/th><th>Plural<\/th><\/tr>\n<tr><td><em>mi<\/em> mir<\/td><td><em>ci<\/em> uns<\/td><\/tr>\n<tr><td><em>ti<\/em> dir<\/td><td><em>vi<\/em> euch<\/td><\/tr>\n<tr><td><em>gli<\/em> ihm<\/td><td><em>gli<\/em> / <em>loro<\/em> ihnen<\/td><\/tr>\n<tr><td><em>le<\/em> ihr / <em>Le<\/em> Ihnen<\/td><td><\/td><\/tr><\/table>\n<p><em>Gli mando un messaggio.<\/em> – Ich schicke ihm eine Nachricht.<br><em>Le compro dei fiori.<\/em> – Ich kaufe ihr Blumen.<br><em>Professore, Le posso fare una domanda?<\/em> – Darf ich Ihnen eine Frage stellen?<\/p>\n<ul><li>Plural: Heute allgemein üblich ist <em>gli<\/em>: <em>I bambini? Gli racconto una storia.<\/em> – Ich erzähle ihnen eine Geschichte. Gehoben: <em>Racconto loro una storia.<\/em> (<em>loro<\/em> steht immer nach dem Verb.)<\/li>\n<li>Typische Verben: <em>dare, dire, scrivere, telefonare, rispondere, chiedere, regalare, mostrare a qcn<\/em>; außerdem <em>piacere, sembrare, mancare, servire<\/em>: <em>Mi manca il mare.<\/em> – Mir fehlt das Meer.<\/li>\n<li>Keine Angleichung des Partizips: <em>Le ho telefonato.<\/em> (nicht <em>telefonata<\/em>)<\/li><\/ul>\n<div class=\"warn\">Achtung: <em>gli<\/em> = ihm, <em>le<\/em> = ihr. „Ihr“ mit <em>gli<\/em> wiederzugeben gilt als Fehler. Und: <em>telefonare a qcn<\/em> ist indirekt – <em>Gli telefono<\/em>, nicht <em>Lo telefono<\/em>.<\/div>"},{"h":"Betonte Pronomen","html":"<p>Die betonten (starken) Formen stehen nach Präpositionen und dort, wo das Pronomen hervorgehoben werden soll.<\/p>\n<table><tr><th>Singular<\/th><th>Plural<\/th><\/tr>\n<tr><td><em>me<\/em><\/td><td><em>noi<\/em><\/td><\/tr>\n<tr><td><em>te<\/em><\/td><td><em>voi<\/em><\/td><\/tr>\n<tr><td><em>lui / lei / Lei<\/em><\/td><td><em>loro<\/em><\/td><\/tr>\n<tr><td><em>sé<\/em> (reflexiv)<\/td><td><em>sé<\/em> (reflexiv)<\/td><\/tr><\/table>\n<ul><li>Nach Präpositionen: <em>Vieni con me?<\/em> – Kommst du mit mir? <em>Ho un regalo per te.<\/em> <em>Stasera dormo da lei.<\/em> – Heute schlafe ich bei ihr.<\/li>\n<li><em>senza, dopo, dentro, sopra, sotto, verso, contro<\/em> verbinden sich meist mit <em>di<\/em>: <em>senza di te, dopo di Lei<\/em>.<\/li>\n<li>Zur Betonung oder für einen Gegensatz statt der unbetonten Form: <em>Cercano te, non me.<\/em> – Sie suchen dich, nicht mich. <em>A me il calcio non piace, a lui sì.<\/em><\/li>\n<li>Nach Vergleichswörtern und in Ausrufen: <em>È più giovane di me.<\/em> <em>Lavora come te.<\/em> <em>Beato te!<\/em> – Du Glücklicher!<\/li>\n<li>Reflexiv: <em>Pensa solo a sé.<\/em> – Er denkt nur an sich.<\/li><\/ul>\n<div class=\"warn\">Achtung: Nach <em>come<\/em> und <em>di<\/em> steht die betonte Form, nicht das Subjektpronomen: <em>alto come me<\/em> (nicht <em>come io<\/em>).<\/div>"},{"h":"Das Pronominaladverb ci","html":"<p><em>ci<\/em> ist nicht nur „uns“, sondern auch ein Adverb mit mehreren Aufgaben.<\/p>\n<ul><li><b>Ort<\/b> (dort, dorthin) – ersetzt <em>a, in, da, su<\/em> + Ort: <em>Vai spesso a Bari? – Sì, ci vado ogni mese.<\/em> <em>Il paese è bello, ci abito da dieci anni.<\/em><\/li>\n<li><b>a + Sache<\/b> bei Verben mit <em>a<\/em>: <em>pensare a<\/em> → <em>Ci penso io.<\/em> – Ich kümmere mich darum. <em>credere a<\/em> → <em>Non ci credo.<\/em> <em>riuscire a<\/em> → <em>Non ci riesco.<\/em> – Ich schaffe es nicht.<\/li>\n<li><b>ci vuole / ci vogliono<\/b> – man braucht, es dauert: <em>Ci vuole mezz'ora.<\/em> <em>Ci vogliono due chili di farina.<\/em> Passato: <em>C'è voluto un giorno. Ci sono volute tre ore.<\/em><\/li>\n<li><b>c'è / ci sono<\/b> – es gibt, ist da: <em>C'è un problema.<\/em> <em>Ci sono molti turisti.<\/em><\/li>\n<li><b>averci<\/b> (umgangssprachlich, vor allem mit <em>lo, la, li, le<\/em>): <em>Hai l'ombrello? – Sì, ce l'ho.<\/em> – Ja, hab ich.<\/li><\/ul>\n<div class=\"tip\">Vor <em>lo, la, li, le, ne<\/em> wird <em>ci<\/em> zu <em>ce<\/em>: <em>ce l'ho, ce ne sono tre<\/em>.<\/div>\n<div class=\"warn\">Achtung: Bei <em>ci vuole<\/em> muss das Verb mit dem Benötigten übereinstimmen: <em>Ci vogliono due ore<\/em> (nicht <em>ci vuole due ore<\/em>).<\/div>"},{"h":"Das Pronomen ne","html":"<p><em>ne<\/em> hat im Deutschen oft keine direkte Entsprechung („davon, darüber, von dort“), ist im Italienischen aber Pflicht.<\/p>\n<ul><li><b>Menge / Teil<\/b>: <em>Quanti nipoti hai? – Ne ho quattro.<\/em> – Ich habe vier. <em>Vuoi del formaggio? – Sì, ne prendo un pezzo.<\/em> <em>Non ne ho.<\/em> – Ich habe keine.<\/li>\n<li><b>di + Sache<\/b>: <em>parlare di<\/em> → <em>Ne parliamo dopo.<\/em> – Wir reden später darüber. <em>Che ne pensi?<\/em> – Was hältst du davon? <em>Ne ho bisogno.<\/em> – Ich brauche es. <em>Ne sono sicura.<\/em> – Ich bin mir sicher.<\/li>\n<li><b>da + Ort<\/b> (von dort): <em>Sei stato dal medico? – Sì, ne vengo proprio adesso.<\/em> Vor allem in <em>andarsene<\/em>.<\/li><\/ul>\n<p><b>Angleichung:<\/b> In zusammengesetzten Zeiten richtet sich das Partizip nach der durch <em>ne<\/em> vertretenen Menge: <em>Quante pesche hai comprato? – Ne ho comprate sei.<\/em> <em>Di pane ne ho mangiato poco.<\/em><\/p>\n<div class=\"warn\">Achtung: Auf „Hast du Zigaretten? – Ja, ich habe welche.“ antwortet man <em>Sì, ne ho.<\/em> – nie nur <em>Sì, ho.<\/em> Bei einer Mengenangabe ohne Substantiv gehört <em>ne<\/em> immer dazu: <em>Ne voglio due.<\/em><\/div>"},{"h":"Stellung der Pronomen","html":"<p>Unbetonte Pronomen (auch <em>ci<\/em> und <em>ne<\/em>) stehen <b>vor dem konjugierten Verb<\/b>, die Verneinung davor: <em>Non lo so. Ci siamo già stati. Gli ho risposto.<\/em><\/p>\n<p><b>Angehängt<\/b> (zusammengeschrieben) werden sie an:<\/p>\n<ul><li>den Infinitiv (ohne End-<em>e<\/em>): <em>Sono contento di vederti.<\/em> <em>È ora di alzarsi.<\/em><\/li>\n<li>das Gerundium: <em>Leggendolo, ho capito tutto.<\/em><\/li>\n<li>den bejahten Imperativ von <em>tu, noi, voi<\/em>: <em>Aspettami! Proviamolo! Ditemi!<\/em> – beim Lei-Imperativ aber davor: <em>Mi dica!<\/em><\/li>\n<li><em>ecco<\/em>: <em>Eccolo!<\/em> – Da ist er! <em>Eccoci!<\/em> <em>Eccone uno.<\/em><\/li><\/ul>\n<p>Bei den einsilbigen Imperativen <em>da', di', fa', sta', va'<\/em> verdoppelt sich der Anfangskonsonant des Pronomens: <em>dammi, dimmi, fallo, stammi a sentire, vacci<\/em> (Ausnahme <em>gli<\/em>: <em>dagli<\/em>).<\/p>\n<p>Verneinter tu-Imperativ: beides möglich – <em>Non farlo! / Non lo fare!<\/em><\/p>\n<p><b>Modalverben<\/b> (<em>potere, dovere, volere<\/em>, auch <em>sapere<\/em>): Das Pronomen steht vor dem Modalverb oder hängt am Infinitiv – aber nie doppelt: <em>Ti voglio aiutare / Voglio aiutarti.<\/em><\/p>\n<div class=\"tip\">Im passato prossimo entscheidet die Stellung über das Hilfsverb: <em>Mi sono dovuto alzare<\/em>, aber <em>Ho dovuto alzarmi<\/em>.<\/div>\n<div class=\"warn\">Achtung: <em>loro<\/em> (ihnen) steht immer nach dem Verb und wird nie angehängt: <em>Scrivo loro domani.<\/em><\/div>"},{"h":"Zusammengesetzte Pronomen und feste Wendungen","html":"<p>Treffen zwei unbetonte Pronomen zusammen, steht das indirekte (oder reflexive) vor dem direkten bzw. vor <em>ne<\/em>. Dabei wird das <em>i<\/em> zu <em>e<\/em>; <em>gli<\/em> und <em>le<\/em> werden zu <em>glie-<\/em> und mit dem zweiten Pronomen zusammengeschrieben.<\/p>\n<table><tr><th><\/th><th>+ lo / la<\/th><th>+ li / le<\/th><th>+ ne<\/th><\/tr>\n<tr><td><em>mi<\/em><\/td><td><em>me lo / me la<\/em><\/td><td><em>me li / me le<\/em><\/td><td><em>me ne<\/em><\/td><\/tr>\n<tr><td><em>ti<\/em><\/td><td><em>te lo / te la<\/em><\/td><td><em>te li / te le<\/em><\/td><td><em>te ne<\/em><\/td><\/tr>\n<tr><td><em>gli, le, Le<\/em><\/td><td><em>glielo / gliela<\/em><\/td><td><em>glieli / gliele<\/em><\/td><td><em>gliene<\/em><\/td><\/tr>\n<tr><td><em>ci<\/em><\/td><td><em>ce lo / ce la<\/em><\/td><td><em>ce li / ce le<\/em><\/td><td><em>ce ne<\/em><\/td><\/tr>\n<tr><td><em>vi<\/em><\/td><td><em>ve lo / ve la<\/em><\/td><td><em>ve li / ve le<\/em><\/td><td><em>ve ne<\/em><\/td><\/tr>\n<tr><td><em>si<\/em><\/td><td><em>se lo / se la<\/em><\/td><td><em>se li / se le<\/em><\/td><td><em>se ne<\/em><\/td><\/tr><\/table>\n<p><em>Mi presti la macchina? – Te la presto volentieri.<\/em><br><em>Hai detto la notizia a Luca? – Sì, gliel'ho detta.<\/em> (Angleichung an <em>la<\/em>)<br><em>Si è messa il cappotto. → Se l'è messo.<\/em><br>Angehängt: <em>Puoi spiegarmelo? Portacene due!<\/em><\/p>\n<p><b>Feste pronominale Verben<\/b> (sehr häufig in der gesprochenen Sprache):<\/p>\n<table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr>\n<tr><td><em>andarsene<\/em><\/td><td>weggehen<\/td><td><em>Me ne vado. Se ne sono andati.<\/em><\/td><\/tr>\n<tr><td><em>farcela<\/em><\/td><td>es schaffen<\/td><td><em>Ce l'abbiamo fatta!<\/em><\/td><\/tr>\n<tr><td><em>cavarsela<\/em><\/td><td>zurechtkommen<\/td><td><em>Me la cavo con lo spagnolo.<\/em><\/td><\/tr>\n<tr><td><em>prendersela<\/em><\/td><td>übelnehmen, sich ärgern<\/td><td><em>Non prendertela!<\/em><\/td><\/tr>\n<tr><td><em>smetterla<\/em><\/td><td>damit aufhören<\/td><td><em>Smettila di lamentarti!<\/em><\/td><\/tr>\n<tr><td><em>avercela con qcn<\/em><\/td><td>sauer sein auf jdn.<\/td><td><em>Ce l'hai con me?<\/em><\/td><\/tr>\n<tr><td><em>sentirsela<\/em><\/td><td>sich zutrauen<\/td><td><em>Non me la sento.<\/em><\/td><\/tr><\/table>\n<div class=\"tip\">Das <em>la<\/em> in diesen Wendungen ist ein „leeres“ Femininum – deshalb im passato prossimo: <em>ce l'ho fatta, se l'è cavata, me la sono presa<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Direkte Objektpronomen","task":"Setze das passende direkte Objektpronomen ein (mi, ti, lo, la, La, l', ci, vi, li, le).","items":[{"q":"Compri il giornale? – Sì, ___ compro ogni mattina.","a":["lo","Lo"],"de":"Kaufst du die Zeitung? – Ja, ich kaufe sie jeden Morgen."},{"q":"Conosci le sorelle di Luca? – No, non ___ conosco.","a":["le","Le"],"de":"Kennst du Lucas Schwestern? – Nein, ich kenne sie nicht."},{"q":"Dove sono i miei occhiali? – Io ___ vedo sul tavolo.","a":["li","Li"],"de":"Wo ist meine Brille? – Ich sehe sie auf dem Tisch."},{"q":"Signora, ___ ringrazio per la pazienza.","a":["La","la"],"de":"Ich danke Ihnen für Ihre Geduld."},{"q":"Hai visto Giulia? – Sì, ___ho vista ieri.","a":["l'","l’","L'"],"de":"Hast du Giulia gesehen? – Ja, ich habe sie gestern gesehen."},{"q":"Mi ascolti? – Sì, ___ ascolto.","a":["ti","Ti"],"de":"Hörst du mir zu? – Ja, ich höre dir zu."},{"q":"Ragazzi, ___ chiamo stasera, va bene?","a":["vi","Vi"],"de":"Leute, ich rufe euch heute Abend an, okay?"},{"q":"A che ora parte il treno? – Non ___ so.","a":["lo","Lo"],"de":"Wann fährt der Zug ab? – Ich weiß es nicht."},{"q":"Noi? Marta ___ ha invitati alla sua festa.","a":["ci","Ci"],"de":"Uns? Marta hat uns zu ihrem Fest eingeladen."}]},{"type":"choice","title":"Direkt oder indirekt?","task":"Wähle das richtige Pronomen.","items":[{"q":"Vedi spesso Marco? – Sì, ___ vedo ogni giorno.","options":["lo","gli"],"a":0,"why":"vedere qcn hat ein direktes Objekt."},{"q":"Hai telefonato a Marco? – Sì, ___ ho telefonato stamattina.","options":["l'","gli"],"a":1,"why":"telefonare a qcn → indirektes Objekt."},{"q":"Aiuti tua sorella con i compiti? – Sì, ___ aiuto spesso.","options":["la","le"],"a":0,"why":"aiutare qcn ist transitiv, anders als deutsch „jdm. helfen“."},{"q":"Cosa regali a Chiara? – ___ regalo un libro.","options":["La","Le"],"a":1,"why":"a Chiara = ihr → le."},{"q":"Scrivi ai tuoi nonni? – Sì, ___ scrivo una lettera ogni mese.","options":["li","gli"],"a":1,"why":"a + Personen im Plural → gli (gehoben: scrivo loro)."},{"q":"Ringrazi il professore? – Certo, ___ ringrazio.","options":["lo","gli"],"a":0,"why":"ringraziare qcn → direktes Objekt."},{"q":"Signor Bassi, ___ posso offrire un caffè?","options":["La","Le"],"a":1,"why":"offrire qcs a qcn → indirekt, höflich Le."},{"q":"A Paolo il film non ___ è piaciuto.","options":["lo","gli"],"a":1,"why":"piacere a qcn → indirektes Objekt."},{"q":"Ascolti la radio? – Sì, ___ ascolto in macchina.","options":["la","le"],"a":0,"why":"ascoltare qcs → direktes Objekt."}]},{"type":"choice","title":"ci oder ne?","task":"Wähle ci oder ne (bzw. ce).","items":[{"q":"Vai spesso in montagna? – Sì, ___ vado ogni fine settimana.","options":["ci","ne"],"a":0,"why":"Ort (in montagna) → ci."},{"q":"Quanti fratelli hai? – ___ ho due.","options":["Ci","Ne"],"a":1,"why":"Mengenangabe → ne."},{"q":"Pensi ancora a quella storia? – No, non ___ penso più.","options":["ci","ne"],"a":0,"why":"pensare a qcs → ci."},{"q":"Hai parlato del problema con il capo? – Sì, ___ ho parlato ieri.","options":["ci","ne"],"a":1,"why":"parlare di qcs → ne."},{"q":"Quanto tempo ___ vuole per arrivare a Napoli?","options":["ci","ne"],"a":0,"why":"ci vuole = man braucht / es dauert."},{"q":"Che ___ pensi del nuovo sindaco?","options":["ci","ne"],"a":1,"why":"Meinung „davon“ (pensare di) → ne."},{"q":"Sei sicura? – Sì, ___ sono sicurissima.","options":["ci","ne"],"a":1,"why":"essere sicuro di qcs → ne."},{"q":"Riesci ad aprire la finestra? – No, non ___ riesco.","options":["ci","ne"],"a":0,"why":"riuscire a → ci."},{"q":"Vuoi dell'acqua? – No grazie, ___ ho ancora.","options":["ci","ne"],"a":1,"why":"Teilmenge (dell'acqua) → ne."},{"q":"Hai la patente? – Sì, ___ l'ho.","options":["ce","ne"],"a":0,"why":"averci: ci wird vor lo/la zu ce → ce l'ho."}]},{"type":"choice","title":"Betonte Formen und Stellung","task":"Wähle die richtige Form.","items":[{"q":"Vieni al cinema con ___?","options":["mi","me"],"a":1,"why":"Nach Präpositionen steht die betonte Form."},{"q":"A ___ piace il jazz, a lui no.","options":["mi","me"],"a":1,"why":"Gegensatz mit a → betonte Form a me."},{"q":"È più alto di ___.","options":["io","me","mi"],"a":1,"why":"Im Vergleich nach di steht die betonte Form."},{"q":"Domani devo ___ presto.","options":["alzarmi","mi alzare","alzare mi"],"a":0,"why":"Am Infinitiv wird das Pronomen angehängt (alternativ: mi devo alzare)."},{"q":"Il libro? ___ subito, per favore!","options":["Lo dammi","Dammelo","Dammilo"],"a":1,"why":"Angehängt an den Imperativ; mi wird vor lo zu me, nach da' Konsonantenverdopplung."},{"q":"Signora, ___ pure!","options":["si accomodi","accomodisi","si accomoda"],"a":0,"why":"Beim Lei-Imperativ steht das Pronomen vor dem Verb."},{"q":"Dove sono le ragazze? – ___!","options":["Eccole","Le ecco","Eccoli"],"a":0,"why":"An ecco wird angehängt; ragazze ist feminin Plural."},{"q":"Ieri ___ dovuto alzare alle cinque.","options":["mi ho","mi sono"],"a":1,"why":"Steht das Reflexivpronomen vor dem Modalverb, nimmt man essere."},{"q":"Cercano te, non ___.","options":["mi","me"],"a":1,"why":"Hervorhebung/Gegensatz → betonte Form."}]},{"type":"gap","title":"Zusammengesetzte Pronomen","task":"Ersetze beide Objekte durch ein zusammengesetztes Pronomen (ggf. mit Apostroph).","items":[{"q":"Mi presti la penna? – Sì, ___ presto.","a":["te la","Te la"],"de":"Leihst du mir den Stift? – Ja, ich leihe ihn dir."},{"q":"Hai dato le chiavi a Marco? – Sì, ___ ho date.","a":["gliele","Gliele"],"de":"Hast du Marco die Schlüssel gegeben? – Ja, ich habe sie ihm gegeben."},{"q":"Ci porta il conto, per favore? – Certo, ___ porto subito.","a":["ve lo","Ve lo"],"de":"Bringen Sie uns die Rechnung? – Natürlich, ich bringe sie Ihnen sofort."},{"q":"Hai detto la verità a tua madre? – Sì, ___ho detta.","a":["gliel'","gliel’","Gliel'"],"de":"Hast du deiner Mutter die Wahrheit gesagt? – Ja, ich habe sie ihr gesagt."},{"q":"Quante caramelle ti ha dato? – ___ ha date due.","a":["Me ne","me ne"],"de":"Wie viele Bonbons hat er dir gegeben? – Er hat mir zwei gegeben."},{"q":"Il caffè? Signora, ___ preparo subito.","a":["glielo","Glielo"],"de":"Den Kaffee? Ich mache ihn Ihnen sofort."},{"q":"Ti sei lavato le mani? – Sì, ___ sono lavate.","a":["me le","Me le"],"de":"Hast du dir die Hände gewaschen? – Ja, ich habe sie mir gewaschen."},{"q":"Puoi spiegare la regola a Sara? – Sì, posso spiegar___.","a":["gliela","Gliela"],"de":"Kannst du Sara die Regel erklären? – Ja, ich kann sie ihr erklären."},{"q":"Paolo si è dimenticato l'ombrello? – Sì, ___è dimenticato.","a":["se l'","se l’","Se l'"],"de":"Hat Paolo seinen Schirm vergessen? – Ja, er hat ihn vergessen."},{"q":"Quanti libri hai regalato ai bambini? – ___ ho regalati cinque.","a":["Gliene","gliene"],"de":"Wie viele Bücher hast du den Kindern geschenkt? – Ich habe ihnen fünf geschenkt."}]},{"type":"gap","title":"Pronominale Wendungen","task":"Ergänze die Wendung in der passenden Form (Verb in Klammern).","items":[{"q":"È tardi, io ___ vado. (andarsene)","a":["me ne","Me ne"],"de":"Es ist spät, ich gehe."},{"q":"L'esame era difficile, ma ___ l'ho fatta! (farcela)","a":["ce","Ce"],"de":"Die Prüfung war schwer, aber ich habe es geschafft!"},{"q":"Parli tedesco? – Me ___ cavo abbastanza bene. (cavarsela)","a":["la","La"],"de":"Sprichst du Deutsch? – Ich komme ganz gut zurecht."},{"q":"Non te ___ prendere, era solo uno scherzo! (prendersela)","a":["la","La"],"de":"Nimm es nicht übel, es war nur ein Scherz!"},{"q":"Basta! ___ di gridare! (smetterla, tu-Imperativ)","a":["Smettila","smettila"],"de":"Schluss! Hör auf zu schreien!"},{"q":"Perché Luca non mi saluta? ___ con me? (avercela, lui)","a":["Ce l'ha","Ce l’ha","ce l'ha"],"de":"Warum grüßt Luca mich nicht? Ist er sauer auf mich?"},{"q":"I nostri vicini ___ sono andati senza salutare. (andarsene)","a":["se ne","Se ne"],"de":"Unsere Nachbarn sind gegangen, ohne sich zu verabschieden."},{"q":"Ce la ___ a portare la valigia da solo? (farcela, tu, Präsens)","a":["fai","Fai"],"de":"Schaffst du es, den Koffer allein zu tragen?"},{"q":"Non me la ___ di guidare di notte. (sentirsela, io)","a":["sento","Sento"],"de":"Ich traue mir nicht zu, nachts zu fahren."},{"q":"Ragazzi, ___! Non voglio più vedervi qui. (andarsene, voi-Imperativ)","a":["andatevene","Andatevene"],"de":"Leute, verschwindet! Ich will euch hier nicht mehr sehen."}]}],"cards":[{"f":"Subjektpronomen – wann setzen?","b":"Nur bei Betonung, Gegensatz oder nach anche/neanche: Pago io! Io lavoro, tu no."},{"f":"„Es regnet.“","b":"Piove. (kein Pronomen für „es“)"},{"f":"Höfliche Anrede Singular / Plural","b":"Lei (3. Pers. Sg.) / voi"},{"f":"Reflexivpronomen","b":"mi, ti, si, ci, vi, si"},{"f":"„Ich putze mir die Zähne.“","b":"Mi lavo i denti. (kein Possessiv)"},{"f":"Direkte Objektpronomen 3. Person","b":"lo, la (Sg.) – li, le (Pl.)"},{"f":"Indirekte Objektpronomen 3. Person","b":"gli (ihm), le (ihr), Le (Ihnen), gli / loro (ihnen)"},{"f":"„Ich danke Ihnen.“","b":"La ringrazio. (ringraziare + direktes Objekt)"},{"f":"„Ich rufe ihn an.“","b":"Gli telefono. (telefonare a qcn)"},{"f":"Hai visto Anna? – Ja, ich habe sie gesehen.","b":"Sì, l'ho vista. (Angleichung an la)"},{"f":"Angleichung beim indirekten Pronomen?","b":"Nein: Le ho scritto. (nicht scritta)"},{"f":"Betonte Pronomen","b":"me, te, lui, lei, Lei, sé, noi, voi, loro"},{"f":"„ohne dich“","b":"senza di te"},{"f":"„Du Glücklicher!“","b":"Beato te!"},{"f":"ci – vier Hauptbedeutungen","b":"uns · dort/dorthin · a + Sache (ci penso) · in ci vuole / c'è / averci"},{"f":"„Man braucht zwei Stunden.“","b":"Ci vogliono due ore."},{"f":"„Hast du den Schlüssel? – Ja, hab ich.“","b":"Hai la chiave? – Sì, ce l'ho."},{"f":"„Ich habe drei (davon).“","b":"Ne ho tre."},{"f":"„Was hältst du davon?“","b":"Che ne pensi?"},{"f":"Quante foto hai fatto? – Ich habe zehn gemacht.","b":"Ne ho fatte dieci. (Angleichung bei ne)"},{"f":"Stellung: angehängt an …","b":"Infinitiv, Gerundium, Imperativ (tu/noi/voi), ecco"},{"f":"„Sag es mir!“ (tu)","b":"Dimmelo! (Verdopplung nach di')"},{"f":"Modalverb + Pronomen","b":"Lo voglio fare / Voglio farlo – nie doppelt."},{"f":"mi + lo / gli + la / ci + ne","b":"me lo / gliela / ce ne"},{"f":"„Ich habe es ihm gesagt.“","b":"Gliel'ho detto."},{"f":"andarsene – Präsens","b":"me ne vado, te ne vai, se ne va, ce ne andiamo, ve ne andate, se ne vanno"},{"f":"„Wir haben es geschafft!“","b":"Ce l'abbiamo fatta!"},{"f":"cavarsela / prendersela","b":"zurechtkommen / übelnehmen, sich ärgern"},{"f":"„Bist du sauer auf mich?“","b":"Ce l'hai con me?"},{"f":"„Hör auf damit!“","b":"Smettila!"}],"id":"k10"},{"nr":10.5,"title":"Das Verb im Überblick","teil":"Das Verb und seine Ergänzungen","intro":"Bevor es an die einzelnen Zeiten geht: Hier siehst du, wie das italienische Verbsystem aufgebaut ist – Konjugationen, Personen, Zeiten und Modi auf einen Blick.","sections":[{"h":"Drei Konjugationen","html":"<p>Italienische Verben teilen sich nach der Infinitivendung in drei Gruppen. Der Stamm entsteht durch Abtrennen der Endung: <em>parl-are, prend-ere, dorm-ire<\/em>.<\/p>\n<table><tr><th><\/th><th>-are<\/th><th>-ere<\/th><th>-ire<\/th><\/tr>\n<tr><td>io<\/td><td><em>parlo<\/em><\/td><td><em>prendo<\/em><\/td><td><em>dormo<\/em><\/td><\/tr>\n<tr><td>tu<\/td><td><em>parli<\/em><\/td><td><em>prendi<\/em><\/td><td><em>dormi<\/em><\/td><\/tr>\n<tr><td>lui/lei<\/td><td><em>parla<\/em><\/td><td><em>prende<\/em><\/td><td><em>dorme<\/em><\/td><\/tr>\n<tr><td>noi<\/td><td><em>parliamo<\/em><\/td><td><em>prendiamo<\/em><\/td><td><em>dormiamo<\/em><\/td><\/tr>\n<tr><td>voi<\/td><td><em>parlate<\/em><\/td><td><em>prendete<\/em><\/td><td><em>dormite<\/em><\/td><\/tr>\n<tr><td>loro<\/td><td><em>parlano<\/em><\/td><td><em>prendono<\/em><\/td><td><em>dormono<\/em><\/td><\/tr><\/table>\n<p>Viele <em>-ire<\/em>-Verben schieben im Präsens bei <em>io, tu, lui/lei, loro<\/em> ein <em>-isc-<\/em> ein: <em>finisco, finisci, finisce, finiamo, finite, finiscono<\/em>. Ebenso: <em>capire, preferire, pulire, spedire, costruire<\/em>.<\/p>\n<div class=\"tip\">Die Gruppe <em>-are<\/em> ist die größte und fast ganz regelmäßig; neue Verben entstehen fast immer auf <em>-are<\/em> (<em>chattare, googlare<\/em>).<\/div>"},{"h":"Die Endung zeigt die Person","html":"<p>Weil jede Person eine eigene Endung hat, braucht man das Subjektpronomen normalerweise nicht: <em>Abitiamo vicino al porto.<\/em> – Wir wohnen in der Nähe des Hafens. <em>Che cosa leggi?<\/em> – Was liest du?<\/p>\n<p><b>Höflichkeitsform:<\/b> Man siezt eine Person mit der 3. Person Singular (<em>Lei<\/em>), mehrere Personen meist mit der 2. Person Plural (<em>voi<\/em>).<\/p>\n<ul><li><em>Scusi, Lei parla inglese?<\/em> – Entschuldigung, sprechen Sie Englisch?<\/li>\n<li><em>Signori, da dove venite?<\/em> – Woher kommen Sie (alle)?<\/li><\/ul>\n<div class=\"warn\">Achtung: Das deutsche „Sie“ ist 3. Person Plural – im Italienischen steht dagegen der Singular: <em>Lei è<\/em>, nicht <em>Lei sono<\/em>.<\/div>"},{"h":"Die Zeiten des Indikativs","html":"<p>Der Indikativ (Wirklichkeitsform) hat acht Zeiten – vier einfache und vier zusammengesetzte.<\/p>\n<table><tr><th>Zeit<\/th><th>Beispiel<\/th><th>Deutsch<\/th><\/tr>\n<tr><td>presente<\/td><td><em>Lavoro a Genova.<\/em><\/td><td>Ich arbeite in Genua.<\/td><\/tr>\n<tr><td>imperfetto<\/td><td><em>Da bambino giocavo a calcio.<\/em><\/td><td>Als Kind spielte ich Fußball.<\/td><\/tr>\n<tr><td>passato prossimo<\/td><td><em>Ieri ho finito presto.<\/em><\/td><td>Gestern war ich früh fertig.<\/td><\/tr>\n<tr><td>passato remoto<\/td><td><em>La nonna partì nel 1960.<\/em><\/td><td>Die Oma reiste 1960 ab.<\/td><\/tr>\n<tr><td>trapassato prossimo<\/td><td><em>Il film era già cominciato.<\/em><\/td><td>Der Film hatte schon begonnen.<\/td><\/tr>\n<tr><td>trapassato remoto<\/td><td><em>Dopo che ebbe mangiato, uscì.<\/em><\/td><td>Nachdem er gegessen hatte, ging er.<\/td><\/tr>\n<tr><td>futuro semplice<\/td><td><em>Domani pioverà.<\/em><\/td><td>Morgen wird es regnen.<\/td><\/tr>\n<tr><td>futuro anteriore<\/td><td><em>Quando avrò finito, ti chiamerò.<\/em><\/td><td>Wenn ich fertig bin, rufe ich dich an.<\/td><\/tr><\/table>"},{"h":"Die anderen Modi und das Passiv","html":"<table><tr><th>Modus<\/th><th>Beispiel<\/th><th>Deutsch<\/th><\/tr>\n<tr><td>congiuntivo presente<\/td><td><em>Penso che sia vero.<\/em><\/td><td>Ich glaube, es ist wahr.<\/td><\/tr>\n<tr><td>congiuntivo passato<\/td><td><em>Credo che sia già partita.<\/em><\/td><td>Ich glaube, sie ist schon abgereist.<\/td><\/tr>\n<tr><td>congiuntivo imperfetto<\/td><td><em>Vorrei che tu restassi.<\/em><\/td><td>Ich möchte, dass du bleibst.<\/td><\/tr>\n<tr><td>congiuntivo trapassato<\/td><td><em>Se l'avessi saputo, sarei venuto.<\/em><\/td><td>Hätte ich es gewusst, wäre ich gekommen.<\/td><\/tr>\n<tr><td>condizionale presente<\/td><td><em>Prenderei un tè.<\/em><\/td><td>Ich würde einen Tee nehmen.<\/td><\/tr>\n<tr><td>condizionale passato<\/td><td><em>Avrei preferito il mare.<\/em><\/td><td>Ich hätte das Meer vorgezogen.<\/td><\/tr>\n<tr><td>imperativo<\/td><td><em>Aspetta un attimo!<\/em><\/td><td>Warte einen Moment!<\/td><\/tr>\n<tr><td>infinito<\/td><td><em>Mi piace nuotare.<\/em><\/td><td>Ich schwimme gern.<\/td><\/tr>\n<tr><td>gerundio<\/td><td><em>Sto cucinando.<\/em><\/td><td>Ich koche gerade.<\/td><\/tr>\n<tr><td>participio<\/td><td><em>Finita la cena, siamo usciti.<\/em><\/td><td>Nach dem Essen gingen wir aus.<\/td><\/tr><\/table>\n<p><b>Passiv:<\/b> Es wird mit <em>essere<\/em> (oder <em>venire<\/em>) + Partizip gebildet, das Partizip richtet sich nach dem Subjekt: <em>La chiesa è stata restaurata nel 2015.<\/em> – Die Kirche wurde 2015 restauriert.<\/p>"},{"h":"Einfache und zusammengesetzte Zeiten","html":"<p>Zu jeder einfachen Zeit gibt es eine zusammengesetzte: Hilfsverb <em>avere<\/em> oder <em>essere<\/em> in der einfachen Zeit + Partizip Perfekt. Sie drückt Vorzeitigkeit aus.<\/p>\n<table><tr><th>einfach<\/th><th>zusammengesetzt<\/th><\/tr>\n<tr><td>presente <em>mangio<\/em><\/td><td>passato prossimo <em>ho mangiato<\/em><\/td><\/tr>\n<tr><td>imperfetto <em>mangiavo<\/em><\/td><td>trapassato prossimo <em>avevo mangiato<\/em><\/td><\/tr>\n<tr><td>passato remoto <em>mangiai<\/em><\/td><td>trapassato remoto <em>ebbi mangiato<\/em><\/td><\/tr>\n<tr><td>futuro <em>mangerò<\/em><\/td><td>futuro anteriore <em>avrò mangiato<\/em><\/td><\/tr><\/table>\n<p>Mit <em>essere<\/em> wird das Partizip angeglichen: <em>Anna è arrivata. I ragazzi sono partiti.<\/em><\/p>\n<p><b>Die Vergangenheitszeiten im Überblick:<\/b><\/p>\n<ul><li><b>imperfetto<\/b> – Zustand, Gewohnheit, Hintergrund: <em>Faceva freddo.<\/em><\/li>\n<li><b>passato prossimo<\/b> – abgeschlossenes Ereignis, meist mit Bezug zur Gegenwart (gesprochene Sprache): <em>Ho comprato una bici.<\/em><\/li>\n<li><b>passato remoto<\/b> – abgeschlossen, ohne Gegenwartsbezug (Erzählung, Geschichte): <em>Il castello bruciò nel Seicento.<\/em><\/li>\n<li><b>trapassato<\/b> – Vorvergangenheit: <em>Ero uscito prima della pioggia.<\/em><\/li><\/ul>\n<div class=\"warn\">Achtung: Das deutsche Präteritum entspricht nicht automatisch dem imperfetto. „Ich kaufte ein Auto“ (einmalig) heißt <em>Ho comprato una macchina<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Präsens der drei Konjugationen","task":"Setze die Präsensform ein.","items":[{"q":"Noi (abitare) ___ a Trieste.","a":["abitiamo","Abitiamo"],"de":"Wir wohnen in Triest."},{"q":"Tu (vendere) ___ la tua vecchia moto?","a":["vendi","Vendi"],"de":"Verkaufst du dein altes Motorrad?"},{"q":"Loro (partire) ___ domani mattina.","a":["partono","Partono"],"de":"Sie reisen morgen früh ab."},{"q":"Io non (capire) ___ questa parola.","a":["capisco","Capisco"],"de":"Ich verstehe dieses Wort nicht."},{"q":"Voi (scrivere) ___ spesso ai vostri amici?","a":["scrivete","Scrivete"],"de":"Schreibt ihr euren Freunden oft?"},{"q":"Signora, Lei (preferire) ___ il treno o l'aereo?","a":["preferisce","Preferisce"],"de":"Ziehen Sie den Zug oder das Flugzeug vor?"},{"q":"Marco (lavorare) ___ in banca.","a":["lavora","Lavora"],"de":"Marco arbeitet in einer Bank."},{"q":"I bambini (pulire) ___ la loro camera.","a":["puliscono","Puliscono"],"de":"Die Kinder putzen ihr Zimmer."}]},{"type":"choice","title":"Welche Zeit, welcher Modus?","task":"Bestimme Zeit bzw. Modus der genannten Verbform.","items":[{"q":"vedremo – Domani vedremo la partita.","options":["futuro semplice","condizionale presente","presente"],"a":0,"why":"Endung -emo + r-Stamm = futuro semplice."},{"q":"vedremmo – Vedremmo volentieri la partita.","options":["futuro semplice","condizionale presente","congiuntivo imperfetto"],"a":1,"why":"Doppel-m (-emmo) kennzeichnet den condizionale."},{"q":"correvo – Quando ero giovane, correvo molto.","options":["passato remoto","imperfetto","trapassato prossimo"],"a":1,"why":"-evo ist die typische imperfetto-Endung."},{"q":"avevamo pagato – Avevamo già pagato.","options":["passato prossimo","trapassato prossimo","futuro anteriore"],"a":1,"why":"Hilfsverb im imperfetto + Partizip = trapassato prossimo."},{"q":"morì – Il poeta morì giovane.","options":["passato remoto","presente","imperfetto"],"a":0,"why":"Betontes -ì in der 3. Person: passato remoto von morire."},{"q":"stia – Spero che tu stia meglio.","options":["indicativo presente","congiuntivo presente","imperativo"],"a":1,"why":"Nach sperare che steht der congiuntivo: stia."},{"q":"sarai arrivato – Quando sarai arrivato, scrivimi.","options":["futuro anteriore","passato prossimo","condizionale passato"],"a":0,"why":"Hilfsverb im futuro + Partizip = futuro anteriore."},{"q":"mangiando – Stiamo mangiando.","options":["participio","gerundio","infinito"],"a":1,"why":"-ando/-endo ist die Endung des gerundio."}]},{"type":"choice","title":"Hilfsverb und Vergangenheit","task":"Wähle die richtige Form.","items":[{"q":"Ieri ___ visto un bel film.","options":["ho","sono"],"a":0,"why":"vedere hat ein direktes Objekt → avere."},{"q":"Le mie cugine ___ arrivate stamattina.","options":["hanno","sono"],"a":1,"why":"Verb der Bewegung → essere, Partizip angeglichen."},{"q":"Da piccola ___ sempre al parco.","options":["andavo","sono andata"],"a":0,"why":"Gewohnheit in der Vergangenheit → imperfetto."},{"q":"Quando siamo arrivati, la lezione ___ già cominciata.","options":["è","era"],"a":1,"why":"Vorzeitig zu einer Vergangenheit → trapassato prossimo."},{"q":"Nel 1871 Roma ___ capitale d'Italia.","options":["diventò","diventava"],"a":0,"why":"Abgeschlossenes historisches Ereignis → passato remoto."},{"q":"Il ponte ___ costruito nel Cinquecento.","options":["ha","fu"],"a":1,"why":"Passiv: essere (hier passato remoto) + Partizip."},{"q":"Stamattina ___ alzato alle sei.","options":["mi sono","mi ho"],"a":0,"why":"Reflexive Verben bilden die zusammengesetzten Zeiten mit essere."},{"q":"Elena ___ partita senza salutare.","options":["ha","è"],"a":1,"why":"partire → essere."}]}],"cards":[{"f":"Die drei Konjugationen","b":"-are (parlare), -ere (prendere), -ire (dormire / finire)"},{"f":"finire – Präsens","b":"finisco, finisci, finisce, finiamo, finite, finiscono"},{"f":"Weitere -isc-Verben","b":"capire, preferire, pulire, spedire, costruire"},{"f":"Siezen einer Person","b":"Lei + 3. Person Singular: Lei parla …"},{"f":"Siezen mehrerer Personen","b":"meist voi + 2. Person Plural"},{"f":"Wie viele Zeiten hat der Indikativ?","b":"Acht: 4 einfache, 4 zusammengesetzte"},{"f":"Zusammengesetzte Zeit = …","b":"avere / essere (einfache Zeit) + Partizip Perfekt"},{"f":"presente → passato prossimo","b":"mangio → ho mangiato"},{"f":"imperfetto → trapassato prossimo","b":"mangiavo → avevo mangiato"},{"f":"passato remoto → trapassato remoto","b":"mangiai → ebbi mangiato"},{"f":"futuro → futuro anteriore","b":"mangerò → avrò mangiato"},{"f":"Modi des Italienischen","b":"indicativo, congiuntivo, condizionale, imperativo + infinito, gerundio, participio"},{"f":"imperfetto oder passato prossimo?","b":"imperfetto: Zustand, Gewohnheit, Hintergrund – passato prossimo: abgeschlossenes Ereignis"},{"f":"Passiv – Bildung","b":"essere / venire + Partizip (angeglichen): La casa è stata venduta."}],"id":"k10b"},{"nr":11,"title":"Der Indikativ","teil":"Das Verb und seine Ergänzungen","intro":"Der Indikativ ist der Modus der Wirklichkeit: Mit seinen acht Zeiten erzählst du, was ist, was war und was sein wird. Besonders wichtig sind die unregelmäßigen Formen und das Zusammenspiel von imperfetto und passato prossimo.","sections":[{"h":"Präsens: regelmäßige Formen und Schreibung","html":"<table><tr><th><\/th><th>parlare<\/th><th>vendere<\/th><th>aprire<\/th><\/tr>\n<tr><td>io<\/td><td><em>parlo<\/em><\/td><td><em>vendo<\/em><\/td><td><em>apro<\/em><\/td><\/tr>\n<tr><td>tu<\/td><td><em>parli<\/em><\/td><td><em>vendi<\/em><\/td><td><em>apri<\/em><\/td><\/tr>\n<tr><td>lui/lei<\/td><td><em>parla<\/em><\/td><td><em>vende<\/em><\/td><td><em>apre<\/em><\/td><\/tr>\n<tr><td>noi<\/td><td><em>parliamo<\/em><\/td><td><em>vendiamo<\/em><\/td><td><em>apriamo<\/em><\/td><\/tr>\n<tr><td>voi<\/td><td><em>parlate<\/em><\/td><td><em>vendete<\/em><\/td><td><em>aprite<\/em><\/td><\/tr>\n<tr><td>loro<\/td><td><em>parlano<\/em><\/td><td><em>vendono<\/em><\/td><td><em>aprono<\/em><\/td><\/tr><\/table>\n<p><b>-isc-Verben<\/b> (<em>finire, capire, preferire, pulire, spedire, costruire, restituire<\/em>): <em>-isc-<\/em> in allen Singularformen und in der 3. Person Plural: <em>capisco, capisci, capisce, capiamo, capite, capiscono<\/em>.<\/p>\n<p><b>Schreibbesonderheiten<\/b> – die Aussprache des Stammes soll gleich bleiben:<\/p>\n<ul><li><em>-care / -gare<\/em>: vor <em>i<\/em> ein <em>h<\/em>: <em>cerco, cerchi, cerca, cerchiamo<\/em>; <em>pago, paghi, paghiamo<\/em>.<\/li>\n<li><em>-ciare / -giare<\/em>: das <em>i<\/em> des Stammes fällt vor <em>i<\/em> weg: <em>mangio, mangi, mangiamo<\/em>; <em>comincio, cominci<\/em>.<\/li>\n<li><em>-iare<\/em> mit unbetontem <em>i<\/em>: nur ein <em>i<\/em>: <em>studio, studi, studiamo<\/em>. Ist das <em>i<\/em> betont, bleibt es: <em>invio, invii<\/em>; <em>scio, scii<\/em>.<\/li><\/ul>\n<div class=\"tip\">Bei <em>-cere / -gere<\/em> ändert sich nur die Aussprache, nicht die Schrift: <em>vinco<\/em> [k] – <em>vinci<\/em> [tsch]; <em>leggo<\/em> [g] – <em>leggi<\/em> [dsch].<\/div>\n<div class=\"warn\">Achtung: Die 3. Person Plural wird auf dem Stamm betont: <em>p<b>a<\/b>rlano, abitano, telefonano<\/em> – nicht auf der Endung.<\/div>"},{"h":"Präsens: unregelmäßige Verben","html":"<table><tr><th>Verb<\/th><th>io · tu · lui<\/th><th>noi · voi · loro<\/th><\/tr>\n<tr><td><em>essere<\/em><\/td><td><em>sono, sei, è<\/em><\/td><td><em>siamo, siete, sono<\/em><\/td><\/tr>\n<tr><td><em>avere<\/em><\/td><td><em>ho, hai, ha<\/em><\/td><td><em>abbiamo, avete, hanno<\/em><\/td><\/tr>\n<tr><td><em>andare<\/em><\/td><td><em>vado, vai, va<\/em><\/td><td><em>andiamo, andate, vanno<\/em><\/td><\/tr>\n<tr><td><em>fare<\/em><\/td><td><em>faccio, fai, fa<\/em><\/td><td><em>facciamo, fate, fanno<\/em><\/td><\/tr>\n<tr><td><em>dare<\/em><\/td><td><em>do, dai, dà<\/em><\/td><td><em>diamo, date, danno<\/em><\/td><\/tr>\n<tr><td><em>stare<\/em><\/td><td><em>sto, stai, sta<\/em><\/td><td><em>stiamo, state, stanno<\/em><\/td><\/tr>\n<tr><td><em>dire<\/em><\/td><td><em>dico, dici, dice<\/em><\/td><td><em>diciamo, dite, dicono<\/em><\/td><\/tr>\n<tr><td><em>venire<\/em><\/td><td><em>vengo, vieni, viene<\/em><\/td><td><em>veniamo, venite, vengono<\/em><\/td><\/tr>\n<tr><td><em>uscire<\/em><\/td><td><em>esco, esci, esce<\/em><\/td><td><em>usciamo, uscite, escono<\/em><\/td><\/tr>\n<tr><td><em>potere<\/em><\/td><td><em>posso, puoi, può<\/em><\/td><td><em>possiamo, potete, possono<\/em><\/td><\/tr>\n<tr><td><em>volere<\/em><\/td><td><em>voglio, vuoi, vuole<\/em><\/td><td><em>vogliamo, volete, vogliono<\/em><\/td><\/tr>\n<tr><td><em>dovere<\/em><\/td><td><em>devo, devi, deve<\/em><\/td><td><em>dobbiamo, dovete, devono<\/em><\/td><\/tr>\n<tr><td><em>sapere<\/em><\/td><td><em>so, sai, sa<\/em><\/td><td><em>sappiamo, sapete, sanno<\/em><\/td><\/tr><\/table>\n<table><tr><th>Verb<\/th><th>io · tu · lui<\/th><th>noi · voi · loro<\/th><\/tr>\n<tr><td><em>bere<\/em><\/td><td><em>bevo, bevi, beve<\/em><\/td><td><em>beviamo, bevete, bevono<\/em><\/td><\/tr>\n<tr><td><em>rimanere<\/em><\/td><td><em>rimango, rimani, rimane<\/em><\/td><td><em>rimaniamo, rimanete, rimangono<\/em><\/td><\/tr>\n<tr><td><em>tenere<\/em><\/td><td><em>tengo, tieni, tiene<\/em><\/td><td><em>teniamo, tenete, tengono<\/em><\/td><\/tr>\n<tr><td><em>scegliere<\/em><\/td><td><em>scelgo, scegli, sceglie<\/em><\/td><td><em>scegliamo, scegliete, scelgono<\/em><\/td><\/tr>\n<tr><td><em>porre<\/em><\/td><td><em>pongo, poni, pone<\/em><\/td><td><em>poniamo, ponete, pongono<\/em><\/td><\/tr>\n<tr><td><em>tradurre<\/em><\/td><td><em>traduco, traduci, traduce<\/em><\/td><td><em>traduciamo, traducete, traducono<\/em><\/td><\/tr>\n<tr><td><em>salire<\/em><\/td><td><em>salgo, sali, sale<\/em><\/td><td><em>saliamo, salite, salgono<\/em><\/td><\/tr>\n<tr><td><em>piacere<\/em><\/td><td><em>piaccio, piaci, piace<\/em><\/td><td><em>piacciamo, piacete, piacciono<\/em><\/td><\/tr><\/table>\n<div class=\"tip\">Viele Verben haben ein <em>-g-<\/em> nur bei <em>io<\/em> und <em>loro<\/em>: <em>vengo/vengono, tengo/tengono, rimango/rimangono, salgo/salgono, pongo/pongono<\/em>. Wie <em>porre<\/em> gehen <em>proporre, comporre<\/em>, wie <em>tradurre<\/em> gehen <em>produrre, condurre, ridurre<\/em>.<\/div>\n<div class=\"warn\">Achtung: <em>dà<\/em> (er gibt) mit Akzent, <em>da<\/em> (von) ohne. Ebenso <em>è<\/em> (ist) und <em>e<\/em> (und).<\/div>"},{"h":"Präsens: Gebrauch und stare + Gerundium","html":"<ul><li><b>Gegenwart und Gewohnheit<\/b>: <em>Faccio colazione alle sette.<\/em><\/li>\n<li><b>Allgemeingültiges<\/b>: <em>L'acqua bolle a cento gradi.<\/em><\/li>\n<li><b>Nahe, geplante Zukunft<\/b>: <em>Sabato andiamo al lago.<\/em> – Am Samstag fahren wir an den See.<\/li>\n<li><b>„seit“ + andauernde Handlung<\/b>: <em>da<\/em> + Präsens: <em>Abito a Pavia da tre anni.<\/em> – Ich wohne seit drei Jahren in Pavia. <em>Ti aspetto da mezz'ora!<\/em><\/li>\n<li>Lebendiges Erzählen (historisches Präsens): <em>Nel 1492 Colombo arriva in America.<\/em><\/li><\/ul>\n<p><b>stare + Gerundium<\/b> betont, dass eine Handlung gerade abläuft: <em>Sto scrivendo una mail.<\/em> – Ich schreibe gerade eine Mail. Gerundium: <em>-are → -ando<\/em>, <em>-ere/-ire → -endo<\/em>; unregelmäßig: <em>facendo, dicendo, bevendo, traducendo, ponendo<\/em>.<\/p>\n<p><b>stare per + Infinitiv<\/b> = gleich etwas tun: <em>Sto per uscire.<\/em> – Ich gehe gleich aus dem Haus.<\/p>\n<div class=\"warn\">Achtung: „seit“ mit andauernder Handlung heißt <em>da<\/em> + Präsens, nicht passato prossimo: <em>Studio il violino da due anni<\/em> (nicht <em>ho studiato … da<\/em>). Ist die Handlung abgeschlossen, steht <em>per<\/em>: <em>Ho studiato il violino per due anni.<\/em> – Ich habe zwei Jahre Geige gelernt.<\/div>"},{"h":"Imperfetto: Formen","html":"<p>Bildung: Infinitiv ohne <em>-re<\/em> + <em>-vo, -vi, -va, -vamo, -vate, -vano<\/em>. Fast alle Verben sind regelmäßig.<\/p>\n<table><tr><th><\/th><th>parlare<\/th><th>avere<\/th><th>dormire<\/th><\/tr>\n<tr><td>io<\/td><td><em>parlavo<\/em><\/td><td><em>avevo<\/em><\/td><td><em>dormivo<\/em><\/td><\/tr>\n<tr><td>tu<\/td><td><em>parlavi<\/em><\/td><td><em>avevi<\/em><\/td><td><em>dormivi<\/em><\/td><\/tr>\n<tr><td>lui/lei<\/td><td><em>parlava<\/em><\/td><td><em>aveva<\/em><\/td><td><em>dormiva<\/em><\/td><\/tr>\n<tr><td>noi<\/td><td><em>parlavamo<\/em><\/td><td><em>avevamo<\/em><\/td><td><em>dormivamo<\/em><\/td><\/tr>\n<tr><td>voi<\/td><td><em>parlavate<\/em><\/td><td><em>avevate<\/em><\/td><td><em>dormivate<\/em><\/td><\/tr>\n<tr><td>loro<\/td><td><em>parlavano<\/em><\/td><td><em>avevano<\/em><\/td><td><em>dormivano<\/em><\/td><\/tr><\/table>\n<p><b>essere<\/b> ist unregelmäßig: <em>ero, eri, era, eravamo, eravate, erano<\/em>.<\/p>\n<p>Einige Verben bilden das imperfetto von einem älteren, längeren Stamm:<\/p>\n<ul><li><em>fare → facevo<\/em>, <em>dire → dicevo<\/em>, <em>bere → bevevo<\/em><\/li>\n<li><em>porre → ponevo<\/em>, <em>tradurre → traducevo<\/em>, <em>trarre → traevo<\/em><\/li><\/ul>\n<div class=\"warn\">Achtung: Betonung bei <em>loro<\/em> auf der drittletzten Silbe: <em>parl<b>a<\/b>vano<\/em>, nicht <em>parlav<b>a<\/b>no<\/em>.<\/div>"},{"h":"Imperfetto: Gebrauch","html":"<p>Das imperfetto betrachtet eine vergangene Handlung „von innen“ – ohne Anfang und Ende.<\/p>\n<ul><li><b>Zustände und Beschreibungen<\/b>: <em>La casa era piccola e aveva un giardino.<\/em> Auch Uhrzeit, Alter, Wetter, Gefühle: <em>Erano le nove. Avevo diciott'anni. Pioveva.<\/em><\/li>\n<li><b>Gewohnheiten<\/b> (oft mit <em>sempre, di solito, ogni giorno<\/em>): <em>D'inverno andavamo a sciare ogni domenica.<\/em><\/li>\n<li><b>Hintergrund<\/b>, vor dem ein neues Ereignis eintritt: <em>Mentre guidavo, mi ha chiamato Sara.<\/em><\/li>\n<li><b>Gleichzeitige Handlungen<\/b>: <em>Mentre io stiravo, lui leggeva il giornale.<\/em><\/li>\n<li><b>Höfliche Bitte<\/b> (abschwächend): <em>Volevo chiederLe un favore.<\/em> – Ich wollte Sie um einen Gefallen bitten. <em>Buongiorno, volevo due etti di prosciutto.<\/em><\/li><\/ul>\n<p>Verlaufsform in der Vergangenheit: <em>stavo + Gerundium<\/em>: <em>Stavo uscendo quando è arrivato.<\/em><\/p>\n<div class=\"tip\">Faustregel: imperfetto = Kulisse und Gewohnheit; passato prossimo / remoto = Handlung, die die Geschichte voranbringt.<\/div>"},{"h":"Passato prossimo: das Partizip","html":"<p>Bildung: <em>avere<\/em> oder <em>essere<\/em> im Präsens + Partizip Perfekt.<\/p>\n<p><b>Regelmäßig:<\/b> <em>-are → -ato<\/em> (<em>parlato<\/em>), <em>-ere → -uto<\/em> (<em>venduto<\/em>), <em>-ire → -ito<\/em> (<em>dormito<\/em>).<\/p>\n<p><b>Wichtige unregelmäßige Partizipien<\/b> (vor allem bei <em>-ere<\/em>):<\/p>\n<table><tr><th>Infinitiv<\/th><th>Partizip<\/th><th>Infinitiv<\/th><th>Partizip<\/th><\/tr>\n<tr><td><em>essere<\/em><\/td><td><em>stato<\/em><\/td><td><em>fare<\/em><\/td><td><em>fatto<\/em><\/td><\/tr>\n<tr><td><em>dire<\/em><\/td><td><em>detto<\/em><\/td><td><em>vedere<\/em><\/td><td><em>visto<\/em><\/td><\/tr>\n<tr><td><em>prendere<\/em><\/td><td><em>preso<\/em><\/td><td><em>mettere<\/em><\/td><td><em>messo<\/em><\/td><\/tr>\n<tr><td><em>scrivere<\/em><\/td><td><em>scritto<\/em><\/td><td><em>leggere<\/em><\/td><td><em>letto<\/em><\/td><\/tr>\n<tr><td><em>aprire<\/em><\/td><td><em>aperto<\/em><\/td><td><em>chiudere<\/em><\/td><td><em>chiuso<\/em><\/td><\/tr>\n<tr><td><em>chiedere<\/em><\/td><td><em>chiesto<\/em><\/td><td><em>rispondere<\/em><\/td><td><em>risposto<\/em><\/td><\/tr>\n<tr><td><em>decidere<\/em><\/td><td><em>deciso<\/em><\/td><td><em>perdere<\/em><\/td><td><em>perso<\/em><\/td><\/tr>\n<tr><td><em>venire<\/em><\/td><td><em>venuto<\/em><\/td><td><em>rimanere<\/em><\/td><td><em>rimasto<\/em><\/td><\/tr>\n<tr><td><em>nascere<\/em><\/td><td><em>nato<\/em><\/td><td><em>morire<\/em><\/td><td><em>morto<\/em><\/td><\/tr>\n<tr><td><em>vivere<\/em><\/td><td><em>vissuto<\/em><\/td><td><em>bere<\/em><\/td><td><em>bevuto<\/em><\/td><\/tr>\n<tr><td><em>scegliere<\/em><\/td><td><em>scelto<\/em><\/td><td><em>spegnere<\/em><\/td><td><em>spento<\/em><\/td><\/tr>\n<tr><td><em>rompere<\/em><\/td><td><em>rotto<\/em><\/td><td><em>vincere<\/em><\/td><td><em>vinto<\/em><\/td><\/tr>\n<tr><td><em>offrire<\/em><\/td><td><em>offerto<\/em><\/td><td><em>succedere<\/em><\/td><td><em>successo<\/em><\/td><\/tr>\n<tr><td><em>tradurre<\/em><\/td><td><em>tradotto<\/em><\/td><td><em>porre<\/em><\/td><td><em>posto<\/em><\/td><\/tr><\/table>\n<div class=\"tip\">Gruppen helfen beim Lernen: auf <em>-so<\/em> (<em>preso, chiuso, deciso, acceso, speso<\/em>), auf <em>-sto<\/em> (<em>visto, chiesto, risposto, rimasto<\/em>), auf <em>-tto<\/em> (<em>fatto, detto, scritto, letto, rotto<\/em>).<\/div>"},{"h":"Passato prossimo: avere oder essere?","html":"<p><b>avere<\/b> haben alle Verben mit direktem Objekt und viele intransitive Verben (<em>dormire, lavorare, camminare, viaggiare, piangere<\/em>): <em>Ho dormito bene.<\/em><\/p>\n<p><b>essere<\/b> haben:<\/p>\n<ul><li>die meisten Verben der <b>Bewegung<\/b> zu einem Ziel: <em>andare, venire, arrivare, partire, entrare, uscire, tornare, cadere<\/em><\/li>\n<li>Verben des <b>Zustands<\/b> und der <b>Zustandsänderung<\/b>: <em>essere, stare, rimanere, diventare, nascere, morire, crescere, invecchiare<\/em><\/li>\n<li>alle <b>reflexiven<\/b> Verben: <em>Mi sono divertito.<\/em><\/li>\n<li><b>unpersönliche<\/b> Konstruktionen mit <em>si<\/em> und Verben wie <em>piacere, sembrare, bastare, costare, mancare, servire, succedere<\/em>: <em>Il viaggio mi è piaciuto.<\/em> <em>Che cosa è successo?<\/em><\/li><\/ul>\n<p><b>Verben mit beiden Hilfsverben:<\/b> mit Objekt <em>avere<\/em>, ohne Objekt <em>essere<\/em>.<\/p>\n<table><tr><th>Verb<\/th><th>avere (transitiv)<\/th><th>essere (intransitiv)<\/th><\/tr>\n<tr><td><em>cominciare<\/em><\/td><td><em>Ho cominciato un corso.<\/em><\/td><td><em>Il corso è cominciato.<\/em><\/td><\/tr>\n<tr><td><em>finire<\/em><\/td><td><em>Ho finito la tesi.<\/em><\/td><td><em>La festa è finita.<\/em><\/td><\/tr>\n<tr><td><em>passare<\/em><\/td><td><em>Ho passato un mese a Lipari.<\/em><\/td><td><em>Sono passata da te.<\/em><\/td><\/tr>\n<tr><td><em>salire<\/em><\/td><td><em>Ho salito le scale.<\/em><\/td><td><em>Sono salito sul bus.<\/em><\/td><\/tr>\n<tr><td><em>scendere<\/em><\/td><td><em>Ho sceso le scale.<\/em><\/td><td><em>Sono sceso dal treno.<\/em><\/td><\/tr>\n<tr><td><em>cambiare<\/em><\/td><td><em>Ho cambiato casa.<\/em><\/td><td><em>Il tempo è cambiato.<\/em><\/td><\/tr><\/table>\n<p><small>Ebenso <em>aumentare, diminuire, crescere, correre<\/em>. Wetterverben gehen mit beiden: <em>è piovuto / ha piovuto<\/em>.<\/small><\/p>\n<div class=\"warn\">Achtung: Nicht immer wie im Deutschen: „Ich bin gelaufen“ (ohne Ziel) = <em>Ho camminato<\/em>; „Es hat mir gefallen“ = <em>Mi è piaciuto<\/em>; „Ich bin gewesen“ = <em>Sono stato<\/em>.<\/div>"},{"h":"Passato prossimo: Angleichung, Modalverben, Gebrauch","html":"<p><b>Angleichung des Partizips<\/b><\/p>\n<ul><li>Bei <em>essere<\/em> immer an das Subjekt: <em>Giulia è tornata. I miei amici sono venuti. Le ragazze si sono sedute.<\/em><\/li>\n<li>Bei <em>avere<\/em> nur, wenn ein direktes Objektpronomen <em>lo, la, li, le<\/em> oder <em>ne<\/em> vorausgeht: <em>La torta? L'ho fatta io.<\/em> <em>Le lettere le ho spedite.<\/em> <em>Di libri ne ho letti molti.<\/em><\/li>\n<li>Sonst nicht: <em>Ho fatto la torta.<\/em><\/li><\/ul>\n<p><b>Modalverben<\/b> (<em>potere, dovere, volere<\/em>) übernehmen in der Regel das Hilfsverb des folgenden Infinitivs: <em>Ho dovuto lavorare<\/em>, aber <em>Sono dovuta partire.<\/em> Umgangssprachlich hört man auch <em>ho dovuto partire<\/em>.<\/p>\n<p><b>Gebrauch:<\/b> abgeschlossene Handlungen und Ereignisse der Vergangenheit, besonders wenn sie noch mit der Gegenwart zusammenhängen oder in einem noch nicht abgeschlossenen Zeitraum liegen (<em>oggi, quest'anno<\/em>): <em>Quest'anno ho viaggiato molto.<\/em> In Nord- und Mittelitalien ersetzt es in der gesprochenen Sprache das passato remoto fast vollständig.<\/p>\n<div class=\"tip\">Merke: <em>essere<\/em> → Partizip wie ein Adjektiv angleichen. <em>avere<\/em> → nur nach vorausgehendem <em>lo/la/li/le/ne<\/em>.<\/div>"},{"h":"Imperfetto oder passato prossimo?","html":"<p>Im selben Satz arbeiten beide Zeiten zusammen: Das imperfetto beschreibt die Situation, das passato prossimo das Ereignis.<\/p>\n<ul><li><em>Faceva caldo, così siamo andati in spiaggia.<\/em> – Es war heiß, also sind wir an den Strand gegangen.<\/li>\n<li><em>Mentre aspettavo l'autobus, ho incontrato Ugo.<\/em><\/li>\n<li><em>Da giovane giocavo a tennis.<\/em> (Gewohnheit) – <em>Ieri ho giocato a tennis.<\/em> (einmalig)<\/li>\n<li>Mit Zeitdauer steht das passato prossimo: <em>Ho abitato a Lecce per sei anni.<\/em> (abgeschlossener Zeitraum)<\/li><\/ul>\n<p><b>Bedeutungsunterschiede<\/b> bei einigen Verben:<\/p>\n<table><tr><th>Verb<\/th><th>imperfetto<\/th><th>passato prossimo<\/th><\/tr>\n<tr><td><em>sapere<\/em><\/td><td><em>sapevo<\/em> – ich wusste<\/td><td><em>ho saputo<\/em> – ich habe erfahren<\/td><\/tr>\n<tr><td><em>conoscere<\/em><\/td><td><em>conoscevo<\/em> – ich kannte<\/td><td><em>ho conosciuto<\/em> – ich habe kennengelernt<\/td><\/tr>\n<tr><td><em>volere<\/em><\/td><td><em>volevo<\/em> – ich wollte (offen, ob getan)<\/td><td><em>ho voluto<\/em> – ich wollte und tat es<\/td><\/tr>\n<tr><td><em>potere<\/em><\/td><td><em>potevo<\/em> – ich konnte (hatte die Möglichkeit; offen, ob getan)<\/td><td><em>ho potuto<\/em> – ich konnte (und tat es)<\/td><\/tr>\n<tr><td><em>dovere<\/em><\/td><td><em>dovevo<\/em> – ich sollte/musste (offen, ob getan)<\/td><td><em>ho dovuto<\/em> – ich musste (und tat es)<\/td><\/tr><\/table>\n<p><em>Volevo chiamarti, ma non ho avuto tempo.<\/em> – Ich wollte dich anrufen, hatte aber keine Zeit.<\/p>\n<div class=\"warn\">Achtung: Das deutsche Präteritum ist kein Wegweiser. „Gestern regnete es den ganzen Tag“ = <em>Ieri ha piovuto tutto il giorno<\/em> (abgeschlossener Zeitraum).<\/div>"},{"h":"Passato remoto: Formen","html":"<table><tr><th><\/th><th>parlare<\/th><th>credere<\/th><th>dormire<\/th><\/tr>\n<tr><td>io<\/td><td><em>parlai<\/em><\/td><td><em>credei / credetti<\/em><\/td><td><em>dormii<\/em><\/td><\/tr>\n<tr><td>tu<\/td><td><em>parlasti<\/em><\/td><td><em>credesti<\/em><\/td><td><em>dormisti<\/em><\/td><\/tr>\n<tr><td>lui/lei<\/td><td><em>parlò<\/em><\/td><td><em>credé / credette<\/em><\/td><td><em>dormì<\/em><\/td><\/tr>\n<tr><td>noi<\/td><td><em>parlammo<\/em><\/td><td><em>credemmo<\/em><\/td><td><em>dormimmo<\/em><\/td><\/tr>\n<tr><td>voi<\/td><td><em>parlaste<\/em><\/td><td><em>credeste<\/em><\/td><td><em>dormiste<\/em><\/td><\/tr>\n<tr><td>loro<\/td><td><em>parlarono<\/em><\/td><td><em>crederono / credettero<\/em><\/td><td><em>dormirono<\/em><\/td><\/tr><\/table>\n<p><b>essere<\/b> ist ganz unregelmäßig: <em>fui, fosti, fu, fummo, foste, furono<\/em>.<\/p>\n<p><b>Die 1-3-3-Regel:<\/b> Die meisten unregelmäßigen Verben (vor allem auf <em>-ere<\/em>) sind nur in der 1. Person Singular und der 3. Person Singular und Plural unregelmäßig; die übrigen Formen kommen regelmäßig vom Infinitivstamm. Aus <em>io<\/em> leitet man die beiden anderen ab: <em>-i → -e, -ero<\/em>.<\/p>\n<p><em>avere: <b>ebbi<\/b>, avesti, <b>ebbe<\/b>, avemmo, aveste, <b>ebbero<\/b><\/em><\/p>\n<table><tr><th>Infinitiv<\/th><th>io<\/th><th>lui / loro<\/th><\/tr>\n<tr><td><em>fare<\/em><\/td><td><em>feci<\/em><\/td><td><em>fece, fecero<\/em><\/td><\/tr>\n<tr><td><em>dire<\/em><\/td><td><em>dissi<\/em><\/td><td><em>disse, dissero<\/em><\/td><\/tr>\n<tr><td><em>venire<\/em><\/td><td><em>venni<\/em><\/td><td><em>venne, vennero<\/em><\/td><\/tr>\n<tr><td><em>vedere<\/em><\/td><td><em>vidi<\/em><\/td><td><em>vide, videro<\/em><\/td><\/tr>\n<tr><td><em>prendere<\/em><\/td><td><em>presi<\/em><\/td><td><em>prese, presero<\/em><\/td><\/tr>\n<tr><td><em>mettere<\/em><\/td><td><em>misi<\/em><\/td><td><em>mise, misero<\/em><\/td><\/tr>\n<tr><td><em>scrivere<\/em><\/td><td><em>scrissi<\/em><\/td><td><em>scrisse, scrissero<\/em><\/td><\/tr>\n<tr><td><em>nascere<\/em><\/td><td><em>nacqui<\/em><\/td><td><em>nacque, nacquero<\/em><\/td><\/tr>\n<tr><td><em>volere<\/em><\/td><td><em>volli<\/em><\/td><td><em>volle, vollero<\/em><\/td><\/tr>\n<tr><td><em>sapere<\/em><\/td><td><em>seppi<\/em><\/td><td><em>seppe, seppero<\/em><\/td><\/tr>\n<tr><td><em>stare<\/em><\/td><td><em>stetti<\/em><\/td><td><em>stette, stettero<\/em><\/td><\/tr>\n<tr><td><em>dare<\/em><\/td><td><em>diedi<\/em><\/td><td><em>diede, diedero<\/em><\/td><\/tr><\/table>\n<p><small>Bei <em>fare<\/em> und <em>dire<\/em> kommen die regelmäßigen Formen vom alten Stamm: <em>facesti, facemmo; dicesti, dicemmo<\/em>. <em>stare<\/em> und <em>dare<\/em>: <em>stesti, stemmo; desti, demmo<\/em>.<\/small><\/p>"},{"h":"Passato remoto: Gebrauch und Zeitsysteme","html":"<p>Das passato remoto drückt eine <b>abgeschlossene Handlung ohne Bezug zur Gegenwart<\/b> aus.<\/p>\n<ul><li>Literatur, Märchen, Erzählungen: <em>Il lupo bussò alla porta e la bambina aprì.<\/em><\/li>\n<li>Geschichte und Biografien: <em>Il teatro fu inaugurato nel 1778.<\/em> <em>Mio bisnonno emigrò in Brasile.<\/em><\/li>\n<li>In Süditalien (und teils in der Toskana) auch mündlich für Vergangenes, das kaum zurückliegt; im Norden ist es mündlich fast verschwunden.<\/li><\/ul>\n<p>Vergleich: <em>Ho conosciuto mia moglie a Bari.<\/em> (wir sind noch zusammen – Gegenwartsbezug) – <em>I miei nonni si conobbero durante la guerra.<\/em> (ferne, abgeschlossene Geschichte)<\/p>\n<p><b>Zwei Zeitsysteme der Vergangenheit:<\/b><\/p>\n<table><tr><th><\/th><th>gesprochen / mit Gegenwartsbezug<\/th><th>erzählend / schriftlich<\/th><\/tr>\n<tr><td>Ereignis<\/td><td>passato prossimo<\/td><td>passato remoto<\/td><\/tr>\n<tr><td>Hintergrund<\/td><td>imperfetto<\/td><td>imperfetto<\/td><\/tr>\n<tr><td>Vorvergangenheit<\/td><td>trapassato prossimo<\/td><td>trapassato prossimo / remoto<\/td><\/tr><\/table>\n<div class=\"tip\">Das imperfetto gehört zu beiden Systemen. Innerhalb eines Textes bleibt man bei einem System und wechselt nicht ohne Grund zwischen passato prossimo und passato remoto.<\/div>"},{"h":"Trapassato prossimo und trapassato remoto","html":"<p><b>Trapassato prossimo<\/b> = <em>avere / essere<\/em> im imperfetto + Partizip. Es drückt aus, dass etwas <b>vor<\/b> einem anderen vergangenen Ereignis geschehen war (Plusquamperfekt).<\/p>\n<table><tr><th>avere<\/th><th>essere<\/th><\/tr>\n<tr><td><em>avevo mangiato<\/em><\/td><td><em>ero partito/-a<\/em><\/td><\/tr>\n<tr><td><em>avevi mangiato<\/em><\/td><td><em>eri partito/-a<\/em><\/td><\/tr>\n<tr><td><em>aveva mangiato<\/em><\/td><td><em>era partito/-a<\/em><\/td><\/tr>\n<tr><td><em>avevamo mangiato<\/em><\/td><td><em>eravamo partiti/-e<\/em><\/td><\/tr>\n<tr><td><em>avevate mangiato<\/em><\/td><td><em>eravate partiti/-e<\/em><\/td><\/tr>\n<tr><td><em>avevano mangiato<\/em><\/td><td><em>erano partiti/-e<\/em><\/td><\/tr><\/table>\n<p><em>Quando sono arrivata alla stazione, il treno era già partito.<\/em> – … war der Zug schon abgefahren.<br><em>Non ho riconosciuto Marco: si era tagliato la barba.<\/em><br>Es steht in beiden Zeitsystemen.<\/p>\n<p><b>Trapassato remoto<\/b> = <em>avere / essere<\/em> im passato remoto + Partizip: <em>ebbi mangiato, fui partito<\/em>. Es ist selten und rein schriftsprachlich. Man verwendet es nur in Nebensätzen nach <em>dopo che, appena, (non) appena, quando<\/em>, wenn im Hauptsatz das passato remoto steht:<\/p>\n<p><em>Dopo che ebbe chiuso la bottega, il fabbro tornò a casa.<\/em><br><em>Appena furono usciti, cominciò a nevicare.<\/em><\/p>\n<div class=\"tip\">In der gesprochenen Sprache ersetzt man das trapassato remoto durch das trapassato prossimo oder eine Infinitivkonstruktion: <em>Dopo aver chiuso la bottega, …<\/em><\/div>"},{"h":"Futur I (futuro semplice)","html":"<p>Bildung: Infinitiv ohne End-<em>e<\/em> + <em>-ò, -ai, -à, -emo, -ete, -anno<\/em>. Bei <em>-are<\/em> wird das <em>a<\/em> zu <em>e<\/em>.<\/p>\n<table><tr><th><\/th><th>parlare<\/th><th>prendere<\/th><th>partire<\/th><\/tr>\n<tr><td>io<\/td><td><em>parlerò<\/em><\/td><td><em>prenderò<\/em><\/td><td><em>partirò<\/em><\/td><\/tr>\n<tr><td>tu<\/td><td><em>parlerai<\/em><\/td><td><em>prenderai<\/em><\/td><td><em>partirai<\/em><\/td><\/tr>\n<tr><td>lui/lei<\/td><td><em>parlerà<\/em><\/td><td><em>prenderà<\/em><\/td><td><em>partirà<\/em><\/td><\/tr>\n<tr><td>noi<\/td><td><em>parleremo<\/em><\/td><td><em>prenderemo<\/em><\/td><td><em>partiremo<\/em><\/td><\/tr>\n<tr><td>voi<\/td><td><em>parlerete<\/em><\/td><td><em>prenderete<\/em><\/td><td><em>partirete<\/em><\/td><\/tr>\n<tr><td>loro<\/td><td><em>parleranno<\/em><\/td><td><em>prenderanno<\/em><\/td><td><em>partiranno<\/em><\/td><\/tr><\/table>\n<p><b>Schreibung:<\/b> <em>cercare → cercherò, pagare → pagherò, mangiare → mangerò, cominciare → comincerò<\/em>.<\/p>\n<p><b>Verkürzte oder veränderte Stämme:<\/b><\/p>\n<ul><li>Vokal fällt aus: <em>andrò, avrò, potrò, dovrò, saprò, vedrò, vivrò, cadrò<\/em><\/li>\n<li>mit <em>-rr-<\/em>: <em>verrò, vorrò, berrò, rimarrò, terrò<\/em><\/li>\n<li>eigener Stamm: <em>essere → sarò<\/em>; <em>fare → farò, dare → darò, stare → starò<\/em> (das <em>a<\/em> bleibt)<\/li><\/ul>\n<p><b>Gebrauch:<\/b><\/p>\n<ul><li><b>Zukunft<\/b> (besonders bei Vorhersagen und ferner Zukunft): <em>Fra vent'anni le auto voleranno?<\/em><\/li>\n<li><b>Vermutung über die Gegenwart<\/b>: <em>Che ore sono? – Saranno le sei.<\/em> – Es wird wohl sechs sein. <em>Non risponde, sarà stanco.<\/em><\/li>\n<li><b>Ankündigung, Vorsatz, Versprechen<\/b>: <em>Da lunedì andrò in palestra.<\/em> <em>Te lo prometto: non lo farò più.<\/em><\/li><\/ul>\n<div class=\"warn\">Achtung: Nach <em>quando, appena, se<\/em> mit Zukunftsbezug steht im Italienischen meist das Futur, im Deutschen das Präsens: <em>Quando arriverai a Roma, chiamami.<\/em> – Wenn du in Rom ankommst, ruf mich an.<\/div>"},{"h":"Futur II (futuro anteriore)","html":"<p>Bildung: <em>avere / essere<\/em> im Futur I + Partizip.<\/p>\n<table><tr><th>avere<\/th><th>essere<\/th><\/tr>\n<tr><td><em>avrò finito<\/em><\/td><td><em>sarò arrivato/-a<\/em><\/td><\/tr>\n<tr><td><em>avrai finito<\/em><\/td><td><em>sarai arrivato/-a<\/em><\/td><\/tr>\n<tr><td><em>avrà finito<\/em><\/td><td><em>sarà arrivato/-a<\/em><\/td><\/tr>\n<tr><td><em>avremo finito<\/em><\/td><td><em>saremo arrivati/-e<\/em><\/td><\/tr>\n<tr><td><em>avrete finito<\/em><\/td><td><em>sarete arrivati/-e<\/em><\/td><\/tr>\n<tr><td><em>avranno finito<\/em>
