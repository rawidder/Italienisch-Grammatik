<\/em><\/td><td>es schaffen<\/td><td><em>Ce l'ho fatta!<\/em><\/td><\/tr><tr><td><em>cavarsela<\/em><\/td><td>zurechtkommen<\/td><td><em>Me la cavo.<\/em><\/td><\/tr><tr><td><em>prendersela<\/em><\/td><td>übelnehmen<\/td><td><em>Se l'è presa.<\/em><\/td><\/tr><\/table><div class=\"tip\"><em>farcela<\/em> bildet das passato prossimo mit avere (<em>ce l'abbiamo fatta<\/em>), <em>cavarsela<\/em> und <em>prendersela<\/em> mit essere (<em>me la sono cavata, se l'è presa<\/em>).<\/div>"}],"exercises":[{"type":"gap","title":"Präsens der reflexiven Verben","task":"Setze die richtige Präsensform ein.","items":[{"q":"Di solito (io, svegliarsi) ___ alle sei e mezza.","a":["mi sveglio"],"de":"Normalerweise wache ich um halb sieben auf."},{"q":"Come (tu, chiamarsi) ___?","a":["ti chiami"],"de":"Wie heißt du?"},{"q":"I bambini (divertirsi) ___ molto al parco.","a":["si divertono"],"de":"Die Kinder haben viel Spaß im Park."},{"q":"Noi (sedersi) ___ sempre in prima fila.","a":["ci sediamo"],"de":"Wir setzen uns immer in die erste Reihe."},{"q":"A che ora (voi, alzarsi) ___ la domenica?","a":["vi alzate"],"de":"Um wie viel Uhr steht ihr sonntags auf?"},{"q":"Mia nonna (lamentarsi) ___ sempre del tempo.","a":["si lamenta"],"de":"Meine Großmutter beklagt sich immer über das Wetter."},{"q":"Io non (fidarsi) ___ di lui.","a":["mi fido"],"de":"Ich traue ihm nicht."},{"q":"Ragazzi, perché non (voi, vestirsi) ___? È tardi!","a":["vi vestite"],"de":"Leute, warum zieht ihr euch nicht an? Es ist spät!"}]},{"type":"gap","title":"Passato prossimo","task":"Setze das passato prossimo ein und achte auf die Angleichung.","items":[{"q":"Stamattina Giulia (svegliarsi) ___ tardi.","a":["si è svegliata"],"de":"Heute Morgen ist Giulia spät aufgewacht."},{"q":"Ieri (noi, divertirsi – gemischte Gruppe) ___ moltissimo.","a":["ci siamo divertiti"],"de":"Gestern hatten wir sehr viel Spaß."},{"q":"Le ragazze (prepararsi) ___ per la festa in due ore.","a":["si sono preparate"],"de":"Die Mädchen haben sich in zwei Stunden für das Fest fertig gemacht."},{"q":"Paolo, (tu, ricordarsi) ___ di comprare il pane?","a":["ti sei ricordato"],"de":"Paolo, hast du daran gedacht, Brot zu kaufen?"},{"q":"Anna (lavarsi) ___ i capelli.","a":["si è lavata"],"de":"Anna hat sich die Haare gewaschen."},{"q":"Marco e Lucia (sposarsi) ___ a giugno.","a":["si sono sposati"],"de":"Marco und Lucia haben im Juni geheiratet."},{"q":"Io (Maria) (pentirsi) ___ subito di quelle parole.","a":["mi sono pentita"],"de":"Ich habe diese Worte sofort bereut."},{"q":"I miei genitori (conoscersi) ___ in Sicilia.","a":["si sono conosciuti"],"de":"Meine Eltern haben sich in Sizilien kennengelernt."}]},{"type":"choice","title":"Stellung, Modalverben, Imperativ","task":"Wähle die richtige Form.","items":[{"q":"Domani devo ___ presto.","options":["alzarmi","mi alzare","alzarsi"],"a":0,"why":"Beim Infinitiv wird das passende Pronomen angehängt: alzarmi."},{"q":"Laura: „Ieri ___ dovuta fermare per la pioggia.“","options":["mi sono","ho","mi ho"],"a":0,"why":"Pronomen vor dem Modalverb → essere."},{"q":"Marco: „Ieri ___ dovuto fermarmi per la pioggia.“","options":["mi sono","ho"],"a":1,"why":"Pronomen am Infinitiv → avere."},{"q":"Luca, ___! Sono già le otto!","options":["ti alza","alzati","alzarti"],"a":1,"why":"Bejahter Imperativ (tu): Pronomen angehängt."},{"q":"Non ___, resta ancora un po'!","options":["andartene","vattene","te ne vai"],"a":0,"why":"Verneinter Imperativ (tu): non + Infinitiv."},{"q":"Signora, ___ pure!","options":["si sieda","siediti","si siede"],"a":0,"why":"Höflichkeitsform: congiuntivo, Pronomen davor."},{"q":"Le mani? ___ prima di cena.","options":["Se le è lavate","Si le è lavate","Se l'ha lavate"],"a":0,"why":"si wird vor le zu se; essere, Angleichung an le."},{"q":"Sto ___ per uscire.","options":["preparandomi","preparandosi","mi preparando"],"a":0,"why":"Beim Gerundium wird das Pronomen angehängt und an die Person angepasst."}]},{"type":"choice","title":"Reflexiv oder nicht?","task":"Wähle die richtige Übersetzung oder Form.","items":[{"q":"Il vigile ___ la macchina.","options":["ha fermato","si è fermato"],"a":0,"why":"fermare + Objekt = jdn./etwas anhalten."},{"q":"La macchina ___ davanti alla scuola.","options":["ha fermato","si è fermata"],"a":1,"why":"fermarsi = stehen bleiben."},{"q":"Ogni mattina ___ i bambini alle sette.","options":["sveglio","mi sveglio"],"a":0,"why":"svegliare + Objekt = wecken."},{"q":"„Ich freue mich sehr!“","options":["Sono molto contento!","Mi contento molto!"],"a":0,"why":"sich freuen = essere contento."},{"q":"„Sieh dir das Foto an!“","options":["Guarda la foto!","Ti guarda la foto!"],"a":0,"why":"sich etwas ansehen = guardare qualcosa."},{"q":"„Das Wetter hat sich geändert.“","options":["Il tempo è cambiato.","Il tempo si è cambiato."],"a":0,"why":"cambiare ist hier intransitiv mit essere."},{"q":"„Ich bin um Mitternacht eingeschlafen.“","options":["Mi sono addormentato a mezzanotte.","Ho addormentato a mezzanotte."],"a":0,"why":"einschlafen = addormentarsi (reflexiv)."},{"q":"„Ich habe mich bei ihr bedankt.“","options":["L'ho ringraziata.","Mi sono ringraziato da lei."],"a":0,"why":"ringraziare qualcuno: direktes Objekt, nicht reflexiv."},{"q":"„Wir haben uns gestern im Kino gesehen.“","options":["Ci siamo visti ieri al cinema.","Abbiamo visto ieri al cinema."],"a":0,"why":"Reziprokes Verb: vedersi."}]},{"type":"gap","title":"andarsene und andere pronominale Verben","task":"Setze die richtige Form ein.","items":[{"q":"È tardi, (io, andarsene) ___.","a":["me ne vado"],"de":"Es ist spät, ich gehe."},{"q":"Perché (voi, andarsene) ___ già? La festa è appena cominciata!","a":["ve ne andate"],"de":"Warum geht ihr schon? Das Fest hat gerade erst angefangen!"},{"q":"Ieri sera Carla (andarsene, passato prossimo) ___ senza salutare.","a":["se n'è andata","se ne è andata"],"de":"Gestern Abend ist Carla gegangen, ohne sich zu verabschieden."},{"q":"Non ti preoccupare, (io, farcela, Präsens) ___ da solo.","a":["ce la faccio"],"de":"Mach dir keine Sorgen, ich schaffe es allein."},{"q":"Alla fine (noi, farcela, passato prossimo) ___ a prendere il treno.","a":["ce l'abbiamo fatta"],"de":"Am Ende haben wir es geschafft, den Zug zu erwischen."},{"q":"Non ___, scherzavo! (prendersela, Imperativ tu)","a":["prendertela","te la prendere"],"de":"Nimm es nicht übel, ich habe nur Spaß gemacht!"},{"q":"Luca, ___! Non voglio vederti! (andarsene, Imperativ tu)","a":["vattene"],"de":"Luca, verschwinde! Ich will dich nicht sehen!"},{"q":"Con l'inglese (io, cavarsela, Präsens) ___ abbastanza bene.","a":["me la cavo"],"de":"Mit Englisch komme ich ganz gut zurecht."}]}],"cards":[{"f":"lavarsi – Präsens","b":"mi lavo, ti lavi, si lava, ci laviamo, vi lavate, si lavano"},{"f":"Hilfsverb reflexiver Verben","b":"immer essere: mi sono lavato/-a"},{"f":"„Ich habe mich gewaschen“ (Frau)","b":"Mi sono lavata."},{"f":"„Sie hat sich die Hände gewaschen.“","b":"Si è lavata le mani."},{"f":"„Die Hände? Sie hat sie sich gewaschen.“","b":"Se le è lavate."},{"f":"„Ich musste früh aufstehen.“ (2 Varianten)","b":"Mi sono dovuto alzare presto. / Ho dovuto alzarmi presto."},{"f":"„Ich muss aufstehen.“","b":"Devo alzarmi."},{"f":"Imperativ von alzarsi (tu / voi)","b":"Alzati! / Alzatevi!"},{"f":"Verneinter Imperativ von alzarsi (tu)","b":"Non alzarti! / Non ti alzare!"},{"f":"Höflicher Imperativ von sedersi","b":"Si sieda!"},{"f":"„Ich putze mir die Zähne.“","b":"Mi lavo i denti."},{"f":"reziprok: „Wir sehen uns morgen.“","b":"Ci vediamo domani."},{"f":"pentirsi / accorgersi / vergognarsi","b":"bereuen / bemerken / sich schämen (nur reflexiv)"},{"f":"fidarsi di","b":"vertrauen"},{"f":"fermare / fermarsi","b":"anhalten (jdn.) / stehen bleiben"},{"f":"svegliare / svegliarsi","b":"wecken / aufwachen"},{"f":"trovarsi bene","b":"sich wohlfühlen"},{"f":"sich freuen","b":"essere contento (rallegrarsi)"},{"f":"sich etwas ansehen","b":"guardare qualcosa"},{"f":"sich ändern (Wetter, Situation)","b":"cambiare (mit essere)"},{"f":"sich erholen","b":"riposarsi; gesundheitlich: riprendersi"},{"f":"einschlafen / krank werden","b":"addormentarsi / ammalarsi"},{"f":"andarsene – Präsens","b":"me ne vado, te ne vai, se ne va, ce ne andiamo, ve ne andate, se ne vanno"},{"f":"„Verschwinde!“","b":"Vattene!"},{"f":"„Wir haben es geschafft!“","b":"Ce l'abbiamo fatta!"},{"f":"„Er hat es übelgenommen.“","b":"Se l'è presa."}],"id":"k17"},{"nr":18,"title":"Das Passiv","teil":"Das Verb und seine Ergänzungen","intro":"Das Passiv rückt die Handlung oder das Ergebnis in den Vordergrund statt der handelnden Person. Im Italienischen gibt es neben essere auch venire und andare – und viele Umschreibungen, die im Alltag häufiger sind als das Passiv selbst.","sections":[{"h":"Bildung des Passivs mit essere","html":"<p>Das Passiv wird mit <b>essere<\/b> + <b>Partizip Perfekt<\/b> gebildet. <em>essere<\/em> steht in derselben Zeit, in der im Aktiv das Vollverb stünde.<\/p><table><tr><th>Zeit<\/th><th>Passiv (costruire)<\/th><\/tr><tr><td>presente<\/td><td><em>è costruito<\/em><\/td><\/tr><tr><td>imperfetto<\/td><td><em>era costruito<\/em><\/td><\/tr><tr><td>passato prossimo<\/td><td><em>è stato costruito<\/em><\/td><\/tr><tr><td>trapassato prossimo<\/td><td><em>era stato costruito<\/em><\/td><\/tr><tr><td>passato remoto<\/td><td><em>fu costruito<\/em><\/td><\/tr><tr><td>futuro<\/td><td><em>sarà costruito<\/em><\/td><\/tr><tr><td>condizionale I / II<\/td><td><em>sarebbe costruito / sarebbe stato costruito<\/em><\/td><\/tr><tr><td>congiuntivo pres. / pass.<\/td><td><em>sia costruito / sia stato costruito<\/em><\/td><\/tr><tr><td>Infinitiv pres. / pass.<\/td><td><em>essere costruito / essere stato costruito<\/em><\/td><\/tr><\/table><ul><li><em>Il ponte è stato costruito nel 1960.<\/em> <small>Die Brücke wurde 1960 gebaut.<\/small><\/li><li><em>Il pacco sarà consegnato domani.<\/em> <small>Das Paket wird morgen geliefert.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Das deutsche „werden“ im Passiv heißt <b>nicht<\/b> <em>diventare<\/em>. Falsch: <em>La casa diventa costruita.<\/em> Richtig: <em>La casa viene / è costruita.<\/em><\/div>"},{"h":"Angleichung des Partizips","html":"<p>Das Partizip richtet sich in Geschlecht und Zahl nach dem <b>Subjekt<\/b>. In zusammengesetzten Zeiten werden <b>beide<\/b> Partizipien angeglichen (<em>stato<\/em> und das Vollverb):<\/p><table><tr><th>Subjekt<\/th><th>passato prossimo Passiv<\/th><\/tr><tr><td><em>il museo<\/em><\/td><td><em>è stato costruito<\/em><\/td><\/tr><tr><td><em>la chiesa<\/em><\/td><td><em>è stata costruita<\/em><\/td><\/tr><tr><td><em>i ponti<\/em><\/td><td><em>sono stati costruiti<\/em><\/td><\/tr><tr><td><em>le case<\/em><\/td><td><em>sono state costruite<\/em><\/td><\/tr><\/table><em>Le finestre sono state pulite stamattina.<\/em> <small>Die Fenster sind heute Morgen geputzt worden.<\/small><div class=\"tip\">Merke: Passiv = Partizip wie ein Adjektiv behandeln – es passt sich immer dem Subjekt an.<\/div>"},{"h":"Der Urheber mit da","html":"<p>Wer die Handlung ausführt, wird mit <b>da<\/b> angeschlossen (deutsch: „von“). <em>da<\/em> verschmilzt mit dem Artikel: <em>dal, dallo, dalla, dai, dagli, dalle<\/em>.<\/p><ul><li><em>Il romanzo è stato scritto da una giovane autrice.<\/em> <small>Der Roman wurde von einer jungen Autorin geschrieben.<\/small><\/li><li><em>I ladri sono stati arrestati dalla polizia.<\/em> <small>Die Diebe wurden von der Polizei festgenommen.<\/small><\/li><li><em>La squadra è allenata dagli stessi tecnici da anni.<\/em> <small>Die Mannschaft wird seit Jahren von denselben Trainern trainiert.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nicht <em>di<\/em> oder <em>per<\/em> verwenden. Falsch: <em>scritto di un giornalista<\/em>. Richtig: <em>scritto da un giornalista<\/em>.<\/div>"},{"h":"venire statt essere","html":"<p>In den <b>einfachen Zeiten<\/b> kann statt <em>essere<\/em> auch <b>venire<\/b> stehen. <em>venire<\/em> betont den <b>Vorgang<\/b>, während <em>essere<\/em> manchmal auch einen Zustand ausdrücken kann.<\/p><ul><li><em>La porta viene chiusa alle dieci.<\/em> <small>Die Tür wird um zehn geschlossen. (Vorgang)<\/small><\/li><li><em>La porta è chiusa.<\/em> <small>Die Tür ist geschlossen. (Zustand)<\/small><\/li><li><em>Il pane veniva sfornato ogni mattina alle cinque.<\/em> <small>Das Brot wurde jeden Morgen um fünf aus dem Ofen geholt.<\/small><\/li><li><em>La partita verrà trasmessa in diretta.<\/em> <small>Das Spiel wird live übertragen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: In zusammengesetzten Zeiten ist <em>venire<\/em> nicht möglich. Falsch: <em>è venuto costruito<\/em>. Richtig: <em>è stato costruito<\/em>.<\/div>"},{"h":"andare + Partizip","html":"<p><b>1. Notwendigkeit<\/b> (= muss … werden): nur in einfachen Zeiten.<\/p><ul><li><em>Questo modulo va compilato in stampatello.<\/em> <small>Dieses Formular muss in Druckbuchstaben ausgefüllt werden.<\/small><\/li><li><em>Le medicine vanno prese dopo i pasti.<\/em> <small>Die Medikamente sind nach den Mahlzeiten einzunehmen.<\/small><\/li><li><em>Il pesce andrebbe mangiato fresco.<\/em> <small>Fisch sollte frisch gegessen werden.<\/small><\/li><\/ul><p><b>2. Verlust / negatives Ergebnis<\/b> mit Verben wie <em>perdere, distruggere, smarrire, sprecare<\/em>; hier auch in zusammengesetzten Zeiten:<\/p><ul><li><em>Il mio bagaglio è andato perso.<\/em> <small>Mein Gepäck ist verloren gegangen.<\/small><\/li><li><em>Molti documenti sono andati distrutti nell'incendio.<\/em> <small>Viele Dokumente wurden beim Brand zerstört.<\/small><\/li><\/ul><div class=\"tip\"><em>va fatto<\/em> = <em>deve essere fatto<\/em> – kurz, typisch für Anleitungen, Rezepte und Vorschriften.<\/div>"},{"h":"Aktiv ↔ Passiv","html":"<p>Beim Umformen wird das <b>direkte Objekt<\/b> des Aktivsatzes zum Subjekt des Passivsatzes; das Subjekt des Aktivsatzes wird mit <em>da<\/em> angeschlossen.<\/p><table><tr><th>Aktiv<\/th><th>Passiv<\/th><\/tr><tr><td><em>Mio nonno ha costruito la casa.<\/em><\/td><td><em>La casa è stata costruita da mio nonno.<\/em><\/td><\/tr><tr><td><em>Molti turisti visitano Venezia.<\/em><\/td><td><em>Venezia è visitata da molti turisti.<\/em><\/td><\/tr><tr><td><em>Il comune riparerà le strade.<\/em><\/td><td><em>Le strade saranno riparate dal comune.<\/em><\/td><\/tr><\/table><p>Passivfähig sind <b>nur Verben mit direktem Objekt<\/b>. Anders als im Deutschen kann die Person im Dativ nicht Subjekt werden, und es gibt kein unpersönliches Passiv („es wird getanzt“):<\/p><ul><li><em>Mi è stato offerto un lavoro.<\/em> <small>Mir wurde eine Stelle angeboten. (Subjekt: un lavoro)<\/small><\/li><li><em>Non gli hanno risposto.<\/em> <small>Ihm wurde nicht geantwortet. (rispondere a → kein Passiv)<\/small><\/li><li><em>Alla festa si è ballato molto.<\/em> <small>Auf dem Fest wurde viel getanzt.<\/small><\/li><li><em>Mi hanno aiutato. / Sono stato aiutato.<\/em> <small>Mir wurde geholfen. (aiutare hat ein direktes Objekt!)<\/small><\/li><\/ul><div class=\"warn\">Achtung: Falsch: <em>Sono stato offerto un lavoro<\/em> oder <em>Mi è stato aiutato<\/em>. Prüfe immer, ob das italienische Verb ein direktes Objekt hat.<\/div>"},{"h":"Umschreibungen des Passivs","html":"<p>Im Alltag wird das Passiv oft umschrieben:<\/p><p><b>1. si passivante<\/b>: <em>si<\/em> + Verb in der 3. Person, angeglichen an das Objekt (Urheber wird nicht genannt).<\/p><ul><li><em>Si vendono case.<\/em> <small>Häuser zu verkaufen.<\/small><\/li><li><em>Qui si parla inglese.<\/em> <small>Hier wird Englisch gesprochen.<\/small><\/li><li><em>Si sono costruite molte strade.<\/em> <small>Es wurden viele Straßen gebaut.<\/small><\/li><\/ul><p><b>2. 3. Person Plural<\/b> mit unbestimmtem Subjekt:<\/p><ul><li><em>Dicono che domani farà caldo.<\/em> <small>Es heißt, dass es morgen heiß wird.<\/small><\/li><li><em>Mi hanno rubato la bicicletta.<\/em> <small>Mir wurde das Fahrrad gestohlen.<\/small><\/li><\/ul><p><b>3. Voranstellung des Objekts<\/b> mit wiederaufnehmendem Pronomen – betont den Urheber, typisch für die gesprochene Sprache:<\/p><ul><li><em>La casa l'ha costruita mio nonno.<\/em> <small>Das Haus hat mein Großvater gebaut.<\/small><\/li><li><em>I biglietti li ho comprati io.<\/em> <small>Die Karten habe ich gekauft.<\/small><\/li><\/ul><div class=\"tip\">Beim vorangestellten Objekt mit <em>lo, la, li, le<\/em> wird das Partizip angeglichen: <em>la torta l'ha fatta Marta<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Passiv mit essere","task":"Bilde das Passiv in der angegebenen Zeit.","items":[{"q":"Il Colosseo (costruire, passato remoto) ___ nel I secolo d.C.","a":["fu costruito","venne costruito"],"de":"Das Kolosseum wurde im 1. Jahrhundert n. Chr. erbaut."},{"q":"Questa torta (fare, passato prossimo) ___ da mia nonna.","a":["è stata fatta"],"de":"Diese Torte wurde von meiner Großmutter gemacht."},{"q":"Le lettere (spedire, futuro) ___ domani.","a":["saranno spedite","verranno spedite"],"de":"Die Briefe werden morgen verschickt."},{"q":"Il museo (visitare, presente) ___ da migliaia di turisti ogni anno.","a":["è visitato","viene visitato"],"de":"Das Museum wird jedes Jahr von Tausenden Touristen besucht."},{"q":"I documenti (firmare, passato prossimo) ___ ieri dal direttore.","a":["sono stati firmati"],"de":"Die Dokumente wurden gestern vom Direktor unterschrieben."},{"q":"La finestra (rompere, trapassato prossimo) ___ durante il temporale.","a":["era stata rotta"],"de":"Das Fenster war während des Gewitters zerbrochen worden."},{"q":"Penso che la decisione (prendere, congiuntivo passato) ___ troppo in fretta.","a":["sia stata presa"],"de":"Ich glaube, dass die Entscheidung zu schnell getroffen worden ist."},{"q":"Le strade (pulire, imperfetto) ___ ogni mattina.","a":["erano pulite","venivano pulite"],"de":"Die Straßen wurden jeden Morgen gereinigt."}]},{"type":"choice","title":"essere, venire oder andare?","task":"Wähle die passende Form.","items":[{"q":"Il ponte ___ costruito nel 1950.","options":["è stato","è venuto"],"a":0,"why":"venire ist in zusammengesetzten Zeiten nicht möglich."},{"q":"Questo vino ___ servito fresco. (= muss serviert werden)","options":["va","è andato","è stato"],"a":0,"why":"andare + Partizip drückt Notwendigkeit aus."},{"q":"Purtroppo molti documenti ___ persi nell'incendio.","options":["sono andati","vanno","sono venuti"],"a":0,"why":"andare perso = verloren gehen (Verlust)."},{"q":"Le porte del museo ___ aperte ogni giorno alle nove.","options":["vengono","sono venute"],"a":0,"why":"Einfache Zeit, Vorgang → venire im Präsens."},{"q":"La lettera ___ scritta ieri sera.","options":["è stata","è venuta"],"a":0,"why":"Zusammengesetzte Zeit → nur essere."},{"q":"Il libro è stato scritto ___ un giornalista.","options":["da","di","per"],"a":0,"why":"Der Urheber wird mit da angeschlossen."},{"q":"Queste medicine ___ prese a stomaco pieno. (= müssen genommen werden)","options":["vanno","sono andate","sono venute"],"a":0,"why":"Notwendigkeit → andare im Präsens."},{"q":"La partita ___ trasmessa in diretta domani.","options":["verrà","sarà venuta","è andata"],"a":0,"why":"Einfache Zeit (Futur), Vorgang → venire."}]},{"type":"gap","title":"Aktiv → Passiv","task":"Forme den Satz ins Passiv um. Behalte die Zeit bei.","items":[{"q":"Mio zio ha venduto la casa. → La casa ___ da mio zio.","a":["è stata venduta"],"de":"Das Haus wurde von meinem Onkel verkauft."},{"q":"La polizia arresterà i ladri. → I ladri ___ dalla polizia.","a":["saranno arrestati","verranno arrestati"],"de":"Die Diebe werden von der Polizei festgenommen werden."},{"q":"Gli studenti leggono questo libro. → Questo libro ___ dagli studenti.","a":["è letto","viene letto"],"de":"Dieses Buch wird von den Studenten gelesen."},{"q":"Il sindaco aveva inaugurato la mostra. → La mostra ___ dal sindaco.","a":["era stata inaugurata"],"de":"Die Ausstellung war vom Bürgermeister eröffnet worden."},{"q":"Tutti apprezzavano le sue idee. → Le sue idee ___ da tutti.","a":["erano apprezzate","venivano apprezzate"],"de":"Seine Ideen wurden von allen geschätzt."},{"q":"Una ditta tedesca ha comprato l'azienda. → L'azienda ___ da una ditta tedesca.","a":["è stata comprata"],"de":"Das Unternehmen wurde von einer deutschen Firma gekauft."},{"q":"Il medico visitò i pazienti. → I pazienti ___ dal medico.","a":["furono visitati","vennero visitati"],"de":"Die Patienten wurden vom Arzt untersucht."}]},{"type":"choice","title":"Deutsches Passiv – italienische Lösung","task":"Welche Übersetzung ist korrekt?","items":[{"q":"„Mir wurde eine Stelle angeboten.“","options":["Mi è stato offerto un lavoro.","Sono stato offerto un lavoro."],"a":0,"why":"Subjekt des Passivsatzes ist das direkte Objekt (un lavoro), nicht die Person."},{"q":"„Ihm wurde nicht geantwortet.“","options":["Non gli hanno risposto.","Non è stato risposto."],"a":0,"why":"rispondere a hat kein direktes Objekt → kein Passiv, Umschreibung mit 3. Pl."},{"q":"„Uns wurde gesagt, dass …“","options":["Ci è stato detto che …","Siamo stati detti che …"],"a":0,"why":"Subjekt ist der che-Satz; ci bleibt indirektes Objekt."},{"q":"„Auf dem Fest wurde viel getanzt.“","options":["Alla festa si è ballato molto.","Alla festa è stato ballato molto."],"a":0,"why":"Ein unpersönliches Passiv gibt es nicht → si impersonale."},{"q":"„Mir wurde geholfen.“","options":["Mi hanno aiutato.","Mi è stato aiutato."],"a":0,"why":"aiutare hat ein direktes Objekt: mi hanno aiutato oder sono stato aiutato."},{"q":"„Mir wurde das Fahrrad gestohlen.“","options":["Mi hanno rubato la bicicletta.","Sono stato rubato la bicicletta."],"a":0,"why":"Die Person kann nicht Subjekt werden; Umschreibung mit 3. Pl."},{"q":"„Hier wird Deutsch gesprochen.“","options":["Qui si parla tedesco.","Qui si parlano tedesco."],"a":0,"why":"tedesco ist Singular → si parla."}]},{"type":"gap","title":"Umschreibungen des Passivs","task":"Setze die passende Form oder das Pronomen ein.","items":[{"q":"In questo negozio (vendere, si, Präsens) ___ libri usati.","a":["si vendono"],"de":"In diesem Laden werden gebrauchte Bücher verkauft."},{"q":"In Italia (mangiare, si, Präsens) ___ molta pasta.","a":["si mangia"],"de":"In Italien wird viel Pasta gegessen."},{"q":"L'anno scorso (costruire, si, passato prossimo) ___ due nuove scuole.","a":["si sono costruite"],"de":"Letztes Jahr wurden zwei neue Schulen gebaut."},{"q":"La torta ___ ha fatta Marta.","a":["l'"],"de":"Die Torte hat Marta gemacht."},{"q":"I biglietti ___ ho già comprati io.","a":["li"],"de":"Die Karten habe ich schon gekauft."},{"q":"(dire, 3. Pl. Präsens) ___ che domani ci sarà sciopero.","a":["Dicono","dicono"],"de":"Es heißt, dass morgen gestreikt wird."},{"q":"Le chiavi ___ ha trovate il portiere.","a":["le"],"de":"Die Schlüssel hat der Hausmeister gefunden."},{"q":"Mi (rubare, 3. Pl. passato prossimo) ___ il portafoglio in metropolitana.","a":["hanno rubato"],"de":"Mir wurde in der U-Bahn die Brieftasche gestohlen."}]}],"cards":[{"f":"Passiv: Bildung","b":"essere + Partizip (angeglichen)"},{"f":"„Die Kirche wurde gebaut.“ (passato prossimo)","b":"La chiesa è stata costruita."},{"f":"„Die Häuser sind verkauft worden.“","b":"Le case sono state vendute."},{"f":"Passiv: futuro von costruire","b":"sarà costruito"},{"f":"Passiv: congiuntivo passato","b":"sia stato costruito"},{"f":"Urheber im Passiv","b":"da (+ Artikel): scritto da Dante, dalla polizia"},{"f":"venire im Passiv","b":"nur einfache Zeiten, betont den Vorgang: viene chiuso"},{"f":"„è venuto costruito“?","b":"falsch! → è stato costruito"},{"f":"andare + Partizip (1)","b":"Notwendigkeit: va fatto = deve essere fatto"},{"f":"andare + Partizip (2)","b":"Verlust: è andato perso / distrutto"},{"f":"„Das Formular muss ausgefüllt werden.“","b":"Il modulo va compilato."},{"f":"„Mein Koffer ist verloren gegangen.“","b":"La mia valigia è andata persa."},{"f":"Welche Verben sind passivfähig?","b":"nur Verben mit direktem Objekt"},{"f":"„Mir wurde ein Buch geschenkt.“","b":"Mi è stato regalato un libro."},{"f":"„Mir wurde geholfen.“","b":"Mi hanno aiutato. / Sono stato aiutato."},{"f":"„Es wurde viel getanzt.“","b":"Si è ballato molto."},{"f":"si passivante","b":"Si vendono case. (Verb an Objekt angeglichen)"},{"f":"„Es heißt, dass …“","b":"Dicono che …"},{"f":"„Mir wurde das Fahrrad gestohlen.“","b":"Mi hanno rubato la bici."},{"f":"Objekt voranstellen","b":"La casa l'ha costruita mio nonno."},{"f":"Passiv-„werden“ ≠ …","b":"diventare! (werden = essere/venire)"}],"id":"k18"},{"nr":19,"title":"Die unpersönliche Form si","teil":"Das Verb und seine Ergänzungen","intro":"Mit dem unpersönlichen si drückt das Italienische das deutsche „man“ aus. Je nach Objekt, Verbtyp und Zeit ändern sich Verbform und Partizip – und es gibt mehrere Alternativen für „man“.","sections":[{"h":"Grundregel: si + 3. Person Singular","html":"<p>Für das deutsche „man“ verwendet das Italienische <b>si<\/b> + Verb in der <b>3. Person Singular<\/b>.<\/p><ul><li><em>In Spagna si cena molto tardi.<\/em> <small>In Spanien isst man sehr spät zu Abend.<\/small><\/li><li><em>Come si dice „Regenschirm“ in italiano?<\/em> <small>Wie sagt man „Regenschirm“ auf Italienisch?<\/small><\/li><li><em>Da qui si arriva in centro in dieci minuti.<\/em> <small>Von hier kommt man in zehn Minuten ins Zentrum.<\/small><\/li><li><em>Non si sa mai.<\/em> <small>Man weiß nie.<\/small><\/li><\/ul><div class=\"tip\"><em>si<\/em> steht immer direkt vor dem Verb; eine Verneinung kommt davor: <em>Qui non si fuma.<\/em><\/div>"},{"h":"si mit direktem Objekt","html":"<p>Folgt ein <b>direktes Objekt<\/b>, richtet sich das Verb nach diesem Objekt (<em>si passivante<\/em>): Singular bei einem Objekt im Singular, Plural bei einem Objekt im Plural.<\/p><table><tr><th>Objekt Singular<\/th><th>Objekt Plural<\/th><\/tr><tr><td><em>Si mangia la pizza.<\/em><\/td><td><em>Si mangiano gli spaghetti.<\/em><\/td><\/tr><tr><td><em>Si vede il mare.<\/em><\/td><td><em>Si vedono le isole.<\/em><\/td><\/tr><tr><td><em>Si parla tedesco.<\/em><\/td><td><em>Si parlano tre lingue.<\/em><\/td><\/tr><\/table><p>Mit Modalverben gilt dasselbe: <em>Da qui si possono vedere le Alpi.<\/em> <small>Von hier aus kann man die Alpen sehen.<\/small><\/p><div class=\"warn\">Achtung: Das deutsche „man“ ist immer Singular – im Italienischen hängt die Verbform vom Objekt ab. Falsch: <em>In Italia si beve molti caffè.<\/em> Richtig: <em>si bevono molti caffè<\/em>.<\/div>"},{"h":"Reflexive Verben: ci si","html":"<p>Bei reflexiven Verben würden zwei <em>si<\/em> aufeinandertreffen. Deshalb wird das erste (unpersönliche) <em>si<\/em> durch <b>ci si<\/b> ersetzt:<\/p><table><tr><th>reflexives Verb<\/th><th>unpersönlich<\/th><\/tr><tr><td><em>alzarsi<\/em><\/td><td><em>Ci si alza presto.<\/em> <small>Man steht früh auf.<\/small><\/td><\/tr><tr><td><em>divertirsi<\/em><\/td><td><em>Ci si diverte.<\/em> <small>Man hat Spaß.<\/small><\/td><\/tr><tr><td><em>annoiarsi<\/em><\/td><td><em>Con lui ci si annoia.<\/em> <small>Mit ihm langweilt man sich.<\/small><\/td><\/tr><tr><td><em>abituarsi<\/em><\/td><td><em>Ci si abitua a tutto.<\/em> <small>Man gewöhnt sich an alles.<\/small><\/td><\/tr><\/table><div class=\"warn\">Achtung: Nie <em>si si<\/em>! Falsch: <em>In montagna si si alza presto.<\/em> Richtig: <em>ci si alza presto<\/em>.<\/div>"},{"h":"si mit prädikativer Ergänzung","html":"<p>Folgt nach <em>essere, diventare, sembrare, restare<\/em> … ein Adjektiv oder Substantiv, steht das Verb im Singular, die Ergänzung aber im <b>Plural<\/b> (meist maskulin):<\/p><ul><li><em>Quando si è stanchi, si lavora male.<\/em> <small>Wenn man müde ist, arbeitet man schlecht.<\/small><\/li><li><em>Da giovani si è più impazienti.<\/em> <small>Wenn man jung ist, ist man ungeduldiger.<\/small><\/li><li><em>Non si diventa ricchi così.<\/em> <small>So wird man nicht reich.<\/small><\/li><li><em>Ci si sente soli in una grande città.<\/em> <small>In einer Großstadt fühlt man sich allein.<\/small><\/li><\/ul><div class=\"tip\">Merke: Das Verb ist Singular, aber „man“ steht für viele Menschen – deshalb Adjektiv im Plural.<\/div>"},{"h":"Zusammengesetzte Zeiten","html":"<p>Das unpersönliche <em>si<\/em> bildet die zusammengesetzten Zeiten <b>immer mit essere<\/b>. Die Endung des Partizips hängt vom Verb ab:<\/p><table><tr><th>Verbtyp<\/th><th>Partizip<\/th><th>Beispiel<\/th><\/tr><tr><td>sonst mit avere, ohne Objekt<\/td><td>-o<\/td><td><em>Si è parlato molto.<\/em> <small>Man hat viel geredet.<\/small><\/td><\/tr><tr><td>sonst mit avere, mit Objekt<\/td><td>an Objekt<\/td><td><em>Si sono viste molte cose.<\/em> <small>Man hat viel gesehen.<\/small><\/td><\/tr><tr><td>sonst mit essere<\/td><td>-i<\/td><td><em>Si è arrivati tardi.<\/em> <small>Man ist spät angekommen.<\/small><\/td><\/tr><tr><td>reflexiv<\/td><td>-i<\/td><td><em>Ci si è divertiti.<\/em> <small>Man hat sich amüsiert.<\/small><\/td><\/tr><\/table><ul><li><em>A quella cena si è mangiato benissimo.<\/em> <small>Bei dem Abendessen hat man hervorragend gegessen.<\/small><\/li><li><em>Si è andati a letto presto.<\/em> <small>Man ist früh ins Bett gegangen.<\/small><\/li><li><em>Si è presa una decisione importante.<\/em> <small>Man hat eine wichtige Entscheidung getroffen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Nicht <em>si ha parlato<\/em> – auch bei Verben, die sonst avere haben, steht nach <em>si<\/em> immer essere.<\/div>"},{"h":"Stellung der Pronomen","html":"<p>Objektpronomen stehen <b>vor<\/b> dem unpersönlichen <em>si<\/em>; vor <em>ne<\/em> wird <em>si<\/em> zu <b>se<\/b>.<\/p><table><tr><th>Pronomen<\/th><th>Beispiel<\/th><th>Bedeutung<\/th><\/tr><tr><td>lo / la / li / le<\/td><td><em>Lo si fa così.<\/em><\/td><td>Man macht es so.<\/td><\/tr><tr><td>ne<\/td><td><em>Se ne parla molto.<\/em><\/td><td>Man spricht viel darüber.<\/td><\/tr><tr><td>ci (dort)<\/td><td><em>Ci si va in treno.<\/em><\/td><td>Man fährt mit dem Zug hin.<\/td><\/tr><tr><td>gli / le<\/td><td><em>Gli si può dire tutto.<\/em><\/td><td>Man kann ihm alles sagen.<\/td><\/tr><\/table><p>Steht <em>lo, la, li, le<\/em> vor <em>si<\/em>, bleibt das Verb im Singular: <em>Li si vede spesso in centro.<\/em> <small>Man sieht sie oft im Zentrum.<\/small> Häufiger sagt man ohne Pronomen: <em>Queste cose non si dicono.<\/em> <small>So etwas sagt man nicht.<\/small><\/p><div class=\"warn\">Achtung: Falsch: <em>si lo fa, si ne parla<\/em>. Richtig: <em>lo si fa, se ne parla<\/em>.<\/div>"},{"h":"Weiteres: si im Sinne von „wir“","html":"<p>In der toskanischen Umgangssprache (und in Mittelitalien) steht <em>si<\/em> oft für <b>„wir“<\/b> – meist zusammen mit <em>noi<\/em>:<\/p><ul><li><em>Noi si va al mare domani.<\/em> <small>Wir fahren morgen ans Meer.<\/small><\/li><li><em>Noi si è mangiato bene.<\/em> <small>Wir haben gut gegessen.<\/small><\/li><\/ul><p>In Anzeigen und auf Schildern findet man <em>si<\/em> mit Passivbedeutung:<\/p><ul><li><em>Si affitta appartamento.<\/em> <small>Wohnung zu vermieten.<\/small><\/li><li><em>Si cerca cameriere.<\/em> <small>Kellner gesucht.<\/small><\/li><\/ul><div class=\"tip\"><em>Noi si va<\/em> verstehen, aber im Standarditalienisch <em>noi andiamo<\/em> sagen.<\/div>"},{"h":"Andere Ausdrücke für „man“","html":"<table><tr><th>Ausdruck<\/th><th>Beispiel<\/th><\/tr><tr><td><em>uno<\/em> (+ 3. Sg.)<\/td><td><em>Uno non sa mai cosa dire.<\/em> <small>Man weiß nie, was man sagen soll.<\/small><\/td><\/tr><tr><td><em>la gente<\/em> (+ 3. Sg.!)<\/td><td><em>La gente dice tante cose.<\/em> <small>Die Leute reden viel.<\/small><\/td><\/tr><tr><td>3. Person Plural<\/td><td><em>Hanno chiuso la strada.<\/em> <small>Man hat die Straße gesperrt.<\/small><\/td><\/tr><tr><td><em>tu<\/em> generisch<\/td><td><em>Se studi, impari.<\/em> <small>Wenn man lernt, lernt man dazu.<\/small><\/td><\/tr><tr><td><em>noi<\/em><\/td><td><em>In Italia beviamo molto caffè.<\/em> <small>In Italien trinken wir viel Kaffee.<\/small><\/td><\/tr><tr><td>Passiv<\/td><td><em>È vietato fumare.<\/em> <small>Rauchen verboten.<\/small><\/td><\/tr><\/table><p><em>uno<\/em> ist besonders praktisch bei reflexiven Verben: <em>Uno si stanca a lavorare così.<\/em> <small>Man wird müde, wenn man so arbeitet.<\/small><\/p><div class=\"warn\">Achtung: <em>la gente<\/em> ist Singular! Falsch: <em>La gente dicono<\/em>. Richtig: <em>La gente dice<\/em>.<\/div>"}],"exercises":[{"type":"choice","title":"Singular oder Plural?","task":"Wähle die richtige Verbform.","items":[{"q":"In questo ristorante si ___ bene.","options":["mangia","mangiano"],"a":0,"why":"Ohne direktes Objekt → 3. Person Singular."},{"q":"Da qui si ___ le montagne.","options":["vede","vedono"],"a":1,"why":"Objekt im Plural (le montagne) → Verb im Plural."},{"q":"In Germania si ___ molta birra.","options":["beve","bevono"],"a":0,"why":"Objekt im Singular (molta birra) → Singular."},{"q":"Al mercato si ___ prodotti locali.","options":["trova","trovano"],"a":1,"why":"Objekt im Plural → Plural."},{"q":"Come si ___ „Schmetterling“ in italiano?","options":["dice","dicono"],"a":0,"why":"Ohne Pluralobjekt → Singular."},{"q":"Quando si ___ in vacanza, si dorme di più.","options":["è","sono"],"a":0,"why":"Prädikative Konstruktion: Verb immer im Singular."},{"q":"In questa scuola si ___ tre lingue straniere.","options":["studia","studiano"],"a":1,"why":"Objekt im Plural (tre lingue) → Plural."},{"q":"Si ___ rispettare le regole.","options":["deve","devono"],"a":1,"why":"Modalverb + Pluralobjekt (le regole) → nach der Norm Plural (si passivante)."}]},{"type":"gap","title":"ci si und prädikative Ergänzung","task":"Setze die richtige Form ein.","items":[{"q":"In vacanza (svegliarsi, si) ___ tardi.","a":["ci si sveglia"],"de":"Im Urlaub wacht man spät auf."},{"q":"Quando si è giovani, (divertirsi, si) ___ facilmente.","a":["ci si diverte"],"de":"Wenn man jung ist, hat man leicht Spaß."},{"q":"Dopo una lunga giornata si è (stanco) ___.","a":["stanchi"],"de":"Nach einem langen Tag ist man müde."},{"q":"In montagna (alzarsi, si) ___ presto.","a":["ci si alza"],"de":"In den Bergen steht man früh auf."},{"q":"Quando si è (felice) ___, tutto sembra più facile.","a":["felici"],"de":"Wenn man glücklich ist, scheint alles leichter."},{"q":"Con lui (annoiarsi, si) ___ sempre.","a":["ci si annoia"],"de":"Mit ihm langweilt man sich immer."},{"q":"Se si è (malato) ___, si resta a letto.","a":["malati"],"de":"Wenn man krank ist, bleibt man im Bett."},{"q":"A quella festa (vestirsi, si) ___ in modo elegante.","a":["ci si veste"],"de":"Zu diesem Fest zieht man sich elegant an."}]},{"type":"gap","title":"Zusammengesetzte Zeiten mit si","task":"Setze das passato prossimo mit si ein.","items":[{"q":"Ieri sera (parlare, si) ___ molto di politica.","a":["si è parlato"],"de":"Gestern Abend hat man viel über Politik geredet."},{"q":"Alla fine (arrivare, si) ___ tardi.","a":["si è arrivati"],"de":"Am Ende ist man spät angekommen."},{"q":"Durante il viaggio (vedere, si) ___ molte cose interessanti.","a":["si sono viste"],"de":"Während der Reise hat man viele interessante Dinge gesehen."},{"q":"Alla festa (divertirsi, si) ___ un sacco.","a":["ci si è divertiti"],"de":"Auf dem Fest hat man sich prächtig amüsiert."},{"q":"Quell'estate (andare, si) ___ spesso al lago.","a":["si è andati"],"de":"In jenem Sommer ist man oft an den See gefahren."},{"q":"A cena (mangiare, si) ___ troppo.","a":["si è mangiato"],"de":"Beim Abendessen hat man zu viel gegessen."},{"q":"In quell'occasione (prendere, si) ___ decisioni importanti.","a":["si sono prese"],"de":"Bei dieser Gelegenheit hat man wichtige Entscheidungen getroffen."},{"q":"Dopo la gita (essere, si) ___ tutti contenti.","a":["si è stati"],"de":"Nach dem Ausflug waren alle zufrieden."}]},{"type":"choice","title":"Stellung der Pronomen","task":"Wähle die richtige Reihenfolge.","items":[{"q":"Questo lavoro? ___ fa in due ore.","options":["Lo si","Si lo"],"a":0,"why":"Objektpronomen vor si."},{"q":"Di questo problema non ___ parla mai.","options":["se ne","si ne","ne si"],"a":0,"why":"si wird vor ne zu se: se ne."},{"q":"Al mare? ___ va in treno.","options":["Ci si","Si ci"],"a":0,"why":"Ortsadverb ci vor si."},{"q":"La verità? ___ deve dire sempre.","options":["La si","Si la"],"a":0,"why":"Objektpronomen vor si."},{"q":"Di soldi ___ parla poco in famiglia.","options":["se ne","si ne"],"a":0,"why":"Vor ne steht se."},{"q":"A tuo fratello ___ può dire tutto.","options":["gli si","si gli"],"a":0,"why":"Auch indirekte Objektpronomen stehen vor si."},{"q":"Questi esercizi? ___ fa in fretta.","options":["Li si","Si li"],"a":0,"why":"Objektpronomen vor si; das Verb bleibt dabei im Singular."}]},{"type":"choice","title":"Andere Ausdrücke für „man“","task":"Wähle die richtige Lösung.","items":[{"q":"„Noi si va al mare domani.“ bedeutet …","options":["Wir fahren morgen ans Meer.","Man fährt morgen ans Meer.","Sie fahren morgen ans Meer."],"a":0,"why":"Umgangssprachlich (Toskana): noi si = wir."},{"q":"La gente ___ che il nuovo sindaco è bravo.","options":["dice","dicono"],"a":0,"why":"la gente ist grammatisch Singular."},{"q":"„Man hat mir die Brieftasche gestohlen.“","options":["Mi hanno rubato il portafoglio.","Mi ha rubato il portafoglio la gente."],"a":0,"why":"Unbestimmter Urheber → 3. Person Plural."},{"q":"„Man weiß nie.“","options":["Non si sa mai.","Non si sanno mai."],"a":0,"why":"Kein Objekt → Singular."},{"q":"„Man ärgert sich, wenn man wartet.“","options":["Uno si arrabbia quando aspetta.","Si si arrabbia quando si aspetta."],"a":0,"why":"Bei reflexiven Verben ist uno eine elegante Lösung; si si gibt es nicht."},{"q":"„Wenn man lernt, versteht man mehr.“ (umgangssprachlich)","options":["Se studi, capisci di più.","Se studia, capiscono di più."],"a":0,"why":"Generisches tu."},{"q":"„Rauchen verboten.“ (Schild)","options":["È vietato fumare.","Si vietano fumare."],"a":0,"why":"Passivkonstruktion: è vietato + Infinitiv."}]}],"cards":[{"f":"„man“ auf Italienisch","b":"si + 3. Person Singular: si dice, si mangia"},{"f":"si mit Pluralobjekt","b":"Verb im Plural: si vendono case"},{"f":"„Man isst Spaghetti.“","b":"Si mangiano gli spaghetti."},{"f":"„Von hier kann man die Alpen sehen.“","b":"Da qui si possono vedere le Alpi."},{"f":"si + reflexives Verb","b":"ci si: ci si alza, ci si diverte"},{"f":"„Man gewöhnt sich an alles.“","b":"Ci si abitua a tutto."},{"f":"„Wenn man müde ist …“","b":"Quando si è stanchi …"},{"f":"Hilfsverb beim unpersönlichen si","b":"immer essere"},{"f":"„Man hat viel geredet.“","b":"Si è parlato molto."},{"f":"„Man ist spät angekommen.“","b":"Si è arrivati tardi."},{"f":"„Man hat viel gesehen.“","b":"Si sono viste molte cose."},{"f":"„Man hat sich amüsiert.“","b":"Ci si è divertiti."},{"f":"„Man macht es so.“","b":"Lo si fa così."},{"f":"„Man spricht viel darüber.“","b":"Se ne parla molto."},{"f":"„Man fährt mit dem Zug hin.“","b":"Ci si va in treno."},{"f":"Noi si va …","b":"toskanisch/umgangssprachlich = noi andiamo"},{"f":"Si affitta …","b":"Zu vermieten …"},{"f":"„man“ mit uno","b":"Uno non sa mai … (3. Sg.)"},{"f":"la gente","b":"+ 3. Person Singular: la gente dice"},{"f":"„Es heißt, dass …“","b":"Dicono che …"},{"f":"generisches tu","b":"Se studi, impari."},{"f":"„Rauchen verboten“","b":"È vietato fumare."}],"id":"k19"},{"nr":20,"title":"Besonderheiten bei Verben","teil":"Das Verb und seine Ergänzungen","intro":"Viele italienische Verben verhalten sich anders als ihre deutschen Entsprechungen: Sie sind unpersönlich, funktionieren wie piacere oder verlangen ein anderes Objekt bzw. eine bestimmte Präposition. Hier lohnt sich gezieltes Lernen besonders.","sections":[{"h":"Unpersönliche Verben","html":"<p>Manche Verben haben kein persönliches Subjekt und stehen nur in der 3. Person Singular. Ein deutsches „es“ wird <b>nicht<\/b> übersetzt.<\/p><table><tr><th>Wetter<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>piove / nevica / grandina<\/em><\/td><td>es regnet / schneit / hagelt<\/td><\/tr><tr><td><em>tuona / lampeggia<\/em><\/td><td>es donnert / blitzt<\/td><\/tr><tr><td><em>fa caldo / freddo / bel tempo<\/em><\/td><td>es ist warm / kalt / schön<\/td><\/tr><tr><td><em>c'è il sole / vento / nebbia<\/em><\/td><td>die Sonne scheint / es ist windig / neblig<\/td><\/tr><\/table><p>Passato prossimo der Wetterverben: mit <em>essere<\/em> oder <em>avere<\/em> – beides ist korrekt: <em>è piovuto / ha piovuto<\/em>.<\/p><table><tr><th>Verb<\/th><th>Beispiel<\/th><\/tr><tr><td><em>succedere<\/em><\/td><td><em>Che cosa è successo?<\/em> <small>Was ist passiert?<\/small><\/td><\/tr><tr><td><em>capitare<\/em><\/td><td><em>Mi capita spesso di dimenticare le chiavi.<\/em> <small>Es kommt oft vor, dass ich die Schlüssel vergesse.<\/small><\/td><\/tr><tr><td><em>bastare<\/em><\/td><td><em>Basta poco per essere felici.<\/em> <small>Es braucht wenig, um glücklich zu sein.<\/small><\/td><\/tr><tr><td><em>sembrare<\/em><\/td><td><em>Sembra che stia per piovere.<\/em> <small>Es scheint, als würde es gleich regnen.<\/small><\/td><\/tr><tr><td><em>bisognare<\/em><\/td><td><em>Bisogna partire subito.<\/em> <small>Man muss sofort los.<\/small><\/td><\/tr><tr><td><em>occorrere<\/em><\/td><td><em>Occorrono due ore.<\/em> <small>Man braucht zwei Stunden.<\/small><\/td><\/tr><\/table><div class=\"warn\">Achtung: Kein „es“ übersetzen! Falsch: <em>Esso piove.<\/em> Richtig: <em>Piove.<\/em> <em>bisognare<\/em> steht nur in der 3. Person Singular (<em>bisogna, bisognava, bisognerà<\/em>); <em>occorrere, bastare, servire<\/em> richten sich nach dem, was gebraucht wird (<em>occorre tempo – occorrono soldi<\/em>).<\/div>"},{"h":"Verben vom Typ piacere","html":"<p>Bei <em>piacere<\/em> ist das <b>Gefallende das Subjekt<\/b>, die Person steht als <b>indirektes Objekt<\/b>. Ist das Subjekt Plural, steht das Verb im Plural:<\/p><table><tr><th>Person<\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>mir<\/td><td><em>mi piace il mare<\/em><\/td><td><em>mi piacciono i fiori<\/em><\/td><\/tr><tr><td>dir<\/td><td><em>ti piace<\/em><\/td><td><em>ti piacciono<\/em><\/td><\/tr><tr><td>ihm / ihr<\/td><td><em>gli / le piace<\/em><\/td><td><em>gli / le piacciono<\/em><\/td><\/tr><tr><td>Luca<\/td><td><em>a Luca piace<\/em><\/td><td><em>a Luca piacciono<\/em><\/td><\/tr><\/table><p>Ebenso: <em>mancare<\/em> (fehlen), <em>servire<\/em> (brauchen), <em>restare / rimanere<\/em> (übrig bleiben), <em>interessare<\/em> (interessieren), <em>dispiacere<\/em> (leidtun), <em>bastare<\/em> (reichen), <em>sembrare<\/em> (scheinen).<\/p><ul><li><em>Mi manchi.<\/em> <small>Du fehlst mir.<\/small><\/li><li><em>Ci serve una scala.<\/em> <small>Wir brauchen eine Leiter.<\/small><\/li><li><em>Mi restano solo cinque euro.<\/em> <small>Ich habe nur noch fünf Euro.<\/small><\/li><li><em>Mi dispiace, non posso.<\/em> <small>Es tut mir leid, ich kann nicht.<\/small><\/li><\/ul><p>Zusammengesetzte Zeiten mit <b>essere<\/b>, Partizip an das Subjekt angeglichen:<\/p><ul><li><em>Mi è piaciuta la mostra.<\/em> <small>Die Ausstellung hat mir gefallen.<\/small><\/li><li><em>Ci sono piaciuti i tuoi amici.<\/em> <small>Deine Freunde haben uns gefallen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: „Ich mag dich“ = <em>Mi piaci<\/em> (du gefällst mir). „Du fehlst mir“ = <em>Mi manchi<\/em>, nicht <em>Ti manco<\/em> (= ich fehle dir).<\/div>"},{"h":"Unpersönliche Ausdrücke","html":"<p>Ausdrücke wie <em>è necessario, è importante, è meglio, è possibile, è un peccato<\/em> werden so verwendet:<\/p><table><tr><th>allgemein<\/th><th>bestimmte Person<\/th><\/tr><tr><td><em>È necessario prenotare.<\/em> <small>Man muss reservieren.<\/small><\/td><td><em>È necessario che tu prenoti.<\/em> <small>Du musst reservieren.<\/small><\/td><\/tr><tr><td><em>È meglio aspettare.<\/em> <small>Es ist besser zu warten.<\/small><\/td><td><em>È meglio che aspettiate.<\/em> <small>Ihr wartet besser.<\/small><\/td><\/tr><tr><td><em>È ora di partire.<\/em> <small>Es ist Zeit aufzubrechen.<\/small><\/td><td><em>È ora che tu vada.<\/em> <small>Es ist Zeit, dass du gehst.<\/small><\/td><\/tr><\/table><ul><li><em>Fa bene camminare un po' ogni giorno.<\/em> <small>Es tut gut, jeden Tag ein bisschen spazieren zu gehen.<\/small><\/li><li><em>Fumare fa male alla salute.<\/em> <small>Rauchen schadet der Gesundheit.<\/small><\/li><li><em>Vale la pena visitare questo paese.<\/em> <small>Es lohnt sich, dieses Dorf zu besichtigen.<\/small><\/li><li><em>Conviene partire presto.<\/em> <small>Es empfiehlt sich, früh loszufahren.<\/small><\/li><\/ul><div class=\"tip\">Merke: Ausdruck + Infinitiv <b>ohne Präposition<\/b> (<em>è importante dormire<\/em>); nur <em>è ora di<\/em> braucht <em>di<\/em>. Mit <em>che<\/em> folgt der congiuntivo.<\/div>"},{"h":"Direktes Objekt im Italienischen – anders im Deutschen","html":"<p>Einige Verben haben im Italienischen ein <b>direktes Objekt<\/b>, während das Deutsche Dativ oder Präposition verwendet. Das wirkt sich auf die Pronomen aus (<em>lo, la, li, le<\/em>):<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><th>Pronomen<\/th><\/tr><tr><td><em>aiutare qualcuno<\/em><\/td><td>jdm. helfen<\/td><td><em>lo aiuto<\/em><\/td><\/tr><tr><td><em>ringraziare qualcuno<\/em><\/td><td>sich bei jdm. bedanken<\/td><td><em>la ringrazio<\/em><\/td><\/tr><tr><td><em>aspettare qualcuno<\/em><\/td><td>auf jdn. warten<\/td><td><em>ti aspetto<\/em><\/td><\/tr><tr><td><em>ascoltare qualcuno<\/em><\/td><td>jdm. zuhören<\/td><td><em>ascoltami!<\/em><\/td><\/tr><tr><td><em>seguire qualcuno<\/em><\/td><td>jdm. folgen<\/td><td><em>li seguo<\/em><\/td><\/tr><tr><td><em>cercare qualcosa<\/em><\/td><td>nach etw. suchen<\/td><td><em>la cerco<\/em><\/td><\/tr><tr><td><em>pagare qualcosa<\/em><\/td><td>für etw. bezahlen<\/td><td><em>lo pago io<\/em><\/td><\/tr><\/table><p><em>chiedere / domandare<\/em>: die <b>Sache<\/b> ist direktes, die <b>Person<\/b> indirektes Objekt:<\/p><em>Ho chiesto l'ora a Marco. → Gli ho chiesto l'ora.<\/em> <small>Ich habe Marco nach der Uhrzeit gefragt.<\/small><div class=\"warn\">Achtung: Falsch: <em>Gli aiuto<\/em> (nach „ich helfe ihm“). Richtig: <em>Lo aiuto.<\/em> Ebenso: <em>La ringrazio<\/em>, nicht <em>Le ringrazio<\/em>.<\/div>"},{"h":"Indirektes Objekt im Italienischen","html":"<p>Umgekehrt verlangen manche Verben im Italienischen <b>a<\/b> + Person (indirektes Objekt, Pronomen <em>gli, le<\/em>), wo das Deutsche einen Akkusativ hat:<\/p><table><tr><th>Italienisch<\/th><th>Deutsch<\/th><th>Pronomen<\/th><\/tr><tr><td><em>telefonare a qualcuno<\/em><\/td><td>jdn. anrufen<\/td><td><em>gli telefono<\/em><\/td><\/tr><tr><td><em>rispondere a qualcuno / qualcosa<\/em><\/td><td>jdm. / auf etw. antworten<\/td><td><em>le rispondo<\/em><\/td><\/tr><tr><td><em>credere a qualcuno<\/em><\/td><td>jdm. glauben<\/td><td><em>non gli credo<\/em><\/td><\/tr><tr><td><em>(as)somigliare a qualcuno<\/em><\/td><td>jdm. ähneln<\/td><td><em>le somiglia<\/em><\/td><\/tr><tr><td><em>insegnare qualcosa a qualcuno<\/em><\/td><td>jdn. etw. lehren<\/td><td><em>gli insegno<\/em><\/td><\/tr><tr><td><em>voler bene a qualcuno<\/em><\/td><td>jdn. lieb haben<\/td><td><em>ti voglio bene<\/em><\/td><\/tr><tr><td><em>dare fastidio a qualcuno<\/em><\/td><td>jdn. stören<\/td><td><em>le dà fastidio<\/em><\/td><\/tr><\/table><ul><li><em>Ho telefonato a Chiara. → Le ho telefonato.<\/em> <small>Ich habe Chiara angerufen.<\/small><\/li><li><em>Ho chiamato Chiara. → L'ho chiamata.<\/em> <small>Ich habe Chiara angerufen. (chiamare: direktes Objekt)<\/small><\/li><\/ul><div class=\"tip\">Gleiche Bedeutung, andere Konstruktion: <em>telefonare a<\/em> (indirekt) – <em>chiamare<\/em> (direkt).<\/div>"},{"h":"Verben mit a oder di + Infinitiv","html":"<p>Folgt ein Infinitiv, verlangen viele Verben eine bestimmte Präposition. Sie muss mitgelernt werden.<\/p><table><tr><th>+ a<\/th><th>+ di<\/th><\/tr><tr><td><em>cominciare / iniziare a<\/em><\/td><td><em>finire di<\/em><\/td><\/tr><tr><td><em>continuare a<\/em><\/td><td><em>smettere di<\/em><\/td><\/tr><tr><td><em>abituarsi a<\/em><\/td><td><em>decidere di<\/em><\/td><\/tr><tr><td><em>imparare a<\/em><\/td><td><em>cercare di<\/em> (versuchen)<\/td><\/tr><tr><td><em>riuscire a<\/em><\/td><td><em>ricordarsi di / dimenticare di<\/em><\/td><\/tr><tr><td><em>provare a<\/em><\/td><td><em>accorgersi di<\/em><\/td><\/tr><tr><td><em>aiutare qcn. a, invitare qcn. a<\/em><\/td><td><em>sperare di, avere voglia di<\/em><\/td><\/tr><tr><td><em>andare / venire a<\/em><\/td><td><em>dire / chiedere a qcn. di<\/em><\/td><\/tr><\/table><p><b>Ohne Präposition<\/b>: Modalverben (<em>volere, potere, dovere, sapere<\/em>), <em>preferire, desiderare<\/em> sowie <em>piacere<\/em>: <em>Mi piace cucinare.<\/em><\/p><ul><li><em>Ho cominciato a studiare il portoghese.<\/em> <small>Ich habe angefangen, Portugiesisch zu lernen.<\/small><\/li><li><em>Hai finito di lavorare?<\/em> <small>Bist du mit der Arbeit fertig?<\/small><\/li><li><em>Non mi sono accorto di avere sbagliato strada.<\/em> <small>Ich habe nicht gemerkt, dass ich falsch gefahren war.<\/small><\/li><\/ul><div class=\"tip\">Eselsbrücke: Anfang und Fortsetzung oft mit <em>a<\/em> (<em>cominciare a, continuare a<\/em>), Ende und Entschluss mit <em>di<\/em> (<em>finire di, smettere di, decidere di<\/em>).<\/div>"},{"h":"Bedeutung je nach Präposition: pensare, credere & Co.","html":"<table><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>pensare a<\/em><\/td><td>denken an; sich kümmern um<\/td><td><em>Penso a te. Ci penso io!<\/em><\/td><\/tr><tr><td><em>pensare di<\/em> + Inf.<\/td><td>vorhaben<\/td><td><em>Penso di partire lunedì.<\/em><\/td><\/tr><tr><td><em>pensare di<\/em> + Subst.<\/td><td>halten von<\/td><td><em>Che cosa pensi di lui?<\/em><\/td><\/tr><tr><td><em>credere a<\/em><\/td><td>jdm./etw. glauben<\/td><td><em>Non credo alle sue scuse.<\/em><\/td><\/tr><tr><td><em>credere in<\/em><\/td><td>glauben an<\/td><td><em>Credo in te.<\/em><\/td><\/tr><tr><td><em>credere di<\/em> + Inf.<\/td><td>glauben, etw. zu tun<\/td><td><em>Credo di avere ragione.<\/em><\/td><\/tr><\/table><p><small>Penso a te = Ich denke an dich. Ci penso io = Ich kümmere mich darum. Che cosa pensi di lui? = Was hältst du von ihm? Non credo alle sue scuse = Ich glaube seinen Ausreden nicht. Credo in te = Ich glaube an dich.<\/small><\/p><p>Weitere Paare: <em>decidere di<\/em> (beschließen) – <em>decidersi a<\/em> (sich durchringen); <em>finire di<\/em> (aufhören) – <em>finire per<\/em> (am Ende doch etw. tun).<\/p><em>Alla fine ha finito per accettare.<\/em> <small>Am Ende hat er doch angenommen.<\/small><div class=\"warn\">Achtung: „Ich denke daran“ = <em>Ci penso<\/em>, „Was denkst du darüber?“ = <em>Che ne pensi?<\/em> – nicht verwechseln.<\/div>"}],"exercises":[{"type":"gap","title":"Verben vom Typ piacere (Präsens)","task":"Setze die richtige Präsensform ein.","items":[{"q":"Mi (piacere) ___ molto i film italiani.","a":["piacciono"],"de":"Italienische Filme gefallen mir sehr."},{"q":"A Luca non (piacere) ___ il pesce.","a":["piace"],"de":"Luca mag keinen Fisch."},{"q":"Ti (mancare) ___ i tuoi amici?","a":["mancano"],"de":"Fehlen dir deine Freunde?"},{"q":"Ci (servire) ___ ancora due sedie.","a":["servono"],"de":"Wir brauchen noch zwei Stühle."},{"q":"Mi (restare) ___ solo dieci euro.","a":["restano"],"de":"Ich habe nur noch zehn Euro."},{"q":"Vi (interessare) ___ l'arte moderna?","a":["interessa"],"de":"Interessiert ihr euch für moderne Kunst?"},{"q":"Mi (dispiacere) ___, ma non posso venire.","a":["dispiace"],"de":"Es tut mir leid, aber ich kann nicht kommen."},{"q":"Marco, tu mi (piacere) ___ molto.","a":["piaci"],"de":"Marco, ich mag dich sehr."}]},{"type":"gap","title":"Passato prossimo mit essere","task":"Setze das passato prossimo ein.","items":[{"q":"La cena ti (piacere) ___?","a":["è piaciuta"],"de":"Hat dir das Abendessen geschmeckt?"},{"q":"I regali ai bambini (piacere) ___ tantissimo.","a":["sono piaciuti"],"de":"Die Geschenke haben den Kindern sehr gefallen."},{"q":"Che cosa (succedere) ___ ieri sera?","a":["è successo"],"de":"Was ist gestern Abend passiert?"},{"q":"Ci (bastare) ___ due ore per finire.","a":["sono bastate"],"de":"Zwei Stunden haben uns gereicht, um fertig zu werden."},{"q":"Le vacanze in Sardegna ci (piacere) ___ molto.","a":["sono piaciute"],"de":"Der Urlaub auf Sardinien hat uns sehr gefallen."},{"q":"Paolo, quando eri via, mi (mancare) ___ tanto.","a":["sei mancato"],"de":"Paolo, als du weg warst, hast du mir sehr gefehlt."},{"q":"Ieri (nevicare) ___ tutto il giorno.","a":["è nevicato","ha nevicato"],"de":"Gestern hat es den ganzen Tag geschneit."},{"q":"Mi (capitare) ___ una cosa strana.","a":["è capitata"],"de":"Mir ist etwas Seltsames passiert."}]},{"type":"choice","title":"Unpersönliche Verben und Ausdrücke","task":"Wähle die richtige Form.","items":[{"q":"È necessario ___ i biglietti in anticipo.","options":["comprare","a comprare","di comprare"],"a":0,"why":"Allgemeine Aussage → Infinitiv ohne Präposition."},{"q":"È importante che tu ___ puntuale.","options":["sei","sia","essere"],"a":1,"why":"che nach unpersönlichem Ausdruck → congiuntivo."},{"q":"È ora ___ andare a letto.","options":["di","a","che"],"a":0,"why":"è ora di + Infinitiv."},{"q":"Bisogna che voi ___ subito.","options":["partite","partiate","partire"],"a":1,"why":"bisogna che + congiuntivo."},{"q":"Fa bene ___ un po' di sport ogni giorno.","options":["fare","di fare","a fare"],"a":0,"why":"fa bene + Infinitiv ohne Präposition."},{"q":"Oggi ___ un freddo terribile.","options":["fa","è","ha"],"a":0,"why":"Wetter: fare freddo / fare caldo."},{"q":"Per andare a Roma ___ tre ore.","options":["occorre","occorrono"],"a":1,"why":"occorrere richtet sich nach dem Gebrauchten (tre ore) → Plural."},{"q":"Sembra che domani ___ bel tempo.","options":["fa","faccia","fare"],"a":1,"why":"sembra che + congiuntivo."}]},{"type":"choice","title":"Direktes oder indirektes Objekt?","task":"Wähle das richtige Pronomen.","items":[{"q":"Marco ha bisogno di aiuto. ___ aiuto io.","options":["Lo","Gli"],"a":0,"why":"aiutare hat ein direktes Objekt → lo."},{"q":"Anna è arrivata? – No, ___ stiamo ancora aspettando.","options":["la","le"],"a":0,"why":"aspettare qualcuno → direktes Objekt."},{"q":"Hai telefonato a Luca? – Sì, ___ ho telefonato ieri.","options":["gli","l'"],"a":0,"why":"telefonare a → indirektes Objekt."},{"q":"Hai chiamato Luca? – Sì, ___ ho chiamato ieri.","options":["l'","gli"],"a":0,"why":"chiamare → direktes Objekt."},{"q":"Signora, ___ ringrazio per l'invito.","options":["La","Le"],"a":0,"why":"ringraziare qualcuno → direktes Objekt (Höflichkeitsform La)."},{"q":"Giulia è uguale a sua madre: ___ somiglia moltissimo.","options":["la","le"],"a":1,"why":"somigliare a → indirektes Objekt."},{"q":"I miei studenti? ___ insegno l'italiano da tre anni.","options":["Li","Gli"],"a":1,"why":"insegnare qualcosa a qualcuno → Person indirekt."},{"q":"Il professore ha fatto una domanda e Marta ___ ha risposto subito.","options":["gli","lo"],"a":0,"why":"rispondere a → indirektes Objekt."},{"q":"Ho chiesto a Paola l'indirizzo. → ___ ho chiesto l'indirizzo.","options":["Le","La"],"a":0,"why":"chiedere a qualcuno → Person indirekt."}]},{"type":"gap","title":"a oder di?","task":"Setze die richtige Präposition ein.","items":[{"q":"Ho cominciato ___ studiare il russo.","a":["a"],"de":"Ich habe angefangen, Russisch zu lernen."},{"q":"Hai finito ___ lavorare?","a":["di"],"de":"Bist du mit der Arbeit fertig?"},{"q":"Non riesco ___ dormire con questo caldo.","a":["a"],"de":"Bei dieser Hitze kann ich nicht schlafen."},{"q":"Ricordati ___ chiudere la porta!","a":["di"],"de":"Denk daran, die Tür zu schließen!"},{"q":"Mi sono abituato ___ alzarmi presto.","a":["a"],"de":"Ich habe mich daran gewöhnt, früh aufzustehen."},{"q":"Ho deciso ___ cambiare lavoro.","a":["di"],"de":"Ich habe beschlossen, die Stelle zu wechseln."},{"q":"Non mi sono accorto ___ niente.","a":["di"],"de":"Ich habe nichts bemerkt."},{"q":"Ha smesso ___ fumare due anni fa.","a":["di"],"de":"Er hat vor zwei Jahren aufgehört zu rauchen."},{"q":"Cerca ___ capire la situazione!","a":["di"],"de":"Versuch, die Situation zu verstehen!"},{"q":"Continuate ___ lavorare, per favore.","a":["a"],"de":"Arbeitet bitte weiter."}]},{"type":"choice","title":"pensare und credere","task":"Wähle die passende Präposition oder Bedeutung.","items":[{"q":"Penso spesso ___ mia nonna.","options":["a","di","in"],"a":0,"why":"pensare a = denken an."},{"q":"Penso ___ andare in Sicilia quest'estate.","options":["a","di"],"a":1,"why":"pensare di + Infinitiv = vorhaben."},{"q":"Che cosa pensi ___ questo libro?","options":["di","a"],"a":0,"why":"pensare di qualcosa = halten von."},{"q":"Non credo ___ quello che dice.","options":["a","di"],"a":0,"why":"credere a = jdm./etw. glauben."},{"q":"Molte persone credono ___ Dio.","options":["in","a","di"],"a":0,"why":"credere in = glauben an."},{"q":"Credo ___ aver capito.","options":["di","a"],"a":0,"why":"credere di + Infinitiv bei gleichem Subjekt."},{"q":"„Non ti preoccupare, ci penso io!“ bedeutet …","options":["Ich kümmere mich darum.","Ich denke darüber nach, ob …","Ich glaube daran."],"a":0,"why":"pensarci = sich um etwas kümmern."},{"q":"Devi credere ___ te stesso!","options":["in","a"],"a":0,"why":"credere in se stessi = an sich glauben."}]}],"cards":[{"f":"„Es regnet / es schneit.“","b":"Piove. / Nevica. (kein „es“)"},{"f":"„Es ist kalt.“ (Wetter)","b":"Fa freddo."},{"f":"„Es hat geregnet.“","b":"È piovuto. / Ha piovuto."},{"f":"„Was ist passiert?“","b":"Che cosa è successo?"},{"f":"bisogna","b":"+ Infinitiv oder che + congiuntivo; nur 3. Sg."},{"f":"occorre / occorrono","b":"richtet sich nach dem Gebrauchten: occorrono due ore"},{"f":"„Mir gefallen die Blumen.“","b":"Mi piacciono i fiori."},{"f":"„Ich mag dich.“","b":"Mi piaci."},{"f":"„Du fehlst mir.“","b":"Mi manchi."},{"f":"„Ich brauche einen Stift.“","b":"Mi serve una penna."},{"f":"„Ich habe nur noch 5 Euro.“","b":"Mi restano solo cinque euro."},{"f":"„Die Ausstellung hat mir gefallen.“","b":"Mi è piaciuta la mostra."},{"f":"è necessario …","b":"+ Inf. (allgemein) / che + congiuntivo (Person)"},{"f":"„Es ist Zeit zu gehen.“","b":"È ora di andare."},{"f":"„Es tut gut zu laufen.“","b":"Fa bene camminare."},{"f":"jdm. helfen","b":"aiutare qualcuno → lo aiuto"},{"f":"sich bei jdm. bedanken","b":"ringraziare qualcuno → la ringrazio"},{"f":"auf jdn. warten","b":"aspettare qualcuno → ti aspetto"},{"f":"jdn. etwas fragen","b":"chiedere qualcosa a qualcuno → gli chiedo"},{"f":"jdn. anrufen (2 Verben)","b":"telefonare a qcn. (gli telefono) / chiamare qcn. (lo chiamo)"},{"f":"jdm. ähneln","b":"somigliare a qualcuno → le somiglia"},{"f":"jdn. lieb haben","b":"voler bene a qualcuno → ti voglio bene"},{"f":"cominciare / continuare + Inf.","b":"+ a"},{"f":"finire / smettere / decidere + Inf.","b":"+ di"},{"f":"pensare a / pensare di","b":"denken an / vorhaben, halten von"},{"f":"„Ich kümmere mich darum.“","b":"Ci penso io."},{"f":"credere a / in / di","b":"jdm. glauben / glauben an / glauben, etw. zu tun"}],"id":"k20"},{"nr":21,"title":"Das Adverb","teil":"Das Verb und seine Ergänzungen","intro":"Adverbien sagen, wie, wann, wo und wie oft etwas geschieht. Anders als im Deutschen unterscheidet das Italienische Adjektiv und Adverb meist deutlich – ein häufiger Fehlerpunkt.","sections":[{"h":"Was ist ein Adverb?","html":"<p>Adverbien bestimmen ein Verb, ein Adjektiv, ein anderes Adverb oder einen ganzen Satz näher: <b>wie, wann, wo, wie oft, wie sehr<\/b>. Sie sind – anders als Adjektive – grundsätzlich <b>unveränderlich<\/b>.<\/p><ul><li><em>Luca guida <b>prudentemente<\/b>.<\/em> <small>Luca fährt vorsichtig.<\/small><\/li><li><em>È un film <b>molto<\/b> lungo.<\/em> <small>Es ist ein sehr langer Film.<\/small><\/li><li><em><b>Purtroppo<\/b> non posso venire.<\/em> <small>Leider kann ich nicht kommen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Im Deutschen sehen Adjektiv und Adverb oft gleich aus (schnell). Im Italienischen nicht: <em>una macchina veloce<\/em>, aber <em>guida velocemente<\/em>.<\/div>"},{"h":"Bildung mit -mente","html":"<p>Viele Adverbien entstehen aus dem Adjektiv + <em>-mente<\/em>:<\/p><ul><li>Adjektive auf <b>-o<\/b>: an die <b>weibliche<\/b> Form auf -a anhängen: <em>lento → lenta → lentamente<\/em>, <em>sicuro → sicuramente<\/em><\/li><li>Adjektive auf <b>-e<\/b>: direkt anhängen: <em>veloce → velocemente<\/em>, <em>forte → fortemente<\/em><\/li><li>Adjektive auf <b>-le / -re<\/b> (nach Vokal): das -e fällt weg: <em>facile → facilmente<\/em>, <em>gentile → gentilmente<\/em>, <em>regolare → regolarmente<\/em>, <em>particolare → particolarmente<\/em><\/li><\/ul><table><tr><th>Adjektiv<\/th><th>Adverb<\/th><th>Deutsch<\/th><\/tr><tr><td><em>tranquillo<\/em><\/td><td><em>tranquillamente<\/em><\/td><td>ruhig<\/td><\/tr><tr><td><em>evidente<\/em><\/td><td><em>evidentemente<\/em><\/td><td>offensichtlich<\/td><\/tr><tr><td><em>probabile<\/em><\/td><td><em>probabilmente<\/em><\/td><td>wahrscheinlich<\/td><\/tr><tr><td><em>normale<\/em><\/td><td><em>normalmente<\/em><\/td><td>normalerweise<\/td><\/tr><\/table><p><b>Ausnahmen:<\/b> <em>leggero → leggermente<\/em> (nicht *leggeramente), <em>violento → violentemente<\/em>, <em>altro → altrimenti<\/em> (sonst, anders).<\/p><div class=\"tip\">Merke: -le/-re verliert das -e (<em>facilmente<\/em>), aber nach Konsonant + l/r bleibt es: <em>acre → acremente<\/em>, <em>folle → follemente<\/em>.<\/div><div class=\"warn\">Achtung: Zwei -mente-Adverbien hintereinander (<em>lentamente e chiaramente<\/em>) klingen schwerfällig. Besser umformulieren: <em>Parla in modo lento e chiaro<\/em>.<\/div>"},{"h":"Ursprüngliche Adverbien","html":"<p>Viele häufige Adverbien sind nicht abgeleitet und müssen als Vokabeln gelernt werden:<\/p><table><tr><th>Art<\/th><th>Beispiele<\/th><\/tr><tr><td>Art und Weise<\/td><td><em>bene, male, così, piano, volentieri<\/em><\/td><\/tr><tr><td>Zeit<\/td><td><em>presto, tardi, ora/adesso, poi, prima, dopo, oggi, domani, ieri, subito<\/em><\/td><\/tr><tr><td>Häufigkeit<\/td><td><em>sempre, mai, spesso, talvolta, ogni tanto<\/em><\/td><\/tr><tr><td>Zeitpunkt/Phase<\/td><td><em>già, ancora, appena, finalmente<\/em><\/td><\/tr><tr><td>Ort<\/td><td><em>qui/qua, lì/là, su, giù, dentro, fuori, sopra, sotto, vicino, lontano<\/em><\/td><\/tr><tr><td>Menge<\/td><td><em>molto, poco, tanto, troppo, abbastanza, quasi<\/em><\/td><\/tr><\/table><ul><li><em>Stamattina mi sono alzato presto.<\/em> <small>Heute Morgen bin ich früh aufgestanden.<\/small><\/li><li><em>Torno subito!<\/em> <small>Ich bin gleich zurück!<\/small><\/li><li><em>Il libro è lì, sul tavolo.<\/em> <small>Das Buch liegt dort, auf dem Tisch.<\/small><\/li><\/ul><div class=\"tip\"><em>qui/qua<\/em> = hier (beim Sprecher), <em>lì/là<\/em> = dort. Die Formen mit -a sind etwas ungenauer („hier herum, dort drüben“). Akzent auf <em>lì<\/em> und <em>là<\/em> nicht vergessen!<\/div><div class=\"warn\">Achtung: <em>presto<\/em> heißt „früh“ oder „bald“, <em>tardi<\/em> „spät“. „Ich bin zu spät“ = <em>Sono in ritardo<\/em>, nicht *sono tardi.<\/div>"},{"h":"Adverbiale Ausdrücke","html":"<p>Oft übernimmt eine feste Wortgruppe (meist mit Präposition) die Rolle eines Adverbs:<\/p><table><tr><th>Ausdruck<\/th><th>Deutsch<\/th><\/tr><tr><td><em>a poco a poco<\/em><\/td><td>nach und nach<\/td><\/tr><tr><td><em>di solito<\/em><\/td><td>gewöhnlich<\/td><\/tr><tr><td><em>in fretta<\/em><\/td><td>eilig, schnell<\/td><\/tr><tr><td><em>all'improvviso / d'improvviso<\/em><\/td><td>plötzlich<\/td><\/tr><tr><td><em>per caso<\/em><\/td><td>zufällig<\/td><\/tr><tr><td><em>di nuovo<\/em><\/td><td>wieder, erneut<\/td><\/tr><tr><td><em>in genere<\/em><\/td><td>im Allgemeinen<\/td><\/tr><tr><td><em>a lungo<\/em><\/td><td>lange<\/td><\/tr><tr><td><em>di corsa<\/em><\/td><td>im Laufschritt, eilig<\/td><\/tr><\/table><ul><li><em>Di solito ceno verso le otto.<\/em> <small>Gewöhnlich esse ich gegen acht zu Abend.<\/small><\/li><li><em>All'improvviso è andata via la luce.<\/em> <small>Plötzlich ist der Strom ausgefallen.<\/small><\/li><li><em>Hai visto per caso le mie chiavi?<\/em> <small>Hast du zufällig meine Schlüssel gesehen?<\/small><\/li><\/ul><div class=\"tip\">Auch <em>in modo + Adjektiv<\/em> ersetzt ein -mente-Adverb: <em>in modo gentile<\/em> = <em>gentilmente<\/em>.<\/div>"},{"h":"bene und male – nicht buono und cattivo","html":"<p>Zu <em>buono<\/em> und <em>cattivo<\/em> gibt es keine -mente-Form. Das Adverb lautet <em>bene<\/em> bzw. <em>male<\/em>.<\/p><table><tr><th>Adjektiv (wer/was?)<\/th><th>Adverb (wie?)<\/th><\/tr><tr><td><em>un buon caffè<\/em><\/td><td><em>cucina bene<\/em><\/td><\/tr><tr><td><em>un cattivo odore<\/em><\/td><td><em>dormo male<\/em><\/td><\/tr><\/table><ul><li><em>Questa pizza è buona.<\/em> <small>Diese Pizza ist gut.<\/small><\/li><li><em>Marta parla bene il tedesco.<\/em> <small>Marta spricht gut Deutsch.<\/small><\/li><li><em>Mi sento male.<\/em> <small>Mir ist schlecht / Ich fühle mich schlecht.<\/small><\/li><\/ul><div class=\"warn\">Achtung: „Es geht mir gut“ = <em>Sto bene<\/em>, nie *sto buono. „Das riecht gut“ = <em>ha un buon profumo<\/em> oder <em>profuma bene<\/em>.<\/div>"},{"h":"Stellung des Adverbs","html":"<p>Normalerweise steht das Adverb <b>nach dem konjugierten Verb<\/b>, Adverbien des Satzes (<em>purtroppo, forse, sicuramente<\/em>) auch am Satzanfang.<\/p><ul><li><em>Leggo spesso il giornale.<\/em> <small>Ich lese oft Zeitung.<\/small><\/li><li><em>Forse arriva domani.<\/em> <small>Vielleicht kommt er morgen.<\/small><\/li><\/ul><p>In <b>zusammengesetzten Zeiten<\/b> stehen die kurzen Adverbien <em>già, mai, ancora, sempre, appena, più<\/em> meist <b>zwischen Hilfsverb und Partizip<\/b>:<\/p><ul><li><em>Ho già mangiato.<\/em> <small>Ich habe schon gegessen.<\/small><\/li><li><em>Non sono mai stato a Napoli.<\/em> <small>Ich war noch nie in Neapel.<\/small><\/li><li><em>Non abbiamo ancora deciso.<\/em> <small>Wir haben noch nicht entschieden.<\/small><\/li><li><em>È appena uscita.<\/em> <small>Sie ist gerade hinausgegangen.<\/small><\/li><\/ul><p>Andere Adverbien (Ort, Zeit, -mente) stehen meist <b>nach dem Partizip<\/b>: <em>Ho dormito bene. Siamo arrivati tardi. Ha risposto gentilmente.<\/em><\/p><div class=\"tip\">Merke: Bei <em>molto, poco, troppo<\/em> vor Adjektiven: Adverb vor das Adjektiv: <em>troppo caro, poco interessante<\/em>.<\/div>"},{"h":"Adjektive als Adverbien","html":"<p>Einige Adjektive werden in der <b>männlichen Singularform<\/b> als Adverb gebraucht – dann sind sie <b>unveränderlich<\/b>:<\/p><table><tr><th>Ausdruck<\/th><th>Deutsch<\/th><\/tr><tr><td><em>parlare chiaro<\/em><\/td><td>deutlich/offen reden<\/td><\/tr><tr><td><em>andare piano<\/em><\/td><td>langsam fahren/gehen<\/td><\/tr><tr><td><em>lavorare sodo<\/em><\/td><td>hart arbeiten<\/td><\/tr><tr><td><em>andare forte<\/em><\/td><td>schnell fahren<\/td><\/tr><tr><td><em>vedere giusto<\/em><\/td><td>richtig sehen<\/td><\/tr><tr><td><em>costare caro<\/em><\/td><td>teuer sein, teuer zu stehen kommen<\/td><\/tr><\/table><ul><li><em>Le ragazze lavorano sodo.<\/em> <small>Die Mädchen arbeiten hart.<\/small><\/li><li><em>Parlate più piano, per favore!<\/em> <small>Sprecht bitte leiser/langsamer!<\/small><\/li><\/ul><p>Bezieht sich das Wort dagegen auf das <b>Subjekt<\/b> (Zustand), ist es ein echtes Adjektiv und wird <b>angeglichen<\/b>:<\/p><ul><li><em>Le ragazze arrivano stanche.<\/em> <small>Die Mädchen kommen müde an.<\/small><\/li><li><em>I bambini dormono tranquilli.<\/em> <small>Die Kinder schlafen ruhig.<\/small><\/li><\/ul><div class=\"tip\">Faustregel: Beschreibt es die Handlung → unveränderlich. Beschreibt es den Zustand des Subjekts → angleichen.<\/div>"},{"h":"Steigerung der Adverbien","html":"<p>Komparativ mit <em>più / meno<\/em>, Superlativ relativ mit <em>il più … possibile<\/em>, absolut mit <em>-issimo<\/em> oder <em>molto<\/em>:<\/p><table><tr><th>Stufe<\/th><th>Beispiel<\/th><\/tr><tr><td>Komparativ<\/td><td><em>più velocemente, meno spesso<\/em><\/td><\/tr><tr><td>relativer Superlativ<\/td><td><em>il più velocemente possibile<\/em><\/td><\/tr><tr><td>absoluter Superlativ<\/td><td><em>velocissimamente<\/em> (selten) / <em>molto velocemente<\/em>; <em>prestissimo, tardissimo<\/em><\/td><\/tr><\/table><p><b>Unregelmäßig:<\/b><\/p><table><tr><th>Positiv<\/th><th>Komparativ<\/th><th>abs. Superlativ<\/th><\/tr><tr><td><em>bene<\/em><\/td><td><em>meglio<\/em><\/td><td><em>benissimo / ottimamente<\/em><\/td><\/tr><tr><td><em>male<\/em><\/td><td><em>peggio<\/em><\/td><td><em>malissimo / pessimamente<\/em><\/td><\/tr><tr><td><em>molto<\/em><\/td><td><em>di più / più<\/em><\/td><td><em>moltissimo<\/em><\/td><\/tr><tr><td><em>poco<\/em><\/td><td><em>di meno / meno<\/em><\/td><td><em>pochissimo<\/em><\/td><\/tr><\/table><ul><li><em>Corre più velocemente di suo fratello.<\/em> <small>Er läuft schneller als sein Bruder.<\/small><\/li><li><em>Oggi sto meglio.<\/em> <small>Heute geht es mir besser.<\/small><\/li><li><em>Dovresti dormire di più.<\/em> <small>Du solltest mehr schlafen.<\/small><\/li><li><em>Rispondimi il prima possibile.<\/em> <small>Antworte mir so bald wie möglich.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>meglio<\/em> (Adverb, unveränderlich) ≠ <em>migliore<\/em> (Adjektiv, Plural <em>migliori<\/em>). <em>Questo vino è migliore<\/em>, aber <em>Questo vino si abbina meglio al pesce<\/em>. Nach <em>essere<\/em> geht umgangssprachlich auch <em>è meglio<\/em> = „es ist besser“.<\/div>"}],"exercises":[{"type":"gap","title":"Adverbien auf -mente","task":"Bilde das Adverb zum Adjektiv in Klammern.","items":[{"q":"Il treno avanza (lento) ___ verso la stazione.","a":["lentamente"],"de":"Der Zug fährt langsam auf den Bahnhof zu."},{"q":"Questo esercizio si risolve (facile) ___.","a":["facilmente"],"de":"Diese Übung lässt sich leicht lösen."},{"q":"Vado in palestra (regolare) ___.","a":["regolarmente"],"de":"Ich gehe regelmäßig ins Fitnessstudio."},{"q":"La signora ci ha salutato (gentile) ___.","a":["gentilmente"],"de":"Die Dame hat uns freundlich begrüßt."},{"q":"Sono (leggero) ___ preoccupato.","a":["leggermente"],"de":"Ich bin leicht besorgt."},{"q":"(Probabile) ___ pioverà stasera.","a":["Probabilmente","probabilmente"],"de":"Wahrscheinlich wird es heute Abend regnen."},{"q":"Il vento soffiava (violento) ___.","a":["violentemente"],"de":"Der Wind blies heftig."},{"q":"Sbrigati, (altro) ___ perdiamo l'autobus!","a":["altrimenti"],"de":"Beeil dich, sonst verpassen wir den Bus!"}]},{"type":"choice","title":"Adjektiv oder Adverb?","task":"Wähle die richtige Form.","items":[{"q":"Mia nonna cucina molto ___.","options":["buono","bene"],"a":1,"why":"Wie kocht sie? → Adverb bene."},{"q":"Questa torta è proprio ___.","options":["buona","bene"],"a":0,"why":"Eigenschaft der Torte nach essere → Adjektiv."},{"q":"Stanotte ho dormito ___.","options":["cattivo","male"],"a":1,"why":"Art des Schlafens → Adverb male."},{"q":"Paolo è un autista ___.","options":["prudente","prudentemente"],"a":0,"why":"Bestimmt das Substantiv autista → Adjektiv."},{"q":"Paolo guida ___.","options":["prudente","prudentemente"],"a":1,"why":"Bestimmt das Verb → Adverb."},{"q":"Le mie colleghe lavorano ___.","options":["sodo","sode"],"a":0,"why":"lavorare sodo: Adjektiv als Adverb, unveränderlich."},{"q":"Dopo la gita i bambini sono tornati ___.","options":["stanco","stanchi"],"a":1,"why":"Zustand des Subjekts → angeglichen."},{"q":"Per favore, andate ___: la strada è ghiacciata.","options":["piano","piani"],"a":0,"why":"andare piano: unveränderlich."}]},{"type":"gap","title":"Stellung: già, mai, ancora …","task":"Setze das Adverb in Klammern ein. Die Lücke zeigt die richtige Stelle.","items":[{"q":"Ho ___ letto questo romanzo. (schon)","a":["già"],"de":"Ich habe diesen Roman schon gelesen."},{"q":"Non siamo ___ stati in Sardegna. (nie)","a":["mai"],"de":"Wir waren nie in Sardinien."},{"q":"Il medico non è ___ arrivato. (noch nicht)","a":["ancora"],"de":"Der Arzt ist noch nicht angekommen."},{"q":"Sono ___ tornata dal lavoro. (gerade eben)","a":["appena"],"de":"Ich bin gerade von der Arbeit zurückgekommen."},{"q":"Abbiamo ___ votato per lo stesso partito. (immer)","a":["sempre"],"de":"Wir haben immer dieselbe Partei gewählt."},{"q":"Hai mangiato ___? Sembri sazio. (viel)","a":["molto","tanto"],"de":"Hast du viel gegessen? Du wirkst satt."},{"q":"Di ___ faccio colazione al bar. (gewöhnlich)","a":["solito"],"de":"Gewöhnlich frühstücke ich in der Bar."},{"q":"Ho incontrato Sara per ___ in centro. (zufällig)","a":["caso"],"de":"Ich habe Sara zufällig in der Stadt getroffen."}]},{"type":"choice","title":"meglio oder migliore?","task":"Wähle die passende Form.","items":[{"q":"Oggi mi sento ___ di ieri.","options":["meglio","migliore"],"a":0,"why":"Wie fühle ich mich? → Adverb meglio."},{"q":"Questo ristorante è ___ di quello in piazza.","options":["meglio","migliore"],"a":1,"why":"Vergleich von Eigenschaften eines Substantivs → Adjektiv."},{"q":"Sono i ___ amici che ho.","options":["meglio","migliori"],"a":1,"why":"Adjektiv beim Substantiv, Plural → migliori."},{"q":"Chi canta ___, tu o tua sorella?","options":["meglio","migliore"],"a":0,"why":"Bestimmt das Verb cantare → meglio."},{"q":"Questa borsa costa ___ di quella nera.","options":["meno","di meno"],"a":0,"why":"Mit Vergleichsglied (di quella) steht nur meno; di meno steht allein am Satzende."},{"q":"Mi piace questo film, ma l'altro mi è piaciuto ___.","options":["di più","più"],"a":0,"why":"Am Satzende ohne Ergänzung → di più."},{"q":"Ieri sera ho mangiato ___: ho mal di stomaco.","options":["peggio","malissimo"],"a":1,"why":"Ohne Vergleich → absoluter Superlativ malissimo."},{"q":"Torna a casa il ___ presto possibile.","options":["più","meglio"],"a":0,"why":"il più + Adverb + possibile."}]},{"type":"gap","title":"Steigerung und Ausdrücke","task":"Ergänze das fehlende Wort.","items":[{"q":"Parla ___ lentamente, non capisco! (mehr = langsamer)","a":["più"],"de":"Sprich langsamer, ich verstehe nicht!"},{"q":"Finiscilo il più velocemente ___.","a":["possibile"],"de":"Mach es so schnell wie möglich fertig."},{"q":"Hai superato l'esame? – Sì, è andato (bene, abs. Superlativ) ___!","a":["benissimo"],"de":"Hast du die Prüfung bestanden? – Ja, sie lief bestens!"},{"q":"Ha imparato la lingua a poco a ___.","a":["poco"],"de":"Er hat die Sprache nach und nach gelernt."},{"q":"Abbiamo fatto tutto in ___ e abbiamo dimenticato i passaporti.","a":["fretta"],"de":"Wir haben alles in Eile gemacht und die Pässe vergessen."},{"q":"Luigi lavora meno di te, ma guadagna di ___.","a":["più"],"de":"Luigi arbeitet weniger als du, verdient aber mehr."},{"q":"Con questi occhiali vedo molto (gut, Komparativ) ___.","a":["meglio"],"de":"Mit dieser Brille sehe ich viel besser."},{"q":"La situazione va sempre (schlecht, Komparativ) ___.","a":["peggio"],"de":"Die Lage wird immer schlechter."}]}],"cards":[{"f":"Adverb aus Adjektiv auf -o","b":"weibliche Form + -mente: lento → lentamente"},{"f":"Adverb aus Adjektiv auf -le/-re","b":"-e fällt weg: facile → facilmente, regolare → regolarmente"},{"f":"leicht (Adverb)","b":"leggermente (Ausnahme!)"},{"f":"heftig (Adverb)","b":"violentemente (Ausnahme!)"},{"f":"sonst, andernfalls","b":"altrimenti"},{"f":"Adverb zu buono / cattivo","b":"bene / male"},{"f":"früh / bald","b":"presto"},{"f":"spät / zu spät sein","b":"tardi / essere in ritardo"},{"f":"hier / dort (mit Akzent!)","b":"qui, qua / lì, là"},{"f":"nach und nach","b":"a poco a poco"},{"f":"gewöhnlich","b":"di solito"},{"f":"plötzlich","b":"all'improvviso / d'improvviso"},{"f":"zufällig","b":"per caso"},{"f":"eilig, in Eile","b":"in fretta"},{"f":"Stellung von già/mai/ancora im passato prossimo","b":"zwischen Hilfsverb und Partizip: Ho già mangiato."},{"f":"Ich war noch nie in Rom.","b":"Non sono mai stato a Roma."},{"f":"Sie ist gerade gegangen.","b":"È appena uscita."},{"f":"hart arbeiten","b":"lavorare sodo (unveränderlich)"},{"f":"deutlich reden / langsam gehen","b":"parlare chiaro / andare piano"},{"f":"Le ragazze arrivano … (müde)","b":"stanche – Zustand des Subjekts → angleichen"},{"f":"bene – Komparativ / Superlativ","b":"meglio / benissimo (ottimamente)"},{"f":"male – Komparativ / Superlativ","b":"peggio / malissimo (pessimamente)"},{"f":"mehr / weniger (am Satzende)","b":"di più / di meno"},{"f":"so schnell wie möglich","b":"il più velocemente possibile"},{"f":"meglio vs. migliore","b":"meglio = Adverb (wie?), migliore = Adjektiv (welcher?), Plural migliori"},{"f":"in modo + Adjektiv","b":"Ersatz für -mente: in modo gentile = gentilmente"}],"id":"k21"},{"nr":22,"title":"Die Konjunktionen","teil":"Der Satz","intro":"Konjunktionen verknüpfen Satzteile und Sätze. Bei den unterordnenden Konjunktionen entscheidet die Wahl oft über Indikativ oder congiuntivo – deshalb lohnt es sich, sie samt Modus zu lernen.","sections":[{"h":"Überblick: beiordnend und unterordnend","html":"<p>Konjunktionen verbinden Wörter, Satzteile oder Sätze. <b>Beiordnende<\/b> Konjunktionen verbinden Gleichrangiges (zwei Hauptsätze, zwei Substantive). <b>Unterordnende<\/b> leiten einen Nebensatz ein – und entscheiden oft, ob <b>Indikativ<\/b> oder <b>congiuntivo<\/b> folgt.<\/p><ul><li><em>Leggo <b>e<\/b> ascolto musica.<\/em> <small>Ich lese und höre Musik. (beiordnend)<\/small><\/li><li><em>Resto a casa <b>perché<\/b> piove.<\/em> <small>Ich bleibe zu Hause, weil es regnet. (unterordnend + Indikativ)<\/small><\/li><li><em>Esco <b>benché<\/b> piova.<\/em> <small>Ich gehe hinaus, obwohl es regnet. (unterordnend + congiuntivo)<\/small><\/li><\/ul><div class=\"tip\">Gute Nachricht: Im italienischen Nebensatz bleibt die Wortstellung normal (Subjekt – Verb – Objekt). Keine Verbendstellung wie im Deutschen!<\/div>"},{"h":"Anreihend und ausschließend","html":"<p><b>Anreihend:<\/b> <em>e<\/em> (vor Vokal, besonders vor e-, oft <em>ed<\/em>), <em>anche<\/em> (auch), verneint <em>neanche / neppure / nemmeno<\/em> (auch nicht, nicht einmal).<\/p><ul><li><em>Anna ed Elena sono sorelle.<\/em> <small>Anna und Elena sind Schwestern.<\/small><\/li><li><em>Vengo anch'io.<\/em> <small>Ich komme auch.<\/small><\/li><li><em>Non ho fame e neanche sete.<\/em> <small>Ich habe keinen Hunger und auch keinen Durst.<\/small><\/li><li><em>Nemmeno lui lo sapeva.<\/em> <small>Nicht einmal er wusste es.<\/small><\/li><\/ul><p><b>Ausschließend:<\/b> <em>o / oppure<\/em> (oder), <em>o … o<\/em> (entweder … oder).<\/p><ul><li><em>Prendi il tè o il caffè?<\/em> <small>Nimmst du Tee oder Kaffee?<\/small><\/li><li><em>Possiamo andare al mare, oppure restare in città.<\/em> <small>Wir können ans Meer fahren oder in der Stadt bleiben.<\/small><\/li><li><em>O mi chiami tu, o ti chiamo io.<\/em> <small>Entweder rufst du mich an, oder ich rufe dich an.<\/small><\/li><\/ul><div class=\"tip\"><em>anche<\/em> steht <b>vor<\/b> dem Wort, auf das es sich bezieht: <em>Anche Marco viene<\/em> (auch Marco) ≠ <em>Marco viene anche domani<\/em> (auch morgen).<\/div><div class=\"warn\">Achtung: Steht <em>neanche/nemmeno/neppure<\/em> nach dem Verb, braucht es <em>non<\/em>: <em>Non l'ho visto neanche io<\/em>. Am Satzanfang ohne <em>non<\/em>: <em>Neanche io l'ho visto<\/em>.<\/div>"},{"h":"Entgegensetzend, erläuternd, folgernd","html":"<table><tr><th>Funktion<\/th><th>Konjunktionen<\/th><th>Deutsch<\/th><\/tr><tr><td>Gegensatz<\/td><td><em>ma, però, invece, tuttavia, eppure<\/em><\/td><td>aber, jedoch, dagegen, trotzdem<\/td><\/tr><tr><td>Erläuterung<\/td><td><em>cioè, infatti, ossia<\/em><\/td><td>das heißt, tatsächlich/nämlich, beziehungsweise<\/td><\/tr><tr><td>Folgerung<\/td><td><em>quindi, perciò, dunque, allora<\/em><\/td><td>also, deshalb, folglich, dann<\/td><\/tr><\/table><ul><li><em>È bravo, ma un po' pigro.<\/em> <small>Er ist tüchtig, aber etwas faul.<\/small><\/li><li><em>Volevo uscire; ero però troppo stanco.<\/em> <small>Ich wollte ausgehen; ich war aber zu müde.<\/small><\/li><li><em>Io bevo vino, lei invece preferisce la birra.<\/em> <small>Ich trinke Wein, sie dagegen lieber Bier.<\/small><\/li><li><em>Ha studiato tanto, eppure è stato bocciato.<\/em> <small>Er hat viel gelernt, und trotzdem ist er durchgefallen.<\/small><\/li><li><em>Arrivo dopodomani, cioè giovedì.<\/em> <small>Ich komme übermor
