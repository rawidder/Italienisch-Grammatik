<\/td><td><em>saranno arrivati/-e<\/em><\/td><\/tr><\/table>\n<p><b>Gebrauch:<\/b><\/p>\n<ul><li><b>Vorzeitigkeit in der Zukunft<\/b> – vor allem nach <em>quando, appena, dopo che<\/em>: <em>Quando avrò finito il turno, verrò da te.<\/em> – Wenn ich meine Schicht beendet habe, komme ich zu dir. <em>Appena sarete arrivati, mangeremo.<\/em><\/li>\n<li><b>Vermutung über Vergangenes<\/b>: <em>Lucia è in ritardo: avrà perso il treno.<\/em> – Sie wird wohl den Zug verpasst haben. <em>Dove avrò messo gli occhiali?<\/em> – Wo habe ich bloß meine Brille hingelegt?<\/li><\/ul>\n<div class=\"tip\">Vermutung: Gegenwart → Futur I (<em>sarà a casa<\/em>), Vergangenheit → Futur II (<em>sarà già uscito<\/em>).<\/div>"}],"exercises":[{"type":"gap","title":"Präsens: regelmäßig und Schreibung","task":"Setze die Präsensform ein. Achte auf die Schreibung.","items":[{"q":"Noi (cercare) ___ un appartamento in centro.","a":["cerchiamo","Cerchiamo"],"de":"Wir suchen eine Wohnung im Zentrum."},{"q":"Tu (pagare) ___ sempre con la carta?","a":["paghi","Paghi"],"de":"Zahlst du immer mit Karte?"},{"q":"Voi (prendere) ___ il treno delle otto?","a":["prendete","Prendete"],"de":"Nehmt ihr den Zug um acht?"},{"q":"Loro (capire) ___ bene l'italiano.","a":["capiscono","Capiscono"],"de":"Sie verstehen gut Italienisch."},{"q":"Io (dormire) ___ poco quando fa caldo.","a":["dormo","Dormo"],"de":"Ich schlafe wenig, wenn es heiß ist."},{"q":"Tu (mangiare) ___ troppo in fretta.","a":["mangi","Mangi"],"de":"Du isst zu schnell."},{"q":"Tu (studiare) ___ medicina o farmacia?","a":["studi","Studi"],"de":"Studierst du Medizin oder Pharmazie?"},{"q":"Signora, Lei (preferire) ___ il tè o il caffè?","a":["preferisce","Preferisce"],"de":"Möchten Sie lieber Tee oder Kaffee?"},{"q":"I bambini (giocare) ___ in giardino.","a":["giocano","Giocano"],"de":"Die Kinder spielen im Garten."},{"q":"Tu (cominciare) ___ domani il nuovo lavoro?","a":["cominci","Cominci"],"de":"Fängst du morgen die neue Arbeit an?"}]},{"type":"gap","title":"Präsens: unregelmäßige Verben","task":"Setze die richtige Präsensform ein.","items":[{"q":"Stasera (io – uscire) ___ con i colleghi.","a":["esco","Esco"],"de":"Heute Abend gehe ich mit den Kollegen aus."},{"q":"Che cosa (voi – fare) ___ il fine settimana?","a":["fate","Fate"],"de":"Was macht ihr am Wochenende?"},{"q":"Purtroppo non (noi – potere) ___ venire alla festa.","a":["possiamo","Possiamo"],"de":"Leider können wir nicht zum Fest kommen."},{"q":"I miei amici (venire) ___ da Verona.","a":["vengono","Vengono"],"de":"Meine Freunde kommen aus Verona."},{"q":"Scusa, (tu – sapere) ___ dov'è la stazione?","a":["sai","Sai"],"de":"Entschuldige, weißt du, wo der Bahnhof ist?"},{"q":"Di solito (io – bere) ___ un caffè dopo pranzo.","a":["bevo","Bevo"],"de":"Normalerweise trinke ich nach dem Mittagessen einen Kaffee."},{"q":"Stasera i ragazzi (rimanere) ___ a casa.","a":["rimangono","Rimangono"],"de":"Heute Abend bleiben die Jungs zu Hause."},{"q":"Che vino (tu – scegliere) ___ per la cena?","a":["scegli","Scegli"],"de":"Welchen Wein wählst du für das Abendessen?"},{"q":"Per lavoro (io – tradurre) ___ testi medici dall'inglese.","a":["traduco","Traduco"],"de":"Beruflich übersetze ich medizinische Texte aus dem Englischen."},{"q":"Domani (noi – dovere) ___ partire presto.","a":["dobbiamo","Dobbiamo"],"de":"Morgen müssen wir früh abfahren."}]},{"type":"choice","title":"Präsens: Gebrauch","task":"Wähle die passende Form.","items":[{"q":"Abito a Firenze ___ cinque anni.","options":["per","da","fa"],"a":1,"why":"Handlung dauert bis heute an: da + Präsens."},{"q":"Non disturbarlo, ___ lavorando.","options":["è","sta","ha"],"a":1,"why":"Verlaufsform: stare + Gerundium."},{"q":"„Ich lerne seit Mai Italienisch.“","options":["Studio l'italiano da maggio.","Ho studiato l'italiano da maggio.","Studio l'italiano per maggio."],"a":0,"why":"„seit“ mit andauernder Handlung → da + Präsens."},{"q":"Domani ___ per Parigi, ho già il biglietto.","options":["parto","partivo"],"a":0,"why":"Geplante nahe Zukunft → Präsens."},{"q":"Cosa stai ___?","options":["facendo","fando","fatto"],"a":0,"why":"Gerundium von fare: facendo (Stamm fac-)."},{"q":"Sbrigati, il treno ___ partire!","options":["sta per","sta","è per"],"a":0,"why":"stare per + Infinitiv = gleich etwas tun."},{"q":"„Ich habe drei Jahre in Mailand gewohnt.“ (abgeschlossen)","options":["Abito a Milano da tre anni.","Ho abitato a Milano per tre anni."],"a":1,"why":"Abgeschlossener Zeitraum → passato prossimo + per."},{"q":"Silenzio, i bambini stanno ___.","options":["dormendo","dormindo","dormiendo"],"a":0,"why":"-ire-Verben bilden das Gerundium auf -endo."}]},{"type":"gap","title":"Imperfetto: Formen","task":"Setze das Verb ins imperfetto.","items":[{"q":"Da piccolo (io – avere) ___ paura del buio.","a":["avevo","Avevo"],"de":"Als Kind hatte ich Angst vor der Dunkelheit."},{"q":"Quando eravamo giovani, (noi – andare) ___ spesso a ballare.","a":["andavamo","Andavamo"],"de":"Als wir jung waren, gingen wir oft tanzen."},{"q":"Mentre tu (dormire) ___, io ho pulito la cucina.","a":["dormivi","Dormivi"],"de":"Während du schliefst, habe ich die Küche geputzt."},{"q":"I miei nonni (essere) ___ contadini.","a":["erano","Erano"],"de":"Meine Großeltern waren Bauern."},{"q":"Mio padre (dire) ___ sempre: „Prima il dovere, poi il piacere.“","a":["diceva","Diceva"],"de":"Mein Vater sagte immer: „Erst die Pflicht, dann das Vergnügen.“"},{"q":"All'università voi (bere) ___ molto caffè?","a":["bevevate","Bevevate"],"de":"Habt ihr an der Uni viel Kaffee getrunken?"},{"q":"Buongiorno, (io – volere) ___ un'informazione.","a":["volevo","Volevo"],"de":"Guten Tag, ich hätte gern eine Auskunft."},{"q":"Quando siamo arrivati, (essere) ___ le undici.","a":["erano","Erano"],"de":"Als wir ankamen, war es elf Uhr."},{"q":"Che tempo (fare) ___ ieri a Roma?","a":["faceva","Faceva"],"de":"Wie war gestern das Wetter in Rom?"},{"q":"A vent'anni tu (tradurre) ___ già romanzi?","a":["traducevi","Traducevi"],"de":"Hast du mit zwanzig schon Romane übersetzt?"}]},{"type":"gap","title":"Passato prossimo bilden","task":"Setze das Verb ins passato prossimo (Hilfsverb + Partizip, ggf. angeglichen).","items":[{"q":"Ieri (noi – mangiare) ___ in una trattoria.","a":["abbiamo mangiato","Abbiamo mangiato"],"de":"Gestern haben wir in einer Trattoria gegessen."},{"q":"Giulia (arrivare) ___ alle nove.","a":["è arrivata","È arrivata"],"de":"Giulia ist um neun angekommen."},{"q":"Che cosa (tu – fare) ___ ieri sera?","a":["hai fatto","Hai fatto"],"de":"Was hast du gestern Abend gemacht?"},{"q":"I ragazzi (uscire) ___ presto.","a":["sono usciti","Sono usciti"],"de":"Die Jungs sind früh weggegangen."},{"q":"Io (leggere) ___ quel libro due volte.","a":["ho letto","Ho letto"],"de":"Ich habe das Buch zweimal gelesen."},{"q":"Mia sorella (nascere) ___ nel 1998.","a":["è nata","È nata"],"de":"Meine Schwester ist 1998 geboren."},{"q":"Le mie amiche (divertirsi) ___ molto alla festa.","a":["si sono divertite","Si sono divertite"],"de":"Meine Freundinnen haben sich auf dem Fest gut amüsiert."},{"q":"La lettera? (Io – scriverla) ___ ieri.","a":["L'ho scritta","L’ho scritta","l'ho scritta"],"de":"Den Brief? Ich habe ihn gestern geschrieben."},{"q":"Il film ti (piacere) ___?","a":["è piaciuto","È piaciuto"],"de":"Hat dir der Film gefallen?"},{"q":"Quanti caffè hai bevuto? – (Io – berne) ___ tre.","a":["Ne ho bevuti","ne ho bevuti"],"de":"Wie viele Kaffees hast du getrunken? – Ich habe drei getrunken."}]},{"type":"choice","title":"avere oder essere?","task":"Wähle das richtige Hilfsverb.","items":[{"q":"Il concerto ___ finito a mezzanotte.","options":["ha","è"],"a":1,"why":"finire ohne Objekt → essere."},{"q":"___ finito il lavoro alle sei.","options":["Ho","Sono"],"a":0,"why":"finire mit direktem Objekt → avere."},{"q":"Ieri ___ passata da te, ma non c'eri.","options":["ho","sono"],"a":1,"why":"passare da qcn (vorbeikommen) → essere."},{"q":"___ passato le vacanze in Sardegna.","options":["Abbiamo","Siamo"],"a":0,"why":"passare qcs (verbringen) → avere."},{"q":"I prezzi ___ aumentati del dieci per cento.","options":["hanno","sono"],"a":1,"why":"aumentare ohne Objekt (steigen) → essere."},{"q":"Il biglietto mi ___ costato venti euro.","options":["ha","è"],"a":1,"why":"costare → essere."},{"q":"Marco ___ salito sul treno all'ultimo momento.","options":["ha","è"],"a":1,"why":"salire su (einsteigen, ohne Objekt) → essere."},{"q":"___ sceso le scale di corsa.","options":["Ho","Sono"],"a":0,"why":"scendere qcs (le scale = direktes Objekt) → avere."},{"q":"Che cosa ___ successo?","options":["ha","è"],"a":1,"why":"succedere → essere."},{"q":"Ieri ___ camminato per tre ore.","options":["ho","sono"],"a":0,"why":"camminare (laufen, ohne Ziel) → avere, anders als im Deutschen."}]},{"type":"choice","title":"imperfetto oder passato prossimo?","task":"Wähle die passende Zeit.","items":[{"q":"Quando ___ piccola, abitavo in campagna.","options":["ero","sono stata"],"a":0,"why":"Zustand in der Vergangenheit → imperfetto."},{"q":"Ieri ___ tre ore in biblioteca.","options":["studiavo","ho studiato"],"a":1,"why":"Abgeschlossener, begrenzter Zeitraum → passato prossimo."},{"q":"Mentre ___ la doccia, è suonato il campanello.","options":["facevo","ho fatto"],"a":0,"why":"Hintergrundhandlung → imperfetto."},{"q":"Ogni estate ___ dai nonni in Puglia.","options":["andavamo","siamo andati"],"a":0,"why":"Wiederholte Gewohnheit → imperfetto."},{"q":"Ieri sera ___ Marco alla festa di Anna: è simpatico!","options":["conoscevo","ho conosciuto"],"a":1,"why":"kennenlernen → passato prossimo von conoscere."},{"q":"Non ___ che fossi tornato: nessuno me l'aveva detto.","options":["sapevo","ho saputo"],"a":0,"why":"wissen (Zustand) → imperfetto."},{"q":"Solo stamattina ___ che Paolo si è sposato.","options":["sapevo","ho saputo"],"a":1,"why":"erfahren → passato prossimo von sapere."},{"q":"Era una giornata di sole e il cielo ___ azzurro.","options":["era","è stato"],"a":0,"why":"Beschreibung → imperfetto."},{"q":"___ chiamarti, ma non avevo il tuo numero.","options":["Volevo","Ho voluto"],"a":0,"why":"Absicht, nicht ausgeführt → volevo."},{"q":"All'improvviso ___ a piovere.","options":["cominciava","è cominciato"],"a":1,"why":"Plötzlich eintretendes Ereignis → passato prossimo."}]},{"type":"gap","title":"Passato remoto","task":"Setze das Verb ins passato remoto.","items":[{"q":"Quel giorno i soldati (partire) ___ all'alba.","a":["partirono","Partirono"],"de":"An jenem Tag brachen die Soldaten im Morgengrauen auf."},{"q":"Noi (arrivare) ___ a Napoli di notte.","a":["arrivammo","Arrivammo"],"de":"Wir kamen nachts in Neapel an."},{"q":"Il re (fare) ___ costruire un grande palazzo.","a":["fece","Fece"],"de":"Der König ließ einen großen Palast bauen."},{"q":"Lei (dire) ___ addio e se ne andò.","a":["disse","Disse"],"de":"Sie sagte Lebwohl und ging."},{"q":"Mio nonno (nascere) ___ in un piccolo paese di montagna.","a":["nacque","Nacque"],"de":"Mein Großvater wurde in einem kleinen Bergdorf geboren."},{"q":"Io non (sapere) ___ cosa rispondere.","a":["seppi","Seppi"],"de":"Ich wusste nicht, was ich antworten sollte."},{"q":"Tu (essere) ___ il primo a capirlo.","a":["fosti","Fosti"],"de":"Du warst der Erste, der es verstand."},{"q":"I due fratelli (avere) ___ una vita difficile.","a":["ebbero","Ebbero"],"de":"Die beiden Brüder hatten ein schweres Leben."},{"q":"Dopo la guerra la famiglia (venire) ___ a vivere in città.","a":["venne","Venne"],"de":"Nach dem Krieg zog die Familie in die Stadt."},{"q":"Voi (vedere) ___ subito il pericolo.","a":["vedeste","Vedeste"],"de":"Ihr saht die Gefahr sofort."}]},{"type":"choice","title":"Vorvergangenheit","task":"Wähle die passende Form.","items":[{"q":"Quando siamo arrivati al cinema, il film ___ già cominciato.","options":["è","era","fu"],"a":1,"why":"Vorzeitig zu einem vergangenen Ereignis → trapassato prossimo."},{"q":"Non sono andata alla festa perché non mi ___ invitata.","options":["ebbero","avevano","avranno"],"a":1,"why":"Die (Nicht-)Einladung lag vor dem Fest → trapassato prossimo."},{"q":"Ero stanchissimo perché ___ dormito male.","options":["ho","avevo","ebbi"],"a":1,"why":"Vorzeitig zum Zustand im imperfetto → trapassato prossimo."},{"q":"Gli ho restituito il libro che mi ___ prestato.","options":["aveva","ebbe","avrà"],"a":0,"why":"Das Leihen geschah vorher → trapassato prossimo."},{"q":"Mi ha detto che ___ già stata a Venezia.","options":["sarebbe","era","fu"],"a":1,"why":"Vorzeitigkeit in der indirekten Rede der Vergangenheit → trapassato prossimo."},{"q":"Dopo che ___ cenato, uscirono a fare una passeggiata.","options":["ebbero","hanno","avranno"],"a":0,"why":"dopo che + passato remoto im Hauptsatz → trapassato remoto."},{"q":"Appena ___ arrivato, telefonò alla madre.","options":["fu","è","sarà"],"a":0,"why":"appena + passato remoto im Hauptsatz → trapassato remoto."},{"q":"Quando ebbe letto la lettera, la ___.","options":["bruciò","ha bruciato","bruciava"],"a":0,"why":"Das trapassato remoto verlangt im Hauptsatz das passato remoto."}]},{"type":"gap","title":"Futur I und Futur II","task":"Setze das Verb ins Futur I (oder Futur II, wenn angegeben).","items":[{"q":"L'anno prossimo (noi – andare) ___ in Sicilia.","a":["andremo","Andremo"],"de":"Nächstes Jahr fahren wir nach Sizilien."},{"q":"Da lunedì (io – cercare) ___ un nuovo lavoro.","a":["cercherò","Cercherò"],"de":"Ab Montag suche ich mir eine neue Arbeit."},{"q":"Non so se Paolo (venire) ___ alla riunione.","a":["verrà","Verrà"],"de":"Ich weiß nicht, ob Paolo zur Besprechung kommt."},{"q":"Che ore sono? – Non so, (essere) ___ le dieci.","a":["saranno","Saranno"],"de":"Wie spät ist es? – Weiß nicht, es wird wohl zehn sein."},{"q":"Tu (pagare) ___ con la carta o in contanti?","a":["pagherai","Pagherai"],"de":"Wirst du mit Karte oder bar zahlen?"},{"q":"Se piove, (noi – rimanere) ___ a casa.","a":["rimarremo","Rimarremo"],"de":"Wenn es regnet, bleiben wir zu Hause."},{"q":"Quando (tu – finire, Futur II) ___ i compiti, potrai uscire.","a":["avrai finito","Avrai finito"],"de":"Wenn du deine Hausaufgaben gemacht hast, darfst du rausgehen."},{"q":"Marco non risponde: (lui – uscire, Futur II) ___.","a":["sarà uscito","Sarà uscito"],"de":"Marco antwortet nicht: Er wird wohl weggegangen sein."},{"q":"Paola non è ancora qui: (lei – perdere, Futur II) ___ il treno.","a":["avrà perso","avrà perduto","Avrà perso","Avrà perduto"],"de":"Paola ist noch nicht da: Sie wird wohl den Zug verpasst haben."},{"q":"Appena (loro – arrivare, Futur II) ___, cominceremo a mangiare.","a":["saranno arrivati","Saranno arrivati"],"de":"Sobald sie angekommen sind, fangen wir an zu essen."}]}],"cards":[{"f":"cercare / pagare – tu, noi (Präsens)","b":"cerchi, cerchiamo / paghi, paghiamo"},{"f":"mangiare / studiare – tu (Präsens)","b":"mangi / studi (nur ein i)"},{"f":"capire – Präsens","b":"capisco, capisci, capisce, capiamo, capite, capiscono"},{"f":"andare – Präsens","b":"vado, vai, va, andiamo, andate, vanno"},{"f":"fare – Präsens","b":"faccio, fai, fa, facciamo, fate, fanno"},{"f":"dire – Präsens","b":"dico, dici, dice, diciamo, dite, dicono"},{"f":"venire – Präsens","b":"vengo, vieni, viene, veniamo, venite, vengono"},{"f":"uscire – Präsens","b":"esco, esci, esce, usciamo, uscite, escono"},{"f":"volere / potere / dovere – io, noi","b":"voglio, vogliamo / posso, possiamo / devo, dobbiamo"},{"f":"sapere – Präsens","b":"so, sai, sa, sappiamo, sapete, sanno"},{"f":"rimanere / scegliere – io, loro","b":"rimango, rimangono / scelgo, scelgono"},{"f":"tradurre / porre – io","b":"traduco / pongo"},{"f":"„Ich wohne seit zwei Jahren hier.“","b":"Abito qui da due anni. (da + Präsens)"},{"f":"stare + Gerundium / stare per + Infinitiv","b":"gerade tun (sto leggendo) / gleich tun (sto per uscire)"},{"f":"essere – imperfetto","b":"ero, eri, era, eravamo, eravate, erano"},{"f":"fare / dire / bere – imperfetto (io)","b":"facevo / dicevo / bevevo"},{"f":"imperfetto – Gebrauch","b":"Zustand, Beschreibung, Gewohnheit, Hintergrund, Gleichzeitigkeit, höfliche Bitte (volevo …)"},{"f":"Partizip: prendere, mettere, chiudere","b":"preso, messo, chiuso"},{"f":"Partizip: vedere, chiedere, rispondere, rimanere","b":"visto, chiesto, risposto, rimasto"},{"f":"Partizip: fare, dire, scrivere, leggere, rompere","b":"fatto, detto, scritto, letto, rotto"},{"f":"Partizip: vivere, nascere, morire, scegliere","b":"vissuto, nato, morto, scelto"},{"f":"Mit essere: welche Verben?","b":"Bewegung zu einem Ziel, Zustand/Zustandsänderung, reflexive Verben, piacere, costare, succedere …"},{"f":"finire: avere oder essere?","b":"Ho finito il libro (Objekt) – Il film è finito (ohne Objekt)"},{"f":"Angleichung bei avere – wann?","b":"Nur nach vorausgehendem lo, la, li, le, ne: Le ho viste."},{"f":"„Ich musste abreisen.“","b":"Sono dovuto/-a partire. (Hilfsverb des Infinitivs)"},{"f":"sapevo / ho saputo","b":"ich wusste / ich habe erfahren"},{"f":"conoscevo / ho conosciuto","b":"ich kannte / ich habe kennengelernt"},{"f":"parlare – passato remoto","b":"parlai, parlasti, parlò, parlammo, parlaste, parlarono"},{"f":"essere – passato remoto","b":"fui, fosti, fu, fummo, foste, furono"},{"f":"avere – passato remoto","b":"ebbi, avesti, ebbe, avemmo, aveste, ebbero"},{"f":"1-3-3-Regel (passato remoto)","b":"unregelmäßig nur in io, lui/lei, loro: feci, fece, fecero"},{"f":"passato remoto (io): dire, venire, vedere, nascere","b":"dissi, venni, vidi, nacqui"},{"f":"passato remoto (io): volere, sapere, stare, dare","b":"volli, seppi, stetti, diedi"},{"f":"passato remoto – Gebrauch","b":"abgeschlossen ohne Gegenwartsbezug: Literatur, Geschichte; mündlich v. a. in Süditalien"},{"f":"trapassato prossimo – Bildung","b":"avevo / ero + Partizip: avevo mangiato, ero partito"},{"f":"trapassato remoto – wann?","b":"Nach dopo che / appena / quando, wenn der Hauptsatz im passato remoto steht (schriftlich)"},{"f":"Futur I: andare, avere, essere, venire","b":"andrò, avrò, sarò, verrò"},{"f":"Futur I: volere, bere, rimanere, tenere","b":"vorrò, berrò, rimarrò, terrò"},{"f":"„Er wird wohl müde sein.“","b":"Sarà stanco. (Futur I = Vermutung)"},{"f":"„Sie wird wohl den Zug verpasst haben.“","b":"Avrà perso il treno. (Futur II = Vermutung über Vergangenes)"}],"id":"k11"},{"nr":12,"title":"Der congiuntivo","teil":"Das Verb und seine Ergänzungen","intro":"Der congiuntivo drückt Meinung, Wunsch, Gefühl, Zweifel und Möglichkeit aus und ist in gepflegtem Italienisch unverzichtbar. Hier lernst du alle vier Zeiten, ihre Auslöser und das Zeitgefüge.","sections":[{"h":"Was ist der congiuntivo?","html":"<p>Der <em>congiuntivo<\/em> ist der Modus der Subjektivität: Er steht, wenn etwas nicht als Tatsache, sondern als Meinung, Wunsch, Gefühl, Möglichkeit oder Bedingung dargestellt wird. Er erscheint fast immer im Nebensatz nach <em>che<\/em> oder nach bestimmten Konjunktionen.<\/p><table><tr><th>Zeit<\/th><th>Beispiel (parlare)<\/th><\/tr><tr><td><em>presente<\/em><\/td><td><em>che io parli<\/em><\/td><\/tr><tr><td><em>passato<\/em><\/td><td><em>che io abbia parlato<\/em><\/td><\/tr><tr><td><em>imperfetto<\/em><\/td><td><em>che io parlassi<\/em><\/td><\/tr><tr><td><em>trapassato<\/em><\/td><td><em>che io avessi parlato<\/em><\/td><\/tr><\/table><div class=\"tip\">Der italienische <em>congiuntivo<\/em> hat mit dem deutschen Konjunktiv wenig zu tun. Im Deutschen steht meist der Indikativ: <em>Penso che sia tardi.<\/em> – Ich glaube, es <b>ist<\/b> spät.<\/div>"},{"h":"congiuntivo presente: regelmäßige Formen","html":"<p>Verben auf <em>-are<\/em> bekommen die Endung <em>-i<\/em>, Verben auf <em>-ere<\/em> und <em>-ire<\/em> die Endung <em>-a<\/em>. Die <em>-isc-<\/em>-Verben behalten ihr <em>-isc-<\/em> im Singular und in der 3. Person Plural.<\/p><table><tr><th><\/th><th>lavorare<\/th><th>scrivere<\/th><th>aprire / capire<\/th><\/tr><tr><td>io<\/td><td><em>lavori<\/em><\/td><td><em>scriva<\/em><\/td><td><em>apra / capisca<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>lavori<\/em><\/td><td><em>scriva<\/em><\/td><td><em>apra / capisca<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>lavori<\/em><\/td><td><em>scriva<\/em><\/td><td><em>apra / capisca<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>lavoriamo<\/em><\/td><td><em>scriviamo<\/em><\/td><td><em>apriamo / capiamo<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>lavoriate<\/em><\/td><td><em>scriviate<\/em><\/td><td><em>apriate / capiate<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>lavorino<\/em><\/td><td><em>scrivano<\/em><\/td><td><em>aprano / capiscano<\/em><\/td><\/tr><\/table><ul><li>Die drei Singularformen sind gleich – deshalb steht oft das Subjektpronomen: <em>Credo che tu abbia ragione.<\/em><\/li><li><em>noi<\/em> ist identisch mit dem Indikativ Präsens: <em>(che) lavoriamo<\/em>.<\/li><li><em>-care/-gare<\/em> behalten den harten Laut: <em>cerchi, paghi, giochiamo<\/em>.<\/li><li><em>-iare<\/em> mit unbetontem i: nur ein <em>i<\/em>: <em>mangi, studi, cominci<\/em>.<\/li><\/ul><div class=\"warn\">Achtung: Die Endung ist bei <em>-are<\/em>-Verben <em>-i<\/em>, nicht <em>-a<\/em>! Also <em>che lui lavori<\/em>, nicht <em>*che lui lavora<\/em> und nicht <em>*lavoria<\/em>.<\/div>"},{"h":"congiuntivo presente: unregelmäßige Formen","html":"<p>Viele unregelmäßige Formen lassen sich aus der <em>io<\/em>-Form des Indikativ Präsens ableiten: <em>vengo → venga, esco → esca, dico → dica, bevo → beva<\/em>. <em>noi<\/em> entspricht dem Indikativ, <em>voi<\/em> hängt <em>-iate<\/em> an den <em>noi<\/em>-Stamm.<\/p><table><tr><th>Infinitiv<\/th><th>io/tu/lui<\/th><th>noi / voi<\/th><th>loro<\/th><\/tr><tr><td>essere<\/td><td><em>sia<\/em><\/td><td><em>siamo / siate<\/em><\/td><td><em>siano<\/em><\/td><\/tr><tr><td>avere<\/td><td><em>abbia<\/em><\/td><td><em>abbiamo / abbiate<\/em><\/td><td><em>abbiano<\/em><\/td><\/tr><tr><td>andare<\/td><td><em>vada<\/em><\/td><td><em>andiamo / andiate<\/em><\/td><td><em>vadano<\/em><\/td><\/tr><tr><td>fare<\/td><td><em>faccia<\/em><\/td><td><em>facciamo / facciate<\/em><\/td><td><em>facciano<\/em><\/td><\/tr><tr><td>dare<\/td><td><em>dia<\/em><\/td><td><em>diamo / diate<\/em><\/td><td><em>diano<\/em><\/td><\/tr><tr><td>stare<\/td><td><em>stia<\/em><\/td><td><em>stiamo / stiate<\/em><\/td><td><em>stiano<\/em><\/td><\/tr><tr><td>dire<\/td><td><em>dica<\/em><\/td><td><em>diciamo / diciate<\/em><\/td><td><em>dicano<\/em><\/td><\/tr><tr><td>venire<\/td><td><em>venga<\/em><\/td><td><em>veniamo / veniate<\/em><\/td><td><em>vengano<\/em><\/td><\/tr><tr><td>uscire<\/td><td><em>esca<\/em><\/td><td><em>usciamo / usciate<\/em><\/td><td><em>escano<\/em><\/td><\/tr><tr><td>potere<\/td><td><em>possa<\/em><\/td><td><em>possiamo / possiate<\/em><\/td><td><em>possano<\/em><\/td><\/tr><tr><td>volere<\/td><td><em>voglia<\/em><\/td><td><em>vogliamo / vogliate<\/em><\/td><td><em>vogliano<\/em><\/td><\/tr><tr><td>dovere<\/td><td><em>debba<\/em><\/td><td><em>dobbiamo / dobbiate<\/em><\/td><td><em>debbano<\/em><\/td><\/tr><tr><td>sapere<\/td><td><em>sappia<\/em><\/td><td><em>sappiamo / sappiate<\/em><\/td><td><em>sappiano<\/em><\/td><\/tr><tr><td>bere<\/td><td><em>beva<\/em><\/td><td><em>beviamo / beviate<\/em><\/td><td><em>bevano<\/em><\/td><\/tr><tr><td>rimanere<\/td><td><em>rimanga<\/em><\/td><td><em>rimaniamo / rimaniate<\/em><\/td><td><em>rimangano<\/em><\/td><\/tr><tr><td>tenere<\/td><td><em>tenga<\/em><\/td><td><em>teniamo / teniate<\/em><\/td><td><em>tengano<\/em><\/td><\/tr><tr><td>scegliere<\/td><td><em>scelga<\/em><\/td><td><em>scegliamo / scegliate<\/em><\/td><td><em>scelgano<\/em><\/td><\/tr><\/table><p>Ebenso: <em>porre → ponga<\/em>, <em>salire → salga<\/em>, <em>tradurre → traduca<\/em>, <em>piacere → piaccia<\/em>, <em>morire → muoia<\/em>.<\/p><div class=\"tip\">Die Höflichkeitsform des Imperativs (<em>Lei<\/em>) ist genau dieser <em>congiuntivo<\/em>: <em>Venga pure! Mi dica! Faccia con calma!<\/em> Wer die <em>Lei<\/em>-Befehle kennt, kennt schon die Singularformen.<\/div>"},{"h":"Gebrauch: Meinung, Wille, Wunsch","html":"<p>Nach Verben, die eine <b>persönliche Meinung<\/b> oder einen <b>Willen<\/b> ausdrücken, steht im <em>che<\/em>-Satz der <em>congiuntivo<\/em>.<\/p><ul><li>Meinung/Annahme: <em>penso, credo, ritengo, suppongo, immagino che<\/em>; <em>mi sembra / mi pare che<\/em><\/li><li>Wollen/Wünschen/Erlauben: <em>voglio, preferisco, spero, desidero, chiedo, permetto, lascio che<\/em><\/li><\/ul><p><em>Penso che il negozio chiuda alle sette.<\/em> <small>Ich glaube, der Laden schließt um sieben.<\/small><br><em>Mi pare che Elisa non stia molto bene.<\/em> <small>Mir scheint, Elisa geht es nicht sehr gut.<\/small><br><em>Preferisco che mi scriviate una mail.<\/em> <small>Mir ist lieber, ihr schreibt mir eine Mail.<\/small><br><em>Spero che il treno non abbia ritardo.<\/em> <small>Ich hoffe, der Zug hat keine Verspätung.<\/small><\/p><div class=\"warn\">Achtung: Nicht jeder <em>che<\/em>-Satz verlangt den <em>congiuntivo<\/em>. Bei Gewissheit steht der Indikativ: <em>So che<\/em>, <em>sono sicuro che<\/em>, <em>è vero che<\/em>, <em>vedo che<\/em>, <em>dico che<\/em> + Indikativ: <em>So che Elisa sta male.<\/em><\/div><div class=\"tip\">Verneinte Gewissheit kippt in den Zweifel: <em>Non è vero che Elisa stia male.<\/em> – <em>Non sono sicuro che venga.<\/em><\/div>"},{"h":"Gebrauch: Gefühl, Zweifel, unpersönliche Ausdrücke","html":"<ul><li>Gefühl: <em>sono contento che, mi dispiace che, ho paura che, temo che, mi fa piacere che, mi stupisce che<\/em><\/li><li>Zweifel: <em>dubito che, non sono sicuro che, non credo che<\/em><\/li><li>Unpersönlich: <em>è importante / necessario / possibile / probabile / meglio / strano / un peccato che<\/em>; <em>bisogna che, occorre che, basta che, sembra che, può darsi che<\/em><\/li><\/ul><p><em>Mi fa piacere che tu rimanga ancora un giorno.<\/em> <small>Es freut mich, dass du noch einen Tag bleibst.<\/small><br><em>Dubito che il pacco arrivi prima di lunedì.<\/em> <small>Ich bezweifle, dass das Paket vor Montag ankommt.<\/small><br><em>Bisogna che qualcuno porti fuori il cane.<\/em> <small>Jemand muss den Hund rausbringen.<\/small><br><em>Può darsi che stasera nevichi.<\/em> <small>Es kann sein, dass es heute Abend schneit.<\/small><\/p><div class=\"warn\">Achtung: Unpersönliche Ausdrücke der <b>Gewissheit<\/b> stehen mit Indikativ: <em>È chiaro / evidente / certo / ovvio che il progetto è in ritardo.<\/em><\/div><div class=\"tip\">Bei <em>non so se …<\/em> und <em>mi chiedo se …<\/em> ist beides möglich; der <em>congiuntivo<\/em> klingt gepflegter: <em>Non so se sia una buona idea.<\/em><\/div>"},{"h":"Infinitiv statt congiuntivo","html":"<p>Haben Haupt- und Nebensatz <b>dasselbe Subjekt<\/b>, steht statt <em>che<\/em> + <em>congiuntivo<\/em> der Infinitiv – meist mit <em>di<\/em>, nach <em>volere, preferire, desiderare<\/em> ohne Präposition.<\/p><table><tr><th>gleiches Subjekt<\/th><th>verschiedenes Subjekt<\/th><\/tr><tr><td><em>Penso di partire domani.<\/em><br><small>Ich denke, ich fahre morgen.<\/small><\/td><td><em>Penso che Ugo parta domani.<\/em><br><small>… dass Ugo morgen fährt.<\/small><\/td><\/tr><tr><td><em>Voglio cambiare casa.<\/em><\/td><td><em>Voglio che tu cambi casa.<\/em><\/td><\/tr><tr><td><em>Sono felice di essere qui.<\/em><\/td><td><em>Sono felice che voi siate qui.<\/em><\/td><\/tr><tr><td><em>Spero di trovare un parcheggio.<\/em><\/td><td><em>Spero che Lia trovi un parcheggio.<\/em><\/td><\/tr><\/table><p>Bei unpersönlichen Ausdrücken steht der Infinitiv ohne Präposition, wenn die Aussage allgemein gilt: <em>È importante dormire bene.<\/em> <small>Es ist wichtig, gut zu schlafen.<\/small> – aber: <em>È importante che tu dorma bene.<\/em> <small>… dass du gut schläfst.<\/small><\/p><div class=\"warn\">Achtung: <em>*Voglio che io vada<\/em> oder <em>*Penso che io parta<\/em> sind falsch – bei gleichem Subjekt immer Infinitiv!<\/div>"},{"h":"Gebrauch: nach Konjunktionen","html":"<p>Eine Reihe von Konjunktionen verlangt immer den <em>congiuntivo<\/em>:<\/p><table><tr><th>Konjunktion<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>benché, sebbene, nonostante (che), malgrado<\/em><\/td><td>obwohl<\/td><\/tr><tr><td><em>affinché, perché<\/em><\/td><td>damit<\/td><\/tr><tr><td><em>prima che<\/em><\/td><td>bevor<\/td><\/tr><tr><td><em>senza che<\/em><\/td><td>ohne dass<\/td><\/tr><tr><td><em>a meno che (non)<\/em><\/td><td>es sei denn<\/td><\/tr><tr><td><em>purché, a condizione che, a patto che<\/em><\/td><td>vorausgesetzt, dass<\/td><\/tr><tr><td><em>nel caso (che), qualora<\/em><\/td><td>falls<\/td><\/tr><tr><td><em>chiunque, qualunque, ovunque<\/em><\/td><td>wer/was/wo auch immer<\/td><\/tr><\/table><p><em>Benché sia stanca, Carla va in palestra.<\/em> <small>Obwohl sie müde ist, geht Carla ins Fitnessstudio.<\/small><br><em>Ti mando la mappa perché tu non ti perda.<\/em> <small>Ich schicke dir die Karte, damit du dich nicht verläufst.<\/small><br><em>Usciamo, a meno che non piova.<\/em> <small>Wir gehen raus, es sei denn, es regnet.<\/small><br><em>Nel caso tu abbia domande, chiamami.<\/em> <small>Falls du Fragen hast, ruf mich an.<\/small><\/p><div class=\"warn\">Achtung: <em>perché<\/em> = <b>weil<\/b> → Indikativ (<em>Resto a casa perché sono malato.<\/em>); <em>perché<\/em> = <b>damit<\/b> → <em>congiuntivo<\/em>. Und <em>dopo che<\/em> (nachdem) steht mit Indikativ!<\/div><div class=\"tip\">Bei gleichem Subjekt: <em>prima di<\/em> / <em>senza<\/em> + Infinitiv: <em>Mi lavo le mani prima di mangiare.<\/em> – <em>Esce senza salutare.<\/em><\/div>"},{"h":"Relativsätze, Superlativ, indirekte Frage, Hauptsatz","html":"<p><b>Relativsatz<\/b> mit gesuchter, gewünschter oder nicht vorhandener Eigenschaft:<\/p><p><em>Cerco un appartamento che abbia un balcone.<\/em> <small>Ich suche eine Wohnung, die einen Balkon hat.<\/small><br><em>Non c'è nessuno che sappia riparare questa radio.<\/em> <small>Es gibt niemanden, der dieses Radio reparieren kann.<\/small><br>Aber Tatsache: <em>Ho trovato un appartamento che ha un balcone.<\/em> <small>Ich habe eine Wohnung gefunden, die einen Balkon hat.<\/small><\/p><p><b>Nach Superlativ<\/b> und <em>l'unico, il solo, il primo, l'ultimo<\/em>: <em>È la torta più buona che io abbia mai mangiato.<\/em> <small>Das ist der beste Kuchen, den ich je gegessen habe.<\/small><br><em>Sei l'unica persona che mi capisca.<\/em> <small>Du bist der einzige Mensch, der mich versteht.<\/small><\/p><p><b>Indirekte Frage<\/b> (gehoben): <em>Non so chi abbia preso le chiavi.<\/em> <small>Ich weiß nicht, wer die Schlüssel genommen hat.<\/small> – umgangssprachlich auch Indikativ.<\/p><p><b>Im Hauptsatz<\/b>: Vermutung, Aufforderung, Wunsch: <em>Che sia già arrivato?<\/em> <small>Ob er wohl schon angekommen ist?<\/small><br><em>Che entri pure!<\/em> <small>Er soll ruhig hereinkommen!<\/small><br><em>Che Dio ti benedica!<\/em> <small>Gott segne dich!<\/small><\/p>"},{"h":"congiuntivo passato","html":"<p><b>Bildung:<\/b> <em>congiuntivo presente<\/em> von <em>avere<\/em> oder <em>essere<\/em> + Partizip Perfekt. Bei <em>essere<\/em> wird das Partizip angeglichen.<\/p><table><tr><th><\/th><th>mangiare<\/th><th>arrivare<\/th><\/tr><tr><td>io/tu/lui<\/td><td><em>abbia mangiato<\/em><\/td><td><em>sia arrivato/-a<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>abbiamo mangiato<\/em><\/td><td><em>siamo arrivati/-e<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>abbiate mangiato<\/em><\/td><td><em>siate arrivati/-e<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>abbiano mangiato<\/em><\/td><td><em>siano arrivati/-e<\/em><\/td><\/tr><\/table><p><b>Gebrauch:<\/b> Die Handlung im Nebensatz liegt <b>vor<\/b> der des Hauptsatzes, der im Präsens (oder Futur/Imperativ) steht.<\/p><table><tr><th>Hauptsatz (Präsens)<\/th><th>Nebensatz<\/th><th>Zeitverhältnis<\/th><\/tr><tr><td><em>Credo che<\/em><\/td><td><em>Rita esca.<\/em><\/td><td>gleichzeitig<\/td><\/tr><tr><td><em>Credo che<\/em><\/td><td><em>Rita esca domani.<\/em><\/td><td>nachzeitig<\/td><\/tr><tr><td><em>Credo che<\/em><\/td><td><em>Rita sia uscita.<\/em><\/td><td>vorzeitig<\/td><\/tr><\/table><p><em>Mi dispiace che tu non abbia trovato i biglietti.<\/em> <small>Es tut mir leid, dass du die Karten nicht bekommen hast.<\/small><\/p>"},{"h":"congiuntivo imperfetto: Formen","html":"<p>Stamm des Indikativ Imperfekt (<em>parla-vo, prende-vo, dormi-vo<\/em>) + Endungen <em>-ssi, -ssi, -sse, -ssimo, -ste, -ssero<\/em>.<\/p><table><tr><th><\/th><th>parlare<\/th><th>prendere<\/th><th>dormire<\/th><\/tr><tr><td>io<\/td><td><em>parlassi<\/em><\/td><td><em>prendessi<\/em><\/td><td><em>dormissi<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>parlassi<\/em><\/td><td><em>prendessi<\/em><\/td><td><em>dormissi<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>parlasse<\/em><\/td><td><em>prendesse<\/em><\/td><td><em>dormisse<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>parlassimo<\/em><\/td><td><em>prendessimo<\/em><\/td><td><em>dormissimo<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>parlaste<\/em><\/td><td><em>prendeste<\/em><\/td><td><em>dormiste<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>parlassero<\/em><\/td><td><em>prendessero<\/em><\/td><td><em>dormissero<\/em><\/td><\/tr><\/table><p><b>Unregelmäßig<\/b> (wenige!):<\/p><table><tr><th>Infinitiv<\/th><th>io<\/th><th>loro<\/th><\/tr><tr><td>essere<\/td><td><em>fossi<\/em><\/td><td><em>fossero<\/em><\/td><\/tr><tr><td>dare<\/td><td><em>dessi<\/em><\/td><td><em>dessero<\/em><\/td><\/tr><tr><td>stare<\/td><td><em>stessi<\/em><\/td><td><em>stessero<\/em><\/td><\/tr><tr><td>fare<\/td><td><em>facessi<\/em><\/td><td><em>facessero<\/em><\/td><\/tr><tr><td>dire<\/td><td><em>dicessi<\/em><\/td><td><em>dicessero<\/em><\/td><\/tr><tr><td>bere<\/td><td><em>bevessi<\/em><\/td><td><em>bevessero<\/em><\/td><\/tr><tr><td>tradurre / porre<\/td><td><em>traducessi / ponessi<\/em><\/td><td><em>traducessero / ponessero<\/em><\/td><\/tr><\/table><div class=\"tip\"><em>avere<\/em> ist regelmäßig: <em>avessi<\/em>. <em>fare, dire, bere<\/em> folgen ihrem langen Imperfektstamm: <em>facevo → facessi<\/em>.<\/div><div class=\"warn\">Achtung: <em>voi<\/em> endet auf <em>-ste<\/em> mit nur einem s: <em>(che) voi foste, parlaste<\/em> – genau wie im <em>passato remoto<\/em>.<\/div>"},{"h":"congiuntivo imperfetto: Gebrauch","html":"<ul><li>Hauptsatz in einer <b>Vergangenheitszeit<\/b>, Nebensatz gleichzeitig oder nachzeitig: <em>Pensavo che fossi in ufficio.<\/em> <small>Ich dachte, du wärst im Büro.<\/small><\/li><li>Hauptsatz im <b>Konditional<\/b>: <em>Vorrei che mi accompagnassi.<\/em> <small>Ich möchte, dass du mich begleitest.<\/small> – <em>Sarebbe meglio che partissimo presto.<\/em> <small>Es wäre besser, wenn wir früh losfahren.<\/small><\/li><li><em>magari<\/em> + <em>congiuntivo imperfetto<\/em> = unerfüllbarer Wunsch: <em>Magari avessi un giardino!<\/em> <small>Hätte ich doch einen Garten!<\/small><\/li><li><em>come se<\/em> (als ob) – immer <em>congiuntivo<\/em>: <em>Mi tratta come se fossi un bambino.<\/em> <small>Er behandelt mich, als ob ich ein Kind wäre.<\/small><\/li><li>Irreale Bedingung der Gegenwart: <em>Se avessi tempo, imparerei a suonare il piano.<\/em> <small>Wenn ich Zeit hätte, würde ich Klavier lernen.<\/small><\/li><\/ul><table><tr><th>Hauptsatz (Vergangenheit)<\/th><th>Nebensatz<\/th><th>Verhältnis<\/th><\/tr><tr><td><em>Credevo che<\/em><\/td><td><em>Rita uscisse.<\/em><\/td><td>gleichzeitig<\/td><\/tr><tr><td><em>Credevo che<\/em><\/td><td><em>Rita fosse uscita.<\/em><\/td><td>vorzeitig<\/td><\/tr><tr><td><em>Credevo che<\/em><\/td><td><em>Rita sarebbe uscita.<\/em><\/td><td>nachzeitig<\/td><\/tr><\/table><div class=\"warn\">Achtung: <em>*Vorrei che tu venga<\/em> ist falsch. Nach <em>vorrei che<\/em> steht immer der <em>congiuntivo imperfetto<\/em>: <em>Vorrei che tu venissi.<\/em><\/div>"},{"h":"congiuntivo trapassato","html":"<p><b>Bildung:<\/b> <em>congiuntivo imperfetto<\/em> von <em>avere/essere<\/em> + Partizip: <em>avessi visto, fossi andato/-a<\/em>.<\/p><table><tr><th><\/th><th>vedere<\/th><th>andare<\/th><\/tr><tr><td>io/tu<\/td><td><em>avessi visto<\/em><\/td><td><em>fossi andato/-a<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>avesse visto<\/em><\/td><td><em>fosse andato/-a<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>avessimo visto<\/em><\/td><td><em>fossimo andati/-e<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>aveste visto<\/em><\/td><td><em>foste andati/-e<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>avessero visto<\/em><\/td><td><em>fossero andati/-e<\/em><\/td><\/tr><\/table><ul><li>Vorzeitigkeit in der Vergangenheit: <em>Non sapevo che Teo avesse già venduto la moto.<\/em> <small>Ich wusste nicht, dass Teo das Motorrad schon verkauft hatte.<\/small><\/li><li>Irreale Bedingung der Vergangenheit: <em>Se fossimo partiti prima, avremmo trovato posto.<\/em> <small>Wären wir früher losgefahren, hätten wir Platz gefunden.<\/small><\/li><li>Bedauern mit <em>magari<\/em>: <em>Magari ti avessi ascoltato!<\/em> <small>Hätte ich doch auf dich gehört!<\/small><\/li><li><em>come se<\/em> + Vorzeitigkeit: <em>Parla come se non fosse successo niente.<\/em> <small>Er redet, als ob nichts passiert wäre.<\/small><\/li><\/ul>"},{"h":"Zeitgefüge im Überblick","html":"<p>Welche Zeit des <em>congiuntivo<\/em> im Nebensatz steht, hängt von der Zeit des Hauptsatzes und vom Zeitverhältnis ab.<\/p><table><tr><th>Hauptsatz<\/th><th>gleich-/nachzeitig<\/th><th>vorzeitig<\/th><\/tr><tr><td>Präsens, Futur, Imperativ<\/td><td><em>presente<\/em><br><em>…che venga<\/em><\/td><td><em>passato<\/em><br><em>…che sia venuto<\/em><\/td><\/tr><tr><td>Vergangenheit, Konditional<\/td><td><em>imperfetto<\/em><br><em>…che venisse<\/em><\/td><td><em>trapassato<\/em><br><em>…che fosse venuto<\/em><\/td><\/tr><\/table><p><em>Temo che non capisca.<\/em> <small>Ich fürchte, er versteht nicht.<\/small><br><em>Temo che non abbia capito.<\/em> <small>Ich fürchte, er hat nicht verstanden.<\/small><br><em>Temevo che non capisse.<\/em> <small>Ich fürchtete, er verstünde nicht.<\/small><br><em>Temevo che non avesse capito.<\/em> <small>Ich fürchtete, er hätte nicht verstanden.<\/small><\/p><div class=\"tip\">Nachzeitigkeit nach Vergangenheit wird oft mit dem <em>condizionale passato<\/em> ausgedrückt: <em>Ero sicuro che avrebbe vinto.<\/em> (siehe Kapitel 13)<\/div>"},{"h":"Indikativ oder congiuntivo? Kurzcheck","html":"<table><tr><th>Indikativ<\/th><th>congiuntivo<\/th><\/tr><tr><td><em>so che, è vero che, sono sicuro che<\/em><\/td><td><em>penso che, credo che, mi sembra che<\/em><\/td><\/tr><tr><td><em>è chiaro / certo che<\/em><\/td><td><em>è possibile / importante che<\/em><\/td><\/tr><tr><td><em>perché<\/em> = weil<\/td><td><em>perché<\/em> = damit<\/td><\/tr><tr><td><em>dopo che<\/em>, <em>quando<\/em>, <em>mentre<\/em><\/td><td><em>prima che<\/em>, <em>senza che<\/em>, <em>benché<\/em><\/td><\/tr><tr><td><em>Ho una casa che ha…<\/em><\/td><td><em>Cerco una casa che abbia…<\/em><\/td><\/tr><tr><td><em>se<\/em> (reale Bedingung)<\/td><td><em>se<\/em> (irreale Bedingung), <em>come se<\/em><\/td><\/tr><\/table><div class=\"warn\">Achtung: Gerade <em>penso/credo che<\/em> + Indikativ ist ein klassischer Lernerfehler. Merke den Satz <em>Credo che sia così.<\/em> als Muster.<\/div>"}],"exercises":[{"type":"gap","title":"congiuntivo presente: regelmäßige Verben","task":"Setze den congiuntivo presente ein.","items":[{"q":"Penso che Giulia (lavorare) ___ troppo.","a":["lavori"],"de":"Ich glaube, Giulia arbeitet zu viel."},{"q":"È importante che voi (prendere) ___ le medicine ogni giorno.","a":["prendiate"],"de":"Es ist wichtig, dass ihr die Medikamente jeden Tag nehmt."},{"q":"Spero che i bambini (dormire) ___ bene stanotte.","a":["dormano"],"de":"Ich hoffe, die Kinder schlafen heute Nacht gut."},{"q":"Bisogna che tu (finire) ___ il progetto entro venerdì.","a":["finisca"],"de":"Du musst das Projekt bis Freitag fertigstellen."},{"q":"Mi sembra che loro non (capire) ___ il problema.","a":["capiscano"],"de":"Mir scheint, sie verstehen das Problem nicht."},{"q":"Voglio che tu (pagare) ___ con la carta.","a":["paghi"],"de":"Ich will, dass du mit Karte bezahlst."},{"q":"È meglio che noi (cercare) ___ un albergo vicino alla stazione.","a":["cerchiamo"],"de":"Es ist besser, wenn wir ein Hotel in Bahnhofsnähe suchen."},{"q":"Dubito che Paolo (studiare) ___ abbastanza.","a":["studi"],"de":"Ich bezweifle, dass Paolo genug lernt."},{"q":"Preferisco che voi (aprire) ___ la finestra.","a":["apriate"],"de":"Mir ist lieber, ihr öffnet das Fenster."}]},{"type":"gap","title":"congiuntivo presente: unregelmäßige Verben","task":"Setze die unregelmäßige Form des congiuntivo presente ein.","items":[{"q":"Credo che Marta (essere) ___ in ufficio.","a":["sia"],"de":"Ich glaube, Marta ist im Büro."},{"q":"Spero che voi (avere) ___ un buon viaggio.","a":["abbiate"],"de":"Ich hoffe, ihr habt eine gute Reise."},{"q":"È meglio che tu (andare) ___ dal medico.","a":["vada"],"de":"Es ist besser, wenn du zum Arzt gehst."},{"q":"Non voglio che i bambini (fare) ___ rumore.","a":["facciano"],"de":"Ich will nicht, dass die Kinder Lärm machen."},{"q":"Bisogna che qualcuno ci (dare) ___ una mano.","a":["dia"],"de":"Jemand muss uns helfen."},{"q":"Mi pare che Luca non (stare) ___ bene.","a":["stia"],"de":"Mir scheint, Luca geht es nicht gut."},{"q":"Voglio che tu mi (dire) ___ la verità.","a":["dica"],"de":"Ich will, dass du mir die Wahrheit sagst."},{"q":"Speriamo che i nonni (venire) ___ a Natale.","a":["vengano"],"de":"Hoffen wir, dass die Großeltern an Weihnachten kommen."},{"q":"È possibile che noi (uscire) ___ più tardi.","a":["usciamo"],"de":"Es ist möglich, dass wir später ausgehen."},{"q":"Non credo che Anna (sapere) ___ guidare.","a":["sappia"],"de":"Ich glaube nicht, dass Anna Auto fahren kann."}]},{"type":"choice","title":"Indikativ oder congiuntivo?","task":"Wähle die richtige Form.","items":[{"q":"So che Franco ___ a Torino.","options":["abita","abiti"],"a":0,"why":"sapere che drückt Gewissheit aus → Indikativ."},{"q":"Penso che Franco ___ a Torino.","options":["abita","abiti"],"a":1,"why":"pensare che drückt eine Meinung aus → congiuntivo."},{"q":"È chiaro che tu ___ ragione.","options":["hai","abbia"],"a":0,"why":"È chiaro che = Gewissheit → Indikativ."},{"q":"È possibile che tu ___ ragione.","options":["hai","abbia"],"a":1,"why":"È possibile che = Möglichkeit → congiuntivo."},{"q":"Sono sicura che domani ___ bel tempo.","options":["fa","faccia"],"a":0,"why":"sono sicuro che = Gewissheit → Indikativ."},{"q":"Ho paura che domani ___ brutto tempo.","options":["fa","faccia"],"a":1,"why":"Nach Ausdrücken der Furcht steht der congiuntivo."},{"q":"Esco un attimo perché ___ bisogno d'aria.","options":["ho","abbia"],"a":0,"why":"perché = weil (Grund) → Indikativ."},{"q":"Ti lascio le chiavi perché tu ___ entrare.","options":["puoi","possa"],"a":1,"why":"perché = damit (Zweck) → congiuntivo."},{"q":"Dopo che i bambini ___ a letto, possiamo parlare.","options":["sono andati","siano andati"],"a":0,"why":"dopo che steht mit Indikativ."}]},{"type":"choice","title":"congiuntivo oder Infinitiv?","task":"Achte auf das Subjekt (Hinweis in Klammern) und wähle.","items":[{"q":"Penso ___ domani. (Ich reise ab.)","options":["di partire","che parta"],"a":0,"why":"Gleiches Subjekt (io – io) → di + Infinitiv."},{"q":"Penso ___ domani. (Mein Bruder reist ab.)","options":["di partire","che mio fratello parta"],"a":1,"why":"Verschiedene Subjekte → che + congiuntivo."},{"q":"Marco vuole ___ in montagna. (Marco selbst fährt.)","options":["andare","che vada"],"a":0,"why":"Gleiches Subjekt nach volere → Infinitiv ohne Präposition."},{"q":"Marco vuole ___ in montagna con lui. (Seine Frau soll mitfahren.)","options":["che sua moglie vada","sua moglie andare"],"a":0,"why":"Anderes Subjekt → che + congiuntivo."},{"q":"Sono contenta ___ qui con voi. (Ich bin hier.)","options":["di essere","che io sia"],"a":0,"why":"Gleiches Subjekt → di + Infinitiv."},{"q":"Sono contenta ___ qui con noi. (Ihr seid hier.)","options":["di essere","che voi siate"],"a":1,"why":"Verschiedene Subjekte → che + congiuntivo."},{"q":"Prima ___, chiudo il gas. (Ich gehe aus dem Haus.)","options":["di uscire","che esca"],"a":0,"why":"Gleiches Subjekt → prima di + Infinitiv."},{"q":"Prima ___, controllo le loro giacche. (Die Kinder gehen raus.)","options":["di uscire i bambini","che i bambini escano"],"a":1,"why":"Verschiedene Subjekte → prima che + congiuntivo."},{"q":"È importante ___ molta acqua. (allgemein gültig)","options":["bere","di bere"],"a":0,"why":"Nach è importante steht der Infinitiv ohne Präposition."}]},{"type":"choice","title":"Konjunktionen mit congiuntivo","task":"Wähle die Konjunktion, die zur deutschen Bedeutung passt.","items":[{"q":"Esco a correre ___ piova. (obwohl es regnet)","options":["benché","affinché","prima che"],"a":0,"why":"benché = obwohl."},{"q":"Parlo piano ___ il bambino non si svegli. (damit)","options":["affinché","benché","a meno che"],"a":0,"why":"affinché = damit."},{"q":"Torniamo a casa ___ faccia buio. (bevor)","options":["prima che","sebbene","purché"],"a":0,"why":"prima che = bevor."},{"q":"Ti presto la macchina, ___ tu me la riporti stasera. (vorausgesetzt dass)","options":["purché","senza che","sebbene"],"a":0,"why":"purché = vorausgesetzt dass."},{"q":"Esce di casa ___ i genitori lo sappiano. (ohne dass)","options":["senza che","affinché","nel caso che"],"a":0,"why":"senza che = ohne dass."},{"q":"Domani andiamo al lago, ___ non piova. (es sei denn)","options":["a meno che","affinché","benché"],"a":0,"why":"a meno che (non) = es sei denn."},{"q":"___ tu abbia bisogno di aiuto, chiamami. (falls)","options":["Nel caso che","Benché","Senza che"],"a":0,"why":"nel caso che = falls."},{"q":"Te lo ripeto ___ tu lo capisca bene. (damit)","options":["perché","benché","a meno che"],"a":0,"why":"perché mit congiuntivo bedeutet damit."},{"q":"___ io sappia, il museo è chiuso il lunedì. (soviel)","options":["Che","Purché","Prima che"],"a":0,"why":"Che io sappia = soviel ich weiß (feste Wendung mit congiuntivo)."}]},{"type":"gap","title":"congiuntivo passato","task":"Setze den congiuntivo passato ein.","items":[{"q":"Penso che Laura (partire) ___ ieri.","a":["sia partita"],"de":"Ich glaube, Laura ist gestern abgereist."},{"q":"Mi dispiace che voi non (potere) ___ venire.","a":["abbiate potuto","siate potuti","siate potute"],"de":"Es tut mir leid, dass ihr nicht kommen konntet."},{"q":"È strano che Marco non ci (telefonare) ___ .","a":["abbia telefonato"],"de":"Es ist seltsam, dass Marco uns nicht angerufen hat."},{"q":"Spero che i ragazzi (arrivare) ___ sani e salvi.","a":["siano arrivati"],"de":"Ich hoffe, die Jungs sind wohlbehalten angekommen."},{"q":"È il film più bello che io (vedere) ___ quest'anno.","a":["abbia visto","abbia veduto"],"de":"Das ist der schönste Film, den ich dieses Jahr gesehen habe."},{"q":"Credo che le ragazze (uscire) ___ un'ora fa.","a":["siano uscite"],"de":"Ich glaube, die Mädchen sind vor einer Stunde gegangen."},{"q":"Non sono sicuro che tu (capire) ___ bene la domanda.","a":["abbia capito"],"de":"Ich bin nicht sicher, ob du die Frage richtig verstanden hast."},{"q":"Sebbene noi (studiare) ___ molto, non siamo sicuri di superare l'esame.","a":["abbiamo studiato"],"de":"Obwohl wir viel gelernt haben, sind wir nicht sicher, die Prüfung zu bestehen."}]},{"type":"gap","title":"congiuntivo imperfetto","task":"Setze den congiuntivo imperfetto ein.","items":[{"q":"Pensavo che tu (essere) ___ in vacanza.","a":["fossi"],"de":"Ich dachte, du wärst im Urlaub."},{"q":"Volevo che voi (venire) ___ con noi.","a":["veniste"],"de":"Ich wollte, dass ihr mitkommt."},{"q":"Vorrei che Paolo mi (dire) ___ cosa pensa.","a":["dicesse"],"de":"Ich möchte, dass Paolo mir sagt, was er denkt."},{"q":"Magari (avere, io) ___ più tempo libero!","a":["avessi"],"de":"Hätte ich doch mehr Freizeit!"},{"q":"Parla come se (sapere, lui) ___ tutto.","a":["sapesse"],"de":"Er redet, als ob er alles wüsste."},{"q":"Sarebbe meglio che i bambini (bere) ___ meno bibite gassate.","a":["bevessero"],"de":"Es wäre besser, wenn die Kinder weniger Limonade tränken."},{"q":"Speravamo che tu ci (dare) ___ un passaggio.","a":["dessi"],"de":"Wir hofften, dass du uns mitnimmst."},{"q":"Non sapevo che Giorgio (fare) ___ il cuoco.","a":["facesse"],"de":"Ich wusste nicht, dass Giorgio Koch ist."},{"q":"Se (stare, noi) ___ più attenti, faremmo meno errori.","a":["stessimo"],"de":"Wenn wir aufmerksamer wären, würden wir weniger Fehler machen."}]},{"type":"choice","title":"Zeitgefüge","task":"Wähle die passende Zeit des congiuntivo.","items":[{"q":"Credo che ieri Luisa ___ dal dentista.","options":["sia andata","vada","fosse andata"],"a":0,"why":"Hauptsatz Präsens, Handlung vorzeitig → congiuntivo passato."},{"q":"Credevo che Luisa ___ ancora a casa.","options":["sia","fosse","sia stata"],"a":1,"why":"Hauptsatz Vergangenheit, gleichzeitig → congiuntivo imperfetto."},{"q":"Quando l'ho chiamata, credevo che Luisa ___ già.","options":["sia uscita","fosse uscita","esca"],"a":1,"why":"Vergangenheit, vorzeitig → congiuntivo trapassato."},{"q":"Spero che domani ___ il sole.","options":["ci sia","ci fosse","ci sia stato"],"a":0,"why":"Hauptsatz Präsens, nachzeitig → congiuntivo presente."},{"q":"Vorrei che domani ___ il sole.","options":["ci sia","ci fosse","ci sia stato"],"a":1,"why":"Hauptsatz im Konditional → congiuntivo imperfetto."},{"q":"Ho l'impressione che tu non mi ___ ascoltato.","options":["abbia","avessi"],"a":0,"why":"Hauptsatz Präsens, vorzeitig → congiuntivo passato."},{"q":"Era strano che nessuno ___ niente.","options":["dica","dicesse","abbia detto"],"a":1,"why":"Hauptsatz Vergangenheit, gleichzeitig → congiuntivo imperfetto."},{"q":"Se ___ prima, ti avrei aiutato.","options":["lo sappia","l'avessi saputo","lo sapessi"],"a":1,"why":"Irreale Bedingung der Vergangenheit → congiuntivo trapassato."},{"q":"Sarebbe bello se tu ___ con noi.","options":["venga","venissi","sia venuto"],"a":1,"why":"Irreale/mögliche Bedingung der Gegenwart → congiuntivo imperfetto."}]},{"type":"gap","title":"congiuntivo trapassato, magari, come se","task":"Setze den congiuntivo trapassato ein.","items":[{"q":"Se (sapere, io) ___ che eri in città, ti avrei chiamato.","a":["avessi saputo"],"de":"Hätte ich gewusst, dass du in der Stadt bist, hätte ich dich angerufen."},{"q":"Pensavo che voi (partire) ___ già.","a":["foste partiti","foste partite"],"de":"Ich dachte, ihr wärt schon abgereist."},{"q":"Magari (studiare, io) ___ di più da giovane!","a":["avessi studiato"],"de":"Hätte ich doch in jungen Jahren mehr gelernt!"},{"q":"Mi guardava come se (vedere, lui) ___ un fantasma.","a":["avesse visto","avesse veduto"],"de":"Er sah mich an, als hätte er ein Gespenst gesehen."},{"q":"Non sapevo che Elena (sposarsi) ___ l'anno prima.","a":["si fosse sposata"],"de":"Ich wusste nicht, dass Elena im Jahr davor geheiratet hatte."},{"q":"Se Luca (prendere) ___ il treno delle otto, sarebbe arrivato in tempo.","a":["avesse preso"],"de":"Hätte Luca den Zug um acht genommen, wäre er pünktlich angekommen."},{"q":"Benché (piovere) ___ tutta la notte, la mattina dopo siamo partiti.","a":["fosse piovuto","avesse piovuto"],"de":"Obwohl es die ganze Nacht geregnet hatte, sind wir am nächsten Morgen aufgebrochen."},{"q":"Era l'esperienza più bella che io (fare) ___ fino ad allora.","a":["avessi fatto"],"de":"Es war die schönste Erfahrung, die ich bis dahin gemacht hatte."}]}],"cards":[{"f":"parlare – congiuntivo presente","b":"parli, parli, parli, parliamo, parliate, parlino"},{"f":"prendere / dormire – congiuntivo presente (io)","b":"prenda / dorma"},{"f":"finire – congiuntivo presente","b":"finisca, finisca, finisca, finiamo, finiate, finiscano"},{"f":"essere – congiuntivo presente","b":"sia, sia, sia, siamo, siate, siano"},{"f":"avere – congiuntivo presente","b":"abbia, abbia, abbia, abbiamo, abbiate, abbiano"},{"f":"andare – congiuntivo presente","b":"vada, andiamo, andiate, vadano"},{"f":"fare / dare / stare – congiuntivo presente","b":"faccia / dia / stia"},{"f":"dire / venire / uscire – congiuntivo presente","b":"dica / venga / esca"},{"f":"potere / volere / dovere – congiuntivo presente","b":"possa / voglia / debba"},{"f":"sapere – congiuntivo presente","b":"sappia, sappiamo, sappiate, sappiano"},{"f":"bere / rimanere / tenere / scegliere – congiuntivo presente","b":"beva / rimanga / tenga / scelga"},{"f":"Eselsbrücke: unregelmäßiger congiuntivo presente","b":"von der io-Form des Präsens: vengo → venga, esco → esca, bevo → beva"},{"f":"Credo che … (Meinung)","b":"+ congiuntivo: Credo che sia vero."},{"f":"So che / è vero che / sono sicuro che","b":"+ Indikativ (Gewissheit)"},{"f":"è chiaro / è certo che","b":"+ Indikativ"},{"f":"è possibile / è importante / bisogna che","b":"+ congiuntivo"},{"f":"Ich hoffe, dass ich komme / dass du kommst","b":"Spero di venire. / Spero che tu venga."},{"f":"perché = weil / perché = damit","b":"weil → Indikativ; damit → congiuntivo"},{"f":"dopo che (nachdem)","b":"+ Indikativ (nicht congiuntivo!)"},{"f":"obwohl","b":"benché / sebbene / nonostante + congiuntivo"},{"f":"bevor (andere Person) / bevor (gleiche Person)","b":"prima che + congiuntivo / prima di + Infinitiv"},{"f":"ohne dass / es sei denn / vorausgesetzt dass / falls","b":"senza che / a meno che / purché / nel caso che"},{"f":"Ich suche jemanden, der Spanisch kann.","b":"Cerco qualcuno che sappia lo spagnolo."},{"f":"Superlativ + Relativsatz","b":"congiuntivo: il più bel posto che io abbia mai visto"},{"f":"Ob das wohl stimmt?","b":"Che sia vero?"},{"f":"congiuntivo passato – Bildung","b":"abbia / sia + Partizip: abbia letto, sia partito"},{"f":"congiuntivo imperfetto – parlare","b":"parlassi, parlassi, parlasse, parlassimo, parlaste, parlassero"},{"f":"essere – congiuntivo imperfetto","b":"fossi, fossi, fosse, fossimo, foste, fossero"},{"f":"dare / stare – congiuntivo imperfetto","b":"dessi / stessi"},{"f":"fare / dire / bere – congiuntivo imperfetto","b":"facessi / dicessi / bevessi"},{"f":"Hätte ich doch Zeit!","b":"Magari avessi tempo!"},{"f":"als ob","b":"come se + congiuntivo imperfetto/trapassato"},{"f":"vorrei che …","b":"+ congiuntivo imperfetto: Vorrei che tu restassi."},{"f":"congiuntivo trapassato – Bildung","b":"avessi / fossi + Partizip: avessi detto, fossi arrivato"},{"f":"Hätte ich es gewusst, wäre ich gekommen.","b":"Se l'avessi saputo, sarei venuto."},{"f":"Zeitgefüge: Hauptsatz Präsens","b":"gleich-/nachzeitig: cong. presente; vorzeitig: cong. passato"},{"f":"Zeitgefüge: Hauptsatz Vergangenheit/Konditional","b":"gleich-/nachzeitig: cong. imperfetto; vorzeitig: cong. trapassato"},{"f":"Soviel ich weiß …","b":"Che io sappia …"}],"id":"k12"},{"nr":13,"title":"Der condizionale","teil":"Das Verb und seine Ergänzungen","intro":"Der condizionale macht Bitten höflich, drückt Wünsche, Ratschläge und unbestätigte Nachrichten aus und bildet die Folge irrealer Bedingungen. Besonders wichtig: die Zukunft in der Vergangenheit, die anders funktioniert als im Deutschen.","sections":[{"h":"condizionale presente: regelmäßige Formen","html":"<p>Der <em>condizionale presente<\/em> entspricht meist dem deutschen <b>würde + Infinitiv<\/b> bzw. <b>hätte/wäre/könnte<\/b>. Er wird vom selben Stamm gebildet wie das Futur; bei <em>-are<\/em>-Verben wird das <em>a<\/em> zu <em>e<\/em>.<\/p><table><tr><th><\/th><th>guardare<\/th><th>leggere<\/th><th>partire / finire<\/th><\/tr><tr><td>io<\/td><td><em>guarderei<\/em><\/td><td><em>leggerei<\/em><\/td><td><em>partirei / finirei<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>guarderesti<\/em><\/td><td><em>leggeresti<\/em><\/td><td><em>partiresti / finiresti<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>guarderebbe<\/em><\/td><td><em>leggerebbe<\/em><\/td><td><em>partirebbe / finirebbe<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>guarderemmo<\/em><\/td><td><em>leggeremmo<\/em><\/td><td><em>partiremmo / finiremmo<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>guardereste<\/em><\/td><td><em>leggereste<\/em><\/td><td><em>partireste / finireste<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>guarderebbero<\/em><\/td><td><em>leggerebbero<\/em><\/td><td><em>partirebbero / finirebbero<\/em><\/td><\/tr><\/table><ul><li><em>-care/-gare<\/em>: <em>cercherei, pagherei<\/em> (mit h)<\/li><li><em>-ciare/-giare<\/em>: das i fällt weg: <em>comincerei, mangerei<\/em><\/li><li>Kein <em>-isc-<\/em>: <em>finirei, capirei<\/em><\/li><\/ul><div class=\"warn\">Achtung: <em>noi<\/em> hat im Konditional <b>zwei m<\/b>: <em>guarderemmo<\/em> (würden schauen) – im Futur nur eins: <em>guarderemo<\/em> (werden schauen). Beim Sprechen das Doppel-m deutlich halten!<\/div>"},{"h":"condizionale presente: unregelmäßige Formen","html":"<p>Alle Verben mit unregelmäßigem Futurstamm haben denselben Stamm im Konditional. Wer das Futur kann, kann den Konditional.<\/p><table><tr><th>Infinitiv<\/th><th>Futur<\/th><th>Konditional (io)<\/th><\/tr><tr><td>essere<\/td><td><em>sarò<\/em><\/td><td><em>sarei<\/em><\/td><\/tr><tr><td>avere<\/td><td><em>avrò<\/em><\/td><td><em>avrei<\/em><\/td><\/tr><tr><td>andare<\/td><td><em>andrò<\/em><\/td><td><em>andrei<\/em><\/td><\/tr><tr><td>fare / dare / stare<\/td><td><em>farò / darò / starò<\/em><\/td><td><em>farei / darei / starei<\/em><\/td><\/tr><tr><td>potere<\/td><td><em>potrò<\/em><\/td><td><em>potrei<\/em><\/td><\/tr><tr><td>dovere<\/td><td><em>dovrò<\/em><\/td><td><em>dovrei<\/em><\/td><\/tr><tr><td>sapere / vedere<\/td><td><em>saprò / vedrò<\/em><\/td><td><em>saprei / vedrei<\/em><\/td><\/tr><tr><td>vivere<\/td><td><em>vivrò<\/em><\/td><td><em>vivrei<\/em><\/td><\/tr><tr><td>volere<\/td><td><em>vorrò<\/em><\/td><td><em>vorrei<\/em><\/td><\/tr><tr><td>venire / tenere<\/td><td><em>verrò / terrò<\/em><\/td><td><em>verrei / terrei<\/em><\/td><\/tr><tr><td>rimanere<\/td><td><em>rimarrò<\/em><\/td><td><em>rimarrei<\/em><\/td><\/tr><tr><td>bere<\/td><td><em>berrò<\/em><\/td><td><em>berrei<\/em><\/td><\/tr><tr><td>tradurre / porre<\/td><td><em>tradurrò / porrò<\/em><\/td><td><em>tradurrei / porrei<\/em><\/td><\/tr><\/table><div class=\"tip\">Drei Gruppen: Stamm verkürzt (<em>andr-, potr-, dovr-, sapr-, vedr-, vivr-, avr-<\/em>), Doppel-r (<em>vorr-, verr-, terr-, rimarr-, berr-<\/em>) und Sonderfall <em>sar-<\/em>.<\/div>"},{"h":"Gebrauch: Höflichkeit, Wunsch, Rat","html":"<p><b>Höfliche Bitte<\/b> – besonders mit <em>potere, volere<\/em> und Fragen:<\/p><p><em>Vorrei due biglietti per lo spettacolo delle nove.<\/em> <small>Ich hätte gern zwei Karten für die Vorstellung um neun.<\/small><br><em>Potrebbe ripetere, per favore?<\/em> <small>Könnten Sie das bitte wiederholen?<\/small><br><em>Mi presteresti la tua bici?<\/em> <small>Würdest du mir dein Rad leihen?<\/small><\/p><p><b>Wunsch<\/b>: <em>Mi piacerebbe vivere vicino al mare.<\/em> <small>Ich würde gern am Meer wohnen.<\/small><br><em>Mangerei volentieri una pizza.<\/em> <small>Ich würde gern eine Pizza essen.<\/small><\/p><p><b>Rat<\/b> mit <em>dovere<\/em> oder <em>al posto tuo<\/em>: <em>Dovresti bere più acqua.<\/em> <small>Du solltest mehr Wasser trinken.<\/small><br><em>Al posto tuo, prenderei il treno.<\/em> <small>An deiner Stelle würde ich den Zug nehmen.<\/small><\/p><div class=\"tip\">Auch Meinungen werden so abgeschwächt: <em>Direi che è troppo caro.<\/em> – Ich würde sagen, es ist zu teuer.<\/div><div class=\"warn\">Achtung: <em>volere<\/em> im Indikativ (<em>Voglio un caffè<\/em>) klingt in der Bar fordernd. Bestelle mit <em>Vorrei<\/em> oder <em>Prendo<\/em>.<\/div>"},{"h":"Gebrauch: Vermutung und unbestätigte Nachricht","html":"<p>In Nachrichten und Zeitungen kennzeichnet der Konditional eine <b>Information aus zweiter Hand<\/b>, für die man nicht bürgt – im Deutschen <em>soll<\/em>, <em>angeblich<\/em> oder Konjunktiv I.<\/p><p><em>Secondo fonti vicine al governo, il ministro sarebbe pronto a dimettersi.<\/em> <small>Regierungsnahen Quellen zufolge soll der Minister zum Rücktritt bereit sein.<\/small><br><em>Il sospettato avrebbe circa quarant'anni.<\/em> <small>Der Verdächtige soll etwa vierzig Jahre alt sein.<\/small><br><em>La nuova linea della metro costerebbe due miliardi.<\/em> <small>Die neue U-Bahn-Linie soll zwei Milliarden kosten.<\/small><\/p><div class=\"warn\">Achtung: Eine <b>eigene<\/b> Vermutung des Sprechers wird mit dem Futur ausgedrückt, nicht mit dem Konditional: <em>Sarà a casa.<\/em> – Er wird (wohl) zu Hause sein.<\/div>"},{"h":"Gebrauch: Folge einer irrealen Bedingung","html":"<p>Im Hauptsatz eines irrealen Bedingungssatzes steht der Konditional, im <em>se<\/em>-Satz der <em>congiuntivo<\/em>.<\/p><table><tr><th>Typ<\/th><th>se-Satz<\/th><th>Hauptsatz<\/th><\/tr><tr><td>real<\/td><td><em>Se ho tempo,<\/em><\/td><td><em>vengo / verrò.<\/em><\/td><\/tr><tr><td>möglich / irreal (Gegenwart)<\/td><td><em>Se avessi tempo,<\/em><\/td><td><em>verrei.<\/em><\/td><\/tr><tr><td>irreal (Vergangenheit)<\/td><td><em>Se avessi avuto tempo,<\/em><\/td><td><em>sarei venuto.<\/em><\/td><\/tr><tr><td>gemischt<\/td><td><em>Se avessi dormito,<\/em><\/td><td><em>ora starei meglio.<\/em><\/td><\/tr><\/table><p><em>Se il biglietto costasse meno, ci andremmo anche noi.<\/em> <small>Wenn die Karte weniger kosten würde, würden wir auch hingehen.<\/small><\/p><div class=\"warn\">Achtung: Nie Konditional im <em>se<\/em>-Satz! Nicht <em>*Se avrei tempo …<\/em>, sondern <em>Se avessi tempo …<\/em> – das deutsche „wenn ich … würde“ verleitet dazu.<\/div>"},{"h":"condizionale passato: Formen","html":"<p><b>Bildung:<\/b> <em>condizionale presente<\/em> von <em>avere/essere<\/em> + Partizip Perfekt. Bei <em>essere<\/em> wird angeglichen. Deutsch: <b>hätte / wäre + Partizip<\/b> bzw. <b>würde … haben<\/b>.<\/p><table><tr><th><\/th><th>comprare<\/th><th>tornare<\/th><\/tr><tr><td>io<\/td><td><em>avrei comprato<\/em><\/td><td><em>sarei tornato/-a<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>avresti comprato<\/em><\/td><td><em>saresti tornato/-a<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>avrebbe comprato<\/em><\/td><td><em>sarebbe tornato/-a<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>avremmo comprato<\/em><\/td><td><em>saremmo tornati/-e<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>avreste comprato<\/em><\/td><td><em>sareste tornati/-e<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>avrebbero comprato<\/em><\/td><td><em>sarebbero tornati/-e<\/em><\/td><\/tr><\/table><div class=\"tip\">Modalverben: <em>avrei dovuto<\/em> = ich hätte … sollen, <em>avrei potuto<\/em> = ich hätte … können, <em>avrei voluto<\/em> = ich hätte … wollen. Der Infinitiv folgt ganz normal: <em>Avrei dovuto chiamarti.<\/em><\/div>"},{"h":"condizionale passato: nicht erfüllter Wunsch, irreale Vergangenheit, Nachricht","html":"<ul><li><b>Wunsch oder Absicht, die sich nicht erfüllt hat<\/b>: <em>Sarei rimasta volentieri, ma dovevo lavorare.<\/em> <small>Ich wäre gern geblieben, aber ich musste arbeiten.<\/small><br><em>Avresti potuto avvisarmi!<\/em> <small>Du hättest mir Bescheid sagen können!<\/small><\/li><li><b>Irreale Bedingung der Vergangenheit<\/b>: <em>Se avessimo prenotato, avremmo trovato un tavolo.<\/em> <small>Hätten wir reserviert, hätten wir einen Tisch bekommen.<\/small><\/li><li><b>Unbestätigte Nachricht über Vergangenes<\/b>: <em>Secondo alcuni testimoni, l'auto sarebbe passata con il rosso.<\/em> <small>Laut Zeugen soll das Auto bei Rot gefahren sein.<\/small><br><em>I ladri sarebbero entrati dalla finestra.<\/em> <small>Die Diebe sollen durchs Fenster eingestiegen sein.<\/small><\/li><\/ul><div class=\"warn\">Achtung: Ein Wunsch, der nicht mehr erfüllbar ist, steht oft im <em>condizionale passato<\/em> – auch wenn er sich auf heute bezieht: <em>Sarei venuto stasera, ma sono malato.<\/em> Der <em>condizionale presente<\/em> ist hier ebenfalls möglich: <em>Verrei stasera, ma sono malato.<\/em><\/div>"},{"h":"Zukunft in der Vergangenheit","html":"<p>Wird von einem vergangenen Zeitpunkt aus etwas Späteres berichtet, verwendet das Italienische den <em>condizionale passato<\/em> – das Deutsche dagegen <b>würde + Infinitiv<\/b>.<\/p><table><tr><th>Hauptsatz<\/th><th>Nebensatz (nachzeitig)<\/th><\/tr><tr><td><em>Dice che<\/em> <small>(Präsens)<\/small><\/td><td><em>verrà.<\/em> <small>(Futur)<\/small><\/td><\/tr><tr><td><em>Ha detto che<\/em> <small>(Vergangenheit)<\/small><\/td><td><em>sarebbe venuto.<\/em> <small>(cond. passato)<\/small><\/td><\/tr><\/table><p><em>Sara ha detto che sarebbe venuta alle otto.<\/em> <small>Sara sagte, sie würde um acht kommen.<\/small><br><em>Ero sicuro che avresti vinto.<\/em> <small>Ich war sicher, dass du gewinnen würdest.<\/small><br><em>Ci avevano promesso che il lavoro sarebbe finito a maggio.<\/em> <small>Man hatte uns versprochen, die Arbeit würde im Mai fertig sein.<\/small><\/p><div class=\"warn\">Achtung: Das deutsche „würde kommen“ verleitet zu <em>*Ha detto che verrebbe<\/em>. Richtig ist nur <em>Ha detto che sarebbe venuto.<\/em> (Umgangssprachlich hört man auch <em>Ha detto che veniva.<\/em>)<\/div><div class=\"tip\">Es spielt keine Rolle, ob das Ereignis inzwischen eingetreten ist oder noch bevorsteht: <em>Mi ha scritto che sarebbe arrivato domani.<\/em><\/div>"},{"h":"Deutsch – Italienisch im Vergleich","html":"<table><tr><th>Deutsch<\/th><th>Italienisch<\/th><\/tr><tr><td>Ich hätte gern …<\/td><td><em>Vorrei …<\/em><\/td><\/tr><tr><td>Du solltest …<\/td><td><em>Dovresti …<\/em><\/td><\/tr><tr><td>Er soll (angeblich) … sein<\/td><td><em>Sarebbe …<\/em><\/td><\/tr><tr><td>Wenn ich … würde / hätte<\/td><td><em>Se<\/em> + <em>congiuntivo imperfetto<\/em><\/td><\/tr><tr><td>Ich hätte … sollen<\/td><td><em>Avrei dovuto …<\/em><\/td><\/tr><tr><td>Er sagte, er würde kommen<\/td><td><em>Ha detto che sarebbe venuto<\/em><\/td><\/tr><tr><td>Er wird wohl zu Hause sein<\/td><td><em>Sarà a casa<\/em> (Futur!)<\/td><\/tr><\/table><div class=\"tip\">Faustregel: Konditional im Hauptsatz, <em>congiuntivo<\/em> im <em>se<\/em>-Satz.<\/div>"}],"exercises":[{"type":"gap","title":"condizionale presente: regelmäßige Verben","task":"Setze den condizionale presente ein.","items":[{"q":"Io (prendere) ___ volentieri un tè.","a":["prenderei"],"de":"Ich würde gern einen Tee nehmen."},{"q":"Tu (mangiare) ___ un'altra fetta di torta?","a":["mangeresti"],"de":"Würdest du noch ein Stück Kuchen essen?"},{"q":"Noi (comprare) ___ una casa al mare, ma costa troppo.","a":["compreremmo"],"de":"Wir würden ein Haus am Meer kaufen, aber es kostet zu viel."},{"q":"Voi (preferire) ___ partire di mattina o di sera?","a":["preferireste"],"de":"Würdet ihr lieber morgens oder abends losfahren?"},{"q":"Loro (cercare) ___ un altro lavoro, se potessero.","a":["cercherebbero"],"de":"Sie würden eine andere Arbeit suchen, wenn sie könnten."},{"q":"Signora, mi (spiegare) ___ come funziona?","a":["spiegherebbe"],"de":"Würden Sie mir erklären, wie das funktioniert?"},{"q":"Io al posto tuo (pagare) ___ subito la multa.","a":["pagherei"],"de":"Ich an deiner Stelle würde die Strafe sofort bezahlen."},{"q":"Noi (cominciare) ___ domani, se per voi va bene.","a":["cominceremmo"],"de":"Wir würden morgen anfangen, wenn es euch recht ist."}]},{"type":"gap","title":"condizionale presente: unregelmäßige Verben","task":"Setze die unregelmäßige Form des condizionale presente ein.","items":[{"q":"Io (volere) ___ prenotare un tavolo per due.","a":["vorrei"],"de":"Ich möchte einen Tisch für zwei reservieren."},{"q":"Tu (potere) ___ aiutarmi un attimo?","a":["potresti"],"de":"Könntest du mir kurz helfen?"},{"q":"Mi (piacere) ___ visitare la Sicilia.","a":["piacerebbe"],"de":"Ich würde gern Sizilien besuchen."},{"q":"Voi (dovere) ___ riposarvi un po'.","a":["dovreste"],"de":"Ihr solltet euch ein bisschen ausruhen."},{"q":"Al tuo posto io non (andare) ___ a quella festa.","a":["andrei"],"de":"An deiner Stelle würde ich nicht zu dieser Party gehen."},{"q":"Noi (venire) ___ volentieri, ma abbiamo già un impegno.","a":["verremmo"],"de":"Wir würden gern kommen, aber wir haben schon etwas vor."},{"q":"Lui (bere) ___ un bicchiere di vino, ma deve guidare.","a":["berrebbe"],"de":"Er würde ein Glas Wein trinken, aber er muss fahren."},{"q":"I miei genitori (essere) ___ felici di conoscerti.","a":["sarebbero"],"de":"Meine Eltern würden sich freuen, dich kennenzulernen."},{"q":"Tu che cosa (fare) ___ in questa situazione?","a":["faresti"],"de":"Was würdest du in dieser Situation tun?"},{"q":"Mi dispiace, non (sapere, io) ___ dirti dove sia.","a":["saprei"],"de":"Tut mir leid, ich könnte dir nicht sagen, wo er ist."}]},{"type":"choice","title":"Futur oder Konditional?","task":"Wähle die passende Form.","items":[{"q":"Domani ___ con il direttore.","options":["parleremo","parleremmo"],"a":0,"why":"Feststehende Zukunft → Futur (ein m)."},{"q":"___ volentieri con il direttore, ma oggi non c'è.","options":["Parleremo","Parleremmo"],"a":1,"why":"Nicht erfüllbarer Wunsch → Konditional (zwei m)."},{"q":"Se avessimo i soldi, ___ un viaggio in Giappone.","options":["faremo","faremmo"],"a":1,"why":"Hauptsatz einer irrealen Bedingung → Konditional."},{"q":"Quando avremo i soldi, ___ un viaggio in Giappone.","options":["faremo","faremmo"],"a":0,"why":"Reale Zukunft mit quando → Futur."},{"q":"Scusi, ___ chiudere la porta?","options":["potrà","potrebbe"],"a":1,"why":"Höfliche Bitte → Konditional."},{"q":"Secondo la polizia, il ladro ___ fuggito in moto.","options":["sarà","sarebbe"],"a":1,"why":"Unbestätigte Information aus einer Quelle → Konditional."},{"q":"Non so dove sia Carla: ___ ancora in ufficio.","options":["sarà","sarebbe"],"a":0,"why":"Eigene Vermutung des Sprechers → Futur."},{"q":"Ti ___ se avessi il tuo numero.","options":["chiamerò","chiamerei"],"a":1,"why":"Folge einer irrealen Bedingung → Konditional."}]},{"type":"gap","title":"condizionale passato","task":"Setze den condizionale passato ein.","items":[{"q":"Io (venire) ___ volentieri, ma ero malato.","a":["sarei venuto","sarei venuta"],"de":"Ich wäre gern gekommen, aber ich war krank."},{"q":"Tu (dovere) ___ dirmelo prima!","a":["avresti dovuto"],"de":"Du hättest es mir vorher sagen sollen!"},{"q":"Noi (comprare) ___ quella casa, ma era troppo cara.","a":["avremmo comprato"],"de":"Wir hätten das Haus gekauft, aber es war zu teuer."},{"q":"Se avessero studiato, (superare) ___ l'esame.","a":["avrebbero superato"],"de":"Hätten sie gelernt, hätten sie die Prüfung bestanden."},{"q":"Laura (partire) ___ ieri, ma lo sciopero ha bloccato i treni.","a":["sarebbe partita"],"de":"Laura wäre gestern abgereist, aber der Streik hat die Züge lahmgelegt."},{"q":"Voi (potere) ___ avvisarci!","a":["avreste potuto"],"de":"Ihr hättet uns Bescheid geben können!"},{"q":"Secondo alcuni testimoni, l'autista (perdere) ___ il controllo dell'auto.","a":["avrebbe perso","avrebbe perduto"],"de":"Laut einigen Zeugen soll der Fahrer die Kontrolle über das Auto verloren haben."},{"q":"Senza il tuo aiuto, io non (finire) ___ in tempo.","a":["avrei finito"],"de":"Ohne deine Hilfe wäre ich nicht rechtzeitig fertig geworden."}]},{"type":"choice","title":"Zukunft in der Vergangenheit","task":"Wähle die korrekte Form.","items":[{"q":"Marco ha detto che ___ alle otto.","options":["verrebbe","sarebbe venuto"],"a":1,"why":"Nachzeitigkeit nach Vergangenheit → condizionale passato."},{"q":"Marco dice che ___ alle otto.","options":["verrà","sarebbe venuto"],"a":0,"why":"Hauptsatz im Präsens → Futur."},{"q":"Ero sicuro che tu ___ la verità.","options":["diresti","avresti detto"],"a":1,"why":"Zukunft aus Sicht der Vergangenheit → condizionale passato."},{"q":"Mi avevano promesso che mi ___ entro lunedì.","options":["risponderebbero","avrebbero risposto"],"a":1,"why":"Hauptsatz in der Vergangenheit → condizionale passato, nicht presente."},{"q":"Pensavamo che il concerto ___ più a lungo.","options":["sarebbe durato","durerebbe"],"a":0,"why":"Nachzeitig zur Vergangenheit → condizionale passato."},{"q":"Sapevo che prima o poi ___.","options":["avresti capito","capiresti"],"a":0,"why":"Zukunft in der Vergangenheit → condizionale passato."},{"q":"Il meteo diceva che nel pomeriggio ___.","options":["avrebbe piovuto","pioverebbe"],"a":0,"why":"Vergangenes Einleitungsverb + spätere Handlung → condizionale passato."}]},{"type":"choice","title":"Welche Funktion hat der condizionale?","task":"Bestimme die Funktion des Konditionals im Satz.","items":[{"q":"Potresti passarmi il sale?","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":0,"why":"Höfliche Bitte mit potere."},{"q":"Dovresti smettere di fumare.","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":1,"why":"dovere im Konditional = Ratschlag."},{"q":"Secondo la stampa, il cantante si sarebbe sposato in segreto.","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":2,"why":"Information aus zweiter Hand (secondo la stampa)."},{"q":"Mi aveva promesso che sarebbe tornato presto.","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":3,"why":"Spätere Handlung aus Sicht der Vergangenheit."},{"q":"Vorrei un chilo di pomodori, per favore.","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":0,"why":"Höflicher Wunsch beim Einkaufen."},{"q":"Al posto tuo, accetterei l'offerta.","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":1,"why":"Al posto tuo + Konditional = Ratschlag."},{"q":"Il nuovo stadio costerebbe trecento milioni.","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":2,"why":"Nicht bestätigte Angabe – deutsch: soll kosten."},{"q":"Sapevo che avrebbero vinto.","options":["Höflichkeit","Rat","unbestätigte Nachricht","Zukunft in der Vergangenheit"],"a":3,"why":"Nachzeitigkeit nach sapevo."}]}],"cards":[{"f":"guardare – condizionale presente","b":"guarderei, guarderesti, guarderebbe, guarderemmo, guardereste, guarderebbero"},{"f":"parleremmo vs. parleremo","b":"Konditional (würden) – zwei m; Futur (werden) – ein m"},{"f":"cercare / pagare – condizionale (io)","b":"cercherei / pagherei"},{"f":"mangiare / cominciare – condizionale (io)","b":"mangerei / comincerei"},{"f":"essere / avere – condizionale (io)","b":"sarei / avrei"},{"f":"andare / fare – condizionale (io)","b":"andrei / farei"},{"f":"potere / dovere – condizionale (io)","b":"potrei / dovrei"},{"f":"volere – condizionale","b":"vorrei, vorresti, vorrebbe, vorremmo, vorreste, vorrebbero"},{"f":"venire / tenere – condizionale (io)","b":"verrei / terrei"},{"f":"bere / rimanere – condizionale (io)","b":"berrei / rimarrei"},{"f":"sapere / vedere / vivere – condizionale (io)","b":"saprei / vedrei / vivrei"},{"f":"Könnten Sie …? (höflich)","b":"Potrebbe …?"},{"f":"Ich würde gern …","b":"Mi piacerebbe … / … volentieri"},{"f":"Du solltest …","b":"Dovresti …"},{"f":"An deiner Stelle würde ich …","b":"Al posto tuo, …-rei"},{"f":"Der Minister soll zum Rücktritt bereit sein. (Presse)","b":"Il ministro sarebbe pronto a dimettersi."},{"f":"Er wird wohl zu Hause sein. (eigene Vermutung)","b":"Sarà a casa. (Futur, nicht Konditional)"},{"f":"Wenn ich Zeit hätte, würde ich kommen.","b":"Se avessi tempo, verrei."},{"f":"Hätte ich Zeit gehabt, wäre ich gekommen.","b":"Se avessi avuto tempo, sarei venuto."},{"f":"Konditional im se-Satz?","b":"Nie! Se + congiuntivo, Konditional im Hauptsatz."},{"f":"condizionale passato – Bildung","b":"avrei / sarei + Partizip: avrei fatto, sarei andato"},{"f":"Ich hätte es dir sagen sollen.","b":"Avrei dovuto dirtelo."},{"f":"Du hättest mich anrufen können!","b":"Avresti potuto chiamarmi!"},{"f":"Er sagte, er würde kommen.","b":"Ha detto che sarebbe venuto. (cond. passato!)"},{"f":"Das Auto soll bei Rot gefahren sein.","b":"L'auto sarebbe passata con il rosso."},{"f":"Ich wäre gern geblieben, aber …","b":"Sarei rimasto volentieri, ma …"}],"id":"k13"},{"nr":14,"title":"Der Imperativ","teil":"Das Verb und seine Ergänzungen","intro":"Mit dem Imperativ gibt man Anweisungen, Ratschläge und Bitten – vertraut, im Plural oder höflich. Knifflig sind die Kurzformen, die Verneinung und die Stellung der Pronomen.","sections":[{"h":"Formen für tu, noi, voi","html":"<p>Der Imperativ für <em>noi<\/em> und <em>voi<\/em> ist identisch mit dem Indikativ Präsens. Bei <em>tu<\/em> enden die <em>-are<\/em>-Verben auf <em>-a<\/em>, alle anderen sind gleich der <em>tu<\/em>-Form des Präsens.<\/p><table><tr><th><\/th><th>aspettare<\/th><th>chiudere<\/th><th>aprire / pulire<\/th><\/tr><tr><td>tu<\/td><td><em>aspetta!<\/em><\/td><td><em>chiudi!<\/em><\/td><td><em>apri! / pulisci!<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>aspettiamo!<\/em><\/td><td><em>chiudiamo!<\/em><\/td><td><em>apriamo! / puliamo!<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>aspettate!<\/em><\/td><td><em>chiudete!<\/em><\/td><td><em>aprite! / pulite!<\/em><\/td><\/tr><\/table><p><em>Aspetta qui, torno subito!<\/em> <small>Warte hier, ich bin gleich zurück!<\/small><br><em>Apriamo una bottiglia di spumante!<\/em> <small>Machen wir eine Flasche Sekt auf!<\/small><br><em>Ragazzi, chiudete i quaderni!<\/em> <small>Leute, schlagt die Hefte zu!<\/small><\/p><div class=\"tip\">Die <em>noi<\/em>-Form entspricht dem deutschen „Lass(t) uns …“ bzw. „…en wir!“: <em>Andiamo!<\/em> – Gehen wir!<\/div><div class=\"warn\">Achtung: <em>tu<\/em> bei <em>-are<\/em> endet auf <em>-a<\/em>, nicht <em>-i<\/em>: <em>Aspetta!<\/em>, nicht <em>*Aspetti!<\/em> (das wäre die <em>Lei<\/em>-Form).<\/div>"},{"h":"Unregelmäßige Formen","html":"<table><tr><th>Infinitiv<\/th><th>tu<\/th><th>voi<\/th><\/tr><tr><td>essere<\/td><td><em>sii<\/em><\/td><td><em>siate<\/em><\/td><\/tr><tr><td>avere<\/td><td><em>abbi<\/em><\/td><td><em>abbiate<\/em><\/td><\/tr><tr><td>sapere<\/td><td><em>sappi<\/em><\/td><td><em>sappiate<\/em><\/td><\/tr><tr><td>andare<\/td><td><em>va' / vai<\/em><\/td><td><em>andate<\/em><\/td><\/tr><tr><td>fare<\/td><td><em>fa' / fai<\/em><\/td><td><em>fate<\/em><\/td><\/tr><tr><td>dare<\/td><td><em>da' / dai<\/em><\/td><td><em>date<\/em><\/td><\/tr><tr><td>stare<\/td><td><em>sta' / stai<\/em><\/td><td><em>state<\/em><\/td><\/tr><tr><td>dire<\/td><td><em>di'<\/em><\/td><td><em>dite<\/em><\/td><\/tr><\/table><p>Die <em>noi<\/em>-Formen: <em>siamo, abbiamo, sappiamo, andiamo, facciamo, diamo, stiamo, diciamo<\/em>.<\/p><p>Unregelmäßig nur wie im Präsens: <em>vieni!, tieni!, esci!, bevi!, scegli!, siediti!<\/em><\/p><p><em>Sii puntuale, per una volta!<\/em> <small>Sei ausnahmsweise mal pünktlich!<\/small><br><em>Abbi fiducia in te stesso.<\/em> <small>Hab Vertrauen in dich selbst.<\/small><br><em>Di' la tua opinione!<\/em> <small>Sag deine Meinung!<\/small><\/p><div class=\"warn\">Achtung: <em>di'<\/em> (sag!) hat <b>keine<\/b> Variante <em>*dici<\/em>. Und <em>dai<\/em> ist auch ein Ausruf: <em>Dai, vieni!<\/em> – Komm schon!<\/div>"},{"h":"Der verneinte Imperativ","html":"<p>Für <em>tu<\/em> gilt: <b>non + Infinitiv<\/b>. Für <em>noi<\/em> und <em>voi<\/em> setzt man einfach <em>non<\/em> vor die Imperativform.<\/p><table><tr><th>Person<\/th><th>bejaht<\/th><th>verneint<\/th><\/tr><tr><td>tu<\/td><td><em>Corri!<\/em><\/td><td><em>Non correre!<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>Sii sincero!<\/em><\/td><td><em>Non essere timido!<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>Aspettiamo!<\/em><\/td><td><em>Non aspettiamo!<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>Uscite!<\/em><\/td><td><em>Non uscite!<\/em><\/td><\/tr><\/table><p><em>Non toccare il forno, scotta!<\/em> <small>Fass den Ofen nicht an, er ist heiß!<\/small><br><em>Non avere fretta.<\/em> <small>Hab keine Eile.<\/small><\/p><div class=\"warn\">Achtung: <em>*Non tocca!<\/em> oder <em>*Non sii!<\/em> sind falsch. Bei <em>tu<\/em> immer <em>non<\/em> + Infinitiv.<\/div>"},{"h":"Höflichkeitsform Lei und Loro","html":"<p>Für die Höflichkeitsform verwendet man den <em>congiuntivo presente<\/em>: <em>-are<\/em> → <em>-i<\/em>, <em>-ere/-ire<\/em> → <em>-a<\/em>.<\/p><table><tr><th>Infinitiv<\/th><th>Lei<\/th><th>Loro<\/th><\/tr><tr><td>parlare<\/td><td><em>parli!<\/em><\/td><td><em>parlino!<\/em><\/td><\/tr><tr><td>prendere<\/td><td><em>prenda!<\/em><\/td><td><em>prendano!<\/em><\/td><\/tr><tr><td>sentire<\/td><td><em>senta!<\/em><\/td><td><em>sentano!<\/em><\/td><\/tr><tr><td>finire<\/td><td><em>finis
