td>sagen / bitten / versprechen zu<\/td><\/tr><tr><td><em>dimenticare / ricordarsi di<\/em><\/td><td>vergessen / daran denken zu<\/td><\/tr><tr><td><em>evitare / rifiutare / accettare di<\/em><\/td><td>vermeiden / ablehnen / annehmen zu<\/td><\/tr><tr><td><em>avere paura / bisogno / voglia di<\/em><\/td><td>Angst haben / brauchen / Lust haben zu<\/td><\/tr><\/table><p><b>Ohne Präposition:<\/b> Modalverben und einige andere:<\/p><ul><li><em>volere, potere, dovere, sapere<\/em> (können = wissen wie)<\/li><li><em>preferire, desiderare, amare, osare<\/em><\/li><li><em>fare, lasciare<\/em> (veranlassen, lassen): <em>Mi fai vedere?<\/em><\/li><li><em>vedere, sentire, ascoltare<\/em> + Infinitiv: <em>Ti ho sentito cantare.<\/em><\/li><li>unpersönlich: <em>mi piace, bisogna, basta, conviene, è importante / necessario / facile<\/em> + Infinitiv<\/li><\/ul><ul><li><em>Ho deciso di cambiare lavoro.<\/em> <small>Ich habe beschlossen, die Arbeit zu wechseln.<\/small><\/li><li><em>Ricordati di chiudere la porta!<\/em> <small>Denk daran, die Tür zu schließen!<\/small><\/li><li><em>Preferisco restare a casa.<\/em> <small>Ich bleibe lieber zu Hause.<\/small><\/li><li><em>Mi piace cucinare.<\/em> <small>Ich koche gern.<\/small><\/li><\/ul><div class=\"warn\">Achtung: „versuchen“ = <em>cercare di<\/em> (sich bemühen) bzw. <em>provare a<\/em> (ausprobieren) – zwei Verben, zwei Präpositionen! Und „aufhören“ = <em>smettere di<\/em>, „anfangen“ = <em>cominciare a<\/em>.<\/div>"},{"h":"Adjektive mit Präposition","html":"<table><tr><th>Adjektiv<\/th><th>Deutsch<\/th><\/tr><tr><td><em>contento / felice di<\/em><\/td><td>froh über / zu<\/td><\/tr><tr><td><em>stanco di<\/em><\/td><td>müde, überdrüssig<\/td><\/tr><tr><td><em>sicuro / certo di<\/em><\/td><td>sicher<\/td><\/tr><tr><td><em>capace di<\/em><\/td><td>fähig zu<\/td><\/tr><tr><td><em>orgoglioso / fiero di<\/em><\/td><td>stolz auf<\/td><\/tr><tr><td><em>pieno di<\/em><\/td><td>voll von<\/td><\/tr><tr><td><em>pronto a<\/em><\/td><td>bereit zu<\/td><\/tr><tr><td><em>abituato a<\/em><\/td><td>gewöhnt an<\/td><\/tr><tr><td><em>disposto a<\/em><\/td><td>bereit, gewillt zu<\/td><\/tr><tr><td><em>attento a<\/em><\/td><td>aufmerksam, vorsichtig bei<\/td><\/tr><tr><td><em>interessato a<\/em><\/td><td>interessiert an<\/td><\/tr><tr><td><em>bravo in / a<\/em><\/td><td>gut in<\/td><\/tr><tr><td><em>simile a / diverso da<\/em><\/td><td>ähnlich / verschieden von<\/td><\/tr><tr><td><em>facile / difficile da<\/em> + Inf.<\/td><td>leicht / schwer zu …<\/td><\/tr><tr><td><em>gentile con<\/em><\/td><td>freundlich zu<\/td><\/tr><\/table><ul><li><em>Sono contenta di vederti.<\/em> <small>Ich freue mich, dich zu sehen.<\/small><\/li><li><em>Siamo pronti a partire.<\/em> <small>Wir sind bereit zur Abfahrt.<\/small><\/li><li><em>Questo testo è difficile da tradurre.<\/em> <small>Dieser Text ist schwer zu übersetzen.<\/small><\/li><\/ul><div class=\"warn\">Achtung: <em>Questo libro è facile da leggere<\/em> (Subjekt = Buch) ↔ <em>È facile leggere questo libro<\/em> (unpersönlich, ohne Präposition).<\/div>"}],"exercises":[{"type":"gap","title":"a, di oder nichts?","task":"Setze a oder di ein. Steht keine Präposition, schreibe –.","items":[{"q":"Domani comincio ___ lavorare in una nuova ditta.","a":["a"],"de":"Morgen fange ich an, in einer neuen Firma zu arbeiten."},{"q":"Ho smesso ___ fumare tre anni fa.","a":["di"],"de":"Ich habe vor drei Jahren aufgehört zu rauchen."},{"q":"Voglio ___ imparare il cinese.","a":["–","-"],"de":"Ich will Chinesisch lernen."},{"q":"Non sono riuscito ___ trovare parcheggio.","a":["a"],"de":"Ich habe keinen Parkplatz gefunden."},{"q":"Cerca ___ arrivare puntuale!","a":["di"],"de":"Versuch, pünktlich zu kommen!"},{"q":"Mi hai convinto ___ venire alla festa.","a":["a"],"de":"Du hast mich überzeugt, zum Fest zu kommen."},{"q":"Spero ___ rivederti presto.","a":["di"],"de":"Ich hoffe, dich bald wiederzusehen."},{"q":"Preferisco ___ viaggiare in treno.","a":["–","-"],"de":"Ich reise lieber mit dem Zug."},{"q":"Ho dimenticato ___ spegnere il forno!","a":["di"],"de":"Ich habe vergessen, den Ofen auszuschalten!"},{"q":"Continuano ___ litigare per niente.","a":["a"],"de":"Sie streiten weiter wegen nichts."}]},{"type":"choice","title":"Adjektive und Verben mit Präposition","task":"Wähle die richtige Präposition.","items":[{"q":"Sono molto orgogliosa ___ mia figlia.","options":["di","a","su"],"a":0,"why":"orgoglioso di."},{"q":"Non sono ancora abituato ___ questo clima.","options":["di","a","con"],"a":1,"why":"abituato a."},{"q":"Il tuo progetto è simile ___ mio.","options":["al","del","dal"],"a":0,"why":"simile a."},{"q":"Questa parola è difficile ___ pronunciare.","options":["di","da","a"],"a":1,"why":"difficile da + Infinitiv (Subjekt = parola)."},{"q":"Sei capace ___ cambiare una gomma?","options":["a","di","da"],"a":1,"why":"capace di."},{"q":"Ho voglia ___ un gelato.","options":["di","a","per"],"a":0,"why":"avere voglia di."},{"q":"Il mio carattere è molto diverso ___ quello di mio fratello.","options":["di","da","a"],"a":1,"why":"diverso da."},{"q":"Proviamo ___ aprire la finestra: forse funziona.","options":["di","a"],"a":1,"why":"provare a = ausprobieren."},{"q":"Siete disposti ___ aiutarci?","options":["a","di"],"a":0,"why":"disposto a."}]}],"cards":[{"f":"su + gli / su + lo","b":"sugli / sullo"},{"f":"da + le / in + gli","b":"dalle / negli"},{"f":"anfangen zu","b":"cominciare a / iniziare a"},{"f":"aufhören zu","b":"smettere di / finire di"},{"f":"versuchen (sich bemühen / ausprobieren)","b":"cercare di / provare a"},{"f":"schaffen, gelingen","b":"riuscire a"},{"f":"lernen zu","b":"imparare a"},{"f":"sich gewöhnen an","b":"abituarsi a"},{"f":"beschließen zu","b":"decidere di"},{"f":"vergessen / daran denken zu","b":"dimenticare di / ricordarsi di"},{"f":"hoffen / versprechen zu","b":"sperare di / promettere di"},{"f":"Lust haben / Angst haben zu","b":"avere voglia di / avere paura di"},{"f":"Verben ohne Präposition + Infinitiv","b":"volere, potere, dovere, sapere, preferire, fare, lasciare, mi piace"},{"f":"froh / stolz / müde (+ Präp.)","b":"contento di / orgoglioso di / stanco di"},{"f":"bereit zu / gewöhnt an","b":"pronto a / abituato a"},{"f":"fähig zu","b":"capace di"},{"f":"ähnlich / verschieden von","b":"simile a / diverso da"},{"f":"leicht zu verstehen (Subjekt)","b":"facile da capire"},{"f":"Es ist leicht, zu … (unpersönlich)","b":"È facile + Infinitiv (ohne Präposition)"},{"f":"interessiert an / freundlich zu","b":"interessato a / gentile con"}],"id":"k26"},{"nr":27,"title":"Verbtabellen","teil":"Anhang","intro":"Vollständige Konjugationstabellen der Hilfsverben und der regelmäßigen Modellverben sowie die Leitformen der rund 40 wichtigsten unregelmäßigen Verben – zum Nachschlagen und Wiederholen.","sections":[{"h":"So sind die Tabellen aufgebaut","html":"<p>Für jedes Modellverb stehen zuerst die <b>einfachen Zeiten<\/b> (6 Personen). Die <b>zusammengesetzten Zeiten<\/b> bestehen immer aus einer Form von <em>avere<\/em> bzw. <em>essere<\/em> + Partizip Perfekt:<\/p><table><tr><th>Zeit<\/th><th>Hilfsverb in …<\/th><th>Beispiel (io)<\/th><\/tr><tr><td>passato prossimo<\/td><td>Präsens<\/td><td><em>ho parlato / sono andato<\/em><\/td><\/tr><tr><td>trapassato prossimo<\/td><td>Imperfekt<\/td><td><em>avevo parlato / ero andato<\/em><\/td><\/tr><tr><td>trapassato remoto<\/td><td>passato remoto<\/td><td><em>ebbi parlato / fui andato<\/em><\/td><\/tr><tr><td>futuro anteriore<\/td><td>Futur<\/td><td><em>avrò parlato / sarò andato<\/em><\/td><\/tr><tr><td>congiuntivo passato<\/td><td>Cong. Präsens<\/td><td><em>abbia parlato / sia andato<\/em><\/td><\/tr><tr><td>congiuntivo trapassato<\/td><td>Cong. Imperfekt<\/td><td><em>avessi parlato / fossi andato<\/em><\/td><\/tr><tr><td>condizionale passato<\/td><td>Konditional<\/td><td><em>avrei parlato / sarei andato<\/em><\/td><\/tr><\/table><p>Infinitiv Perfekt: <em>aver(e) parlato, essere andato<\/em>. Gerundium Perfekt: <em>avendo parlato, essendo andato<\/em>.<\/p><div class=\"tip\">Die vollständigen Formen von <em>essere<\/em> und <em>avere<\/em> in den folgenden Tabellen liefern also alle Hilfsverbformen für sämtliche zusammengesetzten Zeiten.<\/div>"},{"h":"essere (sein)","html":"<p>Partizip: <em>stato<\/em> · Gerundium: <em>essendo<\/em> · Hilfsverb: <em>essere<\/em><\/p><table><tr><th><\/th><th>Präsens<\/th><th>Imperfekt<\/th><th>pass. remoto<\/th><\/tr><tr><td>io<\/td><td><em>sono<\/em><\/td><td><em>ero<\/em><\/td><td><em>fui<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>sei<\/em><\/td><td><em>eri<\/em><\/td><td><em>fosti<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>è<\/em><\/td><td><em>era<\/em><\/td><td><em>fu<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>siamo<\/em><\/td><td><em>eravamo<\/em><\/td><td><em>fummo<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>siete<\/em><\/td><td><em>eravate<\/em><\/td><td><em>foste<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>sono<\/em><\/td><td><em>erano<\/em><\/td><td><em>furono<\/em><\/td><\/tr><\/table><table><tr><th><\/th><th>Futur<\/th><th>Konditional<\/th><th>Cong. Präs.<\/th><\/tr><tr><td>io<\/td><td><em>sarò<\/em><\/td><td><em>sarei<\/em><\/td><td><em>sia<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>sarai<\/em><\/td><td><em>saresti<\/em><\/td><td><em>sia<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>sarà<\/em><\/td><td><em>sarebbe<\/em><\/td><td><em>sia<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>saremo<\/em><\/td><td><em>saremmo<\/em><\/td><td><em>siamo<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>sarete<\/em><\/td><td><em>sareste<\/em><\/td><td><em>siate<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>saranno<\/em><\/td><td><em>sarebbero<\/em><\/td><td><em>siano<\/em><\/td><\/tr><\/table><table><tr><th><\/th><th>Cong. Imperf.<\/th><th>Imperativ<\/th><\/tr><tr><td>io<\/td><td><em>fossi<\/em><\/td><td>–<\/td><\/tr><tr><td>tu<\/td><td><em>fossi<\/em><\/td><td><em>sii!<\/em><\/td><\/tr><tr><td>lui/lei<\/td><td><em>fosse<\/em><\/td><td><em>sia!<\/em><\/td><\/tr><tr><td>noi<\/td><td><em>fossimo<\/em><\/td><td><em>si <em>finiamo!<\/em><\/td><\/tr><tr><td>voi<\/td><td><em>finiste<\/em><\/td><td><em>finite!<\/em><\/td><\/tr><tr><td>loro<\/td><td><em>finissero<\/em><\/td><td><em>finiscano!<\/em><\/td><\/tr><\/table><p>Zusammengesetzte Zeiten (io): <em>ho finito, avevo finito, ebbi finito, avrò finito, abbia finito, avessi finito, avrei finito<\/em><\/p><div class=\"tip\"><em>-isc-<\/em> steht nur in den <b>stammbetonten<\/b> Formen (io, tu, lui, loro) von Präsens, congiuntivo und Imperativ – nie bei <em>noi<\/em> und <em>voi<\/em>: <em>finiamo, finite<\/em>.<\/div>"},{"h":"Unregelmäßige Verben A–M","html":"<p>Die wichtigsten unregelmäßigen Verben mit fünf Leitformen. <b>*<\/b> = zusammengesetzte Zeiten mit <em>essere<\/em>.<\/p><table><tr><th>Infinitiv<\/th><th>Präsens (io)<br>Partizip<\/th><th>pass. rem. (io)<br>Futur (io)<br>Cong. Präs. (io)<\/th><\/tr><tr><td><b><em>andare<\/em><\/b><\/td><td><em>vado<\/em><br><em>andato*<\/em><\/td><td><em>andai<\/em><br><em>andrò<\/em><br><em>vada<\/em><\/td><\/tr><tr><td><b><em>aprire<\/em><\/b><\/td><td><em>apro<\/em><br><em>aperto<\/em><\/td><td><em>aprii<\/em><br><em>aprirò<\/em><br><em>apra<\/em><\/td><\/tr><tr><td><b><em>bere<\/em><\/b><\/td><td><em>bevo<\/em><br><em>bevuto<\/em><\/td><td><em>bevvi<\/em><br><em>berrò<\/em><br><em>beva<\/em><\/td><\/tr><tr><td><b><em>cadere<\/em><\/b><\/td><td><em>cado<\/em><br><em>caduto*<\/em><\/td><td><em>caddi<\/em><br><em>cadrò<\/em><br><em>cada<\/em><\/td><\/tr><tr><td><b><em>chiedere<\/em><\/b><\/td><td><em>chiedo<\/em><br><em>chiesto<\/em><\/td><td><em>chiesi<\/em><br><em>chiederò<\/em><br><em>chieda<\/em><\/td><\/tr><tr><td><b><em>chiudere<\/em><\/b><\/td><td><em>chiudo<\/em><br><em>chiuso<\/em><\/td><td><em>chiusi<\/em><br><em>chiuderò<\/em><br><em>chiuda<\/em><\/td><\/tr><tr><td><b><em>conoscere<\/em><\/b><\/td><td><em>conosco<\/em><br><em>conosciuto<\/em><\/td><td><em>conobbi<\/em><br><em>conoscerò<\/em><br><em>conosca<\/em><\/td><\/tr><tr><td><b><em>correre<\/em><\/b><\/td><td><em>corro<\/em> ><\/tr><tr><td><b><em>stare<\/em><\/b><\/td><td><em>sto<\/em><br><em>stato*<\/em><\/td><td><em>stetti<\/em><br><em>starò<\/em><br><em>stia<\/em><\/td><\/tr><tr><td><b><em>tenere<\/em><\/b><\/td><td><em>tengo<\/em><br><em>tenuto<\/em><\/td><td><em>tenni<\/em><br><em>terrò<\/em><br><em>tenga<\/em><\/td><\/tr><tr><td><b><em>togliere<\/em><\/b><\/td><td><em>tolgo<\/em><br><em>tolto<\/em><\/td><td><em>tolsi<\/em><br><em>toglierò<\/em><br><em>tolga<\/em><\/td><\/tr><tr><td><b><em>tradurre<\/em><\/b><\/td><td><em>traduco<\/em><br><em>tradotto<\/em><\/td><td><em>tradussi<\/em><br><em>tradurrò<\/em><br><em>traduca<\/em><\/td><\/tr><tr><td><b><em>uscire<\/em><\/b><\/td><td><em>esco<\/em><br><em>uscito*<\/em><\/td><td><em>uscii<\/em><br><em>uscirò<\/em><br><em>esca<\/em><\/td><\/tr><tr><td><b><em>vedere<\/em><\/b><\/td><td><em>vedo<\/em><br><em>visto<\/em><\/td><td><em>vidi<\/em><br><em>vedrò<\/em><br><em>veda<\/em><\/td><\/tr><tr><td><b><em>venire<\/em><\/b><\/td><td><em>vengo<\/em><br><em>venuto*<\/em><\/td><td><em>venni<\/em><br><em>verrò<\/em><br><em>venga<\/em><\/td><\/tr><tr><td><b><em>vincere<\/em><\/b><\/td><td><em>vinco<\/em><br><em>vinto<\/em><\/td><td><em>vinsi<\/em><br><em>vincerò<\/em><br><em>vinca<\/em><\/td><\/tr><tr><td><b><em>vivere<\/em><\/b><\/td><td><em>vivo<\/em><br><em>vissuto<\/em><\/td><td><em>vissi<\/em><br><em>vivrò<\/em><br><em>viva<\/em><\/td><\/tr><tr><td><b><em>volere<\/em><\/b><\/td><td><em>voglio<\/em><br><em>voluto<\/em><\/td><td><em>volli<\/em><br><em>vorrò<\/em><br><em>voglia<\/em><\/td><\/tr><\/table><p>Weitere Formen, die man kennen sollte: <em>andare<\/em>: <em>vai, va, vanno<\/em> · <em>dovere<\/em>: <em>devi, deve, dobbiamo, dovete, devono<\/em> · <em>fare<\/em>: <em>fai, fa, facciamo, fate, fanno<\/em> · <em>uscire<\/em>: <em>esci, esce, usciamo, uscite, escono<\/em> · <em>venire<\/em>: <em>vieni, viene, veniamo, venite, vengono<\/em>.<\/p><div class=\"warn\">Achtung: Abgeleitete Verben folgen dem Grundverb: <em>prendere → riprendere, sorprendere<\/em> (<em>sorpreso<\/em>); <em>tenere → ottenere, mantenere<\/em> (<em>ottengo, ottenni<\/em>); <em>porre → proporre<\/em> (<em>propongo, proposto<\/em>); <em>venire → divenire<\/em>.<\/div>"}],"exercises":[{"type":"gap","title":"Formen der Modellverben","task":"Setze die verlangte Form ein.","items":[{"q":"Se tu (essere, cong. imperf.) ___ qui, saresti contento.","a":["fossi"],"de":"Wenn du hier wärst, wärst du froh."},{"q":"Penso che loro (avere, cong. pres.) ___ ragione.","a":["abbiano"],"de":"Ich glaube, dass sie recht haben."},{"q":"Domani noi (parlare, Futur) ___ con il direttore.","a":["parleremo"],"de":"Morgen werden wir mit dem Direktor sprechen."},{"q":"Voi (finire, Präsens) ___ alle sei?","a":["finite"],"de":"Hört ihr um sechs auf?"},{"q":"Loro (finire, Präsens) ___ sempre tardi.","a":["finiscono"],"de":"Sie hören immer spät auf."},{"q":"Nel 1950 mio nonno (vendere, pass. rem.) ___ la sua bottega.","a":["vendé","vendè","vendette"],"de":"1950 verkaufte mein Großvater seinen Laden."},{"q":"(Essere, Imperativ tu) ___ paziente!","a":["Sii","sii"],"de":"Sei geduldig!"},{"q":"Al posto tuo io (dormire, Konditional) ___ di più.","a":["dormirei"],"de":"An deiner Stelle würde ich mehr schlafen."},{"q":"Quando sono arrivato, voi (avere, Imperf.) ___ già mangiato.","a":["avevate"],"de":"Als ich ankam, hattet ihr schon gegessen."},{"q":"Bisogna che tu (capire, cong. pres.) ___ il problema.","a":["capisca"],"de":"Es ist nötig, dass du das Problem verstehst."}]},{"type":"choice","title":"Unregelmäßige Leitformen","task":"Wähle die richtige Form.","items":[{"q":"Partizip von „chiedere“:","options":["chieduto","chiesto","chiesso"],"a":1,"why":"chiedere – chiesto."},{"q":"passato remoto (io) von „fare“:","options":["facei","feci","fecci"],"a":1,"why":"fare – feci."},{"q":"Futur (io) von „venire“:","options":["venirò","verrò","vengherò"],"a":1,"why":"venire – verrò."},{"q":"congiuntivo presente (io) von „sapere“:","options":["sappia","sapia","sapa"],"a":0,"why":"sapere – sappia."},{"q":"Präsens (io) von „scegliere“:","options":["sceglio","scelgo","scelgio"],"a":1,"why":"scegliere – scelgo."},{"q":"Partizip von „vivere“:","options":["vivuto","vissuto","visto"],"a":1,"why":"vivere – vissuto (visto gehört zu vedere)."},{"q":"Futur (io) von „rimanere“:","options":["rimanerò","rimarrò","rimango"],"a":1,"why":"rimanere – rimarrò."},{"q":"passato remoto (lui) von „nascere“:","options":["nacque","nascé","nasse"],"a":0,"why":"nascere – nacqui, nacque."},{"q":"Partizip von „rompere“:","options":["rotto","rompito","romputo"],"a":0,"why":"rompere – rotto."},{"q":"Präsens (io) von „tradurre“:","options":["traduro","traduco","tradurro"],"a":1,"why":"tradurre – traduco (Stamm traduc-)."},{"q":"passato remoto (io) von „volere“:","options":["volei","volli","vollei"],"a":1,"why":"volere – volli."},{"q":"congiuntivo presente (io) von „andare“:","options":["vada","anda","vadi"],"a":0,"why":"andare – vada."}]},{"type":"gap","title":"Unregelmäßige Verben im Satz","task":"Setze die verlangte Form ein.","items":[{"q":"Ieri ho (leggere, Partizip) ___ un articolo interessante.","a":["letto"],"de":"Gestern habe ich einen interessanten Artikel gelesen."},{"q":"Dante (scrivere, pass. rem., lui) ___ la Commedia nel Trecento.","a":["scrisse"],"de":"Dante schrieb die Commedia im 14. Jahrhundert."},{"q":"L'anno prossimo (andare, Futur, noi) ___ in Puglia.","a":["andremo"],"de":"Nächstes Jahr fahren wir nach Apulien."},{"q":"Spero che tu (venire, cong. pres.) ___ alla festa.","a":["venga"],"de":"Ich hoffe, dass du zum Fest kommst."},{"q":"Chi ha (spegnere, Partizip) ___ la luce?","a":["spento"],"de":"Wer hat das Licht ausgemacht?"},{"q":"Io non (sapere, Präsens) ___ nuotare.","a":["so"],"de":"Ich kann nicht schwimmen."},{"q":"Se potessi, (bere, Konditional, io) ___ un caffè.","a":["berrei"],"de":"Wenn ich könnte, würde ich einen Kaffee trinken."},{"q":"Quando eravamo in Grecia, (vedere, pass. rem., noi) ___ l'Acropoli.","a":["vedemmo"],"de":"Als wir in Gri  / seppi / sappia"},{"f":"tenere: Präs. / pass. rem. / Fut.","b":"tengo / tenni / terrò"},{"f":"vedere: Partizip / pass. rem. / Fut.","b":"visto / vidi / vedrò"},{"f":"venire: Präs. / pass. rem. / Fut.","b":"vengo / venni / verrò"},{"f":"volere: Präs. / pass. rem. / Fut. / Cong.","b":"voglio / volli / vorrò / voglia"}],"id":"k27"}]</script>
<script>
(function(){
const CH = JSON.parse(document.getElementById('data').textContent);
const byId = {}; CH.forEach(c=>byId[c.id]=c);
const $ = s=>document.querySelector(s);
const app=$('#app'), top=$('#top'), tabs=$('#tabs');

/* ---- per-viewer progress (best effort) ---- */
let P={};
try{ P=JSON.parse(localStorage.getItem('itgr-progress')||'{}')||{}; }catch(e){ P={}; }
function save(){ try{ localStorage.setItem('itgr-progress',JSON.stringify(P)); }catch(e){} }
function prog(id){ return P[id]||(P[id]={ex:{},cards:{}}); }
function chapterPct(c){
  const p=P[c.id]; if(!p) return 0;
  const tot=c.exercises.length + 1; let got=0;
  c.exercises.forEach((e,i)=>{ const s=p.ex[i]; if(s) got+=s.r/s.n; });
  const known=Object.values(p.cards||{}).filter(v=>v===1).length;
  got += c.cards.length? known/c.cards.length : 0;
  return Math.round(100*got/tot);
}

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const label=c=> (String(c.nr).includes('.')? 'Überblick' : 'Kapitel '+c.nr);
function ring(p){
  const r=12, C=2*Math.PI*r, d=C*p/100;
  return `<svg class="ring" viewBox="0 0 30 30" aria-label="${p} Prozent"><circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"/>`+
    `<circle cx="15" cy="15" r="${r}" fill="none" stroke="${p>=80?'var(--green)':'var(--blue)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${d} ${C}" transform="rotate(-90 15 15)"/>`+
    `<text x="15" y="18.5" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="sans-serif">${p}</text></svg>`;
}

/* ---- routing: #home, #k11, #k11-ueben, #k11-karten, #mix ---- */
function go(h){ if(location.hash!=='#'+h) location.hash=h; else render(); }
window.addEventListener('hashchange',render);

function render(){
  const h=(location.hash||'#home').slice(1);
  window.scrollTo(0,0);
  if(h==='mix') return renderMix();
  const m=h.match(/^(k\d+b?)(?:-(ueben|karten))?$/);
  if(m && byId[m[1]]) return renderChapter(byId[m[1]], m[2]||'lernen');
  renderHome();
}

/* ---- home ---- */
function renderHome(){
  tabs.hidden=true;
  top.innerHTML=`<div class="t">Italienisch-Grammatik</div>`;
  const totalEx=CH.reduce((a,c)=>a+c.exercises.reduce((b,e)=>b+e.items.length,0),0);
  const totalCards=CH.reduce((a,c)=>a+c.cards.length,0);
  const known=CH.reduce((a,c)=>a+Object.values((P[c.id]||{}).cards||{}).filter(v=>v===1).length,0);
  let last=null; try{ last=localStorage.getItem('itgr-last'); }catch(e){}
  let html=`<section class="hero"><h1>Grammatica italiana</h1>
    <p>Merkblätter, Übungen und Lernkarten zu allen Grammatikkapiteln, in der Reihenfolge deiner Lerngrammatik. Antippen, lernen, prüfen.</p>
    <div class="stats"><div class="stat"><b>${CH.length}</b>Kapitel</div><div class="stat"><b>${totalEx}</b>Übungssätze</div><div class="stat"><b>${known}/${totalCards}</b>Karten gewusst</div></div>
    <div class="quick">
      ${last&&byId[last]?`<button class="qbtn" data-go="${last}">Weiterlernen<small>${esc(byId[last].title)}</small></button>`:`<button class="qbtn" data-go="k01">Loslegen<small>Kapitel 1</small></button>`}
      <button class="qbtn alt" data-go="mix">Gemischte Karten<small>20 aus allen Kapiteln</small></button>
    </div>
    <input class="search" id="q" type="search" placeholder="Suchen, z. B. ne, congiuntivo, Uhrzeit" autocomplete="off">
    <div id="hits"></div></section>`;
  let teil=null;
  CH.forEach((c,i)=>{
    if(c.teil!==teil){ if(teil!==null) html+='</div>'; teil=c.teil; html+=`<div class="teil">${esc(teil)}</div><div class="list">`; }
    html+=`<button class="row" data-go="${c.id}"><span class="n">${String(c.nr).includes('.')?'·':c.nr}</span><span class="tt"><b>${esc(c.title)}</b><small>${c.sections.length} Abschnitte · ${c.exercises.length} Übungen · ${c.cards.length} Karten</small></span>${ring(chapterPct(c))}</button>`;
  });
  html+='</div>';
  app.innerHTML=html;
  const q=$('#q'), hits=$('#hits');
  q.addEventListener('input',()=>{
    const t=q.value.trim().toLowerCase();
    if(t.length<2){ hits.innerHTML=''; return; }
    const out=[];
    CH.forEach(c=>c.sections.forEach((s,si)=>{
      const plain=(s.h+' '+s.html.replace(/<[^>]+>/g,' ')).toLowerCase();
      if(plain.includes(t)) out.push({c,si,s});
    }));
    hits.innerHTML = out.length? `<div class="list" style="margin-top:8px">`+out.slice(0,25).map(o=>`<button class="hit" data-go="${o.c.id}" data-sec="${o.si}"><b>${esc(o.s.h)}</b><small>${label(o.c)} · ${esc(o.c.title)}</small></button>`).join('')+`</div>` : `<p class="empty">Nichts gefunden.</p>`;
  });
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b) return;
  const sec=b.dataset.sec;
  go(b.dataset.go);
  if(sec!=null) setTimeout(()=>{ const el=document.getElementById('s'+sec); if(el) el.scrollIntoView({behavior:'smooth'}); },60);
});

/* ---- chapter ---- */
function renderChapter(c,tab){
  try{ localStorage.setItem('itgr-last',c.id); }catch(e){}
  tabs.hidden=false;
  tabs.querySelectorAll('.tab').forEach(t=>{ t.setAttribute('aria-selected', t.dataset.tab===tab?'true':'false'); t.onclick=()=>go(c.id+(t.dataset.tab==='lernen'?'':'-'+t.dataset.tab)); });
  top.innerHTML=`<button class="back" data-home aria-label="Zur Übersicht"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>Inhalt</button><div class="t">${esc(c.title)}</div><span class="num">${String(c.nr).includes('.')?'':c.nr}</span>`;
  top.querySelector('[data-home]').onclick=()=>go('home');
  const idx=CH.indexOf(c), prev=CH[idx-1], next=CH[idx+1];
  const nav=`<div class="next">${prev?`<button class="btn ghost" data-go="${prev.id}">‹ ${esc(prev.title)}</button>`:''}${next?`<button class="btn ghost" data-go="${next.id}">${esc(next.title)} ›</button>`:''}</div>`;
  const head=`<header class="chhead"><div class="kn">${label(c)} · ${esc(c.teil)}</div><h1>${esc(c.title)}</h1>${tab==='lernen'?`<p>${esc(c.intro)}</p>`:''}</header>`;
  if(tab==='lernen'){
    app.innerHTML=head+`<div class="toc">${c.sections.map((s,i)=>`<button class="chip" data-sec="${i}">${esc(s.h)}</button>`).join('')}</div>`+
      c.sections.map((s,i)=>`<section class="sec" id="s${i}"><h2>${esc(s.h)}</h2>${s.html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>')}</section>`).join('')+
      `<div class="bar"><button class="btn" data-go="${c.id}-ueben">Jetzt üben</button><button class="btn sec2" data-go="${c.id}-karten">Lernkarten</button></div>`+nav;
    app.querySelectorAll('.toc .chip').forEach(b=>b.onclick=()=>document.getElementById('s'+b.dataset.sec).scrollIntoView({behavior:'smooth'}));
  } else if(tab==='ueben'){
    app.innerHTML=head+c.exercises.map((e,i)=>exHTML(c,e,i)).join('')+nav;
    c.exercises.forEach((e,i)=>wireEx(c,e,i));
  } else {
    app.innerHTML=head+`<div id="cards"></div>`+nav;
    runCards($('#cards'), c.cards.map((x,i)=>({...x,cid:c.id,i})), c.id);
  }
}

/* ---- exercises ---- */
function norm(s){ return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ').replace(/\s*'\s*/g,"'").replace(/[!?.,;:]+$/,'').trim(); }
function deacc(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,''); }
function exHTML(c,e,i){
  const s=(P[c.id]&&P[c.id].ex[i]);
  let h=`<section class="ex" id="ex${i}"><span class="score" id="sc${i}">${s?`zuletzt ${s.r}/${s.n}`:''}</span><h2>${esc(e.title||('Übung '+(i+1)))}</h2><p class="task">${esc(e.task||'')}</p>`;
  e.items.forEach((it,j)=>{
    if(e.type==='gap'){
      const parts=it.q.split('___');
      h+=`<div class="it"><div class="q"><span class="ix">${j+1}.</span><em>${esc(parts[0])}</em><input class="gap" id="g${i}-${j}" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" aria-label="Lücke ${j+1}"><em>${esc(parts.slice(1).join('___'))}</em></div>${it.de?`<span class="de">${esc(it.de)}</span>`:''}<div class="fb" id="f${i}-${j}"></div></div>`;
    } else {
      h+=`<div class="it"><div class="q"><span class="ix">${j+1}.</span><em>${esc(it.q)}</em></div><div class="opts">${it.options.map((o,k)=>`<button class="opt" data-k="${k}" id="o${i}-${j}-${k}">${esc(o)}</button>`).join('')}</div><div class="why" id="w${i}-${j}" hidden></div></div>`;
    }
  });
  h+= e.type==='gap'
    ? `<div class="bar"><button class="btn" data-check>Prüfen</button><button class="btn sec2" data-show>Lösungen zeigen</button><button class="btn ghost" data-reset>Neu</button></div>`
    : `<div class="bar"><button class="btn ghost" data-reset>Neu</button></div>`;
  return h+`</section>`;
}
function record(c,i,r,n){ prog(c.id).ex[i]={r,n}; save(); const sc=document.getElementById('sc'+i); if(sc) sc.textContent=`${r}/${n} richtig`; }
function wireEx(c,e,i){
  const box=document.getElementById('ex'+i);
  if(e.type==='gap'){
    const check=()=>{
      let r=0;
      e.items.forEach((it,j)=>{
        const inp=document.getElementById(`g${i}-${j}`), fb=document.getElementById(`f${i}-${j}`);
        const v=norm(inp.value); const sols=it.a.map(norm);
        inp.classList.remove('ok','bad','near');
        if(!v){ fb.className='fb'; fb.textContent=''; return; }
        if(sols.includes(v)){ inp.classList.add('ok'); fb.className='fb ok'; fb.textContent='Richtig'+(it.a.length>1?' · auch: '+it.a.filter(a=>norm(a)!==v).join(', '):''); r++; }
        else if(sols.map(deacc).includes(deacc(v))){ inp.classList.add('near'); fb.className='fb near'; fb.textContent='Fast: Akzent prüfen → '+it.a[0]; }
        else { inp.classList.add('bad'); fb.className='fb bad'; fb.textContent='Lösung: '+it.a.join(' / '); }
      });
      record(c,i,r,e.items.length);
    };
    box.querySelector('[data-check]').onclick=check;
    box.querySelector('[data-show]').onclick=()=>e.items.forEach((it,j)=>{ const fb=document.getElementById(`f${i}-${j}`); fb.className='fb ok'; fb.textContent='Lösung: '+it.a.join(' / '); });
    box.querySelectorAll('.gap').forEach((inp,j,all)=>inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(all[j+1]) all[j+1].focus(); else { inp.blur(); check(); } } }));
  } else {
    let answered=0, right=0;
    e.items.forEach((it,j)=>{
      const opts=[...box.querySelectorAll(`[id^="o${i}-${j}-"]`)];
      opts.forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k; opts.forEach(o=>o.disabled=true);
        opts[it.a].classList.add('ok'); if(k!==it.a) b.classList.add('bad'); else right++;
        answered++;
        const w=document.getElementById(`w${i}-${j}`); if(it.why){ w.textContent=it.why; w.hidden=false; }
        if(answered===e.items.length) record(c,i,right,e.items.length);
      });
    });
  }
  box.querySelector('[data-reset]').onclick=()=>{
    const fresh=document.createElement('div'); fresh.innerHTML=exHTML(c,e,i); box.replaceWith(fresh.firstElementChild); wireEx(c,e,i);
  };
}

/* ---- flashcards ---- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function runCards(el, deck, cid){
  let queue=shuffle(deck), pos=0, good=0, again=[];
  function show(){
    if(pos>=queue.length){
      if(again.length){ queue=shuffle(again); again=[]; pos=0; }
      else { el.innerHTML=`<div class="done"><h2>Bravissimo!</h2><p class="empty">${good} Karten gewusst.</p><div class="bar" style="justify-content:center"><button class="btn" id="cagain">Nochmal mischen</button></div></div>`; $('#cagain').onclick=()=>runCards(el,deck,cid); return; }
    }
    const k=queue[pos]; const src=cid?'':`${esc(byId[k.cid].title)}`;
    el.innerHTML=`<div class="cardwrap"><div class="cardmeta"><span>Karte ${pos+1} von ${queue.length}</span><span>${again.length?again.length+' zum Wiederholen':''}</span></div>
      <div class="fc" id="fc" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="inner">
        <div class="face"><span class="lab">Frage</span><div class="tx">${esc(k.f)}</div>${src?`<div class="src">${src}</div>`:''}</div>
        <div class="face back"><span class="lab">Antwort</span><div class="tx">${esc(k.b)}</div></div>
      </div></div>
      <div class="cardbtns"><button class="btn no" id="cno">Nochmal</button><button class="btn yes" id="cyes">Gewusst</button></div>
      <p class="empty" style="text-align:center;font-size:14px">Tippe auf die Karte zum Umdrehen.</p></div>`;
    const fc=$('#fc'); const flip=()=>fc.classList.toggle('flip');
    fc.onclick=flip; fc.onkeydown=ev=>{ if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); flip(); } };
    $('#cyes').onclick=()=>{ prog(k.cid).cards[k.i]=1; save(); good++; pos++; show(); };
    $('#cno').onclick=()=>{ prog(k.cid).cards[k.i]=0; save(); again.push(k); pos++; show(); };
  }
  show();
}
function renderMix(){
  tabs.hidden=true;
  top.innerHTML=`<button class="back" data-home><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>Inhalt</button><div class="t">Gemischte Karten</div>`;
  top.querySelector('[data-home]').onclick=()=>go('home');
  const all=[]; CH.forEach(c=>c.cards.forEach((x,i)=>all.push({...x,cid:c.id,i})));
  // bevorzugt Karten, die noch nicht gewusst wurden
  const unknown=all.filter(k=>((P[k.cid]||{}).cards||{})[k.i]!==1);
  const pool=shuffle(unknown.length>=20?unknown:all).slice(0,20);
  app.innerHTML=`<header class="chhead"><div class="kn">Alle Kapitel</div><h1>20 gemischte Karten</h1><p>Karten, die du noch nicht gewusst hast, kommen zuerst.</p></header><div id="cards"></div>`;
  runCards($('#cards'), pool, null);
}

render();
})();
</script>
